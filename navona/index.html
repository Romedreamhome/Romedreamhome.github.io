  <script>window.RDH_DATA = {"slug":"navona","name":"Navona","brand":"Rome Dream Home","address":{"line1":"Vicolo della Palomba 4","line2":{"en":"Rome, Italy","it":"Roma, Italia","fr":"Rome, Italie","es":"Roma, Italia","de":"Rom, Italien","ar":"روما، إيطاليا"},"maps":"Vicolo della Palomba 4, 00186 Roma RM, Italy"},"host":{"name":"Federico","phone":"+39 331 278 6108","tel":"+393312786108","whatsapp":"393312786108","email":"romedreamhome@gmail.com","website":"https://www.romedreamhome.it","websiteLabel":"www.romedreamhome.it","instagram":"romedreamhome","photo":"img/host-federico.webp"},"support":{"phone":"+39 352 282 7301","tel":"+393522827301","whatsapp":"393522827301"},"wifi":{"ssid":"xxx","password":"xxx"},"lockboxCode":"109","checkin":"15:00","checkout":"10:00","touristTax":6,"music":true,"photos":[{"src":"img/living-1","alt":{"en":"Living room","it":"Soggiorno","fr":"Salon","es":"Salón","de":"Wohnzimmer","ar":"غرفة المعيشة"}},{"src":"img/billiard","alt":{"en":"Billiard table","it":"Biliardo","fr":"Billard","es":"Billar","de":"Billardtisch","ar":"طاولة البلياردو"}},{"src":"img/dining","alt":{"en":"Dining area","it":"Zona pranzo","fr":"Coin repas","es":"Comedor","de":"Essbereich","ar":"منطقة الطعام"}},{"src":"img/bedroom-1","alt":{"en":"Double bedroom","it":"Camera matrimoniale","fr":"Chambre double","es":"Dormitorio doble","de":"Doppelzimmer","ar":"غرفة نوم مزدوجة"}},{"src":"img/bedroom-2","alt":{"en":"Double bedroom","it":"Camera matrimoniale","fr":"Chambre double","es":"Dormitorio doble","de":"Doppelzimmer","ar":"غرفة نوم مزدوجة"}},{"src":"img/bedroom-3","alt":{"en":"Double bedroom","it":"Camera matrimoniale","fr":"Chambre double","es":"Dormitorio doble","de":"Doppelzimmer","ar":"غرفة نوم مزدوجة"}},{"src":"img/bedroom-4","alt":{"en":"Twin bedroom","it":"Camera con letti singoli","fr":"Chambre à lits jumeaux","es":"Dormitorio con camas individuales","de":"Zweibettzimmer","ar":"غرفة بسريرين مفردين"}},{"src":"img/hallway","alt":{"en":"Hallway","it":"Corridoio","fr":"Couloir","es":"Pasillo","de":"Flur","ar":"الممر"}},{"src":"img/street","alt":{"en":"Vicolo della Palomba","it":"Vicolo della Palomba","fr":"Vicolo della Palomba","es":"Vicolo della Palomba","de":"Vicolo della Palomba","ar":"Vicolo della Palomba"}}],"sections":[{"id":"welcome","icon":"column","title":{"en":"Welcome","it":"Benvenuti","fr":"Bienvenue","es":"Bienvenida","de":"Willkommen","ar":"مرحباً بكم"},"blocks":[{"type":"lead","text":{"en":"**Welcome to Navona!** We are pleased to welcome you to our accommodation and we hope you will have an **unforgettable stay**.","it":"**Benvenuti a Navona!** Siamo lieti di accogliervi nella nostra struttura e speriamo che il vostro soggiorno sia **indimenticabile**.","fr":"**Bienvenue à Navona !** Nous sommes ravis de vous accueillir dans notre logement et espérons que votre séjour sera **inoubliable**.","es":"**¡Bienvenidos a Navona!** Nos complace darle la bienvenida a nuestro alojamiento y esperamos que disfrute de una **estancia inolvidable**.","de":"**Willkommen im Navona!** Wir freuen uns, Sie in unserer Unterkunft willkommen zu heißen, und wünschen Ihnen einen **unvergesslichen Aufenthalt**.","ar":"**أهلاً بكم في Navona!** يسعدنا أن نرحب بكم في مسكننا، ونتمنى لكم **إقامة لا تُنسى**."}},{"type":"text","text":{"en":"**Navona** is a large apartment for up to **9 guests**, on the **3rd floor** (with **elevator**) in a quiet lane just **4 minutes** from **Piazza Navona**. It has a big **living room** with a **billiard table**, a **single bed** and a **sofa bed**, **2 double bedrooms**, a **third bedroom** with **two single beds** up a short **internal staircase**, an **eat-in kitchen** and **2 bathrooms**.","it":"**Navona** è un ampio appartamento per un massimo di **9 ospiti**, al **terzo piano** (con **ascensore**) in un vicolo tranquillo a soli **4 minuti** da **Piazza Navona**. Ha un grande **soggiorno** con **tavolo da biliardo**, **letto singolo** e **divano letto**, **2 camere matrimoniali**, una **terza camera** con **due letti singoli** raggiungibile da una breve **scala interna**, una **cucina abitabile** e **2 bagni**.","fr":"**Navona** est un grand appartement pour **9 personnes** maximum, au **3e étage** (avec **ascenseur**) dans une ruelle calme à seulement **4 minutes** de la **Piazza Navona**. Il dispose d’un grand **salon** avec **billard**, **lit simple** et **canapé-lit**, de **2 chambres doubles**, d’une **troisième chambre** avec **deux lits simples** accessible par un petit **escalier intérieur**, d’une **cuisine** avec coin repas et de **2 salles de bains**.","es":"**Navona** es un amplio apartamento para un máximo de **9 huéspedes**, en la **3ª planta** (con **ascensor**) en un callejón tranquilo a solo **4 minutos** de la **Piazza Navona**. Tiene un gran **salón** con **mesa de billar**, **cama individual** y **sofá cama**, **2 dormitorios dobles**, un **tercer dormitorio** con **dos camas individuales** al que se sube por una breve **escalera interior**, una **cocina** con comedor y **2 baños**.","de":"**Navona** ist eine große Wohnung für bis zu **9 Gäste** im **3. Stock** (mit **Aufzug**) in einer ruhigen Gasse, nur **4 Minuten** von der **Piazza Navona** entfernt. Sie hat ein großes **Wohnzimmer** mit **Billardtisch**, **Einzelbett** und **Schlafsofa**, **2 Doppelzimmer**, ein **drittes Schlafzimmer** mit **zwei Einzelbetten** über eine kurze **Innentreppe**, eine **Wohnküche** und **2 Bäder**.","ar":"**Navona** شقة واسعة تتسع لما يصل إلى **9 ضيوف**، في **الطابق الثالث** (مع **مصعد**) في زقاق هادئ على بُعد **4 دقائق** فقط من **ساحة نافونا**. تضم **صالة جلوس** كبيرة مع **طاولة بلياردو** و**سرير مفرد** و**أريكة سرير**، و**غرفتي نوم مزدوجتين**، و**غرفة ثالثة** بـ**سريرين مفردين** يُصعد إليها عبر **درج داخلي** قصير، و**مطبخاً** مع منطقة طعام و**حمّامين**."}},{"type":"photo","src":"img/living-1","alt":{"en":"Living room","it":"Soggiorno","fr":"Salon","es":"Salón","de":"Wohnzimmer","ar":"غرفة المعيشة"}},{"type":"photo","src":"img/bedroom-1","alt":{"en":"Double bedroom","it":"Camera matrimoniale","fr":"Chambre double","es":"Dormitorio doble","de":"Doppelzimmer","ar":"غرفة نوم مزدوجة"}},{"type":"photo","src":"img/billiard","alt":{"en":"Billiard table","it":"Biliardo","fr":"Billard","es":"Billar","de":"Billardtisch","ar":"طاولة البلياردو"}},{"type":"photo","src":"img/bedroom-4","alt":{"en":"Twin bedroom","it":"Camera con letti singoli","fr":"Chambre à lits jumeaux","es":"Dormitorio con camas individuales","de":"Zweibettzimmer","ar":"غرفة بسريرين مفردين"}},{"type":"text","text":{"en":"We wish you an **excellent stay** in our beautiful city and hope to **see you again soon**!","it":"Vi auguriamo un **ottimo soggiorno** nella nostra splendida città e speriamo di **rivedervi presto**!","fr":"Nous vous souhaitons un **excellent séjour** dans notre belle ville et espérons **vous revoir très bientôt** !","es":"¡Le deseamos una **excelente estancia** en nuestra hermosa ciudad y esperamos **volver a verle pronto**!","de":"Wir wünschen Ihnen einen **wunderbaren Aufenthalt** in unserer schönen Stadt und hoffen, Sie **bald wiederzusehen**!","ar":"نتمنى لكم **إقامة ممتعة** في مدينتنا الجميلة، ونأمل أن **نراكم مجدداً قريباً**!"}},{"type":"signature","text":"Rome Dream Home"}]},{"id":"checkin","icon":"key","title":{"en":"Check-in","it":"Check-in","fr":"Arrivée","es":"Check-in","de":"Check-in","ar":"تسجيل الوصول"},"blocks":[{"type":"time","value":"15:00","label":{"en":"Self check-in","it":"Self check-in","fr":"Self check-in","es":"Self check-in","de":"Self-Check-in","ar":"تسجيل الوصول الذاتي"}},{"type":"text","text":{"en":"**Self check-in**: you can arrive **at any time**, even late at night – the street door opens with the **keypad code**.","it":"**Self check-in**: potete arrivare **a qualsiasi ora**, anche a tarda notte – il portone si apre con il **codice del tastierino**.","fr":"**Self check-in** : vous pouvez arriver **à toute heure**, même tard le soir – la porte de l’immeuble s’ouvre avec le **code du clavier**.","es":"**Self check-in**: puede llegar **a cualquier hora**, incluso de madrugada – el portal se abre con el **código del teclado**.","de":"**Self-Check-in**: Sie können **jederzeit** anreisen, auch spät in der Nacht – die Haustür öffnet sich mit dem **Code am Tastenfeld**.","ar":"**تسجيل دخول ذاتي**: يمكنكم الوصول **في أي وقت**، حتى في ساعة متأخرة من الليل – يُفتح باب المبنى بـ**رمز لوحة المفاتيح**."}},{"type":"text","text":{"en":"Please respect the check-in times. If you would like to arrive earlier, no problem at all: you can **drop off your luggage from 11:00** and take the keys, then **come back at 15:00** when the apartment will be ready.","it":"Vi preghiamo di rispettare gli orari di check-in. Se desiderate arrivare prima, nessun problema: potete **lasciare i bagagli a partire dalle 11:00** e ritirare le chiavi, per poi **tornare alle 15:00**, quando l’appartamento sarà pronto.","fr":"Merci de respecter les horaires d’arrivée. Si vous souhaitez arriver plus tôt, aucun problème : vous pouvez **déposer vos bagages à partir de 11h00** et récupérer les clés, puis **revenir à 15h00**, lorsque l’appartement sera prêt.","es":"Le rogamos que respete los horarios de check-in. Si desea llegar antes, no hay ningún problema: puede **dejar su equipaje a partir de las 11:00** y recoger las llaves, y luego **volver a las 15:00**, cuando el apartamento esté listo.","de":"Bitte halten Sie die Check-in-Zeiten ein. Wenn Sie früher ankommen möchten, ist das kein Problem: Sie können Ihr **Gepäck ab 11:00 Uhr abstellen** und die Schlüssel abholen und dann **um 15:00 Uhr zurückkommen**, wenn die Wohnung bereit ist.","ar":"يُرجى الالتزام بمواعيد تسجيل الوصول. إذا رغبتم في الوصول مبكراً فلا مشكلة إطلاقاً: يمكنكم **ترك أمتعتكم ابتداءً من الساعة 11:00** واستلام المفاتيح، ثم **العودة في الساعة 15:00** عندما تكون الشقة جاهزة."}},{"type":"heading","text":{"en":"House access","it":"Accesso alla casa","fr":"Accès au logement","es":"Acceso a la vivienda","de":"Zugang zur Wohnung","ar":"الدخول إلى المنزل"}},{"type":"steps","items":[{"text":{"en":"Arrive at **Vicolo della Palomba 4**: the **green street door** in the photo.","it":"Arrivate in **Vicolo della Palomba 4**: il **portone verde** della foto.","fr":"Arrivez au **Vicolo della Palomba 4** : la **porte verte** de la photo.","es":"Llegue a **Vicolo della Palomba 4**: el **portal verde** de la foto.","de":"Kommen Sie in den **Vicolo della Palomba 4**: die **grüne Haustür** auf dem Foto.","ar":"عند وصولكم إلى **Vicolo della Palomba 4**: **باب المبنى الأخضر** الظاهر في الصورة."},"photos":[{"src":"img/step-entrance","alt":{"en":"The green street door, Vicolo della Palomba 4","it":"Il portone verde, Vicolo della Palomba 4","fr":"La porte verte de l’immeuble, Vicolo della Palomba 4","es":"El portal verde, Vicolo della Palomba 4","de":"Die grüne Haustür, Vicolo della Palomba 4","ar":"باب المبنى الأخضر، Vicolo della Palomba 4"}}]},{"text":{"en":"At the door you’ll see a **keypad**: enter **1379A** and **keep the A pressed** until the street door **opens**.","it":"Al portone trovate un **tastierino**: digitate **1379A** e **tenete premuta la A** finché il portone **non si apre**.","fr":"À la porte, vous verrez un **clavier à code** : tapez **1379A** et **maintenez le A appuyé** jusqu’à ce que la porte **s’ouvre**.","es":"En el portal verá un **teclado**: marque **1379A** y **mantenga pulsada la A** hasta que el portal **se abra**.","de":"An der Tür sehen Sie ein **Tastenfeld**: Geben Sie **1379A** ein und **halten Sie das A gedrückt**, bis die Haustür **aufgeht**.","ar":"عند الباب سترون **لوحة مفاتيح**: أدخلوا **1379A** و**استمروا بالضغط على A** حتى **يُفتح** باب المبنى."},"photos":[{"src":"img/step-keypad","alt":{"en":"The keypad at the street door","it":"Il tastierino al portone","fr":"Le clavier à code de la porte","es":"El teclado del portal","de":"Das Tastenfeld an der Haustür","ar":"لوحة المفاتيح عند باب المبنى"}}],"tall":true},{"text":{"en":"Take the **elevator** to the **3rd floor**. When you exit, **in front of you** there is the **key box**: enter the code **109** and take the **apartment keys**.","it":"Prendete l’**ascensore** fino al **terzo piano**. Uscendo, **di fronte a voi** c’è la **cassetta delle chiavi**: inserite il codice **109** e prendete le **chiavi dell’appartamento**.","fr":"Prenez l’**ascenseur** jusqu’au **3e étage**. En sortant, **en face de vous**, se trouve la **boîte à clés** : saisissez le code **109** et prenez les **clés de l’appartement**.","es":"Tome el **ascensor** hasta la **3ª planta**. Al salir, **frente a usted** está la **caja de llaves**: introduzca el código **109** y coja las **llaves del apartamento**.","de":"Fahren Sie mit dem **Aufzug** in den **3. Stock**. Beim Aussteigen befindet sich **direkt vor Ihnen** der **Schlüsselsafe**: Geben Sie den Code **109** ein und nehmen Sie die **Wohnungsschlüssel**.","ar":"اصعدوا بـ**المصعد** إلى **الطابق الثالث**. عند خروجكم ستجدون **أمامكم** **صندوق المفاتيح**: أدخلوا الرمز **109** وخذوا **مفاتيح الشقة**."},"photos":[{"src":"img/step-padlock","alt":{"en":"The key box in front of the elevator, 3rd floor","it":"La cassetta delle chiavi di fronte all’ascensore, terzo piano","fr":"La boîte à clés en face de l’ascenseur, 3e étage","es":"La caja de llaves frente al ascensor, 3ª planta","de":"Der Schlüsselsafe gegenüber dem Aufzug, 3. Stock","ar":"صندوق المفاتيح مقابل المصعد، الطابق الثالث"}}],"tall":true},{"text":{"en":"**Walk left** and **immediately turn right**: there is your door. Open it with the **longest key**.","it":"**Andate a sinistra** e **girate subito a destra**: lì c’è la vostra porta. Apritela con la **chiave più lunga**.","fr":"**Allez à gauche** puis **tournez tout de suite à droite** : voici votre porte. Ouvrez-la avec la **clé la plus longue**.","es":"**Vaya a la izquierda** y **gire enseguida a la derecha**: ahí está su puerta. Ábrala con la **llave más larga**.","de":"**Gehen Sie nach links** und **biegen Sie sofort rechts ab**: Dort ist Ihre Tür. Öffnen Sie sie mit dem **längsten Schlüssel**.","ar":"**اتجهوا يساراً** ثم **انعطفوا يميناً مباشرةً**: هناك باب شقتكم. افتحوه بـ**المفتاح الأطول**."},"photos":[{"src":"img/step-door","alt":{"en":"The apartment door","it":"La porta dell’appartamento","fr":"La porte de l’appartement","es":"La puerta del apartamento","de":"Die Wohnungstür","ar":"باب الشقة"}}]},{"en":"Go inside and **close the door** behind you. **Welcome!**","it":"Entrate e **chiudete la porta** alle vostre spalle. **Benvenuti!**","fr":"Entrez et **refermez la porte** derrière vous. **Bienvenue !**","es":"Entre y **cierre la puerta** detrás de usted. **¡Bienvenidos!**","de":"Treten Sie ein und **schließen Sie die Tür** hinter sich. **Willkommen!**","ar":"ادخلوا و**أغلقوا الباب** خلفكم. **أهلاً وسهلاً!**"}]},{"type":"code","label":{"en":"Street door code · keep the A pressed","it":"Codice portone · tenete premuta la A","fr":"Code de la porte · maintenez le A appuyé","es":"Código del portal · mantenga pulsada la A","de":"Haustür-Code · A gedrückt halten","ar":"رمز باب المبنى · استمروا بالضغط على A"},"value":"1379A","icon":"door"},{"type":"code","label":{"en":"Key box code · in front of the elevator, 3rd floor","it":"Codice cassetta · di fronte all’ascensore, 3° piano","fr":"Code de la boîte à clés · en face de l’ascenseur, 3e étage","es":"Código de la caja · frente al ascensor, 3ª planta","de":"Schlüsselsafe-Code · gegenüber dem Aufzug, 3. Stock","ar":"رمز صندوق المفاتيح · مقابل المصعد، الطابق الثالث"},"value":"109","icon":"lock"},{"type":"notice","tone":"warning","icon":"elevator","title":{"en":"Important to know","it":"Importante da sapere","fr":"À savoir","es":"Importante","de":"Wichtig zu wissen","ar":"من المهم معرفته"},"text":{"en":"**Lights**: the apartment has an **energy-saving electrical system**: every time the **entrance door is opened** the power **goes off**; to bring it back, just **press the button**. **Elevator**: please **close its doors properly** and respect the **maximum of 7 people**. **Don’t lock yourself in** when you are at home: the door is **anti-burglary** and you could get stuck inside.","it":"**Luci**: la casa è dotata di un **sistema elettrico a risparmio energetico**: ogni volta che si **apre la porta d’ingresso** la corrente **va via**; per farla tornare basta **premere il pulsante**. **Ascensore**: **chiudete bene le porte** e rispettate la **capienza massima di 7 persone**. **Non chiudetevi dentro** quando siete in casa: la porta è **a prova di scasso** e potreste rimanere bloccati.","fr":"**Lumières** : l’appartement est équipé d’un **système électrique à économie d’énergie** : chaque fois que l’on **ouvre la porte d’entrée**, le courant **se coupe** ; pour le rétablir, il suffit d’**appuyer sur le bouton**. **Ascenseur** : **refermez bien ses portes** et respectez la **capacité maximale de 7 personnes**. **Ne vous enfermez pas** quand vous êtes à l’intérieur : la porte est **anti-effraction** et vous pourriez rester bloqués.","es":"**Luces**: el apartamento tiene un **sistema eléctrico de ahorro energético**: cada vez que se **abre la puerta de entrada** la corriente **se corta**; para restablecerla basta con **pulsar el botón**. **Ascensor**: **cierre bien sus puertas** y respete la **capacidad máxima de 7 personas**. **No se encierre** cuando esté en casa: la puerta es **antirrobo** y podría quedarse atrapado.","de":"**Licht**: Die Wohnung hat ein **energiesparendes Stromsystem**: Jedes Mal, wenn die **Eingangstür geöffnet** wird, geht der **Strom aus**; um ihn wieder einzuschalten, einfach **den Knopf drücken**. **Aufzug**: Bitte **schließen Sie seine Türen richtig** und beachten Sie die **Höchstzahl von 7 Personen**. **Schließen Sie sich nicht ein**, wenn Sie zu Hause sind: Die Tür ist **einbruchsicher** und Sie könnten drinnen festsitzen.","ar":"**الإضاءة**: الشقة مزوّدة بـ**نظام كهربائي موفّر للطاقة**: في كل مرة **يُفتح فيها باب المدخل** **تنقطع الكهرباء**؛ ولإعادتها يكفي **الضغط على الزر**. **المصعد**: يُرجى **إغلاق أبوابه جيداً** والالتزام بـ**الحد الأقصى وهو 7 أشخاص**. **لا تقفلوا على أنفسكم** وأنتم في الداخل: الباب **مقاوم للسرقة** وقد تعلقون في الداخل."}},{"type":"arrival"},{"type":"tax","text":{"en":"Rome **tourist tax**: **€6 per person per night** (**children under 10** are exempt). With self check-in it is paid on the **check-out day**: leave it **in cash on the table next to the keys** and close the door. Please make sure you have already sent us a **photo of your passport** for the registration of your stay.","it":"**Tassa di soggiorno** di Roma: **6 € a persona a notte** (esenti i **bambini sotto i 10 anni**). Con il self check-in si paga il **giorno del check-out**: lasciatela **in contanti sul tavolo accanto alle chiavi** e chiudete la porta. Assicuratevi di averci già inviato la **foto del passaporto** per la registrazione del soggiorno.","fr":"**Taxe de séjour** de Rome : **6 € par personne et par nuit** (les **enfants de moins de 10 ans** en sont exemptés). Avec le self check-in, elle se paie le **jour du départ** : laissez-la **en espèces sur la table à côté des clés** et fermez la porte. Assurez-vous de nous avoir déjà envoyé la **photo de votre passeport** pour l’enregistrement de votre séjour.","es":"**Tasa turística** de Roma: **6 € por persona y noche** (exentos los **niños menores de 10 años**). Con el self check-in se paga el **día del check-out**: déjela **en efectivo sobre la mesa junto a las llaves** y cierre la puerta. Asegúrese de habernos enviado ya la **foto de su pasaporte** para el registro de su estancia.","de":"Römische **Kurtaxe**: **6 € pro Person und Nacht** (**Kinder unter 10 Jahren** sind befreit). Beim Self-Check-in wird sie am **Abreisetag** bezahlt: Lassen Sie sie **in bar auf dem Tisch neben den Schlüsseln** und schließen Sie die Tür. Bitte stellen Sie sicher, dass Sie uns bereits ein **Foto Ihres Reisepasses** für die Anmeldung Ihres Aufenthalts geschickt haben.","ar":"**ضريبة السياحة** في روما: **6 يورو للشخص في الليلة** (يُعفى منها **الأطفال دون 10 سنوات**). مع تسجيل الدخول الذاتي تُدفع **يوم المغادرة**: اتركوها **نقداً على الطاولة بجانب المفاتيح** وأغلقوا الباب. يُرجى التأكد من أنكم أرسلتم إلينا **صورة جواز السفر** لتسجيل إقامتكم."}},{"type":"problems","items":[{"icon":"door","q":{"en":"The street door doesn’t open?","it":"Il portone non si apre?","fr":"La porte de l’immeuble ne s’ouvre pas ?","es":"¿El portal no se abre?","de":"Die Haustür geht nicht auf?","ar":"باب المبنى لا يُفتح؟"},"a":{"en":"Enter **1379A** again and **keep the A pressed** until it opens. Still closed? **Call us**.","it":"Digitate di nuovo **1379A** e **tenete premuta la A** finché si apre. Ancora chiuso? **Chiamateci**.","fr":"Tapez à nouveau **1379A** et **maintenez le A appuyé** jusqu’à l’ouverture. Toujours fermée ? **Appelez-nous**.","es":"Marque otra vez **1379A** y **mantenga pulsada la A** hasta que se abra. ¿Sigue cerrado? **Llámenos**.","de":"Geben Sie **1379A** erneut ein und **halten Sie das A gedrückt**, bis sie aufgeht. Immer noch zu? **Rufen Sie uns an**.","ar":"أدخلوا **1379A** مجدداً و**استمروا بالضغط على A** حتى يُفتح. ما زال مغلقاً؟ **اتصلوا بنا**."}},{"icon":"lock","q":{"en":"The lockbox won’t open?","it":"La cassetta non si apre?","fr":"La boîte à clés ne s’ouvre pas ?","es":"¿La caja de llaves no se abre?","de":"Der Schlüsselsafe geht nicht auf?","ar":"صندوق المفاتيح لا يُفتح؟"},"a":{"en":"Check that **each digit** is set to **109**, then try again. Still closed? **Call us**.","it":"Controllate che **ogni cifra** sia su **109** e riprovate. Ancora chiusa? **Chiamateci**.","fr":"Vérifiez que **chaque chiffre** est bien sur **109**, puis réessayez. Toujours fermée ? **Appelez-nous**.","es":"Compruebe que **cada dígito** esté en **109** e inténtelo de nuevo. ¿Sigue cerrada? **Llámenos**.","de":"Prüfen Sie, ob **jede Ziffer** auf **109** steht, und versuchen Sie es erneut. Immer noch zu? **Rufen Sie uns an**.","ar":"تأكّدوا من أن **كل رقم** مضبوط على **109** ثم حاولوا مجدداً. ما زال مغلقاً؟ **اتصلوا بنا**."}},{"icon":"clock","q":{"en":"Arriving late?","it":"Arrivate tardi?","fr":"Vous arrivez tard ?","es":"¿Llega tarde?","de":"Späte Ankunft?","ar":"ستصلون متأخرين؟"},"a":{"en":"**No time limit**: the street door opens with the **keypad code**.","it":"**Nessun limite di orario**: il portone si apre con il **codice del tastierino**.","fr":"**Aucune limite d’horaire** : la porte s’ouvre avec le **code du clavier**.","es":"**Sin límite de horario**: el portal se abre con el **código del teclado**.","de":"**Keine Zeitbeschränkung**: Die Haustür öffnet sich mit dem **Code am Tastenfeld**.","ar":"**لا يوجد حد زمني**: يُفتح باب المبنى بـ**رمز لوحة المفاتيح**."}},{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]},{"type":"closing","text":{"en":"Thank you very much for your **understanding and cooperation**.","it":"Grazie mille per la vostra **comprensione e collaborazione**.","fr":"Merci beaucoup pour votre **compréhension et votre coopération**.","es":"Muchas gracias por su **comprensión y colaboración**.","de":"Vielen Dank für Ihr **Verständnis und Ihre Mitarbeit**.","ar":"شكراً جزيلاً **لتفهمكم وتعاونكم**."}}]},{"id":"location","icon":"pin","title":{"en":"Location","it":"Posizione","fr":"Accès","es":"Ubicación","de":"Anreise","ar":"الموقع"},"blocks":[{"type":"address"},{"type":"heading","text":{"en":"How to arrive?","it":"Come arrivare?","fr":"Comment arriver ?","es":"¿Cómo llegar?","de":"Wie komme ich hin?","ar":"كيف تصلون إلينا؟"}},{"type":"tabs","label":{"en":"Arrive from","it":"Arrivo da","fr":"Arriver depuis","es":"Llegar desde","de":"Anreise von","ar":"الوصول من"},"tabs":[{"label":{"en":"Fiumicino Airport","it":"Aeroporto di Fiumicino","fr":"Aéroport de Fiumicino","es":"Aeropuerto de Fiumicino","de":"Flughafen Fiumicino","ar":"مطار فيوميتشينو"},"origin":"Fiumicino Airport (FCO), Rome","routes":[{"icon":"train","title":{"en":"Train (Leonardo Express)","it":"Treno (Leonardo Express)","fr":"Train (Leonardo Express)","es":"Tren (Leonardo Express)","de":"Zug (Leonardo Express)","ar":"القطار (ليوناردو إكسبريس)"},"text":{"en":"Take the **Leonardo Express** from Fiumicino Airport to Roma Termini Station (direct trip, **about 32 minutes**). From Termini, take **bus 70** and get off at **Zanardelli** (about 25 minutes), then walk **2 minutes** to Vicolo della Palomba 4 – or take a **taxi** from Termini (about 15 minutes).","it":"Prendete il **Leonardo Express** dall’aeroporto di Fiumicino alla stazione Roma Termini (corsa diretta, **circa 32 minuti**). Da Termini prendete il **bus 70** e scendete a **Zanardelli** (circa 25 minuti), poi **2 minuti** a piedi fino a Vicolo della Palomba 4 – oppure prendete un **taxi** da Termini (circa 15 minuti).","fr":"Prenez le **Leonardo Express** de l’aéroport de Fiumicino jusqu’à la gare Roma Termini (trajet direct, **environ 32 minutes**). De Termini, prenez le **bus 70** et descendez à **Zanardelli** (environ 25 minutes), puis marchez **2 minutes** jusqu’au Vicolo della Palomba 4 – ou prenez un **taxi** depuis Termini (environ 15 minutes).","es":"Tome el **Leonardo Express** desde el aeropuerto de Fiumicino hasta la estación Roma Termini (trayecto directo, **unos 32 minutos**). Desde Termini, tome el **autobús 70** y bájese en **Zanardelli** (unos 25 minutos), luego camine **2 minutos** hasta Vicolo della Palomba 4 – o tome un **taxi** desde Termini (unos 15 minutos).","de":"Nehmen Sie den **Leonardo Express** vom Flughafen Fiumicino zum Bahnhof Roma Termini (Direktfahrt, **ca. 32 Minuten**). Nehmen Sie ab Termini den **Bus 70** bis **Zanardelli** (ca. 25 Minuten) und gehen Sie dann **2 Minuten** zu Fuß zum Vicolo della Palomba 4 – oder nehmen Sie ab Termini ein **Taxi** (ca. 15 Minuten).","ar":"استقلوا **ليوناردو إكسبريس** من مطار فيوميتشينو إلى محطة روما تيرميني (رحلة مباشرة، **حوالي 32 دقيقة**). من تيرميني، استقلوا **الحافلة 70** وانزلوا في محطة **Zanardelli** (حوالي 25 دقيقة)، ثم سيروا **دقيقتين** حتى Vicolo della Palomba 4 – أو استقلوا **سيارة أجرة** من تيرميني (حوالي 15 دقيقة)."},"price":{"en":"Total price: **around €15.50** (€14 for the train + €1.50 for the bus).","it":"Prezzo totale: **circa 15,50 €** (14 € il treno + 1,50 € il bus).","fr":"Prix total : **environ 15,50 €** (14 € pour le train + 1,50 € pour le bus).","es":"Precio total: **unos 15,50 €** (14 € el tren + 1,50 € el autobús).","de":"Gesamtpreis: **ca. 15,50 €** (14 € für den Zug + 1,50 € für den Bus).","ar":"السعر الإجمالي: **حوالي 15.50 يورو** (14 يورو للقطار + 1.50 يورو للحافلة)."}},{"icon":"bus","title":{"en":"Bus","it":"Bus","fr":"Bus","es":"Autobús","de":"Bus","ar":"الحافلة"},"text":{"en":"Take a **Terravision** bus to Roma Termini (approx. 50 minutes). From Termini, take **bus 70** and get off at **Zanardelli** (about 25 minutes), then walk **2 minutes** to Vicolo della Palomba 4 – or take a **taxi** from Termini (about 15 minutes).","it":"Prendete un bus **Terravision** fino a Roma Termini (circa 50 minuti). Da Termini prendete il **bus 70** e scendete a **Zanardelli** (circa 25 minuti), poi **2 minuti** a piedi fino a Vicolo della Palomba 4 – oppure prendete un **taxi** da Termini (circa 15 minuti).","fr":"Prenez un bus **Terravision** jusqu’à Roma Termini (environ 50 minutes). De Termini, prenez le **bus 70** et descendez à **Zanardelli** (environ 25 minutes), puis marchez **2 minutes** jusqu’au Vicolo della Palomba 4 – ou prenez un **taxi** depuis Termini (environ 15 minutes).","es":"Tome un autobús **Terravision** hasta Roma Termini (unos 50 minutos). Desde Termini, tome el **autobús 70** y bájese en **Zanardelli** (unos 25 minutos), luego camine **2 minutos** hasta Vicolo della Palomba 4 – o tome un **taxi** desde Termini (unos 15 minutos).","de":"Nehmen Sie einen **Terravision**-Bus nach Roma Termini (ca. 50 Minuten). Nehmen Sie ab Termini den **Bus 70** bis **Zanardelli** (ca. 25 Minuten) und gehen Sie dann **2 Minuten** zu Fuß zum Vicolo della Palomba 4 – oder nehmen Sie ab Termini ein **Taxi** (ca. 15 Minuten).","ar":"استقلوا حافلة **تيرافيجن** إلى روما تيرميني (حوالي 50 دقيقة). من تيرميني، استقلوا **الحافلة 70** وانزلوا في محطة **Zanardelli** (حوالي 25 دقيقة)، ثم سيروا **دقيقتين** حتى Vicolo della Palomba 4 – أو استقلوا **سيارة أجرة** من تيرميني (حوالي 15 دقيقة)."},"price":{"en":"Total price: **from about €5.50** (Terravision bus from €4 + €1.50 city bus).","it":"Prezzo totale: **da circa 5,50 €** (bus Terravision da 4 € + 1,50 € bus urbano).","fr":"Prix total : **à partir d’environ 5,50 €** (bus Terravision dès 4 € + 1,50 € le bus urbain).","es":"Precio total: **desde unos 5,50 €** (autobús Terravision desde 4 € + 1,50 € el autobús urbano).","de":"Gesamtpreis: **ab ca. 5,50 €** (Terravision-Bus ab 4 € + 1,50 € Stadtbus).","ar":"السعر الإجمالي: **ابتداءً من حوالي 5.50 يورو** (حافلة تيرافيجن ابتداءً من 4 يورو + 1.50 يورو للحافلة داخل المدينة)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis charge a **fixed fare of €55** from Fiumicino to the city centre (inside the Aurelian Walls), luggage included.","it":"I taxi ufficiali bianchi applicano una **tariffa fissa di 55 €** da Fiumicino al centro città (entro le Mura Aureliane), bagagli inclusi.","fr":"Les taxis officiels blancs appliquent un **tarif fixe de 55 €** de Fiumicino au centre-ville (à l’intérieur du mur d’Aurélien), bagages compris.","es":"Los taxis oficiales blancos aplican una **tarifa fija de 55 €** desde Fiumicino hasta el centro de la ciudad (dentro de las Murallas Aurelianas), equipaje incluido.","de":"Offizielle weiße Taxis berechnen von Fiumicino ins Stadtzentrum (innerhalb der Aurelianischen Mauer) einen **Festpreis  notre **service de transfert exclusif** directement depuis Ciampino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Ciampino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Ciampino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Ciampino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Ciampino"}]}]},{"type":"heading","text":{"en":"From the Zanardelli bus stop on foot","it":"Dalla fermata bus Zanardelli a piedi","fr":"De l’arrêt de bus Zanardelli à pied","es":"Desde la parada de autobús Zanardelli a pie","de":"Von der Bushaltestelle Zanardelli zu Fuß","ar":"من محطة حافلات Zanardelli سيراً على الأقدام"}},{"type":"steps","items":[{"en":"Get off at **Zanardelli**, next to the northern end of **Piazza Navona**.","it":"Scendete alla fermata **Zanardelli**, accanto al lato nord di **Piazza Navona**.","fr":"Descendez à l’arrêt **Zanardelli**, près de l’extrémité nord de la **Piazza Navona**.","es":"Bájese en la parada **Zanardelli**, junto al extremo norte de la **Piazza Navona**.","de":"Steigen Sie an der Haltestelle **Zanardelli** aus, am Nordende der **Piazza Navona**.","ar":"انزلوا في محطة **Zanardelli**، بجوار الطرف الشمالي من **ساحة نافونا**."},{"en":"**Vicolo della Palomba** is a small lane about **2 minutes** away on foot: number **4** is the **green door**.","it":"**Vicolo della Palomba** è un piccolo vicolo a circa **2 minuti** a piedi: il numero **4** è il **portone verde**.","fr":"Le **Vicolo della Palomba** est une petite ruelle à environ **2 minutes** à pied : le numéro **4** est la **porte verte**.","es":"**Vicolo della Palomba** es un pequeño callejón a unos **2 minutos** a pie: el número **4** es el **portal verde**.","de":"Der **Vicolo della Palomba** ist eine kleine Gasse etwa **2 Gehminuten** entfernt: Nummer **4** ist die **grüne Tür**.","ar":"**Vicolo della Palomba** زقاق صغير على بُعد **دقيقتين** سيراً تقريباً: الرقم **4** هو **الباب الأخضر**."},{"en":"Enter **1379A** on the keypad and **keep the A pressed** until the door opens.","it":"Digitate **1379A** sul tastierino e **tenete premuta la A** finché il portone si apre.","fr":"Tapez **1379A** sur le clavier et **maintenez le A appuyé** jusqu’à l’ouverture de la porte.","es":"Marque **1379A** en el teclado y **mantenga pulsada la A** hasta que se abra el portal.","de":"Geben Sie **1379A** am Tastenfeld ein und **halten Sie das A gedrückt**, bis die Tür aufgeht.","ar":"أدخلوا **1379A** على لوحة المفاتيح و**استمروا بالضغط على A** حتى يُفتح الباب."}]},{"type":"heading","text":{"en":"By taxi","it":"In taxi","fr":"En taxi","es":"En taxi","de":"Mit dem Taxi","ar":"بسيارة الأجرة"}},{"type":"text","text":{"en":"Give the driver the address **Vicolo della Palomba 4**, near **Piazza Navona**. The nearest taxi rank is in **Piazza delle Cinque Lune**, 2 minutes away.","it":"Indicate al tassista l’indirizzo **Vicolo della Palomba 4**, vicino a **Piazza Navona**. Il posteggio taxi più vicino è in **Piazza delle Cinque Lune**, a 2 minuti.","fr":"Donnez au chauffeur l’adresse **Vicolo della Palomba 4**, près de la **Piazza Navona**. La station de taxis la plus proche est **Piazza delle Cinque Lune**, à 2 minutes.","es":"Indique al taxista la dirección **Vicolo della Palomba 4**, cerca de la **Piazza Navona**. La parada de taxis más cercana está en **Piazza delle Cinque Lune**, a 2 minutos.","de":"Nennen Sie dem Fahrer die Adresse **Vicolo della Palomba 4**, nahe der **Piazza Navona**. Der nächste Taxistand ist an der **Piazza delle Cinque Lune**, 2 Minuten entfernt.","ar":"أعطوا السائق العنوان **Vicolo della Palomba 4**، قرب **ساحة نافونا**. أقرب موقف لسيارات الأجرة في **ساحة تشينكوي لوني** على بُعد دقيقتين."}}]},{"id":"wifi","icon":"wifi","title":{"en":"Wi-Fi","it":"Wi-Fi","fr":"Wi-Fi","es":"Wi-Fi","de":"WLAN","ar":"الواي فاي"},"blocks":[{"type":"wifi"},{"type":"heading","text":{"en":"Quick internet tips","it":"Consigli rapidi per internet","fr":"Astuces internet","es":"Consejos rápidos de internet","de":"Schnelle Internet-Tipps","ar":"نصائح سريعة للإنترنت"}},{"type":"list","items":[{"icon":"cable","title":{"en":"Check the connection","it":"Controllate la connessione","fr":"Vérifiez la connexion","es":"Compruebe la conexión","de":"Verbindung prüfen","ar":"تحقّقوا من الاتصال"},"text":{"en":"Ensure that **all cables** are properly connected to the internet box.","it":"Assicuratevi che **tutti i cavi** siano collegati correttamente al modem.","fr":"Assurez-vous que **tous les câbles** sont bien branchés sur la box internet.","es":"Asegúrese de que **todos los cables** estén bien conectados al router.","de":"Stellen Sie sicher, dass **alle Kabel** richtig mit dem Router verbunden sind.","ar":"تأكّدوا من توصيل **جميع الكابلات** بجهاز الإنترنت بشكل صحيح."}},{"icon":"rotate","title":{"en":"Restart the box","it":"Riavviate il modem","fr":"Redémarrez la box","es":"Reinicie el router","de":"Router neu starten","ar":"أعيدوا تشغيل الجهاز"},"text":{"en":"**Switch off the box**, wait a few seconds, then **switch it back on**.","it":"**Spegnete il modem**, attendete qualche secondo, poi **riaccendetelo**.","fr":"**Éteignez la box**, attendez quelques secondes, puis **rallumez-la**.","es":"**Apague el router**, espere unos segundos y **vuelva a encenderlo**.","de":"**Schalten Sie den Router aus**, warten Sie einige Sekunden und schalten Sie ihn dann **wieder ein**.","ar":"**أطفئوا الجهاز**، وانتظروا بضع ثوانٍ، ثم **أعيدوا تشغيله**."}}]},{"type":"problems","items":[{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]}]},{"id":"rules","icon":"rules","title":{"en":"House rules","it":"Regole della casa","fr":"Règlement intérieur","es":"Normas de la casa","de":"Hausregeln","ar":"قواعد المنزل"},"blocks":[{"type":"lead","text":{"en":"The apartment is in a **historic residential building** (palazzo d’epoca) where **families live**. Thank you for respecting the **house rules**.","it":"L’appartamento si trova in un **palazzo d’epoca residenziale**, dove **vivono famiglie**. Grazie per il rispetto delle **regole della casa**.","fr":"L’appartement se trouve dans un **immeuble résidentiel historique** (palazzo d’epoca) où **vivent des familles**. Merci de respecter le **règlement intérieur**.","es":"El apartamento está en un **edificio residencial histórico** (palazzo d’epoca) donde **viven familias**. Gracias por respetar las **normas de la casa**.","de":"Die Wohnung liegt in einem **historischen Wohnhaus** (Palazzo d’epoca), in dem **Familien wohnen**. Danke, dass Sie die **Hausregeln** einhalten.","ar":"تقع الشقة في **مبنى سكني تاريخي** (palazzo d’epoca) **تسكنه عائلات**. نشكركم على احترام **قواعد المنزل**."}},{"type":"rules","items":[{"icon":"column","text":{"en":"This is a **historic residential building**: keep **quiet** in the **common areas**, out of respect for the residents.","it":"È un **palazzo d’epoca residenziale**: mantenete il **silenzio** negli **spazi comuni**, per rispetto dei residenti.","fr":"C’est un **immeuble résidentiel historique** : restez **silencieux** dans les **parties communes**, par respect pour les résidents.","es":"Es un **edificio residencial histórico**: guarde **silencio** en las **zonas comunes**, por respeto a los vecinos.","de":"Dies ist ein **historisches Wohnhaus**: Bitte seien Sie in den **Gemeinschaftsbereichen** **leise** – aus Rücksicht auf die Bewohner.","ar":"هذا **مبنى سكني تاريخي**: التزموا **الهدوء** في **الأماكن المشتركة** احتراماً للسكان."}},{"icon":"nosmoke","text":{"en":"Please **do not smoke** inside the house.","it":"Vi preghiamo di **non fumare** all’interno della casa.","fr":"Merci de **ne pas fumer** à l’intérieur du logement.","es":"Le rogamos que **no fume** dentro de la vivienda.","de":"Bitte **rauchen Sie nicht** in der Wohnung.","ar":"يُرجى **عدم التدخين** داخل المنزل."}},{"icon":"sparkles","text":{"en":"Take care of the house, **keep the common areas clean** and leave things tidy after you use them.","it":"Abbiate cura della casa, **mantenete puliti gli spazi comuni** e lasciate tutto in ordine dopo l’uso.","fr":"Prenez soin du logement, **gardez les parties communes propres** et laissez tout en ordre après utilisation.","es":"Cuide la vivienda, **mantenga limpias las zonas comunes** y deje todo ordenado después de usarlo.","de":"Gehen Sie sorgsam mit der Wohnung um, halten Sie die **Gemeinschaftsbereiche sauber** und hinterlassen Sie alles ordentlich.","ar":"اعتنوا بالمنزل، و**حافظوا على نظافة الأماكن المشتركة**، واتركوا الأشياء مرتبة بعد استخدامها."}},{"icon":"mute","text":{"en":"Respect the peace and privacy of other occupants by **minimizing noise**.","it":"Rispettate la tranquillità e la privacy degli altri residenti **limitando i rumori**.","fr":"Respectez la tranquillité et l’intimité des autres occupants **en limitant le bruit**.","es":"Respete la tranquilidad y la privacidad de los demás ocupantes **reduciendo el ruido**.","de":"Respektieren Sie die Ruhe und Privatsphäre der anderen Bewohner, indem Sie **Lärm vermeiden**.","ar":"احترموا هدوء وخصوصية السكان الآخرين **بالتقليل من الضوضاء**."}},{"icon":"users","text":{"en":"Avoid inviting additional people **without prior authorization**.","it":"Evitate di invitare altre persone **senza previa autorizzazione**.","fr":"Évitez d’inviter d’autres personnes **sans autorisation préalable**.","es":"Evite invitar a otras personas **sin autorización previa**.","de":"Laden Sie keine weiteren Personen **ohne vorherige Genehmigung** ein.","ar":"تجنّبوا دعوة أشخاص إضافيين **دون إذن مسبق**."}},{"icon":"zap","text":{"en":"Follow **safety instructions** and avoid using dangerous or unauthorised electrical equipment.","it":"Seguite le **istruzioni di sicurezza** ed evitate di usare apparecchi elettrici pericolosi o non autorizzati.","fr":"Suivez les **consignes de sécurité** et évitez d’utiliser des appareils électriques dangereux ou non autorisés.","es":"Siga las **instrucciones de seguridad** y evite utilizar aparatos eléctricos peligrosos o no autorizados.","de":"Befolgen Sie die **Sicherheitshinweise** und verwenden Sie keine gefährlichen oder nicht zugelassenen Elektrogeräte.","ar":"اتبعوا **تعليمات السلامة** وتجنّبوا استخدام الأجهزة الكهربائية الخطرة أو غير المصرّح بها."}},{"icon":"alert","text":{"en":"Please report any problems or damage that occur during your stay **as soon as possible**.","it":"Segnalateci **il prima possibile** eventuali problemi o danni che si verifichino durante il soggiorno.","fr":"Signalez-nous **au plus vite** tout problème ou dommage survenu pendant votre séjour.","es":"Comuníquenos **lo antes posible** cualquier problema o daño que se produzca durante su estancia.","de":"Bitte melden Sie uns Probleme oder Schäden während Ihres Aufenthalts **so schnell wie möglich**.","ar":"يُرجى إبلاغنا **في أقرب وقت ممكن** بأي مشكلة أو ضرر يحدث خلال إقامتكم."}}]},{"type":"closing","text":{"en":"Thank you","it":"Grazie","fr":"Merci","es":"Gracias","de":"Danke","ar":"شكراً لكم"}}]},{"id":"transport","icon":"metro","title":{"en":"Transport","it":"Trasporti","fr":"Transports","es":"Transporte","de":"Verkehrsmittel","ar":"المواصلات"},"blocks":[{"type":"list","items":[{"icon":"metro","title":{"en":"Metro – Line A","it":"Metro – Linea A","fr":"Métro – Ligne A","es":"Metro – Línea A","de":"Metro – Linie A","ar":"المترو – الخط A"},"text":{"en":"Stop: **Spa ":"checkout","icon":"door","title":{"en":"Check-out","it":"Check-out","fr":"Départ","es":"Check-out","de":"Check-out","ar":"تسجيل المغادرة"},"blocks":[{"type":"time","value":"10:00","label":{"en":"Check-out","it":"Check-out","fr":"Départ","es":"Check-out","de":"Check-out","ar":"تسجيل المغادرة"}},{"type":"text","text":{"en":"If you wish to **depart later**, please contact us and we will check availability and confirm according to our schedule. You may also leave your luggage with us **until 1:00 PM**, provided it is properly closed.","it":"Se desiderate **partire più tardi**, contattateci: verificheremo la disponibilità e ve la confermeremo in base alla nostra programmazione. Potete anche lasciare i bagagli da noi **fino alle 13:00**, purché ben chiusi.","fr":"Si vous souhaitez **partir plus tard**, contactez-nous : nous vérifierons la disponibilité et vous confirmerons selon notre planning. Vous pouvez également nous laisser vos bagages **jusqu’à 13h00**, à condition qu’ils soient bien fermés.","es":"Si desea **salir más tarde**, contáctenos y comprobaremos la disponibilidad y se la confirmaremos según nuestra programación. También puede dejarnos su equipaje **hasta las 13:00**, siempre que esté bien cerrado.","de":"Wenn Sie **später abreisen** möchten, kontaktieren Sie uns bitte – wir prüfen die Verfügbarkeit und bestätigen sie entsprechend unserem Zeitplan. Sie können Ihr Gepäck auch **bis 13:00 Uhr** bei uns lassen, sofern es gut verschlossen ist.","ar":"إذا رغبتم في **المغادرة في وقت لاحق**، يُرجى التواصل معنا وسنتحقق من التوفر ونؤكد لكم ذلك حسب جدولنا. يمكنكم أيضاً ترك أمتعتكم لدينا **حتى الساعة 13:00**، بشرط أن تكون مغلقة بإحكام."}},{"type":"checklist","title":{"en":"Before leaving – in this order","it":"Prima di partire – in quest’ordine","fr":"Avant de partir – dans cet ordre","es":"Antes de salir – en este orden","de":"Vor der Abreise – in dieser Reihenfolge","ar":"قبل المغادرة – بهذا الترتيب"},"items":[{"icon":"clock","title":{"en":"Leave by 10:00","it":"Uscite entro le 10:00","fr":"Départ avant 10h00","es":"Salida antes de las 10:00","de":"Abreise bis 10:00 Uhr","ar":"المغادرة قبل 10:00"},"text":{"en":"Check-out is by **10:00**. Make sure you **haven’t forgotten anything**.","it":"Il check-out è entro le **10:00**. Controllate di **non aver dimenticato nulla**.","fr":"Le départ se fait avant **10h00**. Vérifiez que vous **n’avez rien oublié**.","es":"El check-out es antes de las **10:00**. Compruebe que **no ha olvidado nada**.","de":"Check-out ist bis **10:00 Uhr**. Prüfen Sie, dass Sie **nichts vergessen** haben.","ar":"موعد المغادرة قبل **10:00**. تأكّدوا من أنكم **لم تنسوا شيئاً**."}},{"icon":"power","title":{"en":"Lights and devices off","it":"Luci e apparecchi spenti","fr":"Lumières et appareils éteints","es":"Luces y aparatos apagados","de":"Licht und Geräte aus","ar":"إطفاء الأضواء والأجهزة"},"text":{"en":"**Turn off** all lights and electrical devices.","it":"**Spegnete** tutte le luci e gli apparecchi elettrici.","fr":"**Éteignez** toutes les lumières et les appareils électriques.","es":"**Apague** todas las luces y los aparatos eléctricos.","de":"**Schalten Sie** alle Lichter und Elektrogeräte **aus**.","ar":"**أطفئوا** جميع الأضواء والأجهزة الكهربائية."}},{"icon":"house","title":{"en":"Windows closed","it":"Finestre chiuse","fr":"Fenêtres fermées","es":"Ventanas cerradas","de":"Fenster geschlossen","ar":"النوافذ مغلقة"},"text":{"en":"**Close all the windows.**","it":"**Chiudete tutte le finestre.**","fr":"**Fermez toutes les fenêtres.**","es":"**Cierre todas las ventanas.**","de":"**Schließen Sie alle Fenster.**","ar":"**أغلقوا جميع النوافذ.**"}},{"icon":"euro","title":{"en":"Tourist tax","it":"Tassa di soggiorno","fr":"Taxe de séjour","es":"Tasa turística","de":"Kurtaxe","ar":"ضريبة السياحة"},"text":{"en":"Leave it **in cash on the table next to the keys** (€6 per person per night, not for children under 10).","it":"Lasciatela **in contanti sul tavolo accanto alle chiavi** (6 € a persona a notte, esenti i bambini sotto i 10 anni).","fr":"Laissez-la **en espèces sur la table à côté des clés** (6 € par personne et par nuit, sauf enfants de moins de 10 ans).","es":"Déjela **en efectivo sobre la mesa junto a las llaves** (6 € por persona y noche, exentos los menores de 10 años).","de":"Lassen Sie sie **in bar auf dem Tisch neben den Schlüsseln** (6 € pro Person und Nacht, Kinder unter 10 befreit).","ar":"اتركوها **نقداً على الطاولة بجانب المفاتيح** (6 يورو للشخص في الليلة، ويُعفى الأطفال دون 10 سنوات)."}},{"icon":"key","title":{"en":"Keys on the table","it":"Chiavi sul tavolo","fr":"Clés sur la table","es":"Llaves sobre la mesa","de":"Schlüssel auf den Tisch","ar":"المفاتيح على الطاولة"},"text":{"en":"Leave the **keys on the table**, next to the tourist tax.","it":"Lasciate le **chiavi sul tavolo**, accanto alla tassa di soggiorno.","fr":"Laissez les **clés sur la table**, à côté de la taxe de séjour.","es":"Deje las **llaves sobre la mesa**, junto a la tasa turística.","de":"Legen Sie die **Schlüssel auf den Tisch**, neben die Kurtaxe.","ar":"اتركوا **المفاتيح على الطاولة** بجانب ضريبة السياحة."}},{"icon":"door","title":{"en":"Close the door","it":"Chiudete la porta","fr":"Fermez la porte","es":"Cierre la puerta","de":"Tür schließen","ar":"أغلقوا الباب"},"text":{"en":"Go out and **close the apartment door** behind you.","it":"Uscite e **chiudete la porta di casa** alle vostre spalle.","fr":"Sortez et **refermez la porte de l’appartement** derrière vous.","es":"Salga y **cierre la puerta del apartamento** detrás de usted.","de":"Gehen Sie hinaus und **schließen Sie die Wohnungstür** hinter sich.","ar":"اخرجوا و**أغلقوا باب الشقة** خلفكم."}}]},{"type":"closing","text":{"en":"Thank you!","it":"Grazie!","fr":"Merci !","es":"¡Gracias!","de":"Vielen Dank!","ar":"شكراً لكم!"}}]},{"id":"contact","icon":"phone","title":{"en":"Contact","it":"Contatti","fr":"Contact","es":"Contacto","de":"Kontakt","ar":"التواصل"},"blocks":[{"type":"host","text":{"en":"Dear travelers, I am here to assist you whenever you need. If you encounter any issues or have any questions, please do not hesitate to contact me **by phone or email**. I am **always available** to help make your stay as pleasant and stress-free as possible.","it":"Cari viaggiatori, sono qui per assistervi ogni volta che ne avrete bisogno. Se incontrate qualche problema o avete domande, non esitate a contattarmi **per telefono o via email**. Sono **sempre disponibile** per rendere il vostro soggiorno il più piacevole e sereno possibile.","fr":"Chers voyageurs, je suis là pour vous aider à tout moment. Si vous rencontrez un problème ou avez des questions, n’hésitez pas à me contacter **par téléphone ou par e-mail**. Je suis **toujours disponible** pour rendre votre séjour aussi agréable et serein que possible.","es":"Queridos viajeros, estoy aquí para ayudarles siempre que lo necesiten. Si tienen algún problema o alguna pregunta, no duden en contactarme **por teléfono o por correo electrónico**. **Siempre estoy disponible** para que su estancia sea lo más agradable y tranquila posible.","de":"Liebe Reisende, ich bin jederzeit für Sie da. Wenn Probleme auftreten oder Sie Fragen haben, zögern Sie nicht, mich **telefonisch oder per E-Mail** zu kontaktieren. Ich helfe Ihnen **immer gern**, Ihren Aufenthalt so angenehm und entspannt wie möglich zu gestalten.","ar":"أعزاءنا المسافرين، أنا هنا لمساعدتكم متى احتجتم إلى ذلك. إذا واجهتم أي مشكلة أو كان لديكم أي سؤال، فلا تترددوا في التواصل معي **عبر الهاتف أو البريد الإلكتروني**. أنا **متاح دائماً** لأجعل إقامتكم ممتعة ومريحة قدر الإمكان."}},{"type":"review","text":{"en":"We hope you had a pleasant stay in our home. If you could take a moment to share your feedback and leave us a **5-star review**, it would be greatly appreciated.","it":"Speriamo che abbiate trascorso un piacevole soggiorno nella nostra casa. Se poteste dedicarci un momento per condividere la vostra opinione e lasciarci una **recensione a 5 stelle**, ve ne saremmo davvero grati.","fr":"Nous espérons que vous avez passé un agréable séjour chez nous. Si vous pouviez prendre un instant pour partager votre avis et nous laisser un **commentaire 5 étoiles**, nous vous en serions très reconnaissants.","es":"Esperamos que haya disfrutado de una agradable estancia en nuestra casa. Si pudiera dedicar un momento a compartir su opinión y dejarnos una **reseña de 5 estrellas**, se lo agradeceríamos muchísimo.","de":"Wir hoffen, Sie hatten einen angenehmen Aufenthalt bei uns. Wenn Sie sich einen Moment Zeit nehmen könnten, um Ihre Eindrücke zu teilen und uns eine **5-Sterne-Bewertung** zu hinterlassen, würden wir uns sehr freuen.","ar":"نأمل أن تكونوا قد استمتعتم بإقامة طيبة في منزلنا. إذا تمكنتم من تخصيص لحظة لمشاركة رأيكم وترك **تقييم من 5 نجوم** لنا، فسنكون ممتنين جداً."}}]}],"arrival":{"steps":[{"en":"Arrive at **Vicolo della Palomba 4**: the **green street door** in the photo.","it":"Arrivate in **Vicolo della Palomba 4**: il **portone verde** della foto.","fr":"Arrivez au **Vicolo della Palomba 4** : la **porte verte** de la photo.","es":"Llegue a **Vicolo della Palomba 4**: el **portal verde** de la foto.","de":"Kommen Sie in den **Vicolo della Palomba 4**: die **grüne Haustür** auf dem Foto.","ar":"عند وصولكم إلى **Vicolo della Palomba 4**: **باب المبنى الأخضر** الظاهر في الصورة."},{"en":"At the door you’ll see a **keypad**: enter **1379A** and **keep the A pressed** until the street door **opens**.","it":"Al portone trovate un **tastierino**: digitate **1379A** e **tenete premuta la A** finché il portone **non si apre**.","fr":"À la porte, vous verrez un **clavier à code** : tapez **1379A** et **maintenez le A appuyé** jusqu’à ce que la porte **s’ouvre**.","es":"En el portal verá un **teclado**: marque **1379A** y **mantenga pulsada la A** hasta que el portal **se abra**.","de":"An der Tür sehen Sie ein **Tastenfeld**: Geben Sie **1379A** ein und **halten Sie das A gedrückt**, bis die Haustür **aufgeht**.","ar":"عند الباب سترون **لوحة مفاتيح**: أدخلوا **1379A** و**استمروا بالضغط على A** حتى **يُفتح** باب المبنى."},{"en":"Take the **elevator** to the **3rd floor**. When you exit, **in front of you** there is the **key box**: enter the code **109** and take the **apartment keys**.","it":"Prendete l’**ascensore** fino al **terzo piano**. Uscendo, **di fronte a voi** c’è la **cassetta delle chiavi**: inserite il codice **109** e prendete le **chiavi dell’appartamento**.","fr":"Prenez l’**ascenseur** jusqu’au **3e étage**. En sortant, **en face de vous**, se trouve la **boîte à clés** : saisissez le code **109** et prenez les **clés de l’appartement**.","es":"Tome el **ascensor** hasta la **3ª planta**. Al salir, **frente a usted** está la **caja de llaves**: introduzca el código **109** y coja las **llaves del apartamento**.","de":"Fahren Sie mit dem **Aufzug** in den **3. Stock**. Beim Aussteigen befindet sich **direkt vor Ihnen** der **Schlüsselsafe**: Geben Sie den Code **109** ein und nehmen Sie die **Wohnungsschlüssel**.","ar":"اصعدوا بـ**المصعد** إلى **الطابق الثالث**. عند خروجكم ستجدون **أمامكم** **صندوق المفاتيح**: أدخلوا الرمز **109** وخذوا **مفاتيح الشقة**."},{"en":"**Walk left** and **immediately turn right**: there is your door. Open it with the **longest key**.","it":"**Andate a sinistra** e **girate subito a destra**: lì c’è la vostra porta. Apritela con la **chiave più lunga**.","fr":"**Allez à gauche** puis **tournez tout de suite à droite** : voici votre porte. Ouvrez-la avec la **clé la plus longue**.","es":"**Vaya a la izquierda** y **gire enseguida a la derecha**: ahí está su puerta. Ábrala con la **llave más larga**.","de":"**Gehen Sie nach links** und **biegen Sie sofort rechts ab**: Dort ist Ihre Tür. Öffnen Sie sie mit dem **längsten Schlüssel**.","ar":"**اتجهوا يساراً** ثم **انعطفوا يميناً مباشرةً**: هناك باب شقتكم. افتحوه بـ**المفتاح الأطول**."},{"en":"Go inside and **close the door** behind you. **Welcome!**","it":"Entrate e **chiudete la porta** alle vostre spalle. **Benvenuti!**","fr":"
