o","de":"Der Flur","ar":"الممر"}}],"sections":[{"id":"welcome","icon":"column","title":{"en":"Welcome","it":"Benvenuti","fr":"Bienvenue","es":"Bienvenida","de":"Willkommen","ar":"مرحباً بكم"},"blocks":[{"type":"lead","text":{"en":"**Welcome to Catone!** We are pleased to welcome you to our accommodation and we hope you will have an **unforgettable stay**.","it":"**Benvenuti a Catone!** Siamo lieti di accogliervi nella nostra struttura e speriamo che il vostro soggiorno sia **indimenticabile**.","fr":"**Bienvenue à Catone !** Nous sommes ravis de vous accueillir dans notre logement et espérons que votre séjour sera **inoubliable**.","es":"**¡Bienvenidos a Catone!** Nos complace darle la bienvenida a nuestro alojamiento y esperamos que disfrute de una **estancia inolvidable**.","de":"**Willkommen im Catone!** Wir freuen uns, Sie in unserer Unterkunft willkommen zu heißen, und wünschen Ihnen einen **unvergesslichen Aufenthalt**.","ar":"**أهلاً بكم في Catone!** يسعدنا أن نرحب بكم في مسكننا، ونتمنى لكم **إقامة لا تُنسى**."}},{"type":"text","text":{"en":"**Catone** is a large, newly renovated apartment at **Via Catone 29** (**raised ground floor**, the **door at the END of the hallway**), in the elegant **Prati** district right next to the **Vatican**: the **Vatican Museums** are **8 minutes** away on foot and **St. Peter’s Square** **10**. It has **3 bedrooms** with **6 beds**, a **living room** with a **piano**, a **kitchen** and **2 bathrooms**.","it":"**Catone** è un grande appartamento appena ristrutturato in **Via Catone 29** (**piano rialzato**, la **porta in FONDO al corridoio**), nell’elegante quartiere **Prati**, accanto al **Vaticano**: i **Musei Vaticani** sono a **8 minuti** a piedi e **Piazza San Pietro** a **10**. Ha **3 camere da letto** con **6 letti**, un **soggiorno** con **pianoforte**, una **cucina** e **2 bagni**.","fr":"**Catone** est un grand appartement récemment rénové situé **Via Catone 29** (**rez-de-chaussée surélevé**, la **porte au FOND du couloir**), dans l’élégant quartier de **Prati**, juste à côté du **Vatican** : les **musées du Vatican** sont à **8 minutes** à pied et la **place Saint-Pierre** à **10**. Il dispose de **3 chambres** avec **6 lits**, d’un **séjour** avec **piano**, d’une **cuisine** et de **2 salles de bain**.","es":"**Catone** es un amplio apartamento recién reformado en **Via Catone 29** (**planta baja elevada**, la **puerta al FONDO del pasillo**), en el elegante barrio de **Prati**, junto al **Vaticano**: los **Museos Vaticanos** están a **8 minutos** a pie y la **Plaza de San Pedro** a **10**. Tiene **3 dormitorios** con **6 camas**, un **salón** con **piano**, una **cocina** y **2 baños**.","de":"**Catone** ist eine große, frisch renovierte Wohnung in der **Via Catone 29** (**Hochparterre**, die **Tür am ENDE des Flurs**), im eleganten Viertel **Prati** direkt neben dem **Vatikan**: Die **Vatikanischen Museen** sind **8 Gehminuten** entfernt, der **Petersplatz** **10**. Sie hat **3 Schlafzimmer** mit **6 Betten**, ein **Wohnzimmer** mit **Klavier**, eine **Küche** und **2 Bäder**.","ar":"**Catone** شقة واسعة مجدّدة حديثاً في **Via Catone 29** (**الطابق الأرضي المرتفع**، **الباب في نهاية الممر**)، في حي **براتي** الأنيق بجوار **الفاتيكان**: تبعد **متاحف الفاتيكان** **8 دقائق** سيراً و**ساحة القديس بطرس** **10 دقائق**. تضم **3 غرف نوم** بـ**6 أسرّة**، و**غرفة معيشة** مع **بيانو**، و**مطبخاً** و**حمّامين**."}},{"type":"photo","src":"img/living","alt":{"en":"Living room with piano","it":"Soggiorno con pianoforte","fr":"Séjour avec piano","es":"Salón con piano","de":"Wohnzimmer mit Klavier","ar":"غرفة المعيشة مع البيانو"}},{"type":"text","text":{"en":"We wish you an **excellent stay** in our beautiful city and hope to **see you again soon**!","it":"Vi auguriamo un **ottimo soggiorno** nella nostra splendida città e speriamo di **rivedervi presto**!","fr":"Nous vous souhaitons un **excellent séjour** dans notre belle ville et espérons **vous revoir très bientôt** !","es":"¡Le deseamos una **excelente estancia** en nuestra hermosa ciudad y esperamos **volver a verle pronto**!","de":"Wir wünschen Ihnen einen **wunderbaren Aufenthalt** in unserer schönen Stadt und hoffen, Sie **bald wiederzusehen**!","ar":"نتمنى لكم **إقامة ممتعة** في مدينتنا الجميلة، ونأمل أن **نراكم مجدداً قريباً**!"}},{"type":"signature","text":"Rome Dream Home"}]},{"id":"checkin","icon":"key","title":{"en":"Check-in","it":"Check-in","fr":"Arrivée","es":"Check-in","de":"Check-in","ar":"تسجيل الوصول"},"blocks":[{"type":"time","value":"15:00","label":{"en":"Self check-in","it":"Self check-in","fr":"Self check-in","es":"Self check-in","de":"Self-Check-in","ar":"تسجيل الوصول الذاتي"}},{"type":"text","text":{"en":"**Self check-in**: the **main door** opens with the code **1919#** on the keypad on the **LEFT**; the **keys** are in the **key box on your door** (**raised ground floor**, **at the END of the hallway**), code **2193**.","it":"**Self check-in**: il **portone** si apre con il codice **1919#** sulla tastiera a **SINISTRA**; le **chiavi** sono nella **cassetta sulla vostra porta** (**piano rialzato**, **in FONDO al corridoio**), codice **2193**.","fr":"**Self check-in** : la **porte de l’immeuble** s’ouvre avec le code **1919#** sur le clavier à **GAUCHE** ; les **clés** sont dans la **boîte sur votre porte** (**rez-de-chaussée surélevé**, **au FOND du couloir**), code **2193**.","es":"**Self check-in**: el **portal** se abre con el código **1919#** en el teclado a la **IZQUIERDA**; las **llaves** están en la **caja de su puerta** (**planta baja elevada**, **al FONDO del pasillo**), código **2193**.","de":"**Self-Check-in**: Die **Haustür** öffnen Sie mit dem Code **1919#** am Tastenfeld **LINKS**; die **Schlüssel** liegen im **Schlüsselsafe an Ihrer Tür** (**Hochparterre**, **am ENDE des Flurs**), Code **2193**.","ar":"**تسجيل وصول ذاتي**: يُفتح **باب المبنى** بالرمز **1919#** على لوحة الأرقام على **اليسار**؛ و**المفاتيح** في **الصندوق على بابكم** (**الطابق الأرضي المرتفع**، **في نهاية الممر**)، الرمز **2193**."}},{"type":"text","text":{"en":"Please respect the check-in times. If you would like to arrive earlier, no problem at all: you can **drop off your luggage from 11:00** and take the keys, then **come back at 15:00** when the apartment will be ready.","it":"Vi preghiamo di rispettare gli orari di check-in. Se desiderate arrivare prima, nessun problema: potete **lasciare i bagagli a partire dalle 11:00** e ritirare le chiavi, per poi **tornare alle 15:00**, quando l’appartamento sarà pronto.","fr":"Merci de respecter les horaires d’arrivée. Si vous souhaitez arriver plus tôt, aucun problème : vous pouvez **déposer vos bagages à partir de 11h00** et récupérer les clés, puis **revenir à 15h00**, lorsque l’appartement sera prêt.","es":"Le rogamos que respete los horarios de check-in. Si desea llegar antes, no hay ningún problema: puede **dejar su equipaje a partir de las 11:00** y recoger las llaves, y luego **volver a las 15:00**, cuando el apartamento esté listo.","de":"Bitte halten Sie die Check-in-Zeiten ein. Wenn Sie früher ankommen möchten, ist das kein Problem: Sie können Ihr **Gepäck ab 11:00 Uhr abstellen** und die Schlüssel abholen und dann **um 15:00 Uhr zurückkommen**, wenn die Wohnung bereit ist.","ar":"يُرجى الالتزام بمواعيد تسجيل الوصول. إذا رغبتم في الوصول مبكراً فلا مشكلة إطلاقاً: يمكنكم **ترك أمتعتكم ابتداءً من الساعة 11:00** واستلام المفاتيح، ثم **العودة في الساعة 15:00** عندما تكون الشقة جاهزة."}},{"type":"heading","text":{"en":"House access","it":"Accesso alla casa","fr":"Accès au logement","es":"Acceso a la vivienda","de":"Zugang zur Wohnung","ar":"الدخول إلى المنزل"}},{"type":"steps","items":[{"text":{"en":"Arrive at **Via Catone 29**: the **black wrought-iron and glass main door**.","it":"Arrivate in **Via Catone 29**: il **portone in ferro battuto nero e vetro**.","fr":"Arrivez au **Via Catone 29** : la **porte d’entrée en fer forgé noir et verre**.","es":"Llegue a **Via Catone 29**: el **portal de hierro forjado negro y cristal**.","de":"Kommen Sie zur **Via Catone 29**: die **schwarze Haustür aus Schmiedeeisen und Glas**.","ar":"عند الوصول إلى **Via Catone 29**: **الباب الرئيسي من الحديد المشغول الأسود والزجاج**."},"photos":[{"src":"img/step-entrance","alt":{"en":"The main door of Via Catone 29","it":"Il portone di Via Catone 29","fr":"La porte d’entrée du Via Catone 29","es":"El portal de Via Catone 29","de":"Die Haustür der Via Catone 29","ar":"الباب الرئيسي لـ Via Catone 29"}}]},{"text":{"en":"On the **LEFT side** of the door there is a **keypad** (code lock): type **1919#** to open the **main door**.","it":"Sul **lato SINISTRO** del portone c’è una **tastiera** (serratura a codice): digitate **1919#** per aprire il **portone**.","fr":"Sur le **côté GAUCHE** de la porte se trouve un **clavier** (serrure à code) : tapez **1919#** pour ouvrir la **porte de l’immeuble**.","es":"En el **lado IZQUIERDO** del portal hay un **teclado** (cerradura con código): marque **1919#** para abrir el **portal**.","de":"An der **LINKEN Seite** der Tür befindet sich ein **Tastenfeld** (Codeschloss): Geben Sie **1919#** ein, um die **Haustür** zu öffnen.","ar":"على **الجانب الأيسر** من الباب توجد **لوحة أرقام** (قفل برمز): اكتبوا **1919#** لفتح **باب المبنى**."},"photos":[{"src":"img/step-keypad","alt":{"en":"The keypad on the LEFT of the main door","it":"La tastiera a SINISTRA del portone","fr":"Le clavier à GAUCHE de la porte","es":"El teclado a la IZQUIERDA del portal","de":"Das Tastenfeld LINKS neben der Haustür","ar":"لوحة الأرقام على يسار الباب الرئيسي"}}]},{"text":{"en":"Inside, follow the **red arrows**: **turn RIGHT** and **climb the short ramp**.","it":"Una volta dentro, seguite le **frecce rosse**: **girate a DESTRA** e **salite la breve rampa**.","fr":"À l’intérieur, suivez les **flèches rouges** : **tournez à DROITE** et **montez la petite rampe**.","es":"Dentro, siga las **flechas rojas**: **gire a la DERECHA** y **suba la pequeña rampa**.","de":"Folgen Sie drinnen den **roten Pfeilen**: **Biegen Sie RECHTS ab** und **gehen Sie die kurze Rampe hinauf**.","ar":"في الداخل اتبعوا **الأسهم الحمراء**: **انعطفوا يميناً** و**اصعدوا المنحدر القصير**."},"photos":[{"src":"img/step-hall","alt":{"en":"The entrance hall: follow the arrows, turn right and climb the short ramp","it":"L’androne: seguite le frecce, girate a destra e salite la rampa","fr":"Le hall : suivez les flèches, tournez à droite et montez la rampe","es":"El vestíbulo: siga las flechas, gire a la derecha y suba la rampa","de":"Die Eingangshalle: den Pfeilen folgen, rechts abbiegen, die Rampe hinauf","ar":"المدخل: اتبعوا الأسهم وانعطفوا يميناً واصعدوا المنحدر"}}]},{"text":{"en":"**Your door: raised ground floor, at the END of the hallway.** The **key box is on the door**: enter the code **2193** and take the **keys**. Go in and **close the door** behind you. **Welcome!**","it":"**La vostra porta: piano rialzato, in FONDO al corridoio.** La **cassetta delle chiavi è sulla porta**: inserite il codice **2193** e prendete le **chiavi**. Entrate e **chiudete la porta** alle vostre spalle. **Benvenuti!**","fr":"**Votre porte : rez-de-chaussée surélevé, au FOND du couloir.** La **boîte à clés est sur la porte** : saisissez le code **2193** et prenez les **clés**. Entrez et **refermez la porte** derrière vous. **Bienvenue !**","es":"**Su puerta: planta baja elevada, al FONDO del pasillo.** La **caja de llaves está en la puerta**: introduzca el código **2193** y coja las **llaves**. Entre y **cierre la puerta** al pasar. **¡Bienvenidos!**","de":"**Ihre Tür: Hochparterre, am ENDE des Flurs.** Der **Schlüsselsafe ist an der Tür**: Geben Sie den Code **2193** ein und nehmen Sie die **Schlüssel**. Treten Sie ein und **schließen Sie die Tür** hinter sich. **Willkommen!**","ar":"**بابكم: الطابق الأرضي المرتفع، في نهاية الممر.** **صندوق المفاتيح على الباب**: أدخلوا الرمز **2193** وخذوا **المفاتيح**. ادخلوا و**أغلقوا الباب** خلفكم. **أهلاً وسهلاً!**"},"photos":[{"src":"img/step-door","alt":{"en":"Your door: raised ground floor, door at the END of the hallway","it":"La vostra porta: piano rialzato, porta in FONDO al corridoio","fr":"Votre porte : rez-de-chaussée surélevé, porte au FOND du couloir","es":"Su puerta: planta baja elevada, puerta al FONDO del pasillo","de":"Ihre Tür: Hochparterre, Tür am ENDE des Flurs","ar":"بابكم: الطابق الأرضي المرتفع، الباب في نهاية الممر"}}]}]},{"type":"arrival"},{"type":"code","icon":"door","value":"1919#","label":{"en":"Main door code · keypad on the LEFT","it":"Codice portone · tastiera a SINISTRA","fr":"Code de la porte de l’immeuble · clavier à GAUCHE","es":"Código del portal · teclado a la IZQUIERDA","de":"Haustür-Code · Tastenfeld LINKS","ar":"رمز باب المبنى · لوحة الأرقام على اليسار"}},{"type":"code","label":{"en":"Apartment lockbox · raised ground floor, door at the END of the hallway","it":"Cassetta appartamento · piano rialzato, porta in FONDO al corridoio","fr":"Boîte à clés de l’appartement · rez-de-chaussée surélevé, porte au FOND du couloir","es":"Caja del apartamento · planta baja elevada, puerta al FONDO del pasillo","de":"Safe Wohnung · Hochparterre, Tür am ENDE des Flurs","ar":"صندوق الشقة · الطابق الأرضي المرتفع، الباب في نهاية الممر"},"value":"2193","icon":"lock"},{"type":"tax","text":{"en":"Rome **tourist tax**: **€6 per person per night**. Leave it **in cash on the table** before you leave. Please make sure you have already sent us a **photo of your passport** for the registration of your stay. Children **under 10** are exempt.","it":"**Tassa di soggiorno** di Roma: **6 € a persona a notte**. Lasciatela **in contanti sul tavolo** prima di partire. Assicuratevi di averci già inviato la **foto del passaporto** per la registrazione del soggiorno. I bambini **sotto i 10 anni** sono esenti.","fr":"**Taxe de séjour** de Rome : **6 € par personne et par nuit**. Laissez-la **en espèces sur la table** avant de partir. Assurez-vous de nous avoir déjà envoyé la **photo de votre passeport** pour l’enregistrement de votre séjour. Les enfants de **moins de 10 ans** sont exonérés.","es":"**Tasa turística** de Roma: **6 € por persona y noche**. Déjela **en efectivo sobre la mesa** antes de irse. Asegúrese de habernos enviado ya la **foto de su pasaporte** para el registro de su estancia. Los niños **menores de 10 años** están exentos.","de":"Römische **Kurtaxe**: **6 € pro Person und Nacht**. Lassen Sie sie vor der Abreise **in bar auf dem Tisch**. Bitte stellen Sie sicher, dass Sie uns bereits ein **Foto Ihres Reisepasses** für die Anmeldung Ihres Aufenthalts geschickt haben. Kinder **unter 10 Jahren** sind befreit.","ar":"**ضريبة السياحة** في روما: **6 يورو للشخص في الليلة**. اتركوها **نقداً على الطاولة** قبل المغادرة. يُرجى التأكد من أنكم أرسلتم إلينا **صورة جواز السفر** لتسجيل إقامتكم. الأطفال **دون 10 سنوات** معفون."}},{"type":"problems","items":[{"icon":"door","q":{"en":"The street door doesn’t open?","it":"Il portone non si apre?","fr":"La porte de l’immeuble ne s’ouvre pas ?","es":"¿El portal no se abre?","de":"Die Haustür geht nicht auf?","ar":"باب المبنى لا يُفتح؟"},"a":{"en":"Use the **keypad on the LEFT** of the door: type **1919** and then **#**, slowly. Still closed? **Message us or call us**.","it":"Usate la **tastiera a SINISTRA** del portone: digitate **1919** e poi **#**, con calma. Ancora chiuso? **Scriveteci o chiamateci**.","fr":"Utilisez le **clavier à GAUCHE** de la porte : tapez **1919** puis **#**, lentement. Toujours fermée ? **Écrivez-nous ou appelez-nous**.","es":"Use el **teclado a la IZQUIERDA** del portal: marque **1919** y luego **#**, despacio. ¿Sigue cerrado? **Escríbanos o llámenos**.","de":"Benutzen Sie das **Tastenfeld LINKS** neben der Tür: Geben Sie langsam **1919** und dann **#** ein. Immer noch zu? **Schreiben Sie uns oder rufen Sie an**.","ar":"استخدموا **لوحة الأرقام على يسار** الباب: اكتبوا **1919** ثم **#** ببطء. ما زال مغلقاً؟ **راسلونا أو اتصلوا بنا**."}},{"icon":"lock","q":{"en":"The lockbox won’t open?","it":"La cassetta non si apre?","fr":"La boîte à clés ne s’ouvre pas ?","es":"¿La caja de llaves no se abre?","de":"Der Schlüsselsafe geht nicht auf?","ar":"صندوق المفاتيح لا يُفتح؟"},"a":{"en":"The box is **on your door**: **raised ground floor, at the END of the hallway**, after the short ramp on the right. Check that **every digit** is on **2193** and try again. Still closed? **Call us**.","it":"La cassetta è **sulla vostra porta**: **piano rialzato, in FONDO al corridoio**, dopo la breve rampa a destra. Controllate che **ogni cifra** sia su **2193** e riprovate. Ancora chiusa? **Chiamateci**.","fr":"La boîte est **sur votre porte** : **rez-de-chaussée surélevé, au FOND du couloir**, après la petite rampe à droite. Vérifiez que **chaque chiffre** est sur **2193** et réessayez. Toujours fermée ? **Appelez-nous**.","es":"La caja está **en su puerta**: **planta baja elevada, al FONDO del pasillo**, tras la pequeña rampa a la derecha. Compruebe que **cada cifra** esté en **2193** y vuelva a intentarlo. ¿Sigue cerrada? **Llámenos**.","de":"Der Safe ist **an Ihrer Tür**: **Hochparterre, am ENDE des Flurs**, nach der kurzen Rampe rechts. Prüfen Sie, ob **jede Ziffer** auf **2193** steht, und versuchen Sie es erneut. Immer noch zu? **Rufen Sie uns an**.","ar":"الصندوق **على بابكم**: **الطابق الأرضي المرتفع، في نهاية الممر** بعد المنحدر القصير على اليمين. تأكدوا من أن **كل رقم** على **2193** وأعيدوا المحاولة. ما زال مغلقاً؟ **اتصلوا بنا**."}},{"icon":"clock","q":{"en":"Arriving late?","it":"Arrivate tardi?","fr":"Vous arrivez tard ?","es":"¿Llega tarde?","de":"Späte Ankunft?","ar":"ستصلون متأخرين؟"},"a":{"en":"No problem: **self check-in** works at **any time** with the codes (main door **1919#**, key box **2193**). Just **message us** when you are on your way.","it":"Nessun problema: il **self check-in** funziona a **qualsiasi ora** con i codici (portone **1919#**, cassetta **2193**). **Scriveteci** solo quando siete in arrivo.","fr":"Pas de problème : le **self check-in** fonctionne à **toute heure** avec les codes (porte **1919#**, boîte **2193**). **Écrivez-nous** simplement quand vous êtes en route.","es":"Ningún problema: el **self check-in** funciona a **cualquier hora** con los códigos (portal **1919#**, caja **2193**). Solo **escríbanos** cuando esté de camino.","de":"Kein Problem: Der **Self-Check-in** funktioniert **jederzeit** mit den Codes (Haustür **1919#**, Safe **2193**). **Schreiben Sie uns** einfach, wenn Sie unterwegs sind.","ar":"لا مشكلة: **تسجيل الوصول الذاتي** يعمل في **أي وقت** بالرموز (باب المبنى **1919#**، الصندوق **2193**). فقط **راسلونا** عندما تكونون في الطريق."}},{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]},{"type":"closing","text":{"en":"Thank you very much for your **understanding and cooperation**.","it":"Grazie mille per la vostra **comprensione e collaborazione**.","fr":"Merci beaucoup pour votre **compréhension et votre coopération**.","es":"Muchas gracias por su **comprensión y colaboración**.","de":"Vielen Dank für Ihr **Verständnis und Ihre Mitarbeit**.","ar":"شكراً جزيلاً **لتفهمكم وتعاونكم**."}}]},{"id":"location","icon":"pin","title":{"en":"Location","it":"Posizione","fr":"Accès","es":"Ubicación","de":"Anreise","ar":"الموقع"},"blocks":[{"type":"address"},{"type":"heading","text":{"en":"How to arrive?","it":"Come arrivare?","fr":"Comment arriver ?","es":"¿Cómo llegar?","de":"Wie komme ich hin?","ar":"كيف تصلون إلينا؟"}},{"type":"tabs","label":{"en":"Arrive from","it":"Arrivo da","fr":"Arriver depuis","es":"Llegar desde","de":"Anreise von","ar":"الوصول من"},"tabs":[{"label":{"en":"Fiumicino Airport","it":"Aeroporto di Fiumicino","fr":"Aéroport de Fiumicino","es":"Aeropuerto de Fiumicino","de":"Flughafen Fiumicino","ar":"مطار فيوميتشينو"},"origin":"Fiumicino Airport (FCO), Rome","routes":[{"icon":"train","title":{"en":"Train (Leonardo Express)","it":"Treno (Leonardo Express)","fr":"Train (Leonardo Express)","es":"Tren (Leonardo Express)","de":"Zug (Leonardo Express)","ar":"القطار (ليوناردو إكسبريس)"},"text":{"en":"Take the **Leonardo Express** from Fiumicino Airport to Roma Termini Station (direct trip, **about 32 minutes**). Then take **metro line A** towards Battistini and get off at Ottaviano. Walk about 5 minutes to Via Catone.","it":"Prendete il **Leonardo Express** dall’aeroporto di Fiumicino alla stazione Roma Termini (corsa diretta, **circa 32 minuti**). Poi prendete la **metro linea A** direzione Battistini e scendete a Ottaviano. Proseguite a piedi per circa 5 minuti fino a Via Catone.","fr":"Prenez le **Leonardo Express** de l’aéroport de Fiumicino jusqu’à la gare Roma Termini (trajet direct, **environ 32 minutes**). Prenez ensuite la **ligne A du métro** direction Battistini et descendez à Ottaviano. Marchez environ 5 minutes jusqu’à la Via Catone.","es":"Tome el **Leonardo Express** desde el aeropuerto de Fiumicino hasta la estación Roma Termini (trayecto directo, **unos 32 minutos**). Después tome la **línea A del metro** dirección Battistini y bájese en Ottaviano. Camine unos 5 minutos hasta Via Catone.","de":"Nehmen Sie den **Leonardo Express** vom Flughafen Fiumicino zum Bahnhof Roma Termini (Direktfahrt, **ca. 32 Minuten**). Fahren Sie dann mit der **Metrolinie A** Richtung Battistini bis Ottaviano. Von dort sind es etwa 5 Minuten zu Fuß bis zur Via Catone.","ar":"استقلوا قطار **ليوناردو إكسبريس** من مطار فيوميتشينو إلى محطة روما تيرميني (رحلة مباشرة، **حوالي 32 دقيقة**). ثم استقلوا **خط المترو A** باتجاه باتيستيني وانزلوا في محطة أوتافيانو. سيروا حوالي 5 دقيقة حتى Via Catone."},"price":{"en":"Total price: **around €15.50** (€14 for the train + €1.50 for the metro).","it":"Prezzo totale: **circa 15,50 €** (14 € il treno + 1,50 € la metro).","fr":"Prix total : **environ 15,50 €** (14 € pour le train + 1,50 € pour le métro).","es":"Precio total: **unos 15,50 €** (14 € el tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 15,50 €** (14 € für den Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 15.50 يورو** (14 يورو للقطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus to Roma Termini (approx. 50 minutes), then **metro line A** towards Battistini to **Ottaviano**.","it":"Prendete un autobus **Terravision** fino a Roma Termini (circa 50 minuti), poi la **metro linea A** direzione Battistini fino a **Ottaviano**.","fr":"Prenez un bus **Terravision** jusqu’à Roma Termini (environ 50 minutes), puis la **ligne A du métro** direction Battistini jusqu’à **Ottaviano**.","es":"Tome un autobús **Terravision** hasta Roma Termini (aprox. 50 minutos) y después la **línea A del metro** dirección Battistini hasta **Ottaviano**.","de":"Nehmen Sie einen **Terravision**-Bus nach Roma Termini (ca. 50 Minuten) und dann die **Metrolinie A** Richtung Battistini bis **Ottaviano**.","ar":"استقلوا حافلة **تيرافيجن** إلى روما تيرميني (حوالي 50 دقيقة)، ثم **خط المترو A** باتجاه باتيستيني حتى محطة **أوتافيانو**."},"price":{"en":"Total price: **from about €5.50** (Terravision bus from €4 + €1.50 metro).","it":"Prezzo totale: **da circa 5,50 €** (bus Terravision da 4 € + 1,50 € metro).","fr":"Prix total : **à partir d’environ 5,50 €** (bus Terravision dès 4 € + 1,50 € le métro).","es":"Precio total: **desde unos 5,50 €** (autobús Terravision desde 4 € + 1,50 € el metro).","de":"Gesamtpreis: **ab ca. 5,50 €** (Terravision-Bus ab 4 € + 1,50 € Metro).","ar":"السعر الإجمالي: **ابتداءً من حوالي 5.50 يورو** (حافلة تيرافيجن ابتداءً من 4 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis charge a **fixed fare of €55** from Fiumicino to the city centre (inside the Aurelian Walls), luggage included. **Prati** is just **outside the Aurelian Walls**: **confirm the fare with the driver** before you set off.","it":"I taxi ufficiali bianchi applicano una **tariffa fissa di 55 €** da Fiumicino al centro città (entro le Mura Aureliane), bagagli inclusi. **Prati** si trova appena **fuori dalle Mura Aureliane**: **concordate la tariffa con il tassista** prima di partire.","fr":"Les taxis officiels blancs appliquent un **tarif fixe de 55 €** de Fiumicino au centre-ville (à l’intérieur du mur d’Aurélien), bagages compris. **Prati** se trouve juste **en dehors du mur d’Aurélien** : **confirmez le tarif avec le chauffeur** avant le départ.","es":"Los taxis oficiales blancos aplican una **tarifa fija de 55 €** desde Fiumicino hasta el centro de la ciudad (dentro de las Murallas Aurelianas), equipaje incluido. **Prati** está justo **fuera de las Murallas Aurelianas**: **confirme la tarifa con el taxista** antes de salir.","de":"Offizielle weiße Taxis berechnen von Fiumicino ins Stadtzentrum (innerhalb der Aurelianischen Mauer) einen **Festpreis von 55 €**, Gepäck inklusive. **Prati** liegt knapp **außerhalb der Aurelianischen Mauer**: **Klären Sie den Preis mit dem Fahrer** vor der Abfahrt.","ar":"تتقاضى سيارات الأجرة الرسمية البيضاء **تعرفة ثابتة قدرها 55 يورو** من فيوميتشينو إلى وسط المدينة (داخل الأسوار الأوريليانية)، شاملة الأمتعة. يقع حي **براتي** خارج **الأسوار الأوريليانية** مباشرةً: **اتفقوا على الأجرة مع السائق** قبل الانطلاق."},"warn":{"en":"Please note: during busy periods, there may be **long lines** at the airport taxi station.","it":"Attenzione: nei periodi di maggiore affluenza potrebbero esserci **lunghe code** alla stazione dei taxi dell’aeroporto.","fr":"Attention : en période d’affluence, il peut y avoir de **longues files d’attente** à la station de taxis de l’aéroport.","es":"Atención: en periodos de mucha afluencia puede haber **largas colas** en la parada de taxis del aeropuerto.","de":"Bitte beachten: Zu Stoßzeiten kann es am Taxistand des Flughafens **lange Warteschlangen** geben.","ar":"يُرجى الانتباه: خلال فترات الازدحام قد تكون هناك **طوابير طويلة** عند موقف سيارات الأجرة في المطار."}},{"icon":"car","title":{"en":"Private transfer","it":"Transfer privato","fr":"Transfert privé","es":"Traslado privado","de":"Privater Transfer","ar":"نقل خاص"},"text":{"en":"For a simple, comfortable and stress-free journey, choose our **exclusive transfer service** directly from Fiumicino. The price depends on the day, time and number of passengers.","it":"Per un viaggio semplice, comodo e senza stress, scegliete il nostro **servizio esclusivo di transfer** direttamente da Fiumicino. Il prezzo dipende dal giorno, dall’orario e dal numero di passeggeri.","fr":"Pour un trajet simple, confortable et sans stress, choisissez notre **service de transfert exclusif** directement depuis Fiumicino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Fiumicino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Fiumicino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Fiumicino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Fiumicino"}]},{"label":{"en":"Ciampino Airport","it":"Aeroporto di Ciampino","fr":"Aéroport de Ciampino","es":"Aeropuerto de Ciampino","de":"Flughafen Ciampino","ar":"مطار تشامبينو"},"origin":"Ciampino Airport (CIA), Rome","routes":[{"icon":"train","title":{"en":"Train + Metro","it":"Treno + Metro","fr":"Train + Métro","es":"Tren + Metro","de":"Zug + Metro","ar":"قطار + مترو"},"text":{"en":"Take the **Ciampino Airlink** shuttle bus to Ciampino station (about 10 minutes). Then take a **regional train** to Roma Termini (about 15 minutes). From Termini, take **metro line A** towards Battistini and get off at Ottaviano.","it":"Prendete la navetta **Ciampino Airlink** fino alla stazione di Ciampino (circa 10 minuti). Poi un **treno regionale** fino a Roma Termini (circa 15 minuti). Da Termini, prendete la **metro linea A** direzione Battistini e scendete a Ottaviano.","fr":"Prenez la navette **Ciampino Airlink** jusqu’à la gare de Ciampino (environ 10 minutes). Prenez ensuite un **train régional** jusqu’à Roma Termini (environ 15 minutes). À Termini, prenez la **ligne A du métro** direction Battistini et descendez à Ottaviano.","es":"Tome el autobús lanzadera **Ciampino Airlink** hasta la estación de Ciampino (unos 10 minutos). Después tome un **tren regional** hasta Roma Termini (unos 15 minutos). Desde Termini, tome la **línea A del metro** dirección Battistini y bájese en Ottaviano.","de":"Nehmen Sie den Shuttlebus **Ciampino Airlink** zum Bahnhof Ciampino (ca. 10 Minuten). Fahren Sie dann mit einem **Regionalzug** nach Roma Termini (ca. 15 Minuten). Ab Termini nehmen Sie die **Metrolinie A** Richtung Battistini bis Ottaviano.","ar":"استقلوا حافلة **Ciampino Airlink** المكوكية إلى محطة تشامبينو (حوالي 10 دقائق). ثم استقلوا **قطاراً إقليمياً** إلى روما تيرميني (حوالي 15 دقيقة). ومن تيرميني، استقلوا **خط المترو A** باتجاه باتيستيني وانزلوا في محطة أوتافيانو."},"price":{"en":"Total price: **about €4.20** (€2.70 for the ‘Ciampino Airlink’ bus + train + €1.50 for the metro).","it":"Prezzo totale: **circa 4,20 €** (2,70 € per bus ‘Ciampino Airlink’ + treno + 1,50 € per la metro).","fr":"Prix total : **environ 4,20 €** (2,70 € pour le bus « Ciampino Airlink » + train + 1,50 € pour le métro).","es":"Precio total: **unos 4,20 €** (2,70 € el autobús ‘Ciampino Airlink’ + tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 4,20 €** (2,70 € für Bus „Ciampino Airlink“ + Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 4.20 يورو** (2.70 يورو لحافلة «Ciampino Airlink» + القطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus directly to Roma Termini (approx. 40–50 minutes). Then take **metro line A** towards Battistini to **Ottaviano**.","it":"Prendete un autobus **Terravision** diretto a Roma Termini (circa 40–50 minuti). Poi la **metro linea A** direzione Battistini fino a **Ottaviano**.","fr":"Prenez un bus **Terravision** direct jusqu’à Roma Termini (environ 40 à 50 minutes). Prenez ensuite la **ligne A du métro** direction Battistini jusqu’à **Ottaviano**.","es":"Tome un autobús **Terravision** directo a Roma Termini (aprox. 40–50 minutos). Después tome la **línea A del metro** dirección Battistini hasta **Ottaviano**.","de":"Nehmen Sie einen **Terravision**-Bus direkt nach Roma Termini (ca. 40–50 Minuten). Fahren Sie dann mit der **Metrolinie A** Richtung Battistini bis **Ottaviano**.","ar":"استقلوا حافلة **تيرافيجن** مباشرةً إلى روما تيرميني (حوالي 40–50 دقيقة). ثم **خط المترو A** باتجاه باتيستيني حتى محطة **أوتافيانو**."},"price":{"en":"Total price: **about €8** (Terravision bus from €6.50 + €1.50 metro).","it":"Prezzo totale: **circa 8 €** (bus Terravision da 6,50 € + 1,50 € metro).","fr":"Prix total : **environ 8 €** (bus Terravision dès 6,50 € + 1,50 € le métro).","es":"Precio total: **unos 8 €** (autobús Terravision desde 6,50 € + 1,50 € el metro).","de":"Gesamtpreis: **ca. 8 €** (Terravision-Bus ab 6,50 € + 1,50 € Metro).","ar":"السعر الإجمالي: **حوالي 8 يورو** (حافلة تيرافيجن ابتداءً من 6.50 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis from Ciampino charge a **fixed fare of €40** to the centre of Rome (inside the Aurelian Walls), luggage included. **Prati** is just **outside the Aurelian Walls**: **confirm the fare with the driver** before you set off.","it":"I taxi ufficiali bianchi da Ciampino applicano una **tariffa fissa di 40 €** per il centro di Roma (entro le Mura Aureliane), bagagli inclusi. **Prati** si trova appena **fuori dalle Mura Aureliane**: **concordate la tariffa con il tassista** prima di partire.","fr":"Les taxis officiels blancs au départ de Ciampino appliquent un **tarif fixe de 40 €** jusqu’au centre de Rome (à l’intérieur du mur d’Aurélien), bagages compris. **Prati** se trouve juste **en dehors du mur d’Aurélien** : **confirmez le tarif avec le chauffeur** avant le départ.","es":"Los taxis oficiales blancos desde Ciampino aplican una **tarifa fija de 40 €** hasta el centro de Roma (dentro de las Murallas Aurelianas), equipaje incluido. **Prati** está justo **fuera de las Murallas Aurelianas**: **confirme la tarifa con el taxista** antes de salir.","de":"Offizielle weiße Taxis ab Ciampino berechnen ins Zentrum von Rom (innerhalb der Aurelianischen Mauer) einen **Festpreis von 40 €**, Gepäck inklusive. **Prati** liegt knapp **außerhalb der Aurelianischen Mauer**: **Klären Sie den Preis mit dem Fahrer** vor der Abfahrt.","ar":"تتقاضى سيارات الأجرة الرسمية البيضاء من تشامبينو **تعرفة ثابتة قدرها 40 يورو** إلى وسط روما (داخل الأسوار الأوريليانية)، شاملة الأمتعة. يقع حي **براتي** خارج **الأسوار الأوريليانية** مباشرةً: **اتفقوا على الأجرة مع السائق** قبل الانطلاق."},"warn":{"en":"Please note: during busy times, there may be **long queues** at the airport taxi rank.","it":"Attenzione: negli orari di punta potrebbero esserci **lunghe code** alla fermata dei taxi dell’aeroporto.","fr":"Attention : aux heures d’affluence, il peut y avoir de **longues files d’attente** à la station de taxis de l’aéroport.","es":"Atención: en las horas de mayor afluencia puede haber **largas colas** en la parada de taxis del aeropuerto.","de":"Bitte beachten: Zu Stoßzeiten kann es am Taxistand des Flughafens **lange Warteschlangen** geben.","ar":"يُرجى الانتباه: في أوقات الذروة قد تكون هناك **طوابير طويلة** عند موقف سيارات الأجرة في المطار."}},{"icon":"car","title":{"en":"Private transfer","it":"Transfer privato","fr":"Transfert privé","es":"Traslado privado","de":"Privater Transfer","ar":"نقل خاص"},"text":{"en":"For a simple, comfortable and stress-free journey, choose our **exclusive transfer service** directly from Ciampino. The price depends on the day, time and number of passengers.","it":"Per un viaggio semplice, comodo e senza stress, scegliete il nostro **servizio esclusivo di transfer** direttamente da Ciampino. Il prezzo dipende dal giorno, dall’orario e dal numero di passeggeri.","fr":"Pour un trajet simple, confortable et sans stress, choisissez notre **service de transfert exclusif** directement depuis Ciampino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Ciampino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Ciampino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Ciampino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Ciampino"}]}]},{"type":"heading","text":{"en":"From Ottaviano metro on foot","it":"Dalla metro Ottaviano a piedi","fr":"Du métro Ottaviano à pied","es":"Desde el metro Ottaviano a pie","de":"Von der Metro Ottaviano zu Fuß","ar":"من مترو أوتافيانو سيراً على الأقدام"}},{"type":"steps","items":[{"en":"Exit **Ottaviano** station and walk down **Via Ottaviano** towards **Piazza del Risorgimento**.","it":"Uscite dalla stazione **Ottaviano** e percorrete **Via Ottaviano** in direzione di **Piazza del Risorgimento**.","fr":"Sortez de la station **Ottaviano** et descendez la **Via Ottaviano** en direction de la **Piazza del Risorgimento**.","es":"Salga de la estación **Ottaviano** y baje por **Via Ottaviano** hacia la **Piazza del Risorgimento**.","de":"Verlassen Sie die Station **Ottaviano** und gehen Sie die **Via Ottaviano** in Richtung **Piazza del Risorgimento** hinunter.","ar":"اخرجوا من محطة **أوتافيانو** وسيروا في **Via Ottaviano** باتجاه **ساحة ريزورجيمنتو**."},{"en":"Turn **left** into **Via Germanico** and take the first street on the **right**: **Via Catone**.","it":"Girate a **sinistra** in **Via Germanico** e prendete la prima a **destra**: **Via Catone**.","fr":"Tournez à **gauche** dans la **Via Germanico** et prenez la première à **droite** : la **Via Catone**.","es":"Gire a la **izquierda** por **Via Germanico** y tome la primera a la **derecha**: **Via Catone**.","de":"Biegen Sie **links** in die **Via Germanico** und dann die erste Straße **rechts** ab: **Via Catone**.","ar":"انعطفوا **يساراً** إلى **Via Germanico** ثم أول شارع على **اليمين**: **Via Catone**."},{"en":"Number **29** is the **black wrought-iron and glass main door** (code **1919#** on the keypad on the LEFT). Inside, turn **RIGHT**, climb the short ramp: your **door is on the raised ground floor, at the END of the hallway**.","it":"Il numero **29** è il **portone in ferro battuto nero e vetro** (codice **1919#** sulla tastiera a SINISTRA). Dentro girate a **DESTRA**, salite la breve rampa: la vostra **porta è al piano rialzato, in FONDO al corridoio**.","fr":"Le numéro **29** est la **porte en fer forgé noir et verre** (code **1919#** sur le clavier à GAUCHE). À l’intérieur, tournez à **DROITE**, montez la petite rampe : votre **porte est au rez-de-chaussée surélevé, au FOND du couloir**.","es":"El número **29** es el **portal de hierro forjado negro y cristal** (código **1919#** en el teclado a la IZQUIERDA). Dentro, gire a la **DERECHA** y suba la pequeña rampa: su **puerta está en la planta baja elevada, al FONDO del pasillo**.","de":"Nummer **29** ist die **schwarze Tür aus Schmiedeeisen und Glas** (Code **1919#** am Tastenfeld LINKS). Drinnen **RECHTS** abbiegen und die kurze Rampe hinauf: Ihre **Tür ist im Hochparterre, am ENDE des Flurs**.","ar":"الرقم **29** هو **الباب من الحديد المشغول الأسود والزجاج** (الرمز **1919#** على اللوحة على اليسار). في الداخل انعطفوا **يميناً** واصعدوا المنحدر القصير: **بابكم في الطابق الأرضي المرتفع، في نهاية الممر**."}]}]},{"id":"wifi","icon":"wifi","title":{"en":"Wi-Fi","it":"Wi-Fi","fr":"Wi-Fi","es":"Wi-Fi","de":"WLAN","ar":"الواي فاي"},"blocks":[{"type":"wifi","qr":"<svg width=\"31mm\" height=\"31mm\" version=\"1.1\" viewBox=\"0 0 31 31\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M1,1H2V2H1zM2,1H3V2H2zM3,1H4V2H3zM4,1H5V2H4zM5,1H6V2H5zM6,1H7V2H6zM7,1H8V2H7zM10,1H11V2H10zM12,1H13V2H12zM13,1H14V2H13zM16,1H17V2H16zM17,1H18V2H17zM20,1H21V2H20zM23,1H24V2H23zM24,1H25V2H24zM25,1H26V2H25zM26,1H27V2H26zM27,1H28V2H27zM28,1H29V2H28zM29,1H30V2H29zM1,2H2V3H1zM7,2H8V3H7zM10,2H11V3H10zM11,2H12V3H11zM12,2H13V3H12zM13,2H14V3H13zM16,2H17V3H16zM17,2H18V3H17zM18,2H19V3H18zM19,2H20V3H19zM23,2H24V3H23zM29,2H30V3H29zM1,3H2V4H1zM3,3H4V4H3zM4,3H5V4H4zM5,3H6V4H5zM7,3H8V4H7zM9,3H10V4H9zM10,3H11V4H10zM12,3H13V4H12zM13,3H14V4H13zM15,3H16V4H15zM19,3H20V4H19zM20,3H21V4H20zM23,3H24V4H23zM25,3H26V4H25zM26,3H27V4H26zM27,3H28V4H27zM29,3H30V4H29zM1,4H2V5H1zM3,4H4V5H3zM4,4H5V5H4zM5,4H6V5H5zM7,4H8V5H7zM9,4H10V5H9zM10,4H11V5H10zM12,4H13V5H12zM15,4H16V5H15zM16,4H17V5H16zM17,4H18V5H17zM18,4H19V5H18zM19,4H20V5H19zM23,4H24V5H23zM25,4H26V5H25zM26,4H27V5H26zM27,4H28V5H27zM29,4H30V5H29zM1,5H2V6H1zM3,5H4V6H3zM4,5H5V6H4zM5,5H6V6H5zM7,5H8V6H7zM9,5H10V6H9zM10,5H11V6H10zM13,5H14V6H13zM14,5H15V6H14zM18,5H19V6H18zM21,5H22V6H21zM23,5H24V6H23zM25,5H26V6H25zM26,5H27V6H26zM27,5H28V6H27zM29,5H30V6H29zM1,6H2V7H1zM7,6H8V7H7zM9,6H10V7H9zM10,6H11V7H10zM14,6H15V7H14zM16,6H17V7H16zM17,6H18V7H17zM19,6H20V7H19zM21,6H22V7H21zM23,6H24V7H23zM29,6H30V7H29 erbunden sind.","ar":"تأكّدوا من توصيل **جميع الكابلات** بجهاز الإنترنت بشكل صحيح."}},{"icon":"rotate","title":{"en":"Restart the box","it":"Riavviate il modem","fr":"Redémarrez la box","es":"Reinicie el router","de":"Router neu starten","ar":"أعيدوا تشغيل الجهاز"},"text":{"en":"**Switch off the box**, wait a few seconds, then **switch it back on**.","it":"**Spegnete il modem**, attendete qualche secondo, poi **riaccendetelo**.","fr":"**Éteignez la box**, attendez quelques secondes, puis **rallumez-la**.","es":"**Apague el router**, espere unos segundos y **vuelva a encenderlo**.","de":"**Schalten Sie den Router aus**, warten Sie einige Sekunden und schalten Sie ihn dann **wieder ein**.","ar":"**أطفئوا الجهاز**، وانتظروا بضع ثوانٍ، ثم **أعيدوا تشغيله**."}}]},{"type":"problems","items":[{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]}]},{"id":"rules","icon":"rules","title":{"en":"House rules","it":"Regole della casa","fr":"Règlement intérieur","es":"Normas de la casa","de":"Hausregeln","ar":"قواعد المنزل"},"blocks":[{"type":"lead","text":{"en":"The apartment is in a **historic residential building** (palazzo d’epoca) where **families live**. Thank you for respecting the **house rules**.","it":"L’appartamento si trova in un **palazzo d’epoca residenziale**, dove **vivono famiglie**. Grazie per il rispetto delle **regole della casa**.","fr":"L’appartement se trouve dans un **immeuble résidentiel historique** (palazzo d’epoca) où **vivent des familles**. Merci de respecter le **règlement intérieur**.","es":"El apartamento está en un **edificio residencial histórico** (palazzo d’epoca) donde **viven familias**. Gracias por respetar las **normas de la casa**.","de":"Die Wohnung liegt in einem **historischen Wohnhaus** (Palazzo d’epoca), in dem **Familien wohnen**. Danke, dass Sie die **Hausregeln** einhalten.","ar":"تقع الشقة في **مبنى سكني تاريخي** (palazzo d’epoca) **تسكنه عائلات**. نشكركم على احترام **قواعد المنزل**."}},{"type":"rules","items":[{"icon":"column","text":{"en":"This is a **historic residential building**: keep **quiet** in the **common areas**, out of respect for the residents.","it":"È un **palazzo d’epoca residenziale**: mantenete il **silenzio** negli **spazi comuni**, per rispetto dei residenti.","fr":"C’est un **immeuble résidentiel historique** : restez **silencieux** dans les **parties communes**, par respect pour les résidents.","es":"Es un **edificio residencial histórico**: guarde **silencio** en las **zonas comunes**, por respeto a los vecinos.","de":"Dies ist ein **historisches Wohnhaus**: Bitte seien Sie in den **Gemeinschaftsbereichen** **leise** – aus Rücksicht auf die Bewohner.","ar":"هذا **مبنى سكني تاريخي**: التزموا **الهدوء** في **الأماكن المشتركة** احتراماً للسكان."}},{"icon":"nosmoke","text":{"en":"Please **do not smoke** inside the house.","it":"Vi preghiamo di **non fumare** all’interno della casa.","fr":"Merci de **ne pas fumer** à l’intérieur du logement.","es":"Le rogamos que **no fume** dentro de la vivienda.","de":"Bitte **rauchen Sie nicht** in der Wohnung.","ar":"يُرجى **عدم التدخين** داخل المنزل."}},{"icon":"sparkles","text":{"en":"Take care of the house, **keep the common areas clean** and leave things tidy after you use them.","it":"Abbiate cura della casa, **mantenete puliti gli spazi comuni** e lasciate tutto in ordine dopo l’uso.","fr":"Prenez soin du logement, **gardez les parties communes propres** et laissez tout en ordre après utilisation.","es":"Cuide la vivienda, **mantenga limpias las zonas comunes** y deje todo ordenado después de usarlo.","de":"Gehen Sie sorgsam mit der Wohnung um, halten Sie die **Gemeinschaftsbereiche sauber** und hinterlassen Sie alles ordentlich.","ar":"اعتنوا بالمنزل، و**حافظوا على نظافة الأماكن المشتركة**، واتركوا الأشياء مرتبة بعد استخدامها."}},{"icon":"mute","text":{"en":"Respect the peace and privacy of other occupants by **minimizing noise**.","it":"Rispettate la tranquillità e la privacy degli altri residenti **limitando i rumori**.","fr":"Respectez la tranquillité et l’intimité des autres occupants **en limitant le bruit**.","es":"Respete la tranquilidad y la privacidad de los demás ocupantes **reduciendo el ruido**.","de":"Respektieren Sie die Ruhe und Privatsphäre der anderen Bewohner, indem Sie **Lärm vermeiden**.","ar":"احترموا هدوء وخصوصية السكان الآخرين **بالتقليل من الضوضاء**."}},{"icon":"users","text":{"en":"Avoid inviting additional people **without prior authorization**.","it":"Evitate di invitare altre persone **senza previa autorizzazione**.","fr":"Évitez d’inviter d’autres personnes **sans autorisation préalable**.","es":"Evite invitar a otras personas **sin autorización previa**.","de":"Laden Sie keine weiteren Personen **ohne vorherige Genehmigung** ein.","ar":"تجنّبوا دعوة أشخاص إضافيين **دون إذن مسبق**."}},{"icon":"zap","text":{"en":"Follow **safety instructions** and avoid using dangerous or unauthorised electrical equipment.","it":"Seguite le **istruzioni di sicurezza** ed evitate di usare apparecchi elettrici pericolosi o non autorizzati.","fr":"Suivez les **consignes de sécurité** et évitez d’utiliser des appareils électriques dangereux ou non autorisés.","es":"Siga las **instrucciones de seguridad** y evite utilizar aparatos eléctricos peligrosos o no autorizados.","de":"Befolgen Sie die **Sicherheitshinweise** und verwenden Sie keine gefährlichen oder nicht zugelassenen Elektrogeräte.","ar":"اتبعوا **تعليمات السلامة** وتجنّبوا استخدام الأجهزة الكهربائية الخطرة أو غير المصرّح بها."}},{"icon":"alert","text":{"en":"Please report any problems or damage that occur during your stay **as soon as possible**.","it":"Segnalateci **il prima possibile** eventuali problemi o danni che si verifichino durante il soggiorno.","fr":"Signalez-nous **au plus vite** tout problème ou dommage survenu pendant votre séjour.","es":"Comuníquenos **lo antes posible** cualquier problema o daño que se produzca durante su estancia.","de":"Bitte melden Sie uns Probleme oder Schäden während Ihres Aufenthalts **so schnell wie möglich**.","ar":"يُرجى إبلاغنا **في أقرب وقت ممكن** بأي مشكلة أو ضرر يحدث خلال إقامتكم."}}]},{"type":"closing","text":{"en":"Thank you","it":"Grazie","fr":"Merci","es":"Gracias","de":"Danke","ar":"شكراً لكم"}}]},{"id":"transport","icon":"metro","title":{"en":"Transport","it":"Trasporti","fr":"Transports","es":"Transporte","de":"Verkehrsmittel","ar":"المواصلات"},"blocks":[{"type":"list","items":[{"icon":"metro","title":{"en":"Metro – Line A","it":"Metro – Linea A","fr":"Métro – Ligne A","es":"Metro – Línea A","de":"Metro – Linie A","ar":"المترو – الخط A"},"text":{"en":"Stop: **Ottaviano** (line A) · about **5 minutes** on foot","it":"Fermata: **Ottaviano** (linea A) · circa **5 minuti** a piedi","fr":"Arrêt : **Ottaviano** (ligne A) · environ **5 minutes** à pied","es":"Parada: **Ottaviano** (línea A) · unos **5 minutos** a pie","de":"Haltestelle: **Ottaviano** (Linie A) · ca. **5 Minuten** zu Fuß","ar":"المحطة: **أوتافيانو** (الخط A) · حوالي **5 دقائق** سيراً"},"maps":"Ottaviano Metro Station, Roma"},{"icon":"bus","title":{"en":"Bus","it":"Bus","fr":"Bus","es":"Autobús","de":"Bus","ar":"الحافلة"},"text":{"en":"Stop: **Piazza del Risorgimento** · **3 minutes** on foot, lines **23**, **32**, **49**, **81**, **492** and **990**","it":"Fermata: **Piazza del Risorgimento** · **3 minuti** a piedi, linee **23**, **32**, **49**, **81**, **492** e **990**","fr":"Arrêt : **Piazza del Risorgimento** · **3 minutes** à pied, lignes **23**, **32**, **49**, **81**, **492** et **990**","es":"Parada: **Piazza del Risorgimento** · **3 minutos** a pie, líneas **23**, **32**, **49**, **81**, **492** y **990**","de":"Haltestelle: **Piazza del Risorgimento** · **3 Minuten** zu Fuß, Linien **23**, **32**, **49**, **81**, **492** und **990**","ar":"المحطة: **ساحة ريزورجيمنتو** · **3 دقائق** سيراً، الخطوط **23** و**32** و**49** و**81** و**492** و**990**"},"maps":"Piazza del Risorgimento, Roma"},{"icon":"train","title":{"en":"Train station","it":"Stazione ferroviaria","fr":"Gare ferroviaire","es":"Estación de tren","de":"Bahnhof","ar":"محطة القطارات"},"text":{"en":"Termini Station · about **15 minutes** by underground (**line A**, Ottaviano → Termini)","it":"Stazione Termini · circa **15 minuti** in metropolitana (**linea A**, Ottaviano → Termini)","fr":"Gare Termini · environ **15 minutes** en métro (**ligne A**, Ottaviano → Termini)","es":"Estación Termini · unos **15 minutos** en metro (**línea A**, Ottaviano → Termini)","de":"Bahnhof Termini · ca. **15 Minuten** mit der U-Bahn (**Linie A**, Ottaviano → Termini)","ar":"محطة تيرميني · حوالي **15 دقيقة** بالمترو (**الخط A**، أوتافيانو ← تيرميني)"},"maps":"Roma Termini"},{"icon":"plane","title":{"en":"Fiumicino Airport","it":"Aeroporto di Fiumicino","fr":"Aéroport de Fiumicino","es":"Aeropuerto de Fiumicino","de":"Flughafen Fiumicino","ar":"مطار فيوميتشينو"},"text":{"en":"40 minutes by car","it":"40 minuti in auto","fr":"40 minutes en voiture","es":"40 minutos en coche","de":"40 Minuten mit dem Auto","ar":"40 دقيقة بالسيارة"},"maps":"Fiumicino Airport"},{"icon":"plane","title":{"en":"Ciampino Airport","it":"Aeroporto di Ciampino","fr":"Aéroport de Ciampino","es":"Aeropuerto de Ciampino","de":"Flughafen Ciampino","ar":"مطار تشامبينو"},"text":{"en":"45 minutes by car","it":"45 minuti in auto","fr":"45 minutes en voiture","es":"45 minutos en coche","de":"45 Minuten mit dem Auto","ar":"45 دقيقة بالسيارة"},"maps":"Ciampino Airport"}]}]},{"id":"amenities","icon":"sofa","title":{"en":"Amenities","it":"Dotazioni","fr":"Équipements","es":"Equipamiento","de":"Ausstattung","ar":"المرافق"},"bloc "ar":"تدفئة"}},{"icon":"washer","label":{"en":"Washing machine","it":"Lavatrice","fr":"Lave-linge","es":"Lavadora","de":"Waschmaschine","ar":"غسالة ملابس"}},{"icon":"dishwasher","label":{"en":"Dishwasher","it":"Lavastoviglie","fr":"Lave-vaisselle","es":"Lavavajillas","de":"Geschirrspüler","ar":"غسالة صحون"}},{"icon":"hob","label":{"en":"Kitchen with gas hob","it":"Cucina con piano cottura a gas","fr":"Cuisine avec plaques au gaz","es":"Cocina con fogones de gas","de":"Küche mit Gasherd","ar":"مطبخ مع موقد غاز"}},{"icon":"oven","label":{"en":"Oven","it":"Forno","fr":"Four","es":"Horno","de":"Backofen","ar":"فرن"}},{"icon":"fridge","label":{"en":"Fridge","it":"Frigorifero","fr":"Réfrigérateur","es":"Frigorífico","de":"Kühlschrank","ar":"ثلاجة"}},{"icon":"coffee","label":{"en":"Coffee machine and kettle","it":"Macchina per il caffè e bollitore","fr":"Machine à café et bouilloire","es":"Cafetera y hervidor","de":"Kaffeemaschine und Wasserkocher","ar":"آلة قهوة وغلاية"}},{"icon":"table","label":{"en":"Dining table","it":"Tavolo da pranzo","fr":"Table à manger","es":"Mesa de comedor","de":"Esstisch","ar":"طاولة طعام"}},{"icon":"shirt","label":{"en":"Iron and hangers","it":"Ferro da stiro e grucce","fr":"Fer à repasser et cintres","es":"Plancha y perchas","de":"Bügeleisen und Kleiderbügel","ar":"مكواة وعلّاقات"}},{"icon":"zap","label":{"en":"Hair dryer","it":"Asciugacapelli","fr":"Sèche-cheveux","es":"Secador de pelo","de":"Haartrockner","ar":"مجفف شعر"}}]}]},{"id":"activities","icon":"colosseum","title":{"en":"Activities","it":"Attività","fr":"Activités","es":"Actividades","de":"Aktivitäten","ar":"الأنشطة"},"blocks":[{"type":"heading","text":{"en":"A few steps from home","it":"A due passi da casa","fr":"À deux pas de chez vous","es":"A dos pasos de casa","de":"Ganz in der Nähe","ar":"على بُعد خطوات من المنزل"}},{"type":"features","items":[{"icon":"column","title":{"en":"Castel Sant’Angelo and the Tiber","it":"Castel Sant’Angelo e il Tevere","fr":"Le château Saint-Ange et le Tibre","es":"Castel Sant’Angelo y el Tíber","de":"Engelsburg und Tiber","ar":"قلعة سانت أنجيلو ونهر التيبر"},"text":{"en":"Walk to **Castel Sant’Angelo** (**15 minutes**), Hadrian’s mausoleum turned papal fortress, and cross **Ponte Sant’Angelo** (**15 minutes**) with Bernini’s angels, then stroll along the **Tiber**. On the way you pass the **Passetto di Borgo** (**7 minutes**), the raised corridor the popes used to flee from the Vatican to the castle.","it":"Passeggiate fino a **Castel Sant’Angelo** (**15 minuti**), il mausoleo di Adriano diventato fortezza dei papi, attraversate **Ponte Sant’Angelo** (**15 minuti**) con gli angeli del Bernini e proseguite lungo il **Tevere**. Lungo la strada incontrate il **Passetto di Borgo** (**7 minuti**), il corridoio sopraelevato da cui i papi fuggivano dal Vaticano al castello.","fr":"Promenez-vous jusqu’au **château Saint-Ange** (**15 minutes**), le mausolée d’Hadrien devenu forteresse des papes, traversez le **pont Saint-Ange** (**15 minutes**) et ses anges du Bernin, puis longez le **Tibre**. En chemin, vous passez devant le **Passetto di Borgo** (**7 minutes**), le corridor surélevé par lequel les papes fuyaient du Vatican au château.","es":"Pasee hasta **Castel Sant’Angelo** (**15 minutos**), el mausoleo de Adriano convertido en fortaleza de los papas, cruce el **Puente de Sant’Angelo** (**15 minutos**) con los ángeles de Bernini y siga por el **Tíber**. Por el camino pasa junto al **Passetto di Borgo** (**7 minutos**), el pasadizo elevado por el que los papas huían del Vaticano al castillo.","de":"Spazieren Sie zur **Engelsburg** (**15 Minuten**), dem zur Papstfestung gewordenen Mausoleum Hadrians, überqueren Sie die **Engelsbrücke** (**15 Minuten**) mit Berninis Engeln und schlendern Sie am **Tiber** entlang. Unterwegs kommen Sie am **Passetto di Borgo** (**7 Minuten**) vorbei, dem erhöhten Gang, über den die Päpste vom Vatikan in die Burg flohen.","ar":"تمشّوا إلى **قلعة سانت أنجيلو** (**15 دقيقة**)، ضريح هادريان الذي صار حصناً للبابوات، واعبروا **جسر سانت أنجيلو** (**15 دقيقة**) بتماثيل ملائكة برنيني، ثم تنزّهوا على ضفاف **التيبر**. وفي الطريق تمرّون بـ**باسيتو دي بورغو** (**7 دقائق**)، الممر المرتفع الذي كان البابوات يفرّون عبره من الفاتيكان إلى القلعة."},"maps":"Castel Sant'Angelo, Roma","photo":{"src":"rome/castel-santangelo","place":"Castel Sant’Angelo","area":false,"credit":{"title":"Castel Sant'Angelo at dusk, Rome, Italy.jpg","author":"Jebulon","license":"CC0","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","source":"https://commons.wikimedia.org/wiki/File:Castel_Sant%27Angelo_at_dusk,_Rome,_Italy.jpg"}}},{"icon":"dome","title":{"en":"St. Peter’s Basilica and Square","it":"Basilica e Piazza San Pietro","fr":"Basilique et place Saint-Pierre","es":"Basílica y Plaza de San Pedro","de":"Petersdom und Petersplatz","ar":"كاتدرائية وساحة القديس بطرس"},"text":{"en":"**St. Peter’s Square** is **10 minutes** away. The Basilica is **free** and opens at **7:00**: **our tip** is to go **early in the morning**, before the queues. Climb **Michelangelo’s dome**: **551 steps**, or **320** with the lift to the terrace. Shoulders and knees must be covered.","it":"**Piazza San Pietro** è a **10 minuti**. La Basilica è **gratuita** e apre alle **7:00**: **il nostro consiglio** è andarci **di primo mattino**, prima delle code. Salite sulla **cupola di Michelangelo**: **551 gradini**, oppure **320** con l’ascensore fino alla terrazza. Spalle e ginocchia devono essere coperte.","fr":"La **place Saint-Pierre** est à **10 minutes**. La basilique est **gratuite** et ouvre à **7h00** : **notre conseil** est d’y aller **tôt le matin**, avant les files d’attente. Montez sur la **coupole de Michel-Ange** : **551 marches**, ou **320** avec l’ascenseur jusqu’à la terrasse. Épaules et genoux doivent être couverts.","es":"La **Plaza de San Pedro** está a **10 minutos**. La basílica es **gratuita** y abre a las **7:00**: **nuestro consejo** es ir **a primera hora de la mañana**, antes de las colas. Suba a la **cúpula de Miguel Ángel**: **551 escalones**, o **320** con el ascensor hasta la terraza. Hombros y rodillas deben ir cubiertos.","de":"Der **Petersplatz** ist **10 Minuten** entfernt. Der Petersdom ist **kostenlos** und öffnet um **7:00 Uhr**: **Unser Tipp** ist, **früh am Morgen** zu gehen, vor den Warteschlangen. Steigen Sie auf **Michelangelos Kuppel**: **551 Stufen** oder **320** mit dem Aufzug bis zur Terrasse. Schultern und Knie müssen bedeckt sein.","ar":"تبعد **ساحة القديس بطرس** **10 دقائق**. الدخول إلى الكاتدرائية **مجاني** وتفتح في **7:00**: **نصيحتنا** أن تذهبوا **في الصباح الباكر** قبل الطوابير. اصعدوا إلى **قبة مايكل أنجلو**: **551 درجة**، أو **320** باستخدام المصعد حتى الشرفة. يجب تغطية الكتفين والركبتين."},"maps":"Basilica di San Pietro, Città del Vaticano","photo":{"src":"rome/st-peters-square","place":"Piazza San Pietro","area":false,"credit":{"title":"Piazza San Pietro Panorama from basilica.jpg","author":"Till Niermann","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","source":"https://commons.wikimedia.org/wiki/File:Piazza_San_Pietro_Panorama_from_basilica.jpg"}}},{"icon":"ticket","title":{"en":"Vatican Museums and Sistine Chapel","it":"Musei Vaticani e Cappella Sistina","fr":"Musées du Vatican et chapelle Sixtine","es":"Museos Vaticanos y Capilla Sixtina","de":"Vatikanische Museen und Sixtinische Kapelle","ar":"متاحف الفاتيكان وكنيسة سيستينا"},"text":{"en":"The entrance is **8 minutes** away on foot. Open **Mon–Sat 8:00–20:00** (last entry 18:00); **book your tickets ahead** on the official website **museivaticani.va** to skip the queue. Free on the **last Sunday of the month** (9:00–14:00), with very long queues.","it":"L’ingresso è a **8 minuti** a piedi. Aperti **lun–sab 8:00–20:00** (ultimo ingresso 18:00); **prenotate i biglietti in anticipo** sul sito ufficiale **museivaticani.va** per evitare la fila. Gratuiti l’**ultima domenica del mese** (9:00–14:00), con code molto lunghe.","fr":"L’entrée est à **8 minutes** à pied. Ouverts **du lundi au samedi, 8h00–20h00** (dernière entrée 18h00) ; **réservez vos billets à l’avance** sur le site officiel **museivaticani.va** pour éviter la file. Gratuits le **dernier dimanche du mois** (9h00–14h00), avec de très longues files.","es":"La entrada está a **8 minutos** a pie. Abiertos **lun–sáb 8:00–20:00** (última entrada 18:00); **reserve las entradas con antelación** en la web oficial **museivaticani.va** para evitar la cola. Gratis el **último domingo del mes** (9:00–14:00), con colas muy largas.","de":"Der Eingang ist **8 Gehminuten** entfernt. Geöffnet **Mo–Sa 8:00–20:00** (letzter Einlass 18:00); **buchen Sie Ihre Tickets vorab** auf der offiziellen Website **museivaticani.va**, um die Warteschlange zu umgehen. Kostenlos am **letzten Sonntag im Monat** (9:00–14:00), mit sehr langen Schlangen.","ar":"يبعد المدخل **8 دقائق** سيراً. مفتوحة **من الإثنين إلى السبت 8:00–20:00** (آخر دخول 18:00)؛ **احجزوا التذاكر مسبقاً** عبر الموقع الرسمي **museivaticani.va** لتجنّب الطابور. الدخول مجاني في **آخر أحد من كل شهر** (9:00–14:00) مع طوابير طويلة جداً."},"maps":"Musei Vaticani, Viale Vaticano, Roma","web":"www.museivaticani.va","photo":{"src":"rome/vatican-museums","place":"Musei Vaticani","area":false,"credit":{"title":"Circular staircase of the Vatican Museums 02.jpg","author":"Wilfredor","license":"CC0","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","source":"https://commons.wikimedia.org/wiki/File:Circular_staircase_of_the_Vatican_Museums_02.jpg"}}},{"icon":"walk","title":{"en":"The streets of Borgo Pio","it":"Le vie di Borgo Pio","fr":"Les ruelles du Borgo Pio","es":"Las calles de Borgo Pio","de":"Die Gassen von Borgo Pio","ar":"شوارع بورغو بيو"},"text":{"en":"A short walk away (**5 minutes**): the pedestrian **Borgo Pio**, with cobbled streets, **trattorias with outdoor tables**, artisan shops and the old **Passetto** walls. Lovely in the **evening**, when the day visitors have left.","it":"A pochi passi (**5 minuti**): la pedonale **Borgo Pio**, con strade di sampietrini, **trattorie con i tavoli all’aperto**, botteghe artigiane e le antiche mura del **Passetto**. Bellissima **la sera**, quando i turisti della giornata sono andati via.","fr":"À quelques pas (**5 minutes**) : le **Borgo Pio** piéton, avec ses rues pavées, ses **trattorias en terrasse**, ses boutiques d’artisans et les vieux murs du **Passetto**. Charmant le **soir**, quand les visiteurs de la journée sont partis.","es":"A pocos pasos (**5 minutos**): la peatonal **Borgo Pio**, con calles empedradas, **trattorias con mesas al aire libre**, tiendas artesanas y los antiguos muros del **Passetto**. Preciosa **por la noche**, cuando se han ido los visitantes del día.","de":"Nur ein kurzer Spaziergang (**5 Minuten**): der autofreie **Borgo Pio** mit Kopfsteinpflaster, **Trattorien mit Tischen im Freien**, Handwerksläden und den alten Mauern des **Passetto**. Besonders schön **am Abend**, wenn die Tagesbesucher gegangen sind.","ar":"على بُعد خطوات (**5 دقائق**): شارع المشاة **بورغو بيو** بأزقّته المرصوفة و**مطاعمه ذات الطاولات في الهواء الطلق** ومتاجر الحرفيين وأسوار **الباسيتو** القديمة. جميل جداً **في المساء** بعد مغادرة زوار النهار."},"maps":"Borgo Pio, Roma","photo":{"src":"rome/borgo-pio","place":"Borgo Pio","area":false,"credit":{"title":"Roma Borgo Pio (52985588231).jpg","author":"Jorge Franganillo","license":"CC BY 2.0","licenseUrl":"https://creativecommons.org/licenses/by/2.0","source":"https://commons.wikimedia.org/wiki/File:Roma_Borgo_Pio_(52985588231).jpg"}}},{"icon":"bag","title":{"en":"Shopping on Via Cola di Rienzo","it":"Shopping in Via Cola di Rienzo","fr":"Shopping sur la Via Cola di Rienzo","es":"Compras en Via Cola di Rienzo","de":"Shopping in der Via Cola di Rienzo","ar":"التسوق في شارع كولا دي رينزو"},"text":{"en":"**3 minutes** away, the main shopping street of the elegant **Prati** district: fashion, shoes and Italian brands, plus the historic food shop **Castroni** (no. 196) for coffee, sweets and delicacies to take home.","it":"A **3 minuti**, la via dello shopping dell’elegante quartiere **Prati**: moda, scarpe e marchi italiani, e la storica drogheria **Castroni** (civico 196) per caffè, dolci e specialità da portare a casa.","fr":"À **3 minutes**, la grande rue commerçante de l’élégant quartier de **Prati** : mode, chaussures et marques italiennes, et l’épicerie historique **Castroni** (n° 196) pour le café, les douceurs et les spécialités à rapporter.","es":"A **3 minutos**, la gran calle comercial del elegante barrio de **Prati**: moda, zapatos y marcas italianas, y la histórica tienda de ultramarinos **Castroni** (n.º 196) para café, dulces y especialidades para llevar.","de":"**3 Minuten** entfernt: die Einkaufsstraße des eleganten Viertels **Prati** mit Mode, Schuhen und italienischen Marken sowie dem traditionsreichen Feinkostladen **Castroni** (Nr. 196) für Kaffee, Süßes und Spezialitäten zum Mitnehmen.","ar":"على بُعد **3 دقائق**، شارع التسوق الرئيسي في حي **براتي** الأنيق: أزياء وأحذية وماركات إيطالية، ومتجر الأطعمة التاريخي **كاستروني** (رقم 196) للقهوة والحلويات والمنتجات المميزة."},"maps":"Via Cola di Rienzo, Roma"},{"icon":"sun","title":{"en":"Sunset on the Gianicolo","it":"Il tramonto al Gianicolo","fr":"Coucher de soleil sur le Janicule","es":"Atardecer en el Gianicolo","de":"Sonnenuntergang auf dem Gianicolo","ar":"الغروب على تلة جانيكولو"},"text":{"en":"About **30 minutes** on foot, uphill: from the terrace of **Piazza Garibaldi** you see the whole of Rome, magical **at sunset**. Every day at **noon** a **cannon** is fired from below the terrace.","it":"Circa **30 minuti** a piedi, in salita: dalla terrazza di **Piazza Garibaldi** si vede tutta Roma, magica **al tramonto**. Ogni giorno a **mezzogiorno** sotto la terrazza spara il **cannone**.","fr":"Environ **30 minutes** à pied, en montée : depuis la terrasse de la **Piazza Garibaldi**, tout Rome s’offre à vous, magique **au coucher du soleil**. Chaque jour à **midi**, un **coup de canon** est tiré sous la terrasse.","es":"Unos **30 minutos** a pie, cuesta arriba: desde la terraza de **Piazza Garibaldi** se ve toda Roma, mágica **al atardecer**. Cada día a **mediodía** se dispara un **cañonazo** bajo la terraza.","de":"Etwa **30 Minuten** zu Fuß, bergauf: Von der Terrasse der **Piazza Garibaldi** sehen Sie ganz Rom, magisch **bei Sonnenuntergang**. Jeden Tag um **12 Uhr mittags** wird unterhalb der Terrasse eine **Kanone** abgefeuert.","ar":"حوالي **30 دقيقة** سيراً صعوداً: من شرفة **ساحة غاريبالدي** ترون روما كلها، ومنظرها ساحر **عند الغروب**. وكل يوم عند **الظهيرة** يُطلق **مدفع** من أسفل الشرفة."},"maps":"Piazza Giuseppe Garibaldi, Gianicolo, Roma","photo":{"src":"rome/gianicolo","place":"Gianicolo","area":false,"credit":{"title":"20110327 Roma - Gianicolo 006.jpg","author":"Amaunet","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","source":"https://commons.wikimedia.org/wiki/File:20110327_Roma_-_Gianicolo_006.jpg"}}}]},{"type":"heading","text":{"en":"The great classics of the centre","it":"I grandi classici del centro","fr":"Les grands classiques du centre","es":"Los grandes clásicos del centro","de":"Die großen Klassiker im Zentrum","ar":"روائع وسط المدينة"}},{"type":"features","items":[{"icon":"column","title":{"en":"Piazza Navona","it":"Piazza Navona","fr":"Piazza Navona","es":"Piazza Navona","de":"Piazza Navona","ar":"ساحة نافونا"},"text":{"en":"A **24-minute walk** across the Tiber: Bernini’s **Fountain of the Four Rivers**, Borromini’s church of **Sant’Agnese** and street artists in Rome’s most beautiful Baroque square.","it":"A **24 minuti a piedi**, oltre il Tevere: la **Fontana dei Quattro Fiumi** del Bernini, la chiesa di **Sant’Agnese** del Borromini e gli artisti di strada nella piazza barocca più bella di Roma.","fr":"À **24 minutes à pied**, de l’autre côté du Tibre : la **fontaine des Quatre-Fleuves** du Bernin, l’église **Sant’Agnese** de Borromini et les artistes de rue sur la plus belle place baroque de Rome.","es":"A **24 minutos a pie**, al otro lado del Tíber: la **Fuente de los Cuatro Ríos** de Bernini, la iglesia de **Sant’Agnese** de Borromini y los artistas callejeros en la plaza barroca más bella de Roma.","de":"**24 Gehminuten** jenseits des Tibers: Berninis **Vierströmebrunnen**, Borrominis Kirche **Sant’Agnese** und Straßenkünstler auf Roms schönstem Barockplatz.","ar":"على بُعد **24 دقيقة سيراً** عبر نهر التيبر: **نافورة الأنهار الأربعة** لبرنيني، وكنيسة **سانت أنييزي** لبوروميني، وفنانو الشارع في أجمل ساحة باروكية في روما."},"maps":"Piazza Navona, Roma","photo":{"src":"rome/piazza-navona","place":"Piazza Navona","area":false,"credit":{"title":"Piazza Navona Sant'Agnese in Agone fontana dei Fiumi Roma.jpg","author":"Wolfgang Moroder","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","source":"https://commons.wikimedia.org/wiki/File:Piazza_Navona_Sant%27Agnese_in_Agone_fontana_dei_Fiumi_Roma.jpg"}}},{"icon":"column","title":{"en":"Pantheon","it":"Pantheon","fr":"Pantheon","es":"Pantheon","de":"Pantheon","ar":"البانثيون"},"text":{"en":"A **30-minute walk**, the best-preserved temple of ancient Rome, with its huge dome open to the sky.","it":"A **30 minuti a piedi**, il tempio meglio conservato dell’antica Roma, con la sua immensa cupola aperta verso il cielo.","fr":"À **30 minutes à pied**, le temple le mieux conservé de la Rome antique, avec son immense coupole ouverte sur le ciel.","es":"A **30 minutos a pie**, el templo mejor conservado de la antigua Roma, con su enorme cúpula abierta al cielo.","de":"**30 Gehminuten** entfernt: der am besten erhaltene Tempel des antiken Rom mit seiner riesigen, zum Himmel offenen Kuppel.","ar":"على بُعد **30 دقيقة سيراً**، أفضل المعابد المحفوظة في روما القديمة بقبته الهائلة المفتوحة نحو السماء."},"maps":"Pantheon, Roma","photo":{"src":"rome/pantheon","place":"Pantheon","area":false,"credit":{"title":"Pantheon Rom 1 cropped.jpg","author":"Rabax63","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","source":"https://commons.wikimedia.org/wiki/File:Pantheon_Rom_1_cropped.jpg"}}},{"icon":"column","title":{"en":"Trevi Fountain","it":"Fontana di Trevi","fr":"Fontaine de Trevi","es":"Fontana de Trevi","de":"Trevi-Brunnen","ar":"نافورة تريفي"},"text":{"en":"A **35-minute walk**, the famous Baroque fountain where it is traditional to **throw a coin** to ensure your return to Rome.","it":"A **35 minuti a piedi**, la celebre fontana barocca dove è tradizione **lanciare una moneta** per assicurarsi di tornare a Roma.","fr":"À **35 minutes à pied**, la célèbre fontaine baroque où la tradition veut que l’on **lance une pièce** pour être sûr de revenir à Rome.","es":"A **35 minutos a pie**, la famosa fuente barroca donde es tradición **lanzar una moneda** para asegurarse de volver a Roma.","de":"**35 Gehminuten** entfernt: der berühmte Barockbrunnen, in den man traditionell **eine Münze wirft**, um sicher nach Rom zurückzukehren.","ar":"على بُعد **35 دقيقة سيراً**، النافورة الباروكية الشهيرة حيث جرت العادة أن **ترموا قطعة نقدية** لتضمنوا العودة إلى روما."},"maps":"Fontana di Trevi, Roma","photo":{"src":"img/trevi-fountain","own":true,"pos":"50% 40%"}},{"icon":"column","title":{"en":"Piazza di Spagna and Trinità dei Monti","it":"Piazza di Spagna e Trinità dei Monti","fr":"Piazza di Spagna et Trinité-des-Monts","es":"Piazza di Spagna y Trinità dei Monti","de":"Piazza di Spagna und Trinità dei Monti","ar":"ساحة إسبانيا وترينيتا دي مونتي"},"text":{"en":"A **30-minute walk**: the **Spanish Steps**, the **Barcaccia fountain** and the luxury boutiques of Via Condotti.","it":"A **30 minuti a piedi**: la **Scalinata di Trinità dei Monti**, la **fontana della Barcaccia** e le boutique di lusso di Via Condotti.","fr":"À **30 minutes à pied** : l’**escalier de la Trinité-des-Monts**, la **fontaine de la Barcaccia** et les boutiques de luxe de la Via Condotti.","es":"A **30 minutos a pie**: la **escalinata de Trinità dei Monti**, la **fuente de la Barcaccia** y las boutiques de lujo de Via Condotti.","de":"**30 Gehminuten** entfernt: die **Spanische Treppe**, der **Barcaccia-Brunnen** und die Luxusboutiquen der Via Condotti.","ar":"على بُعد **30 دقيقة سيراً**: **درج ترينيتا دي مونتي** و**نافورة باركاتشا** ومتاجر الأزياء الفاخرة في شارع كوندوتي."},"maps":"Piazza di Spagna, Roma","photo":{"src":"img/piazza-di-spagna","own":true,"pos":"50% 0%"}}]},{"type":"heading","text":{"en":"Local activities","it":"Attività in zona","fr":"Activités locales","es":"Actividades locales","de":"Aktivitäten vor Ort","ar":"أنشطة محلية"}},{"type":"list","grid":true,"items":[{"icon":"bike","title":{"en":"Cycling","it":"In bicicletta","fr":"Vélo","es":"En bicicleta","de":"Radfahren","ar":"ركوب الدراجات"},"text":{"en":"Explore **Villa Borghese**, the Tiber, Trastevere, the Vatican and Monti.","it":"Esplorate **Villa Borghese**, il Tevere, Trastevere, il Vaticano e Monti.","fr":"Explorez la **Villa Borghèse**, le Tibre, le Trastevere, le Vatican et Monti.","es":"Explore **Villa Borghese**, el Tíber, Trastevere, el Vaticano y Monti.","de":"Erkunden Sie die **Villa Borghese**, den Tiber, Trastevere, den Vatikan und Monti.","ar":"استكشفوا **فيلا بورغيزي** ونهر التيبر وتراستيفيري والفاتيكان وحي مونتي."},"photo":{"src":"rome/villa-borghese","place":"Villa Borghese","area":false,"credit":{"title":"Piazza di Siena Villa Borghese Roma 2012.JPG","author":"Felix König","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","source":"https://commons.wikimedia.org/wiki/File:Piazza_di_Siena_Villa_Borghese_Roma_2012.JPG"}}},{"icon":"boat","title":{"en":"Boating","it":"In barca","fr":"Balade en barque","es":"En barca","de":"Bootfahren","ar":"نزهة بالقارب"},"text":{"en":"**Boat trip** on the lake at Villa Borghese.","it":"**Giro in barca** sul laghetto di Villa Borghese.","fr":"**Promenade en barque** sur le lac de la Villa Borghèse.","es":"**
