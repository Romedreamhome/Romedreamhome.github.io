le":{"en":"Before leaving – in this order","it":"Prima di partire – in quest’ordine","fr":"Avant de partir – dans cet ordre","es":"Antes de salir – en este orden","de":"Vor der Abreise – in dieser Reihenfolge","ar":"قبل المغادرة – بهذا الترتيب"},"items":[{"icon":"clock","title":{"en":"Leave by 10:00","it":"Uscite entro le 10:00","fr":"Départ avant 10h00","es":"Salida antes de las 10:00","de":"Abreise bis 10:00 Uhr","ar":"المغادرة قبل 10:00"},"text":{"en":"Check-out is by **10:00**. Make sure you **haven’t forgotten anything**.","it":"Il check-out è entro le **10:00**. Controllate di **non aver dimenticato nulla**.","fr":"Le départ se fait avant **10h00**. Vérifiez que vous **n’avez rien oublié**.","es":"El check-out es antes de las **10:00**. Compruebe que **no ha olvidado nada**.","de":"Check-out ist bis **10:00 Uhr**. Prüfen Sie, dass Sie **nichts vergessen** haben.","ar":"موعد المغادرة قبل **10:00**. تأكّدوا من أنكم **لم تنسوا شيئاً**."}},{"icon":"power","title":{"en":"Lights and devices off","it":"Luci e apparecchi spenti","fr":"Lumières et appareils éteints","es":"Luces y aparatos apagados","de":"Licht und Geräte aus","ar":"إطفاء الأضواء والأجهزة"},"text":{"en":"**Turn off** all lights and electrical devices.","it":"**Spegnete** tutte le luci e gli apparecchi elettrici.","fr":"**Éteignez** toutes les lumières et les appareils électriques.","es":"**Apague** todas las luces y los aparatos eléctricos.","de":"**Schalten Sie** alle Lichter und Elektrogeräte **aus**.","ar":"**أطفئوا** جميع الأضواء والأجهزة الكهربائية."}},{"icon":"house","title":{"en":"Windows closed","it":"Finestre chiuse","fr":"Fenêtres fermées","es":"Ventanas cerradas","de":"Fenster geschlossen","ar":"النوافذ مغلقة"},"text":{"en":"**Close all the windows.**","it":"**Chiudete tutte le finestre.**","fr":"**Fermez toutes les fenêtres.**","es":"**Cierre todas las ventanas.**","de":"**Schließen Sie alle Fenster.**","ar":"**أغلقوا جميع النوافذ.**"}},{"icon":"euro","title":{"en":"Tourist tax","it":"Tassa di soggiorno","fr":"Taxe de séjour","es":"Tasa turística","de":"Kurtaxe","ar":"ضريبة السياحة"},"text":{"en":"Leave it **in cash on the table** (€6 per person per night).","it":"Lasciatela **in contanti sul tavolo** (6 € a persona a notte).","fr":"Laissez-la **en espèces sur la table** (6 € par personne et par nuit).","es":"Déjela **en efectivo sobre la mesa** (6 € por persona y noche).","de":"Lassen Sie sie **in bar auf dem Tisch** (6 € pro Person und Nacht).","ar":"اتركوها **نقدًا على الطاولة** (6 يورو للشخص في الليلة)."}},{"icon":"door","title":{"en":"Close the door","it":"Chiudete la porta","fr":"Fermez la porte","es":"Cierre la puerta","de":"Tür schließen","ar":"أغلقوا الباب"},"text":{"en":"Go out and **close the apartment door**.","it":"Uscite e **chiudete la porta di casa**.","fr":"Sortez et **fermez la porte de l’appartement**.","es":"Salga y **cierre la puerta del apartamento**.","de":"Gehen Sie hinaus und **schließen Sie die Wohnungstür**.","ar":"اخرجوا و**أغلقوا باب الشقة**."}},{"icon":"key","title":{"en":"Keys in the lockbox","it":"Chiavi nella cassetta","fr":"Clés dans la boîte","es":"Llaves en la caja","de":"Schlüssel in den Safe","ar":"المفاتيح في الصندوق"},"text":{"en":"Put the keys back in the **lockbox on the door** and close it.","it":"Rimettete le chiavi nella **cassetta sulla porta** e chiudetela.","fr":"Remettez les clés dans la **boîte à clés sur la porte** et refermez-la.","es":"Vuelva a dejar las llaves en la **caja de la puerta** y ciérrela.","de":"Legen Sie die Schlüssel zurück in den **Schlüsselsafe an der Tür** und schließen Sie ihn.","ar":"أعيدوا المفاتيح إلى **الصندوق الموجود على الباب** وأغلقوه."}},{"icon":"rotate","title":{"en":"Scramble the code","it":"Mescolate il codice","fr":"Brouillez le code","es":"Mezcle el código","de":"Code verstellen","ar":"غيّروا أرقام الرمز"},"text":{"en":"**Scramble the code** on the lockbox, **otherwise it stays open**.","it":"**Mescolate le cifre** della cassetta, **altrimenti resta aperta**.","fr":"**Brouillez les chiffres** de la boîte, **sinon elle reste ouverte**.","es":"**Mezcle los dígitos** de la caja; **de lo contrario, se queda abierta**.","de":"**Verstellen Sie die Ziffern** am Safe, **sonst bleibt er offen**.","ar":"**غيّروا أرقام** الصندوق، **وإلا سيبقى مفتوحاً**."}}]},{"type":"notice","tone":"important","icon":"key","title":{"en":"Important","it":"Importante","fr":"Important","es":"Importante","de":"Wichtig","ar":"مهم"},"text":{"en":"After putting the keys in the lockbox, always **scramble the code**: otherwise the box **stays open**.","it":"Dopo aver messo le chiavi nella cassetta, **mescolate sempre il codice**: altrimenti la cassetta **resta aperta**.","fr":"Après avoir remis les clés dans la boîte, **brouillez toujours le code** : sinon la boîte **reste ouverte**.","es":"Después de dejar las llaves en la caja, **mezcle siempre el código**: de lo contrario, la caja **se queda abierta**.","de":"Nachdem Sie die Schlüssel in den Safe gelegt haben, **verstellen Sie immer den Code**: sonst **bleibt der Safe offen**.","ar":"بعد وضع المفاتيح في الصندوق، **غيّروا أرقام الرمز دائماً**: وإلا **سيبقى الصندوق مفتوحاً**."}},{"type":"closing","text":{"en":"Thank you!","it":"Grazie!","fr":"Merci !","es":"¡Gracias!","de":"Vielen Dank!","ar":"شكراً لكم!"}}]},{"id":"contact","icon":"phone","title":{"en":"Contact","it":"Contatti","fr":"Contact","es":"Contacto","de":"Kontakt","ar":"التواصل"},"blocks":[{"type":"host","text":{"en":"Dear travelers, I am here to assist you whenever you need. If you encounter any issues or have any questions, please do not hesitate to contact me **by phone or email**. I am **always available** to help make your stay as pleasant and stress-free as possible.","it":"Cari viaggiatori, sono qui per assistervi ogni volta che ne avrete bisogno. Se incontrate qualche problema o avete domande, non esitate a contattarmi **per telefono o via email**. Sono **sempre disponibile** per rendere il vostro soggiorno il più piacevole e sereno possibile.","fr":"Chers voyageurs, je suis là pour vous aider à tout moment. Si vous rencontrez un problème ou avez des questions, n’hésitez pas à me contacter **par téléphone ou par e-mail**. Je suis **toujours disponible** pour rendre votre séjour aussi agréable et serein que possible.","es":"Queridos viajeros, estoy aquí para ayudarles siempre que lo necesiten. Si tienen algún problema o alguna pregunta, no duden en contactarme **por teléfono o por correo electrónico**. **Siempre estoy disponible** para que su estancia sea lo más agradable y tranquila posible.","de":"Liebe Reisende, ich bin jederzeit für Sie da. Wenn Probleme auftreten oder Sie Fragen haben, zögern Sie nicht, mich **telefonisch oder per E-Mail** zu kontaktieren. Ich helfe Ihnen **immer gern**, Ihren Aufenthalt so angenehm und entspannt wie möglich zu gestalten.","ar":"أعزاءنا المسافرين، أنا هنا لمساعدتكم متى احتجتم إلى ذلك. إذا واجهتم أي مشكلة أو كان لديكم أي سؤال، فلا تترددوا في التواصل معي **عبر الهاتف أو البريد الإلكتروني**. أنا **متاح دائماً** لأجعل إقامتكم ممتعة ومريحة قدر الإمكان."}},{"type":"review","text":{"en":"We hope you had a pleasant stay in our home. If you could take a moment to share your feedback and leave us a **5-star review**, it would be greatly appreciated.","it":"Speriamo che abbiate trascorso un piacevole soggiorno nella nostra casa. Se poteste dedicarci un momento per condividere la vostra opinione e lasciarci una **recensione a 5 stelle**, ve ne saremmo davvero grati.","fr":"Nous espérons que vous avez passé un agréable séjour chez nous. Si vous pouviez prendre un instant pour partager votre avis et nous laisser un **commentaire 5 étoiles**, nous vous en serions très reconnaissants.","es":"Esperamos que haya disfrutado de una agradable estancia en nuestra casa. Si pudiera dedicar un momento a compartir su opinión y dejarnos una **reseña de 5 estrellas**, se lo agradeceríamos muchísimo.","de":"Wir hoffen, Sie hatten einen angenehmen Aufenthalt bei uns. Wenn Sie sich einen Moment Zeit nehmen könnten, um Ihre Eindrücke zu teilen und uns eine **5-Sterne-Bewertung** zu hinterlassen, würden wir uns sehr freuen.","ar":"نأمل أن تكونوا قد استمتعتم بإقامة طيبة في منزلنا. إذا تمكنتم من تخصيص لحظة لمشاركة رأيكم وترك **تقييم من 5 نجوم** لنا، فسنكون ممتنين جداً."}}]}],"arrival":{"steps":[{"en":"Arrive at **Via Catone 29**: the **black wrought-iron and glass main door**.","it":"Arrivate in **Via Catone 29**: il **portone in ferro battuto nero e vetro**.","fr":"Arrivez au **Via Catone 29** : la **porte d’entrée en fer forgé noir et verre**.","es":"Llegue a **Via Catone 29**: el **portal de hierro forjado negro y cristal**.","de":"Kommen Sie zur **Via Catone 29**: die **schwarze Haustür aus Schmiedeeisen und Glas**.","ar":"عند الوصول إلى **Via Catone 29**: **الباب الرئيسي من الحديد المشغول الأسود والزجاج**."},{"en":"On the **LEFT side** of the door there is a **keypad** (code lock): type **1919#** to open the **main door**.","it":"Sul **lato SINISTRO** del portone c’è una **tastiera** (serratura a codice): digitate **1919#** per aprire il **portone**.","fr":"Sur le **côté GAUCHE** de la porte se trouve un **clavier** (serrure à code) : tapez **1919#** pour ouvrir la **porte de l’immeuble**.","es":"En el **lado IZQUIERDO** del portal hay un **teclado** (cerradura con código): marque **1919#** para abrir el **portal**.","de":"An der **LINKEN Seite** der Tür befindet sich ein **Tastenfeld** (Codeschloss): Geben Sie **1919#** ein, um die **Haustür** zu öffnen.","ar":"على **الجانب الأيسر** من الباب توجد **لوحة أرقام** (قفل برمز): اكتبوا **1919#** لفتح **باب المبنى**."},{"en":"Inside, follow the **red arrows**: **turn RIGHT** and **climb the short ramp**.","it":"Una volta dentro, seguite le **frecce rosse**: **girate a DESTRA** e **salite la breve rampa**.","fr":"À l’intérieur, suivez les **flèches rouges** : **tournez à DROITE** et **montez la petite rampe**.","es":"Dentro, siga las **flechas rojas**: **gire a la DERECHA** y **suba la pequeña rampa**.","de":"Folgen Sie drinnen den **roten Pfeilen**: **Biegen Sie RECHTS ab** und **gehen Sie die kurze Rampe hinauf**.","ar":"في الداخل اتبعوا **الأسهم الحمراء**: **انعطفوا يميناً** و**اصعدوا المنحدر القصير**."},{"en":"**Your door: raised ground floor, at the END of the hallway.** The **key box is on the door**: enter the code **2193** and take the **keys**. Go in and **close the door** behind you. **Welcome!**","it":"**La vostra porta: piano rialzato, in FONDO al corridoio.** La **cassetta delle chiavi è sulla porta**: inserite il codice **2193** e prendete le **chiavi**. Entrate e **chiudete la porta** alle vostre spalle. **Benvenuti!**","fr":"**Votre porte : rez-de-chaussée surélevé, au FOND du couloir.** La **boîte à clés est sur la porte** : saisissez le code **2193** et prenez les **clés**. Entrez et **refermez la porte** derrière vous. **Bienvenue !**","es":"**Su puerta: planta baja elevada, al FONDO del pasillo.** La **caja de llaves está en la puerta**: introduzca el código **2193** y coja las **llaves**. Entre y **cierre la puerta** al pasar. **¡Bienvenidos!**","de":"**Ihre Tür: Hochparterre, am ENDE des Flurs.** Der **Schlüsselsafe ist an der Tür**: Geben Sie den Code **2193** ein und nehmen Sie die **Schlüssel**. Treten Sie ein und **schließen Sie die Tür** hinter sich. **Willkommen!**","ar":"**بابكم: الطابق الأرضي المرتفع، في نهاية الممر.** **صندوق المفاتيح على الباب**: أدخلوا الرمز **2193** وخذوا **المفاتيح**. ادخلوا و**أغلقوا الباب** خلفكم. **أهلاً وسهلاً!**"}]},"registration":"IT058091C2Z3DQVT3V","ui":{"arrivalTitle":{"en":"Arrival in 4 steps","it":"Arrivo in 4 passi","fr":"Arrivée en 4 étapes","es":"Llegada en 4 pasos","de":"Ankunft in 4 Schritten","ar":"الوصول في 4 خطوات"},"quickCode":{"en":"Apartment lockbox · raised ground floor, door at the END of the hallway","it":"Cassetta appartamento · piano rialzato, porta in FONDO al corridoio","fr":"Boîte de l’appartement · rez-de-chaussée surélevé, porte au FOND du couloir","es":"Caja del apartamento · planta baja elevada,
