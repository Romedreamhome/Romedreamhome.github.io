errazza","fr":"Terrasse","es":"Terraza","de":"Terrasse","ar":"شرفة"}}],"sections":[{"id":"welcome","icon":"column","title":{"en":"Welcome","it":"Benvenuti","fr":"Bienvenue","es":"Bienvenida","de":"Willkommen","ar":"مرحباً بكم"},"blocks":[{"type":"lead","text":{"en":"We are pleased to welcome you to our accommodation and we hope you will have an **unforgettable stay**.","it":"Siamo lieti di accogliervi nella nostra struttura e speriamo che il vostro soggiorno sia **indimenticabile**.","fr":"Nous sommes ravis de vous accueillir dans notre logement et espérons que votre séjour sera **inoubliable**.","es":"Nos complace darle la bienvenida a nuestro alojamiento y esperamos que disfrute de una **estancia inolvidable**.","de":"Wir freuen uns, Sie in unserer Unterkunft willkommen zu heißen, und wünschen Ihnen einen **unvergesslichen Aufenthalt**.","ar":"يسعدنا أن نرحب بكم في مسكننا، ونتمنى لكم **إقامة لا تُنسى**."}},{"type":"text","text":{"en":"**Big Bufalo** is a **180 m²** apartment with **2 terraces**, **5 bedrooms** and **2 bathrooms**, on the **3rd floor** of an elegant **historic palazzo d’epoca** in the heart of Rome, a few steps from the **Trevi Fountain** and about **5 minutes** from **Piazza di Spagna**.","it":"**Big Bufalo** è un appartamento di **180 m²** con **2 terrazze**, **5 camere** e **2 bagni**, al **terzo piano** di un elegante **palazzo d’epoca** nel cuore di Roma, a pochi passi dalla **Fontana di Trevi** e a circa **5 minuti** da **Piazza di Spagna**.","fr":"**Big Bufalo** est un appartement de **180 m²** avec **2 terrasses**, **5 chambres** et **2 salles de bains**, au **3e étage** d’un élégant **palazzo d’epoca** au cœur de Rome, à deux pas de la **fontaine de Trevi** et à environ **5 minutes** de la **place d’Espagne**.","es":"**Big Bufalo** es un apartamento de **180 m²** con **2 terrazas**, **5 dormitorios** y **2 baños**, en la **3ª planta** de un elegante **palazzo d’epoca** en el corazón de Roma, a pocos pasos de la **Fontana de Trevi** y a unos **5 minutos** de la **Plaza de España**.","de":"**Big Bufalo** ist eine **180 m²** große Wohnung mit **2 Terrassen**, **5 Schlafzimmern** und **2 Bädern** im **3. Stock** eines eleganten **historischen Palazzo d’epoca** im Herzen Roms, nur wenige Schritte vom **Trevi-Brunnen** und etwa **5 Minuten** von der **Spanischen Treppe** entfernt.","ar":"**Big Bufalo** شقة بمساحة **180 م²** مع **شرفتين** و**5 غرف نوم** و**حمّامين**، في **الطابق الثالث** من **قصر تاريخي** أنيق (palazzo d’epoca) في قلب روما، على بُعد خطوات من **نافورة تريفي** وحوالي **5 دقائق** من **ساحة إسبانيا**."}},{"type":"photo","src":"img/dining","alt":{"en":"Living room","it":"Soggiorno","fr":"Salon","es":"Salón","de":"Wohnzimmer","ar":"غرفة المعيشة"}},{"type":"photo","src":"img/living-billiard","alt":{"en":"Living room","it":"Soggiorno","fr":"Salon","es":"Salón","de":"Wohnzimmer","ar":"غرفة المعيشة"}},{"type":"photo","src":"img/bedroom-1","alt":{"en":"Double bedroom","it":"Camera matrimoniale","fr":"Chambre double","es":"Dormitorio doble","de":"Doppelzimmer","ar":"غرفة نوم مزدوجة"}},{"type":"photo","src":"img/bedroom-2","alt":{"en":"Double bedroom","it":"Camera matrimoniale","fr":"Chambre double","es":"Dormitorio doble","de":"Doppelzimmer","ar":"غرفة نوم مزدوجة"}},{"type":"text","text":{"en":"We wish you an **excellent stay** in our beautiful city and hope to **see you again soon**!","it":"Vi auguriamo un **ottimo soggiorno** nella nostra splendida città e speriamo di **rivedervi presto**!","fr":"Nous vous souhaitons un **excellent séjour** dans notre belle ville et espérons **vous revoir très bientôt** !","es":"¡Le deseamos una **excelente estancia** en nuestra hermosa ciudad y esperamos **volver a verle pronto**!","de":"Wir wünschen Ihnen einen **wunderbaren Aufenthalt** in unserer schönen Stadt und hoffen, Sie **bald wiederzusehen**!","ar":"نتمنى لكم **إقامة ممتعة** في مدينتنا الجميلة، ونأمل أن **نراكم مجدداً قريباً**!"}},{"type":"signature","text":"Rome Dream Home"}]},{"id":"checkin","icon":"key","title":{"en":"Check-in","it":"Check-in","fr":"Arrivée","es":"Check-in","de":"Check-in","ar":"تسجيل الوصول"},"blocks":[{"type":"time","value":"15:00","label":{"en":"Self check-in","it":"Self check-in","fr":"Self check-in","es":"Self check-in","de":"Self-Check-in","ar":"تسجيل الوصول الذاتي"}},{"type":"text","text":{"en":"You can arrive **at any time**, even late at night: you get in **on your own** with the **street door code** and the **lockbox code**.","it":"Potete arrivare **a qualsiasi ora**, anche a tarda notte: entrate **in autonomia** con il **codice del portone** e il **codice della cassetta**.","fr":"Vous pouvez arriver **à toute heure**, même tard le soir : vous entrez **en toute autonomie** avec le **code de la porte d’entrée** et le **code de la boîte à clés**.","es":"Puede llegar **a cualquier hora**, incluso de madrugada: entra **por su cuenta** con el **código del portal** y el **código de la caja de llaves**.","de":"Sie können **jederzeit** anreisen, auch spät in der Nacht: Sie gelangen **selbstständig** hinein – mit dem **Haustür-Code** und dem **Schlüsselsafe-Code**.","ar":"يمكنكم الوصول **في أي وقت**، حتى في ساعة متأخرة من الليل: تدخلون **بأنفسكم** باستخدام **رمز باب المبنى** و**رمز صندوق المفاتيح**."}},{"type":"text","text":{"en":"Please respect the check-in times. If you would like to arrive earlier, no problem at all: you can **drop off your luggage from 11:00** and take the keys, then **come back at 15:00** when the apartment will be ready.","it":"Vi preghiamo di rispettare gli orari di check-in. Se desiderate arrivare prima, nessun problema: potete **lasciare i bagagli a partire dalle 11:00** e ritirare le chiavi, per poi **tornare alle 15:00**, quando l’appartamento sarà pronto.","fr":"Merci de respecter les horaires d’arrivée. Si vous souhaitez arriver plus tôt, aucun problème : vous pouvez **déposer vos bagages à partir de 11h00** et récupérer les clés, puis **revenir à 15h00**, lorsque l’appartement sera prêt.","es":"Le rogamos que respete los horarios de check-in. Si desea llegar antes, no hay ningún problema: puede **dejar su equipaje a partir de las 11:00** y recoger las llaves, y luego **volver a las 15:00**, cuando el apartamento esté listo.","de":"Bitte halten Sie die Check-in-Zeiten ein. Wenn Sie früher ankommen möchten, ist das kein Problem: Sie können Ihr **Gepäck ab 11:00 Uhr abstellen** und die Schlüssel abholen und dann **um 15:00 Uhr zurückkommen**, wenn die Wohnung bereit ist.","ar":"يُرجى الالتزام بمواعيد تسجيل الوصول. إذا رغبتم في الوصول مبكراً فلا مشكلة إطلاقاً: يمكنكم **ترك أمتعتكم ابتداءً من الساعة 11:00** واستلام المفاتيح، ثم **العودة في الساعة 15:00** عندما تكون الشقة جاهزة."}},{"type":"heading","text":{"en":"House access","it":"Accesso alla casa","fr":"Accès au logement","es":"Acceso a la vivienda","de":"Zugang zur Wohnung","ar":"الدخول إلى المنزل"}},{"type":"steps","items":[{"en":"At **Via del Bufalo 138A**, type **21219** then press **#** on the **street door keypad**: the **portone** opens.","it":"Arrivati in **Via del Bufalo 138A**, digitate **21219** e poi premete **#** sulla **tastiera del portone**: il **portone** si apre.","fr":"Arrivés au **Via del Bufalo 138A**, tapez **21219** puis appuyez sur **#** sur le **clavier de la porte d’entrée** : la **porte de l’immeuble** s’ouvre.","es":"Al llegar a **Via del Bufalo 138A**, marque **21219** y después pulse **#** en el **teclado del portal**: el **portal** se abre.","de":"In der **Via del Bufalo 138A** angekommen, tippen Sie **21219** und dann **#** auf dem **Tastenfeld der Haustür**: Die **Haustür** öffnet sich.","ar":"عند وصولكم إلى **Via del Bufalo 138A**، اكتبوا **21219** ثم اضغطوا **#** على **لوحة أرقام باب المبنى**: سيُفتح **باب المبنى**."},{"en":"Go to the **3rd floor**.","it":"Andate al **terzo piano**.","fr":"Rendez-vous au **3e étage**.","es":"Vaya a la **3ª planta**.","de":"Gehen Sie in den **3. Stock**.","ar":"توجّهوا إلى **الطابق الثالث**."},{"en":"The **lockbox is on the apartment door**: enter the code **4207**, open it and **take the keys**.","it":"La **cassetta è sulla porta di casa**: inserite il codice **4207**, apritela e **prendete le chiavi**.","fr":"La **boîte à clés est sur la porte de l’appartement** : saisissez le code **4207**, ouvrez-la et **prenez les clés**.","es":"La **caja de llaves está en la puerta del apartamento**: introduzca el código **4207**, ábrala y **coja las llaves**.","de":"Der **Schlüsselsafe hängt an der Wohnungstür**: Geben Sie den Code **4207** ein, öffnen Sie ihn und **nehmen Sie die Schlüssel**.","ar":"**صندوق المفاتيح موجود على باب الشقة**: أدخلوا الرمز **4207**، افتحوه و**خذوا المفاتيح**."},{"en":"Go inside and **close the door** behind you. **Welcome!**","it":"Entrate e **chiudete la porta** alle vostre spalle. **Benvenuti!**","fr":"Entrez et **refermez la porte** derrière vous. **Bienvenue !**","es":"Entre y **cierre la puerta** detrás de usted. **¡Bienvenidos!**","de":"Treten Sie ein und **schließen Sie die Tür** hinter sich. **Willkommen!**","ar":"ادخلوا و**أغلقوا الباب** خلفكم. **أهلاً وسهلاً!**"}]},{"type":"code","icon":"door","value":"21219#","label":{"en":"Street door code · type 21219, then #","it":"Codice portone · digitate 21219, poi #","fr":"Code de la porte d’entrée · tapez 21219, puis #","es":"Código del portal · marque 21219 y luego #","de":"Haustür-Code · 21219 tippen, dann #","ar":"رمز باب المبنى · اكتبوا 21219 ثم #"}},{"type":"code","label":{"en":"Lockbox code · on the apartment door","it":"Codice cassetta · sulla porta di casa","fr":"Code de la boîte à clés · sur la porte","es":"Código de la caja · en la puerta","de":"Schlüsselsafe-Code · an der Wohnungstür","ar":"رمز صندوق المفاتيح · على باب الشقة"},"value":"4207","icon":"lock"},{"type":"notice","tone":"info","icon":"luggage","title":{"en":"Luggage assistance","it":"Assistenza bagagli","fr":"Aide pour les bagages","es":"Ayuda con el equipaje","de":"Gepäckservice","ar":"المساعدة في الأمتعة"},"text":{"en":"On request, an **operator** can carry your **suitcases** up to the apartment: contact **customer service** (+39 352 282 7301).","it":"Su richiesta, un **operatore** può portare le vostre **valigie** fino all’appartamento: contattate il **servizio clienti** (+39 352 282 7301).","fr":"Sur demande, un **opérateur** peut monter vos **valises** jusqu’à l’appartement : contactez le **service client** (+39 352 282 7301).","es":"Bajo petición, un **operario** puede llevar sus **maletas** hasta el apartamento: contacte con el **servicio de atención al cliente** (+39 352 282 7301).","de":"Auf Anfrage kann ein **Mitarbeiter** Ihre **Koffer** bis in die Wohnung bringen: Kontaktieren Sie den **Kundenservice** (+39 352 282 7301).","ar":"عند الطلب، يمكن **لعامل** أن يحمل **حقائبكم** حتى الشقة: تواصلوا مع **خدمة العملاء** (+39 352 282 7301)."}},{"type":"arrival"},{"type":"tax","text":{"en":"Rome **tourist tax**: **€6 per person per night**. Please leave it **in cash** on the table before you leave.","it":"**Tassa di soggiorno** di Roma: **6 € a persona a notte**. Lasciatela **in contanti** sul tavolo prima di partire.","fr":"**Taxe de séjour** de Rome : **6 € par personne et par nuit**. Merci de la laisser **en espèces** sur la table avant votre départ.","es":"**Tasa turística** de Roma: **6 € por persona y noche**. Déjela **en efectivo** sobre la mesa antes de marcharse.","de":"Römische **Kurtaxe**: **6 € pro Person und Nacht**. Bitte lassen Sie sie vor der Abreise **in bar** auf dem Tisch.","ar":"**ضريبة السياحة** في روما: **6 يورو للشخص في الليلة**. يُرجى تركها **نقدًا** على الطاولة قبل المغادرة."}},{"type":"problems","items":[{"icon":"door","q":{"en":"The street door doesn’t open?","it":"Il portone non si apre?","fr":"La porte de l’immeuble ne s’ouvre pas ?","es":"¿El portal no se abre?","de":"Die Haustür geht nicht auf?","ar":"باب المبنى لا يُفتح؟"},"a":{"en":"Type **21219** and then press **#**. Still closed? **Call us**.","it":"Digitate **21219** e poi premete **#**. Ancora chiuso? **Chiamateci**.","fr":"Tapez **21219** puis appuyez sur **#**. Toujours fermée ? **Appelez-nous**.","es":"Marque **21219** y después pulse **#**. ¿Sigue cerrado? **Llámenos**.","de":"Tippen Sie **21219** und dann **#**. Immer noch zu? **Rufen Sie uns an**.","ar":"اكتبوا **21219** ثم اضغطوا **#**. ما زال مغلقاً؟ **اتصلوا بنا**."}},{"icon":"lock","q":{"en":"The lockbox won’t open?","it":"La cassetta non si apre?","fr":"La boîte à clés ne s’ouvre pas ?","es":"¿La caja de llaves no se abre?","de":"Der Schlüsselsafe geht nicht auf?","ar":"صندوق المفاتيح لا يُفتح؟"},"a":{"en":"Check that **each digit** is set to **4207**, then try again. Still closed? **Call us**.","it":"Controllate che **ogni cifra** sia su **4207** e riprovate. Ancora chiusa? **Chiamateci**.","fr":"Vérifiez que **chaque chiffre** est bien sur **4207**, puis réessayez. Toujours fermée ? **Appelez-nous**.","es":"Compruebe que **cada dígito** esté en **4207** e inténtelo de nuevo. ¿Sigue cerrada? **Llámenos**.","de":"Prüfen Sie, ob **jede Ziffer** auf **4207** steht, und versuchen Sie es erneut. Immer noch zu? **Rufen Sie uns an**.","ar":"تأكّدوا من أن **كل رقم** مضبوط على **4207** ثم حاولوا مجدداً. ما زال مغلقاً؟ **اتصلوا بنا**."}},{"icon":"clock","q":{"en":"Arriving late?","it":"Arrivate tardi?","fr":"Vous arrivez tard ?","es":"¿Llega tarde?","de":"Späte Ankunft?","ar":"ستصلون متأخرين؟"},"a":{"en":"**No time limit**: with the two codes you get in **on your own** at any time.","it":"**Nessun limite di orario**: con i due codici entrate **in autonomia** a qualsiasi ora.","fr":"**Aucune limite horaire** : avec les deux codes, vous entrez **en toute autonomie** à toute heure.","es":"**Sin límite de horario**: con los dos códigos entra **por su cuenta** a cualquier hora.","de":"**Keine zeitliche Begrenzung**: Mit den beiden Codes kommen Sie jederzeit **selbstständig** hinein.","ar":"**لا يوجد حدّ زمني**: بالرمزين تدخلون **بأنفسكم** في أي وقت."}},{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]},{"type":"closing","text":{"en":"Thank you very much for your **understanding and cooperation**.","it":"Grazie mille per la vostra **comprensione e collaborazione**.","fr":"Merci beaucoup pour votre **compréhension et votre coopération**.","es":"Muchas gracias por su **comprensión y colaboración**.","de":"Vielen Dank für Ihr **Verständnis und Ihre Mitarbeit**.","ar":"شكراً جزيلاً **لتفهمكم وتعاونكم**."}}]},{"id":"location","icon":"pin","title":{"en":"Location","it":"Posizione","fr":"Accès","es":"Ubicación","de":"Anreise","ar":"الموقع"},"blocks":[{"type":"address"},{"type":"heading","text":{"en":"How to arrive?","it":"Come arrivare?","fr":"Comment arriver ?","es":"¿Cómo llegar?","de":"Wie komme ich hin?","ar":"كيف تصلون إلينا؟"}},{"type":"tabs","label":{"en":"Arrive from","it":"Arrivo da","fr":"Arriver depuis","es":"Llegar desde","de":"Anreise von","ar":"الوصول من"},"tabs":[{"label":{"en":"Fiumicino Airport","it":"Aeroporto di Fiumicino","fr":"Aéroport de Fiumicino","es":"Aeropuerto de Fiumicino","de":"Flughafen Fiumicino","ar":"مطار فيوميتشينو"},"origin":"Fiumicino Airport (FCO), Rome","routes":[{"icon":"train","title":{"en":"Train (Leonardo Express)","it":"Treno (Leonardo Express)","fr":"Train (Leonardo Express)","es":"Tren (Leonardo Express)","de":"Zug (Leonardo Express)","ar":"القطار (ليوناردو إكسبريس)"},"text":{"en":"Take the **Leonardo Express** from Fiumicino Airport to Roma Termini Station (direct trip, **about 32 minutes**). Then take **metro line A** towards Battistini and get off at **Barberini** (2 stops). Walk about **9 minutes** to Via del Bufalo.","it":"Prendete il **Leonardo Express** dall’aeroporto di Fiumicino alla stazione Roma Termini (corsa diretta, **circa 32 minuti**). Poi prendete la **metro linea A** direzione Battistini e scendete a **Barberini** (2 fermate). Proseguite a piedi per circa **9 minuti** fino a Via del Bufalo.","fr":"Prenez le **Leonardo Express** de l’aéroport de Fiumicino jusqu’à la gare Roma Termini (trajet direct, **environ 32 minutes**). Prenez ensuite la **ligne A du métro** direction Battistini et descendez à **Barberini** (2 arrêts). Marchez environ **9 minutes** jusqu’à la Via del Bufalo.","es":"Tome el **Leonardo Express** desde el aeropuerto de Fiumicino hasta la estación Roma Termini (trayecto directo, **unos 32 minutos**). Después tome la **línea A del metro** dirección Battistini y bájese en **Barberini** (2 paradas). Camine unos **9 minutos** hasta Via del Bufalo.","de":"Nehmen Sie den **Leonardo Express** vom Flughafen Fiumicino zum Bahnhof Roma Termini (Direktfahrt, **ca. 32 Minuten**). Fahren Sie dann mit der **Metrolinie A** Richtung Battistini bis **Barberini** (2 Stationen). Von dort sind es etwa **9 Minuten** zu Fuß bis zur Via del Bufalo.","ar":"استقلوا قطار **ليوناردو إكسبريس** من مطار فيوميتشينو إلى محطة روما تيرميني (رحلة مباشرة، **حوالي 32 دقيقة**). ثم استقلوا **خط المترو A** باتجاه باتيستيني وانزلوا في محطة **باربيريني** (محطتان). سيروا حوالي **9 دقائق** حتى Via del Bufalo."},"price":{"en":"Total price: **around €15.50** (€14 for the train + €1.50 for the metro).","it":"Prezzo totale: **circa 15,50 €** (14 € il treno + 1,50 € la metro).","fr":"Prix total : **environ 15,50 €** (14 € pour le train + 1,50 € pour le métro).","es":"Precio total: **unos 15,50 €** (14 € el tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 15,50 €** (14 € für den Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 15.50 يورو** (14 يورو للقطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus to Roma Termini (approx. 50 minutes), then **metro line A** towards Battistini to **Barberini** and walk about **9 minutes**.","it":"Prendete un autobus **Terravision** fino a Roma Termini (circa 50 minuti), poi la **metro linea A** direzione Battistini fino a **Barberini** e circa **9 minuti** a piedi.","fr":"Prenez un bus **Terravision** jusqu’à Roma Termini (environ 50 minutes), puis la **ligne A du métro** direction Battistini jusqu’à **Barberini** et environ **9 minutes** à pied.","es":"Tome un autobús **Terravision** hasta Roma Termini (aprox. 50 minutos), después la **línea A del metro** dirección Battistini hasta **Barberini** y unos **9 minutos** a pie.","de":"Nehmen Sie einen **Terravision**-Bus nach Roma Termini (ca. 50 Minuten), dann die **Metrolinie A** Richtung Battistini bis **Barberini** und etwa **9 Minuten** zu Fuß.","ar":"استقلوا حافلة **تيرافيجن** إلى روما تيرميني (حوالي 50 دقيقة)، ثم **خط المترو A** باتجاه باتيستيني حتى محطة **باربيريني**، ثم حوالي **9 دقائق** سيراً على الأقدام."},"price":{"en":"Total price: **from about €5.50** (Terravision bus from €4 + €1.50 metro).","it":"Prezzo totale: **da circa 5,50 €** (bus Terravision da 4 € + 1,50 € metro).","fr":"Prix total : **à partir d’environ 5,50 €** (bus Terravision dès 4 € + 1,50 € le métro).","es":"Precio total: **desde unos 5,50 €** (autobús Terravision desde 4 € + 1,50 € el metro).","de":"Gesamtpreis: **ab ca. 5,50 €** (Terravision-Bus ab 4 € + 1,50 € Metro).","ar":"السعر الإجمالي: **ابتداءً من حوالي 5.50 يورو** (حافلة تيرافيجن ابتداءً من 4 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis charge a **fixed fare of €55** from Fiumicino to the city centre (inside the Aurelian Walls), luggage included.","it":"I taxi ufficiali bianchi applicano una **tariffa fissa di 55 €** da Fiumicino al centro città (entro le Mura Aureliane), bagagli inclusi.","fr":"Les taxis officiels blancs appliquent un **tarif fixe de 55 €** de Fiumicino au centre-ville (à l’intérieur du mur d’Aurélien), bagages compris.","es":"Los taxis oficiales blancos aplican una **tarifa fija de 55 €** desde Fiumicino hasta el centro de la ciudad (dentro de las Murallas Aurelianas), equipaje incluido.","de":"Offizielle weiße Taxis berechnen von Fiumicino ins Stadtzentrum (innerhalb der Aurelianischen Mauer) einen **Festpreis von 55 €**, Gepäck inklusive.","ar":"تتقاضى سيارات الأجرة الرسمية البيضاء **تعرفة ثابتة قدرها 55 يورو** من فيوميتشينو إلى وسط المدينة (داخل الأسوار الأوريليانية)، شاملة الأمتعة."},"warn":{"en":"Please note: during busy periods, there may be **long lines** at the airport taxi station.","it":"Attenzione: nei periodi di maggiore affluenza potrebbero esserci **lunghe code** alla stazione dei taxi dell’aeroporto.","fr":"Attention : en période d’affluence, il peut y avoir de **longues files d’attente** à la station de taxis de l’aéroport.","es":"Atención: en periodos de mucha afluencia puede haber **largas colas** en la parada de taxis del aeropuerto.","de":"Bitte beachten: Zu Stoßzeiten kann es am Taxistand des Flughafens **lange Warteschlangen** geben.","ar":"يُرجى الانتباه: خلال فترات الازدحام قد تكون هناك **طوابير طويلة** عند موقف سيارات الأجرة في المطار."}},{"icon":"car","title":{"en":"Private transfer","it":"Transfer privato","fr":"Transfert privé","es":"Traslado privado","de":"Privater Transfer","ar":"نقل خاص"},"text":{"en":"For a simple, comfortable and stress-free journey, choose our **exclusive transfer service** directly from Fiumicino. The price depends on the day, time and number of passengers.","it":"Per un viaggio semplice, comodo e senza stress, scegliete il nostro **servizio esclusivo di transfer** direttamente da Fiumicino. Il prezzo dipende dal giorno, dall’orario e dal numero di passeggeri.","fr":"Pour un trajet simple, confortable et sans stress, choisissez notre **service de transfert exclusif** directement depuis Fiumicino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Fiumicino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Fiumicino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Fiumicino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Fiumicino"}]},{"label":{"en":"Ciampino Airport","it":"Aeroporto di Ciampino","fr":"Aéroport de Ciampino","es":"Aeropuerto de Ciampino","de":"Flughafen Ciampino","ar":"مطار تشامبينو"},"origin":"Ciampino Airport (CIA), Rome","routes":[{"icon":"train","title":{"en":"Train + Metro","it":"Treno + Metro","fr":"Train + Métro","es":"Tren + Metro","de":"Zug + Metro","ar":"قطار + مترو"},"text":{"en":"Take the **Ciampino Airlink** shuttle bus to Ciampino station (about 10 minutes). Then take a **regional train** to Roma Termini (about 15 minutes). From Termini, take **metro line A** towards Battistini and get off at **Barberini** (2 stops), then walk about **9 minutes**.","it":"Prendete la navetta **Ciampino Airlink** fino alla stazione di Ciampino (circa 10 minuti). Poi un **treno regionale** fino a Roma Termini (circa 15 minuti). Da Termini, prendete la **metro linea A** direzione Battistini e scendete a **Barberini** (2 fermate), poi circa **9 minuti** a piedi.","fr":"Prenez la navette **Ciampino Airlink** jusqu’à la gare de Ciampino (environ 10 minutes). Prenez ensuite un **train régional** jusqu’à Roma Termini (environ 15 minutes). À Termini, prenez la **ligne A du métro** direction Battistini et descendez à **Barberini** (2 arrêts), puis environ **9 minutes** à pied.","es":"Tome el autobús lanzadera **Ciampino Airlink** hasta la estación de Ciampino (unos 10 minutos). Después tome un **tren regional** hasta Roma Termini (unos 15 minutos). Desde Termini, tome la **línea A del metro** dirección Battistini y bájese en **Barberini** (2 paradas); luego, unos **9 minutos** a pie.","de":"Nehmen Sie den Shuttlebus **Ciampino Airlink** zum Bahnhof Ciampino (ca. 10 Minuten). Fahren Sie dann mit einem **Regionalzug** nach Roma Termini (ca. 15 Minuten). Ab Termini nehmen Sie die **Metrolinie A** Richtung Battistini bis **Barberini** (2 Stationen), danach etwa **9 Minuten** zu Fuß.","ar":"استقلوا حافلة **Ciampino Airlink** المكوكية إلى محطة تشامبينو (حوالي 10 دقائق). ثم استقلوا **قطاراً إقليمياً** إلى روما تيرميني (حوالي 15 دقيقة). ومن تيرميني، استقلوا **خط المترو A** باتجاه باتيستيني وانزلوا في محطة **باربيريني** (محطتان)، ثم حوالي **9 دقائق** سيراً على الأقدام."},"price":{"en":"Total price: **about €4.20** (€2.70 for the ‘Ciampino Airlink’ bus + train + €1.50 for the metro).","it":"Prezzo totale: **circa 4,20 €** (2,70 € per bus ‘Ciampino Airlink’ + treno + 1,50 € per la metro).","fr":"Prix total : **environ 4,20 €** (2,70 € pour le bus « Ciampino Airlink » + train + 1,50 € pour le métro).","es":"Precio total: **unos 4,20 €** (2,70 € el autobús ‘Ciampino Airlink’ + tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 4,20 €** (2,70 € für Bus „Ciampino Airlink“ + Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 4.20 يورو** (2.70 يورو لحافلة «Ciampino Airlink» + القطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus to Roma Termini (approx. 40–50 minutes), then **metro line A** towards Battistini to **Barberini** and walk about **9 minutes**.","it":"Prendete un autobus **Terravision** fino a Roma Termini (circa 40–50 minuti), poi la **metro linea A** direzione Battistini fino a **Barberini** e circa **9 minuti** a piedi.","fr":"Prenez un bus **Terravision** jusqu’à Roma Termini (environ 40–50 minutes), puis la **ligne A du métro** direction Battistini jusqu’à **Barberini** et environ **9 minutes** à pied.","es":"Tome un autobús **Terravision** hasta Roma Termini (aprox. 40–50 minutos), después la **línea A del metro** dirección Battistini hasta **Barberini** y unos **9 minutos** a pie.","de":"Nehmen Sie einen **Terravision**-Bus nach Roma Termini (ca. 40–50 Minuten), dann die **Metrolinie A** Richtung Battistini bis **Barberini** und etwa **9 Minuten** zu Fuß.","ar":"استقلوا حافلة **تيرافيجن** إلى روما تيرميني (حوالي 40–50 دقيقة)، ثم **خط المترو A** باتجاه باتيستيني حتى محطة **باربيريني**، ثم حوالي **9 دقائق** سيراً على الأقدام."},"price":{"en":"Total price: **about €8** (Terravision bus from €6.50 + €1.50 metro).","it":"Prezzo totale: **circa 8 €** (bus Terravision da 6,50 € + 1,50 € metro).","fr":"Prix total : **environ 8 €** (bus Terravision dès 6,50 € + 1,50 € le métro).","es":"Precio total: **unos 8 €** (autobús Terravision desde 6,50 € + 1,50 € el metro).","de":"Gesamtpreis: **ca. 8 €** (Terravision-Bus ab 6,50 € + 1,50 € Metro).","ar":"السعر الإجمالي: **حوالي 8 يورو** (حافلة تيرافيجن ابتداءً من 6.50 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis from Ciampino charge a **fixed fare of €40** to the centre of Rome (inside the Aurelian Walls), luggage included.","it":"I taxi ufficiali bianchi da Ciampino applicano una **tariffa fissa di 40 €** per il centro di Roma (entro le Mura Aureliane), bagagli inclusi.","fr":"Les taxis officiels blancs au départ de Ciampino appliquent un **tarif fixe de 40 €** jusqu’au centre de Rome (à l’intérieur du mur d’Aurélien), bagages compris.","es":"Los taxis oficiales blancos desde Ciampino aplican una **tarifa fija de 40 €** hasta el centro de Roma (dentro de las Murallas Aurelianas), equipaje incluido.","de":"Offizielle weiße Taxis ab Ciampino berechnen ins Zentrum von Rom (innerhalb der Aurelianischen Mauer) einen **Festpreis von 40 €**, Gepäck inklusive.","ar":"تتقاضى سيارات الأجرة الرسمية البيضاء من تشامبينو **تعرفة ثابتة قدرها 40 يورو** إلى وسط روما (داخل الأسوار الأوريليانية)، شاملة الأمتعة."},"warn":{"en":"Please note: during busy times, there may be **long queues** at the airport taxi rank.","it":"Attenzione: negli orari di punta potrebbero esserci **lunghe code** alla fermata dei taxi dell’aeroporto.","fr":"Attention : aux heures d’affluence, il peut y avoir de **longues files d’attente** à la station de taxis de l’aéroport.","es":"Atención: en las horas de mayor afluencia puede haber **largas colas** en la parada de taxis del aeropuerto.","de":"Bitte beachten: Zu Stoßzeiten kann es am Taxistand des Flughafens **lange Warteschlangen** geben.","ar":"يُرجى الانتباه: في أوقات الذروة قد تكون هناك **طوابير طويلة** عند موقف سيارات الأجرة في المطار."}},{"icon":"car","title":{"en":"Private transfer","it":"Transfer privato","fr":"Transfert privé","es":"Traslado privado","de":"Privater Transfer","ar":"نقل خاص"},"text":{"en":"For a simple, comfortable and stress-free journey, choose our **exclusive transfer service** directly from Ciampino. The price depends on the day, time and number of passengers.","it":"Per un viaggio semplice, comodo e senza stress, scegliete il nostro **servizio esclusivo di transfer** direttamente da Ciampino. Il prezzo dipende dal giorno, dall’orario e dal numero di passeggeri.","fr":"Pour un trajet simple, confortable et sans stress, choisissez notre **service de transfert exclusif** directement depuis Ciampino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Ciampino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Ciampino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Ciampino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Ciampino"}]}]},{"type":"heading","text":{"en":"From Barberini metro on foot","it":"Dalla metro Barberini a piedi","fr":"Du métro Barberini à pied","es":"Desde el metro Barberini a pie","de":"Von der Metro Barberini zu Fuß","ar":"من مترو باربيريني سيراً على الأقدام"}},{"type":"steps","items":[{"en":"Exit **Barberini** station onto **Piazza Barberini**, with Bernini’s **Triton Fountain**.","it":"Uscite dalla stazione **Barberini** in **Piazza Barberini**, con la **Fontana del Tritone** del Bernini.","fr":"Sortez de la station **Barberini** sur la **Piazza Barberini**, avec la **fontaine du Triton** du Bernin.","es":"Salga de la estación **Barberini** a la **Piazza Barberini**, con la **Fuente del Tritón** de Bernini.","de":"Verlassen Sie die Station **Barberini** auf die **Piazza Barberini** mit Berninis **Tritonenbrunnen**.","ar":"اخرجوا من محطة **باربيريني** إلى **ساحة باربيريني** حيث **نافورة تريتون** لبرنيني."},{"en":"Walk **downhill along Via del Tritone** towards Via del Corso for about **7 minutes**.","it":"Scendete lungo **Via del Tritone** in direzione Via del Corso per circa **7 minuti**.","fr":"Descendez la **Via del Tritone** en direction de la Via del Corso pendant environ **7 minutes**.","es":"Baje por **Via del Tritone** en dirección a Via del Corso durante unos **7 minutos**.","de":"Gehen Sie die **Via del Tritone** bergab in Richtung Via del Corso, etwa **7 Minuten**.","ar":"انزلوا على طول **Via del Tritone** باتجاه Via del Corso لمدة **7 دقائق** تقريباً."},{"en":"Turn **right into Via del Nazareno** to **Largo del Nazareno**: **Via del Bufalo** starts here, number **138A** is a few steps away.","it":"Girate **a destra in Via del Nazareno** fino a **Largo del Nazareno**: qui inizia **Via del Bufalo**, il numero **138A** è a pochi passi.","fr":"Tournez **à droite dans la Via del Nazareno** jusqu’au **Largo del Nazareno** : la **Via del Bufalo** commence ici, le numéro **138A** est à quelques pas.","es":"Gire **a la derecha por Via del Nazareno** hasta **Largo del Nazareno**: aquí empieza **Via del Bufalo**; el número **138A** está a pocos pasos.","de":"Biegen Sie **rechts in die Via del Nazareno** zum **Largo del Nazareno** ab: Hier beginnt die **Via del Bufalo**, die Nummer **138A** ist nur wenige Schritte entfernt.","ar":"انعطفوا **يميناً إلى Via del Nazareno** حتى **Largo del Nazareno**: هنا يبدأ **Via del Bufalo**، والرقم **138A** على بُعد خطوات."}]},{"type":"heading","text":{"en":"By taxi","it":"In taxi","fr":"En taxi","es":"En taxi","de":"Mit dem Taxi","ar":"بسيارة الأجرة"}},{"type":"text","text":{"en":"Give the driver the address **Via del Bufalo 138A**: the taxi drops you **right in front of the door**.","it":"Indicate al tassista l’indirizzo **Via del Bufalo 138A**: il taxi vi lascia **proprio davanti al portone**.","fr":"Donnez au chauffeur l’adresse **Via del Bufalo 138A** : le taxi vous dépose **juste devant la porte**.","es":"Dé al taxista la dirección **Via del Bufalo 138A**: el taxi le deja **justo delante del portal**.","de":"Nennen Sie dem Fahrer die Adresse **Via del Bufalo 138A**: Das Taxi setzt Sie **direkt vor der Haustür** ab.","ar":"أعطوا السائق العنوان **Via del Bufalo 138A**: ستوصلكم سيارة الأجرة **أمام الباب مباشرةً**."}}]},{"id":"wifi","icon":"wifi","title":{"en":"Wi-Fi","it":"Wi-Fi","fr":"Wi-Fi","es":"Wi-Fi","de":"WLAN","ar":"الواي فاي"},"blocks":[{"type":"wifi","qr":"<svg width=\"31mm\" height=\"31mm\" version=\"1.1\" viewBox=\"0 0 31 31\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M1,1H2V2H1zM2,1H3V2H2zM3,1H4V2H3zM4,1H5V2H4zM5,1H6V2H5zM6,1H7V2H6zM7,1H8V2H7zM10,1H11V2H10zM12,1H13V2H12zM13,1H14V2H13zM15,1H16V2H15zM18,1H19V2H18zM20,1H21V2H20zM21,1H22V2H21zM23,1H24V2H23zM24,1H25V2H24zM25,1H26V2H25zM26,1H27V2H26zM27,1H28V2H27zM28,1H29V2H28zM29,1H30V2H29zM1,2H2V3H1zM7,2H8V3H7zM9,2H10V3H9zM13,2H14V3H13zM16,2H17V3H16zM18,2H19 ems","items":[{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]}]},{"id":"rules","icon":"rules","title":{"en":"House rules","it":"Regole della casa","fr":"Règlement intérieur","es":"Normas de la casa","de":"Hausregeln","ar":"قواعد المنزل"},"blocks":[{"type":"lead","text":{"en":"The apartment is in a **historic residential building** (palazzo d’epoca) where **families live**. Thank you for respecting the **house rules**.","it":"L’appartamento si trova in un **palazzo d’epoca residenziale**, dove **vivono famiglie**. Grazie per il rispetto delle **regole della casa**.","fr":"L’appartement se trouve dans un **immeuble résidentiel historique** (palazzo d’epoca) où **vivent des familles**. Merci de respecter le **règlement intérieur**.","es":"El apartamento está en un **edificio residencial histórico** (palazzo d’epoca) donde **viven familias**. Gracias por respetar las **normas de la casa**.","de":"Die Wohnung liegt in einem **historischen Wohnhaus** (Palazzo d’epoca), in dem **Familien wohnen**. Danke, dass Sie die **Hausregeln** einhalten.","ar":"تقع الشقة في **مبنى سكني تاريخي** (palazzo d’epoca) **تسكنه عائلات**. نشكركم على احترام **قواعد المنزل**."}},{"type":"rules","items":[{"icon":"column","text":{"en":"This is a **historic residential building**: keep **quiet** in the **common areas**, out of respect for the residents.","it":"È un **palazzo d’epoca residenziale**: mantenete il **silenzio** negli **spazi comuni**, per rispetto dei residenti.","fr":"C’est un **immeuble résidentiel historique** : restez **silencieux** dans les **parties communes**, par respect pour les résidents.","es":"Es un **edificio residencial histórico**: guarde **silencio** en las **zonas comunes**, por respeto a los vecinos.","de":"Dies ist ein **historisches Wohnhaus**: Bitte seien Sie in den **Gemeinschaftsbereichen** **leise** – aus Rücksicht auf die Bewohner.","ar":"هذا **مبنى سكني تاريخي**: التزموا **الهدوء** في **الأماكن المشتركة** احتراماً للسكان."}},{"icon":"nosmoke","text":{"en":"Please **do not smoke** inside the house.","it":"Vi preghiamo di **non fumare** all’interno della casa.","fr":"Merci de **ne pas fumer** à l’intérieur du logement.","es":"Le rogamos que **no fume** dentro de la vivienda.","de":"Bitte **rauchen Sie nicht** in der Wohnung.","ar":"يُرجى **عدم التدخين** داخل المنزل."}},{"icon":"sparkles","text":{"en":"Take care of the house, **keep the common areas clean** and leave things tidy after you use them.","it":"Abbiate cura della casa, **mantenete puliti gli spazi comuni** e lasciate tutto in ordine dopo l’uso.","fr":"Prenez soin du logement, **gardez les parties communes propres** et laissez tout en ordre après utilisation.","es":"Cuide la vivienda, **mantenga limpias las zonas comunes** y deje todo ordenado después de usarlo.","de":"Gehen Sie sorgsam mit der Wohnung um, halten Sie die **Gemeinschaftsbereiche sauber** und hinterlassen Sie alles ordentlich.","ar":"اعتنوا بالمنزل، و**حافظوا على نظافة الأماكن المشتركة**، واتركوا الأشياء مرتبة بعد استخدامها."}},{"icon":"mute","text":{"en":"Respect the peace and privacy of other occupants by **minimizing noise**.","it":"Rispettate la tranquillità e la privacy degli altri residenti **limitando i rumori**.","fr":"Respectez la tranquillité et l’intimité des autres occupants **en limitant le bruit**.","es":"Respete la tranquilidad y la privacidad de los demás ocupantes **reduciendo el ruido**.","de":"Respektieren Sie die Ruhe und Privatsphäre der anderen Bewohner, indem Sie **Lärm vermeiden**.","ar":"احترموا هدوء وخصوصية السكان الآخرين **بالتقليل من الضوضاء**."}},{"icon":"users","text":{"en":"Avoid inviting additional people **without prior authorization**.","it":"Evitate di invitare altre persone **senza previa autorizzazione**.","fr":"Évitez d’inviter d’autres personnes **sans autorisation préalable**.","es":"Evite invitar a otras personas **sin autorización previa**.","de":"Laden Sie keine weiteren Personen **ohne vorherige Genehmigung** ein.","ar":"تجنّبوا دعوة أشخاص إضافيين **دون إذن مسبق**."}},{"icon":"zap","text":{"en":"Follow **safety instructions** and avoid using dangerous or unauthorised electrical equipment.","it":"Seguite le **istruzioni di sicurezza** ed evitate di usare apparecchi elettrici pericolosi o non autorizzati.","fr":"Suivez les **consignes de sécurité** et évitez d’utiliser des appareils électriques dangereux ou non autorisés.","es":"Siga las **instrucciones de seguridad** y evite utilizar aparatos eléctricos peligrosos o no autorizados.","de":"Befolgen Sie die **Sicherheitshinweise** und verwenden Sie keine gefährlichen oder nicht zugelassenen Elektrogeräte.","ar":"اتبعوا **تعليمات السلامة** وتجنّبوا استخدام الأجهزة الكهربائية الخطرة أو غير المصرّح بها."}},{"icon":"alert","text":{"en":"Please report any problems or damage that occur during your stay **as soon as possible**.","it":"Segnalateci **il prima possibile** eventuali problemi o danni che si verifichino durante il soggiorno.","fr":"Signalez-nous **au plus vite** tout problème ou dommage survenu pendant votre séjour.","es":"Comuníquenos **lo antes posible** cualquier problema o daño que se produzca durante su estancia.","de":"Bitte melden Sie uns Probleme oder Schäden während Ihres Aufenthalts **so schnell wie möglich**.","ar":"يُرجى إبلاغنا **في أقرب وقت ممكن** بأي مشكلة أو ضرر يحدث خلال إقامتكم."}}]},{"type":"closing","text":{"en":"Thank you","it":"Grazie","fr":"Merci","es":"Gracias","de":"Danke","ar":"شكراً لكم"}}]},{"id":"transport","icon":"metro","title":{"en":"Transport","it":"Trasporti","fr":"Transports","es":"Transporte","de":"Verkehrsmittel","ar":"المو fè","fr":"Machine à café","es":"Cafetera","de":"Kaffeemaschine","ar":"آلة القهوة"},"note":"Nespresso"}]}]},{"id":"activities","icon":"colosseum","title":{"en":"Activities","it":"Attività","fr":"Activités","es":"Actividades","de":"Aktivitäten","ar":"الأنشطة"},"blocks":[{"type":"features","items":[{"icon":"coin","title":{"en":"Trevi Fountain","it":"Fontana di Trevi","fr":"Fontaine de Trevi","es":"Fontana de Trevi","de":"Trevi-Brunnen","ar":"نافورة تريفي"},"text":{"en":"Just a **4-minute walk** away, discover the famous Baroque fountain where it is traditional to **throw a coin** to ensure your return to Rome.","it":"A soli **4 minuti a piedi**, scoprite la celebre fontana barocca dove è tradizione **lanciare una moneta** per assicurarsi di tornare a Roma.","fr":"À seulement **4 minutes à pied**, découvrez la célèbre fontaine baroque où la tradition veut que l’on **lance une pièce** pour être sûr de revenir à Rome.","es":"A solo **4 minutos a pie**, descubra la famosa fuente barroca donde es tradición **lanzar una moneda** para asegurarse de volver a Roma.","de":"Nur **4 Gehminuten** entfernt: der berühmte Barockbrunnen, in den man traditionell **eine Münze wirft**, um sicher nach Rom zurückzukehren.","ar":"على بُعد **4 دقائق سيراً** فقط، اكتشفوا النافورة الباروكية الشهيرة حيث جرت العادة أن **ترموا قطعة نقدية** لتضمنوا العودة إلى روما."},"maps":"Fontana di Trevi, Roma","photo":{"src":"img/trevi-fountain","own":true,"pos":"50% 40%"}},{"icon":"arch","title":{"en":"Piazza di Spagna and Trinità dei Monti","it":"Piazza di Spagna e Trinità dei Monti","fr":"Place d’Espagne et Trinité-des-Monts","es":"Plaza de España y Trinità dei Monti","de":"Spanische Treppe und Trinità dei Monti","ar":"ساحة إسبانيا وكنيسة ترينيتا دي مونتي"},"text":{"en":"Discover one of Rome’s most iconic landmarks, just **5 minutes’ walk** from the house. Monumental staircases, the **Barcaccia fountain** and luxury boutiques line this elegant square.","it":"Scoprite uno dei luoghi più iconici di Roma, a soli **5 minuti a piedi** da casa. Scalinata monumentale, **Fontana della Barcaccia** e boutique di lusso animano questa elegante piazza.","fr":"Découvrez l’un des lieux les plus emblématiques de Rome, à seulement **5 minutes à pied** de la maison. L’église de la Trinité-des-Monts, la **fontaine de la Barcaccia** et les boutiques de luxe entourent cette élégante place.","es":"Descubra uno de los lugares más emblemáticos de Roma, a solo **5 minutos a pie** de casa. La escalinata monumental, la **Fuente de la Barcaccia** y tiendas de lujo rodean esta elegante plaza.","de":"Entdecken Sie eines der berühmtesten Wahrzeichen Roms, nur **5 Gehminuten** von der Wohnung entfernt. Die monumentale Treppe, der **Barcaccia-Brunnen** und Luxusboutiquen prägen diesen eleganten Platz.","ar":"اكتشفوا أحد أشهر معالم روما، على بُعد **5 دقائق سيراً** فقط من المنزل. الدرج الضخم و**نافورة باركاتشا** والمتاجر الفاخرة تزيّن هذه الساحة الأنيقة."},"maps":"Piazza di Spagna, Roma","photo":{"src":"img/piazza-di-spagna","own":true,"pos":"50% 0%"}},{"icon":"dome","title":{"en":"Pantheon","it":"Pantheon","fr":"Panthéon","es":"Panteón","de":"Pantheon","ar":"البانثيون"},"text":{"en":"About **11 minutes** on foot: the best-preserved temple of ancient Rome, with its huge **open dome** (the oculus) and Raphael’s tomb.","it":"A circa **11 minuti** a piedi: il tempio meglio conservato della Roma antica, con la sua immensa **cupola aperta** (l’oculo) e la tomba di Raffaello.","fr":"À environ **11 minutes** à pied : le temple le mieux conservé de la Rome antique, avec son immense **coupole ouverte** (l’oculus) et le tombeau de Raphaël.","es":"A unos **11 minutos** a pie: el templo mejor conservado de la Roma antigua, con su enorme **cúpula abierta** (el óculo) y la tumba de Rafael.","de":"Etwa **11 Minuten** zu Fuß: der am besten erhaltene Tempel des antiken Rom mit seiner riesigen **offenen Kuppel** (dem Oculus) und dem Grab Raffaels.","ar":"على بُعد **11 دقيقة** تقريباً سيراً: أفضل معابد روما القديمة حفظاً، بـ**قبّته المفتوحة** الضخمة (الأوكولوس) وقبر رافائيل."},"maps":"Pantheon, Roma","photo":{"src":"rome/pantheon","place":"Pantheon","area":false,"credit":{"title":"Pantheon Rom 1 cropped.jpg","author":"Rabax63","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","source":"https://commons.wikimedia.org/wiki/File:Pantheon_Rom_1_cropped.jpg"}}},{"icon":"column","title":{"en":"Piazza del Quirinale","it":"Piazza del Quirinale","fr":"Place du Quirinal","es":"Plaza del Quirinal","de":"Quirinalsplatz","ar":"ساحة الكويريناله"},"text":{"en":"About **10 minutes** on foot, uphill: the square of the **President’s palace**, with the obelisk, the **Dioscuri statues** and a wonderful **view over the rooftops** of Rome.","it":"A circa **10 minuti** a piedi, in salita: la piazza del **Palazzo del Presidente della Repubblica**, con l’obelisco, le **statue dei Dioscuri** e una splendida **vista sui tetti** di Roma.","fr":"À environ **10 minutes** à pied, en montée : la place du **palais présidentiel**, avec l’obélisque, les **statues des Dioscures** et une superbe **vue sur les toits** de Rome.","es":"A unos **10 minutos** a pie, cuesta arriba: la plaza del **Palacio Presidencial**, con el obelisco, las **estatuas de los Dioscuros** y una preciosa **vista sobre los tejados** de Roma.","de":"Etwa **10 Minuten** zu Fuß, bergauf: der Platz vor dem **Präsidentenpalast** mit Obelisk, den **Dioskuren-Statuen** und einem herrlichen **Blick über die Dächer** Roms.","ar":"على بُعد **10 دقائق** تقريباً سيراً صعوداً: ساحة **قصر رئيس الجمهورية**، مع المسلّة و**تمثالي ديوسكوري** و**إطلالة رائعة على أسطح** روما."},"maps":"Piazza del Quirinale, Roma","photo":{"src":"rome/quirinale","place":"Piazza del Quirinale","area":false,"credit":{"title":"Roma - Piazza del Quirinale (41068410090).jpg","author":"Fred Romero from Paris, France","license":"CC BY 2.0","licenseUrl":"https://creativecommons.org/licenses/by/2.0","source":"https://commons.wikimedia.org/wiki/File:Roma_-_Piazza_del_Quirinale_(41068410090).jpg"}}},{"icon":"laurel","title":{"en":"Piazza Barberini","it":"Piazza Barberini","fr":"Place Barberini","es":"Plaza Barberini","de":"Piazza Barberini","ar":"ساحة باربيريني"},"text":{"en":"About **9 minutes** on foot along Via del Tritone: Bernini’s **Triton Fountain**, the start of **Via Veneto** and the **Palazzo Barberini** art gallery nearby.","it":"A circa **9 minuti** a piedi lungo Via del Tritone: la **Fontana del Tritone** del Bernini, l’inizio di **Via Veneto** e, poco distante, la galleria di **Palazzo Barberini**.","fr":"À environ **9 minutes** à pied par la Via del Tritone : la **fontaine du Triton** du Bernin, le début de la **Via Veneto** et, tout près, le musée du **Palazzo Barberini**.","es":"A unos **9 minutos** a pie por Via del Tritone: la **Fuente del Tritón** de Bernini, el inicio de **Via Veneto** y, muy cerca, la galería del **Palazzo Barberini**.","de":"Etwa **9 Minuten** zu Fuß über die Via del Tritone: Berninis **Tritonenbrunnen**, der Beginn der **Via Veneto** und ganz in der Nähe die Galerie im **Palazzo Barberini**.","ar":"على بُعد **9 دقائق** تقريباً سيراً عبر Via del Tritone: **نافورة تريتون** لبرنيني، وبداية **فيا فينيتو**، وعلى مقربة منها متحف **قصر باربيريني**."},"maps":"Piazza Barberini, Roma","photo":{"src":"rome/piazza-barberini","place":"Piazza Barberini","area":false,"credit":{"title":"Fontana del Tritone(Triton Fountain), Rome, Italy (Ank Kumar, Infosys Limited) 05.jpg","author":"Ank Kumar","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","source":"https://commons.wikimedia.org/wiki/File:Fontana_del_Tritone(Triton_Fountain),_Rome,_Italy_(Ank_Kumar,_Infosys_Limited)_05.jpg"}}},{"icon":"handbag","title":{"en":"Via del Corso shopping","it":"Shopping in Via del Corso","fr":"Shopping Via del Corso","es":"Compras en Via del Corso","de":"Shopping in der Via del Corso","ar":"التسوّق في فيا ديل كورسو"},"text":{"en":"Only **5 minutes** on foot: Rome’s main **shopp تسجيل المغادرة"},"blocks":[{"type":"time","value":"10:00","label":{"en":"Check-out","it":"Check-out","fr":"Départ","es":"Check-out","de":"Check-out","ar":"تسجيل المغادرة"}},{"type":"text","text":{"en":"If you wish to **depart later**, please contact us and we will check availability and confirm according to our schedule. You may also leave your luggage with us **until 1:00 PM**, provided it is properly closed.","it":"Se desiderate **partire più tardi**, contattateci: verificheremo la disponibilità e ve la confermeremo in base alla nostra programmazione. Potete anche lasciare i bagagli da noi **fino alle 13:00**, purché ben chiusi.","fr":"Si vous souhaitez **partir plus tard**, contactez-nous : nous vérifierons la disponibilité et vous confirmerons selon notre planning. Vous pouvez également nous laisser vos bagages **jusqu’à 13h00**, à condition qu’ils soient bien fermés.","es":"Si desea **salir más tarde**, contáctenos y comprobaremos la disponibilidad y se la confirmaremos según nuestra programación. También puede dejarnos su equipaje **hasta las 13:00**, siempre que esté bien cerrado.","de":"Wenn Sie **später abreisen** möchten, kontaktieren Sie uns bitte – wir prüfen die Verfügbarkeit und bestätigen sie entsprechend unserem Zeitplan. Sie können Ihr Gepäck auch **bis 13:00 Uhr** bei uns lassen, sofern es gut verschlossen ist.","ar":"إذا رغبتم في **المغادرة في وقت لاحق**، يُرجى التواصل معنا وسنتحقق من التوفر ونؤكد لكم ذلك حسب جدولنا. يمكنكم أيضاً ترك أمتعتكم لدينا **حتى الساعة 13:00**، بشرط أن تكون مغلقة بإحكام."}},{"type":"checklist","title":{"en":"Before leaving – in this order","it":"Prima di partire – in quest’ordine","fr":"Avant de partir – dans cet ordre","es":"Antes de salir – en este orden","de":"Vor der Abreise – in dieser Reihenfolge","ar":"قبل المغادرة – بهذا الترتيب"},"items":[{"icon":"clock","title":{"en":"Leave by 10:00","it":"Uscite entro le 10:00","fr":"Départ avant 10h00","es":"Salida antes de las 10:00","de":"Abreise bis 10:00 Uhr","ar":"المغادرة قبل 10:00"},"text":{"en":"Check-out is by **10:00**. Make sure you **haven’t forgotten anything**.","it":"Il check-out è entro le **10:00**. Controllate di **non aver dimenticato nulla**.","fr":"Le départ se fait avant **10h00**. Vérifiez que vous **n’avez rien oublié**.","es":"El check-out es antes de las **10:00**. Compruebe que **no ha olvidado nada**.","de":"Check-out ist bis **10:00 Uhr**. Prüfen Sie, dass Sie **nichts vergessen** haben.","ar":"موعد المغادرة قبل **10:00**. تأكّدوا من أنكم **لم تنسوا شيئاً**."}},{"icon":"power","title":{"en":"Lights and devices off","it":"Luci e apparecchi spenti","fr":"Lumières et appareils éteints","es":"Luces y aparatos apagados","de":"Licht und Geräte aus","ar":"إطفاء الأضواء والأجهزة"},"text":{"en":"**Turn off** all lights and electrical devices.","it":"**Spegnete** tutte le luci e gli apparecchi elettrici.","fr":"**Éteignez** toutes les lumières et les appareils électriques.","es":"**Apague** todas las luces y los aparatos eléctricos.","de":"**Schalten Sie** alle Lichter und Elektrogeräte **aus**.","ar":"**أطفئوا** جميع الأضواء والأجهزة الكهربائية."}},{"icon":"house","title":{"en":"Windows closed","it":"Finestre chiuse","fr":"Fenêtres fermées","es":"Ventanas cerradas","de":"Fenster geschlossen","ar":"النوافذ مغلقة"},"text":{"en":"**Close all the windows.**","it":"**Chiudete tutte le finestre.**","fr":"**Fermez toutes les fenêtres.**","es":"**Cierre todas las ventanas.**","de":"**Schließen Sie alle Fenster.**","ar":"**أغلقوا جميع النوافذ.**"}},{"icon":"euro","title":{"en":"Tourist tax","it":"Tassa di soggiorno","fr":"Taxe de séjour","es":"Tasa turística","de":"Kurtaxe","ar":"ضريبة السياحة"},"text":{"en":"Leave it **in cash on the table** (€6 per person per night).","it":"Lasciatela **in contanti sul tavolo** (6 € a persona a notte).","fr":"Laissez-la **en espèces sur la table** (6 € par personne et par nuit).","es":"Déjela **en efectivo sobre la mesa** (6 € por persona y noche).","de":"Lassen Sie sie **in bar auf dem Tisch** (6 € pro Person und Nacht).","ar":"اتركوها **نقدًا على الطاولة** (6 يورو للشخص في الليلة)."}},{"icon":"door","title":{"en":"Close the door","it":"Chiudete la porta","fr":"Fermez la porte","es":"Cierre la puerta","de":"Tür schließen","ar":"أغلقوا الباب"},"text":{"en":"Go out and **close the apartment door**.","it":"Uscite e **chiudete la porta di casa**.","fr":"Sortez et **fermez la porte de l’appartement**.","es":"Salga y **cierre la puerta del apartamento**.","de":"Gehen Sie hinaus und **schließen Sie die Wohnungstür**.","ar":"اخرجوا و**أغلقوا باب الشقة**."}},{"icon":"key","title":{"en":"Keys in the lockbox","it":"Chiavi nella cassetta","fr":"Clés dans la boîte","es":"Llaves en la caja","de":"Schlüssel in den Safe","ar":"المفاتيح في الصندوق"},"text":{"en":"Put the keys back in the **lockbox on the door** and close it.","it":"Rimettete le chiavi nella **cassetta sulla porta** e chiudetela.","fr":"Remettez les clés dans la **boîte à clés sur la porte** et refermez-la.","es":"Vuelva a dejar las llaves en la **caja de la puerta** y ciérrela.","de":"Legen Sie die Schlüssel zurück in den **Schlüsselsafe an der Tür** und schließen Sie ihn.","ar":"أعيدوا المفاتيح إلى **الصندوق الموجود على الباب** وأغلقوه."}},{"icon":"rotate","title":{"en":"Scramble the code","it":"Mescolate il codice","fr":"Brouillez le code","es":"Mezcle el código","de":"Code verstellen","ar":"غيّروا أرقام الرمز"},"text":{"en":"**Scramble the code** on the lockbox, **otherwise it stays open**.","it":"**Mescolate le cifre** della cassetta, **altrimenti resta aperta**.","fr":"**Brouillez les chiffres** de la boîte, **sinon elle reste ouverte**.","es":"**Mezcle los dígitos** de la caja; **de lo contrario, se queda abierta**.","de":"**Verstellen Sie die Ziffern** am Safe, **sonst bleibt er offen**.","ar":"**غيّروا أرقام** الصندوق، **وإلا سيبقى مفتوحاً**."}}]},{"type":"notice","tone":"important","icon":"key","title":{"en":"Important","it":"Importante","fr":"Important","es":"Importante","de":"Wichtig","ar":"مهم"},"text":{"en":"After putting the keys in the lockbox, always **scramble the code**: otherwise the box **stays open**.","it":"Dopo aver messo le chiavi nella cassetta, **mescolate sempre il codice**: altrimenti la cassetta **resta aperta**.","fr":"Après avoir remis les clés dans la boîte, **brouillez toujours le code** : sinon la boîte **reste ouverte**.","es":"Después de dejar las llaves en la caja, **mezcle siempre el código**: de lo contrario, la caja **se queda abierta**.","de":"Nachdem Sie die Schlüssel in den Safe gelegt haben, **verstellen Sie immer den Code**: sonst **bleibt der Safe offen**.","ar":"بعد وضع المفاتيح في الصندوق، **غيّروا أرقام الرمز دائماً**: وإلا **سيبقى الصندوق مفتوحاً**."}},{"type":"closing","text":{"en":"Thank you!","it":"Grazie!","fr":"Merci !","es":"¡Gracias!","de":"Vielen Dank!","ar":"شكراً لكم!"}}]},{"id":"contact","icon":"phone","title":{"en":"Contact","it":"Contatti","fr":"Contact","es":"Contacto","de":"Kontakt","ar":"التواصل"},"blocks":[{"type":"host","text":{"en":"Dear travelers, I am here to assist you whenever you need. If you encounter any issues or have any questions, please do not hesitate to contact me **by phone or email**. I am **always available** to help make your stay as pleasant and stress-free as possible.","it":"Cari viaggiatori, sono qui per assistervi ogni volta che ne avrete bisogno. Se incontrate qualche problema o avete domande, non esitate a contattarmi **per telefono o via email**. Sono **sempre disponibile** per rendere il vostro soggiorno il più piacevole e sereno possibile.","fr":"Chers voyageurs, je suis là pour vous aider à tout moment. Si vous rencontrez un problème ou avez des questions, n’hésitez pas à me contacter **par téléphone ou par e-mail**. Je suis **toujours disponible** pour rendre votre séjour aussi agréable et serein que possible.","es":"Queridos viajeros, estoy aquí para ayudarles siempre que lo necesiten. Si tienen algún problema o alguna pregunta, no duden en contactarme **por teléfono o por correo electrónico**. **Siempre estoy disponible** para que su estancia sea lo más agradable y tranquila posible.","de":"Liebe Reisende, ich bin jederzeit für Sie da. Wenn Probleme auftreten oder Sie Fragen haben, zögern Sie nicht, mich **telefonisch oder per E-Mail** zu kontaktieren. Ich helfe Ihnen **immer gern**, Ihren Aufenthalt so angenehm und entspannt wie möglich zu gestalten.","ar":"أعزاءنا المسافرين، أنا هنا لمساعدتكم متى احتجتم إلى ذلك. إذا واجهتم أي مشكلة أو كان لديكم أي سؤال، فلا تترددوا في التواصل معي **عبر الهاتف أو البريد الإلكتروني**. أنا **متاح دائماً** لأجعل إقامتكم ممتعة ومريحة قدر الإمكان."}},{"type":"review","text":{"en":"We hope you had a pleasant stay in our home. If you could take a moment to share your feedback and leave us a **5-star review**, it would be greatly appreciated.","it":"Speriamo che abbiate trascorso un piacevole soggiorno nella nostra casa. Se poteste dedicarci un momento per condividere la vostra opinione e lasciarci una **recensione a 5 stelle**, ve ne saremmo davvero grati.","fr":"Nous espérons que vous avez passé un agréable séjour chez nous. Si vous pouviez prendre un instant pour partager votre avis et nous laisser un **commentaire 5 étoiles**, nous vous en serions très reconnaissants.","es":"Esperamos que haya disfrutado de una agradable estancia en nuestra casa. Si pudiera dedicar un momento a compartir su opinión y dejarnos una **reseña de 5 estrellas**, se lo agradeceríamos muchísimo.","de":"Wir hoffen, Sie hatten einen angenehmen Aufenthalt bei uns. Wenn Sie sich einen Moment Zeit nehmen könnten, um Ihre Eindrücke zu teilen und uns eine **5-Sterne-Bewertung** zu hinterlassen, würden wir uns sehr freuen.","ar":"نأمل أن تكونوا قد استمتعتم بإقامة طيبة في منزلنا. إذا تمكنتم من تخصيص لحظة لمشاركة رأيكم وترك **تقييم من 5 نجوم** لنا، فسنكون ممتنين جداً."}}]}],"arrival":{"steps":[{"en":"At **Via del Bufalo 138A**, type **21219** then press **#** on the **street door keypad**: the **portone** opens.","it":"Arrivati i
