* – dans le quartier animé de **Ponte Milvio** : l’antique **pont** sur le Tibre est à **13 minutes** à pied. Il dispose de **2 chambres doubles**, d’un **séjour** avec **canapé-lit**, d’un **coin repas** avec **cuisine** et de **2 salles de bain**.","es":"**Ponte Milvio** es un luminoso apartamento recién reformado para un máximo de **5 huéspedes** en **Via Alberico Albricci 12** – **planta baja elevada, puerta de la DERECHA** – en el animado barrio de **Ponte Milvio**: el antiguo **puente** sobre el Tíber está a **13 minutos** a pie. Tiene **2 dormitorios dobles**, un **salón** con **sofá cama**, un **comedor** con **cocina** y **2 baños**.","de":"**Ponte Milvio** ist eine helle, frisch renovierte Wohnung für bis zu **5 Gäste** in der **Via Alberico Albricci 12** – **Hochparterre, Tür RECHTS** – im lebhaften Viertel **Ponte Milvio**: Die antike **Brücke** über den Tiber ist **13 Gehminuten** entfernt. Sie hat **2 Doppelzimmer**, ein **Wohnzimmer** mit **Schlafsofa**, einen **Essbereich** mit **Küche** und **2 Bäder**.","ar":"**Ponte Milvio** شقة مضيئة مجدّدة حديثاً تتسع لما يصل إلى **5 ضيوف** في **Via Alberico Albricci 12** – **الطابق الأرضي المرتفع، الباب على اليمين** – في حي **بونتي ميلفيو** النابض بالحياة: يبعد **الجسر** الأثري على نهر التيبر **13 دقيقة** سيراً. تضم **غرفتي نوم مزدوجتين**، و**غرفة معيشة** مع **أريكة سرير**، و**منطقة طعام** مع **مطبخ** و**حمّامين**."}},{"type":"photo","src":"img/living","alt":{"en":"The living room","it":"Il soggiorno","fr":"Le séjour","es":"El salón","de":"Das Wohnzimmer","ar":"غرفة المعيشة"}},{"type":"text","text":{"en":"We wish you an **excellent stay** in our beautiful city and hope to **see you again soon**!","it":"Vi auguriamo un **ottimo soggiorno** nella nostra splendida città e speriamo di **rivedervi presto**!","fr":"Nous vous souhaitons un **excellent séjour** dans notre belle ville et espérons **vous revoir très bientôt** !","es":"¡Le deseamos una **excelente estancia** en nuestra hermosa ciudad y esperamos **volver a verle pronto**!","de":"Wir wünschen Ihnen einen **wunderbaren Aufenthalt** in unserer schönen Stadt und hoffen, Sie **bald wiederzusehen**!","ar":"نتمنى لكم **إقامة ممتعة** في مدينتنا الجميلة، ونأمل أن **نراكم مجدداً قريباً**!"}},{"type":"signature","text":"Rome Dream Home"}]},{"id":"checkin","icon":"key","title":{"en":"Check-in","it":"Check-in","fr":"Arrivée","es":"Check-in","de":"Check-in","ar":"تسجيل الوصول"},"blocks":[{"type":"time","value":"15:00","label":{"en":"Self check-in","it":"Self check-in","fr":"Self check-in","es":"Self check-in","de":"Self-Check-in","ar":"تسجيل الوصول الذاتي"}},{"type":"text","text":{"en":"**Self check-in**: ring the **first bell** or **message us** – we open the street door **remotely**. The **keys** are in the **lockbox on your door**, code **2193**.","it":"**Self check-in**: suonate il **primo campanello** o **scriveteci** – vi apriamo il portone **a distanza**. Le **chiavi** sono nella **cassetta sulla vostra porta**, codice **2193**.","fr":"**Self check-in** : sonnez au **premier bouton** ou **écrivez-nous** – nous ouvrons la porte **à distance**. Les **clés** sont dans la **boîte sur votre porte**, code **2193**.","es":"**Self check-in**: toque el **primer timbre** o **escríbanos** – le abrimos el portal **a distancia**. Las **llaves** están en la **caja de su puerta**, código **2193**.","de":"**Self-Check-in**: Klingeln Sie an der **ersten Klingel** oder **schreiben Sie uns** – wir öffnen die Haustür **aus der Ferne**. Die **Schlüssel** liegen im **Safe an Ihrer Tür**, Code **2193**.","ar":"**تسجيل وصول ذاتي**: اضغطوا **الجرس الأول** أو **راسلونا** – نفتح باب المبنى **عن بُعد**. **المفاتيح** في **الصندوق على بابكم**، الرمز **2193**."}},{"type":"text","text":{"en":"Please respect the check-in times. If you would like to arrive earlier, no problem at all: you can **drop off your luggage from 11:00** and take the keys, then **come back at 15:00** when the apartment will be ready.","it":"Vi preghiamo di rispettare gli orari di check-in. Se desiderate arrivare prima, nessun problema: potete **lasciare i bagagli a partire dalle 11:00** e ritirare le chiavi, per poi **tornare alle 15:00**, quando l’appartamento sarà pronto.","fr":"Merci de respecter les horaires d’arrivée. Si vous souhaitez arriver plus tôt, aucun problème : vous pouvez **déposer vos bagages à partir de 11h00** et récupérer les clés, puis **revenir à 15h00**, lorsque l’appartement sera prêt.","es":"Le rogamos que respete los horarios de check-in. Si desea llegar antes, no hay ningún problema: puede **dejar su equipaje a partir de las 11:00** y recoger las llaves, y luego **volver a las 15:00**, cuando el apartamento esté listo.","de":"Bitte halten Sie die Check-in-Zeiten ein. Wenn Sie früher ankommen möchten, ist das kein Problem: Sie können Ihr **Gepäck ab 11:00 Uhr abstellen** und die Schlüssel abholen und dann **um 15:00 Uhr zurückkommen**, wenn die Wohnung bereit ist.","ar":"يُرجى الالتزام بمواعيد تسجيل الوصول. إذا رغبتم في الوصول مبكراً فلا مشكلة إطلاقاً: يمكنكم **ترك أمتعتكم ابتداءً من الساعة 11:00** واستلام المفاتيح، ثم **العودة في الساعة 15:00** عندما تكون الشقة جاهزة."}},{"type":"heading","text":{"en":"House access","it":"Accesso alla casa","fr":"Accès au logement","es":"Acceso a la vivienda","de":"Zugang zur Wohnung","ar":"الدخول إلى المنزل"}},{"type":"steps","items":[{"text":{"en":"Arrive at **Via Alberico Albricci 12**. On the **intercom**, ring the **FIRST bell** (top left) or **message us**: we **open the street door for you remotely**.","it":"Arrivate in **Via Alberico Albricci 12**. Al **citofono** suonate il **PRIMO campanello** (in alto a sinistra) oppure **scriveteci**: vi **apriamo il portone a distanza**.","fr":"Arrivez au **Via Alberico Albricci 12**. À l’**interphone**, sonnez au **PREMIER bouton** (en haut à gauche) ou **écrivez-nous** : nous vous **ouvrons la porte à distance**.","es":"Llegue a **Via Alberico Albricci 12**. En el **portero automático**, toque el **PRIMER timbre** (arriba a la izquierda) o **escríbanos**: le **abrimos el portal a distancia**.","de":"Kommen Sie zur **Via Alberico Albricci 12**. Klingeln Sie an der **Sprechanlage** an der **ERSTEN Klingel** (oben links) oder **schreiben Sie uns**: Wir **öffnen Ihnen die Haustür aus der Ferne**.","ar":"عند الوصول إلى **Via Alberico Albricci 12**: على **الإنترفون** اضغطوا **الجرس الأول** (أعلى اليسار) أو **راسلونا**: **نفتح لكم باب المبنى عن بُعد**."},"photos":[{"src":"img/step-entrance","alt":{"en":"The building at Via Alberico Albricci 12","it":"Il palazzo di Via Alberico Albricci 12","fr":"L’immeuble, Via Alberico Albricci 12","es":"El edificio de Via Alberico Albricci 12","de":"Das Haus Via Alberico Albricci 12","ar":"المبنى في Via Alberico Albricci 12"}},{"src":"img/step-intercom","alt":{"en":"The intercom: ring the FIRST bell (circled)","it":"Il citofono: suonate il PRIMO campanello (cerchiato)","fr":"L’interphone : sonnez au PREMIER bouton (entouré)","es":"El portero: toque el PRIMER timbre (marcado)","de":"Die Sprechanlage: ERSTE Klingel (markiert)","ar":"الإنترفون: الجرس الأول (المحدد بدائرة)"}}]},{"text":{"en":"Cross the **entrance hall**: the apartment is on the **raised ground floor**, the **door on the RIGHT**.","it":"Attraversate l’**androne**: l’appartamento è al **piano rialzato**, la **porta a DESTRA**.","fr":"Traversez le **hall** : l’appartement est au **rez-de-chaussée surélevé**, la **porte de DROITE**.","es":"Cruce el **vestíbulo**: el apartamento está en la **planta baja elevada**, la **puerta de la DERECHA**.","de":"Durchqueren Sie die **Eingangshalle**: Die Wohnung liegt im **Hochparterre**, die **Tür RECHTS**.","ar":"اعبروا **المدخل**: الشقة في **الطابق الأرضي المرتفع**، **الباب على اليمين**."},"photos":[{"src":"img/step-hall","alt":{"en":"The entrance hall","it":"L’androne","fr":"Le hall d’entrée","es":"El vestíbulo","de":"Die Eingangshalle","ar":"المدخل"}}]},{"text":{"en":"Your door is the one with the **lockbox on it**: enter the code **2193** and take the **keys**. Then **turn the digits to a random number**, so the code stays secret.","it":"La vostra porta è quella con la **cassetta delle chiavi**: inserite il codice **2193** e prendete le **chiavi**. Poi **girate le cifre su un numero a caso**, così il codice resta segreto.","fr":"Votre porte est celle avec la **boîte à clés** : saisissez le code **2193** et prenez les **clés**. Puis **tournez les chiffres sur un nombre au hasard**, pour que le code reste secret.","es":"Su puerta es la que tiene la **caja de llaves**: introduzca el código **2193** y coja las **llaves**. Después **gire las cifras a un número cualquiera**, para que el código siga siendo secreto.","de":"Ihre Tür ist die mit dem **Schlüsselsafe**: Geben Sie den Code **2193** ein und nehmen Sie die **Schlüssel**. Drehen Sie danach die **Ziffern auf eine beliebige Zahl**, damit der Code geheim bleibt.","ar":"بابكم هو الباب الذي عليه **صندوق المفاتيح**: أدخلوا الرمز **2193** وخذوا **المفاتيح**. ثم **أديروا الأرقام إلى رقم عشوائي** ليبقى الرمز سرياً."},"photos":[{"src":"img/step-door-pdf","alt":{"en":"Your door, with the lockbox: raised ground floor, door on the RIGHT","it":"La vostra porta, con la cassetta: piano rialzato, porta a DESTRA","fr":"Votre porte, avec la boîte à clés : rez-de-chaussée surélevé, porte de DROITE","es":"Su puerta, con la caja: planta baja elevada, puerta de la DERECHA","de":"Ihre Tür mit dem Schlüsselsafe: Hochparterre, Tür RECHTS","ar":"بابكم مع صندوق المفاتيح: الطابق الأرضي المرتفع، الباب على اليمين"}}]},{"text":{"en":"Open the door, go in and **close it** behind you. **Welcome!**","it":"Aprite la porta, entrate e **chiudetela** alle vostre spalle. **Benvenuti!**","fr":"Ouvrez la porte, entrez et **refermez-la** derrière vous. **Bienvenue !**","es":"Abra la puerta, entre y **ciérrela** al pasar. **¡Bienvenidos!**","de":"Öffnen Sie die Tür, treten Sie ein und **schließen Sie sie** hinter sich. **Willkommen!**","ar":"افتحوا الباب وادخلوا و**أغلقوه** خلفكم. **أهلاً وسهلاً!**"},"photos":[{"src":"img/step-door","alt":{"en":"The apartment entrance","it":"L’ingresso dell’appartamento","fr":"L’entrée de l’appartement","es":"La entrada del apartamento","de":"Der Eingang der Wohnung","ar":"مدخل الشقة"}}]}]},{"type":"arrival"},{"type":"code","label":{"en":"Key box code · raised ground floor, door on the RIGHT","it":"Codice cassetta · piano rialzato, porta a DESTRA","fr":"Code de la boîte à clés · rez-de-chaussée surélevé, porte de DROITE","es":"Código de la caja · planta baja elevada, puerta de la DERECHA","de":"Schlüsselsafe-Code · Hochparterre, Tür RECHTS","ar":"رمز صندوق المفاتيح · الطابق الأرضي المرتفع، الباب على اليمين"},"value":"2193","icon":"lock"},{"type":"tax","text":{"en":"Rome **tourist tax**: **€6 per person per night**. Leave it **in cash on the table** before you leave. Please make sure you have already sent us a **photo of your passport** for the registration of your stay.","it":"**Tassa di soggiorno** di Roma: **6 € a persona a notte**. Lasciatela **in contanti sul tavolo** prima di partire. Assicuratevi di averci già inviato la **foto del passaporto** per la registrazione del soggiorno.","fr":"**Taxe de séjour** de Rome : **6 € par personne et par nuit**. Laissez-la **en espèces sur la table** avant de partir. Assurez-vous de nous avoir déjà envoyé la **photo de votre passeport** pour l’enregistrement de votre séjour.","es":"**Tasa turística** de Roma: **6 € por persona y noche**. Déjela **en efectivo sobre la mesa** antes de irse. Asegúrese de habernos enviado ya la **foto de su pasaporte** para el registro de su estancia.","de":"Römische **Kurtaxe**: **6 € pro Person und Nacht**. Lassen Sie sie vor der Abreise **in bar auf dem Tisch**. Bitte stellen Sie sicher, dass Sie uns bereits ein **Foto Ihres Reisepasses** für die Anmeldung Ihres Aufenthalts geschickt haben.","ar":"**ضريبة السياحة** في روما: **6 يورو للشخص في الليلة**. اتركوها **نقداً على الطاولة** قبل المغادرة. يُرجى التأكد من أنكم أرسلتم إلينا **صورة جواز السفر** لتسجيل إقامتكم."}},{"type":"problems","items":[{"icon":"door","q":{"en":"The street door doesn’t open?","it":"Il portone non si apre?","fr":"La porte de l’immeuble ne s’ouvre pas ?","es":"¿El portal no se abre?","de":"Die Haustür geht nicht auf?","ar":"باب المبنى لا يُفتح؟"},"a":{"en":"Ring the **FIRST bell** again or **message us / call us**: we open it **remotely**.","it":"Suonate di nuovo il **PRIMO campanello** oppure **scriveteci / chiamateci**: lo apriamo **a distanza**.","fr":"Sonnez à nouveau au **PREMIER bouton** ou **écrivez-nous / appelez-nous** : nous l’ouvrons **à distance**.","es":"Toque de nuevo el **PRIMER timbre** o **escríbanos / llámenos**: lo abrimos **a distancia**.","de":"Klingeln Sie erneut an der **ERSTEN Klingel** oder **schreiben Sie uns / rufen Sie an**: Wir öffnen **aus der Ferne**.","ar":"اضغطوا **الجرس الأول** مرة أخرى أو **راسلونا / اتصلوا بنا**: نفتحه **عن بُعد**."}},{"icon":"lock","q":{"en":"The lockbox won’t open?","it":"La cassetta non si apre?","fr":"La boîte à clés ne s’ouvre pas ?","es":"¿La caja de llaves no se abre?","de":"Der Schlüsselsafe geht nicht auf?","ar":"صندوق المفاتيح لا يُفتح؟"},"a":{"en":"The box is **on your door**: **raised ground floor, door on the RIGHT**. Check that **every digit** is on **2193** and try again. Still closed? **Call us**.","it":"La cassetta è **sulla vostra porta**: **piano rialzato, porta a DESTRA**. Controllate che **ogni cifra** sia su **2193** e riprovate. Ancora chiusa? **Chiamateci**.","fr":"La boîte est **sur votre porte** : **rez-de-chaussée surélevé, porte de DROITE**. Vérifiez que **chaque chiffre** est sur **2193** et réessayez. Toujours fermée ? **Appelez-nous**.","es":"La caja está **en su puerta**: **planta baja elevada, puerta de la DERECHA**. Compruebe que **cada cifra** esté en **2193** y vuelva a intentarlo. ¿Sigue cerrada? **Llámenos**.","de":"Der Safe ist **an Ihrer Tür**: **Hochparterre, Tür RECHTS**. Prüfen Sie, ob **jede Ziffer** auf **2193** steht, und versuchen Sie es erneut. Immer noch zu? **Rufen Sie uns an**.","ar":"الصندوق **على بابكم**: **الطابق الأرضي المرتفع، الباب على اليمين**. تأكدوا من أن **كل رقم** على **2193** وأعيدوا المحاولة. ما زال مغلقاً؟ **اتصلوا بنا**."}},{"icon":"clock","q":{"en":"Arriving late?","it":"Arrivate tardi?","fr":"Vous arrivez tard ?","es":"¿Llega tarde?","de":"Späte Ankunft?","ar":"ستصلون متأخرين؟"},"a":{"en":"**Message us** when you are on your way and again at the door: we open it **remotely**.","it":"**Scriveteci** quando siete in arrivo e di nuovo davanti al portone: lo apriamo **a distanza**.","fr":"**Écrivez-nous** quand vous êtes en route, puis devant la porte : nous l’ouvrons **à distance**.","es":"**Escríbanos** cuando esté de camino y de nuevo en el portal: lo abrimos **a distancia**.","de":"**Schreiben Sie uns**, wenn Sie unterwegs sind, und erneut an der Tür: Wir öffnen **aus der Ferne**.","ar":"**راسلونا** عندما تكونون في الطريق ومرة أخرى عند الباب: سنفتحه **عن بُعد**."}},{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]},{"type":"closing","text":{"en":"Thank you very much for your **understanding and cooperation**.","it":"Grazie mille per la vostra **comprensione e collaborazione**.","fr":"Merci beaucoup pour votre **compréhension et votre coopération**.","es":"Muchas gracias por su **comprensión y colaboración**.","de":"Vielen Dank für Ihr **Verständnis und Ihre Mitarbeit**.","ar":"شكراً جزيلاً **لتفهمكم وتعاونكم**."}}]},{"id":"location","icon":"pin","title":{"en":"Location","it":"Posizione","fr":"Accès","es":"Ubicación","de":"Anreise","ar":"الموقع"},"blocks":[{"type":"address"},{"type":"heading","text":{"en":"How to arrive?","it":"Come arrivare?","fr":"Comment arriver ?","es":"¿Cómo llegar?","de":"Wie komme ich hin?","ar":"كيف تصلون إلينا؟"}},{"type":"tabs","label":{"en":"Arrive from","it":"Arrivo da","fr":"Arriver depuis","es":"Llegar desde","de":"Anreise von","ar":"الوصول من"},"tabs":[{"label":{"en":"Fiumicino Airport","it":"Aeroporto di Fiumicino","fr":"Aéroport de Fiumicino","es":"Aeropuerto de Fiumicino","de":"Flughafen Fiumicino","ar":"مطار فيوميتشينو"},"origin":"Fiumicino Airport (FCO), Rome","routes":[{"icon":"train","title":{"en":"Train (Leonardo Express)","it":"Treno (Leonardo Express)","fr":"Train (Leonardo Express)","es":"Tren (Leonardo Express)","de":"Zug (Leonardo Express)","ar":"القطار (ليوناردو إكسبريس)"},"text":{"en":"Take the **Leonardo Express** from Fiumicino Airport to Roma Termini Station (direct trip, **about 32 minutes**). Then take **metro line A** to **Flaminio** and **tram 2** to the **Mancini** terminus; from there it is about **22 minutes** on foot (or a short taxi ride).","it":"Prendete il **Leonardo Express** dall’aeroporto di Fiumicino alla stazione Roma Termini (corsa diretta, **circa 32 minuti**). Poi prendete la **metro linea A** fino a **Flaminio** e il **tram 2** fino al capolinea **Mancini**; da lì sono circa **22 minuti** a piedi (o una breve corsa in taxi).","fr":"Prenez le **Leonardo Express** de l’aéroport de Fiumicino jusqu’à la gare Roma Termini (trajet direct, **environ 32 minutes**). Prenez ensuite la **ligne A du métro** jusqu’à **Flaminio** et le **tram 2** jusqu’au terminus **Mancini** ; de là, comptez environ **22 minutes** à pied (ou une courte course en taxi).","es":"Tome el **Leonardo Express** desde el aeropuerto de Fiumicino hasta la estación Roma Termini (trayecto directo, **unos 32 minutos**). Luego tome la **línea A del metro** hasta **Flaminio** y el **tranvía 2** hasta la terminal **Mancini**; desde allí son unos **22 minutos** a pie (o un breve trayecto en taxi).","de":"Nehmen Sie den **Leonardo Express** vom Flughafen Fiumicino zum Bahnhof Roma Termini (Direktfahrt, **ca. 32 Minuten**). Nehmen Sie dann die **U-Bahn-Linie A** bis **Flaminio** und die **Tram 2** bis zur Endhaltestelle **Mancini**; von dort sind es etwa **22 Minuten** zu Fuß (oder eine kurze Taxifahrt).","ar":"استقلوا قطار **ليوناردو إكسبريس** من مطار فيوميتشينو إلى محطة روما تيرميني (رحلة مباشرة، **حوالي 32 دقيقة**). ثم استقلّوا **خط المترو A** حتى **فلامينيو** و**الترام 2** حتى محطة **مانشيني** الأخيرة؛ ومن هناك حوالي **22 دقيقة** سيراً (أو رحلة قصيرة بالتاكسي)."},"price":{"en":"Total price: **around €15.50** (€14 for the train + €1.50 for the metro).","it":"Prezzo totale: **circa 15,50 €** (14 € il treno + 1,50 € la metro).","fr":"Prix total : **environ 15,50 €** (14 € pour le train + 1,50 € pour le métro).","es":"Precio total: **unos 15,50 €** (14 € el tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 15,50 €** (14 € für den Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 15.50 يورو** (14 يورو للقطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus to Roma Termini (approx. 50 minutes), then **metro line A** towards Battistini to **Flaminio**, then **tram 2** to **Mancini**.","it":"Prendete un autobus **Terravision** fino a Roma Termini (circa 50 minuti), poi la **metro linea A** direzione Battistini fino a **Flaminio**, poi **tram 2** fino a **Mancini**.","fr":"Prenez un bus **Terravision** jusqu’à Roma Termini (environ 50 minutes), puis la **ligne A du métro** direction Battistini jusqu’à **Flaminio**, puis **tram 2** jusqu’à **Mancini**.","es":"Tome un autobús **Terravision** hasta Roma Termini (aprox. 50 minutos) y después la **línea A del metro** dirección Battistini hasta **Flaminio**, luego **tranvía 2** hasta **Mancini**.","de":"Nehmen Sie einen **Terravision**-Bus nach Roma Termini (ca. 50 Minuten) und dann die **Metrolinie A** Richtung Battistini bis **Flaminio**, dann **Tram 2** bis **Mancini**.","ar":"استقلوا حافلة **تيرافيجن** إلى روما تيرميني (حوالي 50 دقيقة)، ثم **خط المترو A** باتجاه باتيستيني حتى محطة **فلامينيو**، ثم **الترام 2** حتى **مانشيني**."},"price":{"en":"Total price: **from about €5.50** (Terravision bus from €4 + €1.50 metro).","it":"Prezzo totale: **da circa 5,50 €** (bus Terravision da 4 € + 1,50 € metro).","fr":"Prix total : **à partir d’environ 5,50 €** (bus Terravision dès 4 € + 1,50 € le métro).","es":"Precio total: **desde unos 5,50 €** (autobús Terravision desde 4 € + 1,50 € el metro).","de":"Gesamtpreis: **ab ca. 5,50 €** (Terravision-Bus ab 4 € + 1,50 € Metro).","ar":"السعر الإجمالي: **ابتداءً من حوالي 5.50 يورو** (حافلة تيرافيجن ابتداءً من 4 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis charge a **fixed fare of €55** from Fiumicino to the city centre (inside the Aurelian Walls), luggage included. **Ponte Milvio** is **outside the Aurelian Walls**, so the fixed fare does not apply: the fare is **by meter** – ask the driver for an estimate before you set off.","it":"I taxi ufficiali bianchi applicano una **tariffa fissa di 55 €** da Fiumicino al centro città (entro le Mura Aureliane), bagagli inclusi. **Ponte Milvio** è **fuori dalle Mura Aureliane**, quindi la tariffa fissa non si applica: si paga **a tassametro** – chiedete una stima al tassista prima di partire.","fr":"Les taxis officiels blancs appliquent un **tarif fixe de 55 €** de Fiumicino au centre-ville (à l’intérieur du mur d’Aurélien), bagages compris. **Ponte Milvio** est **en dehors du mur d’Aurélien** : le forfait ne s’applique pas, la course est **au compteur** – demandez une estimation au chauffeur avant le départ.","es":"Los taxis oficiales blancos aplican una **tarifa fija de 55 €** desde Fiumicino hasta el centro de la ciudad (dentro de las Murallas Aurelianas), equipaje incluido. **Ponte Milvio** está **fuera de las Murallas Aurelianas**, así que no se aplica la tarifa fija: se paga **por taxímetro** – pida una estimación al taxista antes de salir.","de":"Offizielle weiße Taxis berechnen von Fiumicino ins Stadtzentrum (innerhalb der Aurelianischen Mauer) einen **Festpreis von 55 €**, Gepäck inklusive. **Ponte Milvio** liegt **außerhalb der Aurelianischen Mauer**, der Festpreis gilt daher nicht: Es wird **nach Taxameter** abgerechnet – fragen Sie den Fahrer vorab nach einer Schätzung.","ar":"تتقاضى سيارات الأجرة الرسمية البيضاء **تعرفة ثابتة قدرها 55 يورو** من فيوميتشينو إلى وسط المدينة (داخل الأسوار الأوريليانية)، شاملة الأمتعة. يقع **بونتي ميلفيو** **خارج الأسوار الأوريليانية**، لذا لا تنطبق الأجرة الثابتة: تُحتسب الأجرة **بالعدّاد** – اطلبوا تقديراً من السائق قبل الانطلاق."},"warn":{"en":"Please note: during busy periods, there may be **long lines** at the airport taxi station.","it":"Attenzione: nei periodi di maggiore affluenza potrebbero esserci **lunghe code** alla stazione dei taxi dell’aeroporto.","fr":"Attention : en période d’affluence, il peut y avoir de **longues files d’attente** à la station de taxis de l’aéroport.","es":"Atención: en periodos de mucha afluencia puede haber **largas colas** en la parada de taxis del aeropuerto.","de":"Bitte beachten: Zu Stoßzeiten kann es am Taxistand des Flughafens **lange Warteschlangen** geben.","ar":"يُرجى الانتباه: خلال فترات الازدحام قد تكون هناك **طوابير طويلة** عند موقف سيارات الأجرة في المطار."}},{"icon":"car","title":{"en":"Private transfer","it":"Transfer privato","fr":"Transfert privé","es":"Traslado privado","de":"Privater Transfer","ar":"نقل خاص"},"text":{"en":"For a simple, comfortable and stress-free journey, choose our **exclusive transfer service** directly from Fiumicino. The price depends on the day, time and number of passengers.","it":"Per un viaggio semplice, comodo e senza stress, scegliete il nostro **servizio esclusivo di transfer** direttamente da Fiumicino. Il prezzo dipende dal giorno, dall’orario e dal numero di passeggeri.","fr":"Pour un trajet simple, confortable et sans stress, choisissez notre **service de transfert exclusif** directement depuis Fiumicino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Fiumicino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Fiumicino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Fiumicino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Fiumicino"}]},{"label":{"en":"Ciampino Airport","it":"Aeroporto di Ciampino","fr":"Aéroport de Ciampino","es":"Aeropuerto de Ciampino","de":"Flughafen Ciampino","ar":"مطار تشامبينو"},"origin":"Ciampino Airport (CIA), Rome","routes":[{"icon":"train","title":{"en":"Train + Metro","it":"Treno + Metro","fr":"Train + Métro","es":"Tren + Metro","de":"Zug + Metro","ar":"قطار + مترو"},"text":{"en":"Take the **Ciampino Airlink** shuttle bus to Ciampino station (about 10 minutes). Then take a **regional train** to Roma Termini (about 15 minutes). From Termini, take **metro line A** towards Battistini and get off at Flaminio, then **tram 2** to **Mancini**.","it":"Prendete la navetta **Ciampino Airlink** fino alla stazione di Ciampino (circa 10 minuti). Poi un **treno regionale** fino a Roma Termini (circa 15 minuti). Da Termini, prendete la **metro linea A** direzione Battistini e scendete a Flaminio, poi **tram 2** fino a **Mancini**.","fr":"Prenez la navette **Ciampino Airlink** jusqu’à la gare de Ciampino (environ 10 minutes). Prenez ensuite un **train régional** jusqu’à Roma Termini (environ 15 minutes). À Termini, prenez la **ligne A du métro** direction Battistini et descendez à Flaminio, puis **tram 2** jusqu’à **Mancini**.","es":"Tome el autobús lanzadera **Ciampino Airlink** hasta la estación de Ciampino (unos 10 minutos). Después tome un **tren regional** hasta Roma Termini (unos 15 minutos). Desde Termini, tome la **línea A del metro** dirección Battistini y bájese en Flaminio, luego **tranvía 2** hasta **Mancini**.","de":"Nehmen Sie den Shuttlebus **Ciampino Airlink** zum Bahnhof Ciampino (ca. 10 Minuten). Fahren Sie dann mit einem **Regionalzug** nach Roma Termini (ca. 15 Minuten). Ab Termini nehmen Sie die **Metrolinie A** Richtung Battistini bis Flaminio, dann **Tram 2** bis **Mancini**.","ar":"استقلوا حافلة **Ciampino Airlink** المكوكية إلى محطة تشامبينو (حوالي 10 دقائق). ثم استقلوا **قطاراً إقليمياً** إلى روما تيرميني (حوالي 15 دقيقة). ومن تيرميني، استقلوا **خط المترو A** باتجاه باتيستيني وانزلوا في محطة فلامينيو، ثم **الترام 2** حتى **مانشيني**."},"price":{"en":"Total price: **about €4.20** (€2.70 for the ‘Ciampino Airlink’ bus + train + €1.50 for the metro).","it":"Prezzo totale: **circa 4,20 €** (2,70 € per bus ‘Ciampino Airlink’ + treno + 1,50 € per la metro).","fr":"Prix total : **environ 4,20 €** (2,70 € pour le bus « Ciampino Airlink » + train + 1,50 € pour le métro).","es":"Precio total: **unos 4,20 €** (2,70 € el autobús ‘Ciampino Airlink’ + tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 4,20 €** (2,70 € für Bus „Ciampino Airlink“ + Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 4.20 يورو** (2.70 يورو لحافلة «Ciampino Airlink» + القطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus directly to Roma Termini (approx. 40–50 minutes). Then take **metro line A** towards Battistini to **Flaminio**, then **tram 2** to **Mancini**.","it":"Prendete un autobus **Terravision** diretto a Roma Termini (circa 40–50 minuti). Poi la **metro linea A** direzione Battistini fino a **Flaminio**, poi **tram 2** fino a **Mancini**.","fr":"Prenez un bus **Terravision** direct jusqu’à Roma Termini (environ 40 à 50 minutes). Prenez ensuite la **ligne A du métro** direction Battistini jusqu’à **Flaminio**, puis **tram 2** jusqu’à **Mancini**.","es":"Tome un autobús **Terravision** directo a Roma Termini (aprox. 40–50 minutos). Después tome la **línea A del metro** dirección Battistini hasta **Flaminio**, luego **tranvía 2** hasta **Mancini**.","de":"Nehmen Sie einen **Terravision**-Bus direkt nach Roma Termini (ca. 40–50 Minuten). Fahren Sie dann mit der **Metrolinie A** Richtung Battistini bis **Flaminio**, dann **Tram 2** bis **Mancini**.","ar":"استقلوا حافلة **تيرافيجن** مباشرةً إلى روما تيرميني (حوالي 40–50 دقيقة). ثم **خط المترو A** باتجاه باتيستيني حتى محطة **فلامينيو**، ثم **الترام 2** حتى **مانشيني**."},"price":{"en":"Total price: **about €8** (Terravision bus from €6.50 + €1.50 metro).","it":"Prezzo totale: **circa 8 €** (bus Terravision da 6,50 € + 1,50 € metro).","fr":"Prix total : **environ 8 €** (bus Terravision dès 6,50 € + 1,50 € le métro).","es":"Precio total: **unos 8 €** (autobús Terravision desde 6,50 € + 1,50 € el metro).","de":"Gesamtpreis: **ca. 8 €** (Terravision-Bus ab 6,50 € + 1,50 € Metro).","ar":"السعر الإجمالي: **حوالي 8 يورو** (حافلة تيرافيجن ابتداءً من 6.50 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis from Ciampino charge a **fixed fare of €40** to the centre of Rome (inside the Aurelian Walls), luggage included. **Ponte Milvio** is **outside the Aurelian Walls**, so the fixed fare does not apply: the fare is **by meter** – ask the driver for an estimate before you set off.","it":"I taxi ufficiali bianchi da Ciampino applicano una **tariffa fissa di 40 €** per il centro di Roma (entro le Mura Aureliane), bagagli inclusi. **Ponte Milvio** è **fuori dalle Mura Aureliane**, quindi la tariffa fissa non si applica: si paga **a tassametro** – chiedete una stima al tassista prima di partire.","fr":"Les taxis officiels blancs au départ de Ciampino appliquent un **tarif fixe de 40 €** jusqu’au centre de Rome (à l’intérieur du mur d’Aurélien), bagages compris. **Ponte Milvio** est **en dehors du mur d’Aurélien** : le forfait ne s’applique pas, la course est **au compteur** – demandez une estimation au chauffeur avant le départ.","es":"Los taxis oficiales blancos desde Ciampino aplican una **tarifa fija de 40 €** hasta el centro de Roma (dentro de las Murallas Aurelianas), equipaje incluido. **Ponte Milvio** está **fuera de las Murallas Aurelianas**, así que no se aplica la tarifa fija: se paga **por taxímetro** – pida una estimación al taxista antes de salir.","de":"Offizielle weiße Taxis ab Ciampino berechnen ins Zentrum von Rom (innerhalb der Aurelianischen Mauer) einen **Festpreis von 40 €**, Gepäck inklusive. **Ponte Milvio** liegt **außerhalb der Aurelianischen Mauer**, der Festpreis gilt daher nicht: Es wird **nach Taxameter** abgerechnet – fragen Sie den Fahrer vorab nach einer Schätzung.","ar":"تتقاضى سيارات الأجرة الرسمية البيضاء من تشامبينو **تعرفة ثابتة قدرها 40 يورو** إلى وسط روما (داخل الأسوار الأوريليانية)، شاملة الأمتعة. يقع **بونتي ميلفيو** **خارج الأسوار الأوريليانية**، لذا لا تنطبق الأجرة الثابتة: تُحتسب الأجرة **بالعدّاد** – اطلبوا تقديراً من السائق قبل الانطلاق."},"warn":{"en":"Please note: during busy times, there may be **long queues** at the airport taxi rank.","it":"Attenzione: negli orari di punta potrebbero esserci **lunghe code** alla fermata dei taxi dell’aeroporto.","fr":"Attention : aux heures d’affluence, il peut y avoir de **longues files d’attente** à la station de taxis de l’aéroport.","es":"Atención: en las horas de mayor afluencia puede haber **largas colas** en la parada de taxis del aeropuerto.","de":"Bitte beachten: Zu Stoßzeiten kann es am Taxistand des Flughafens **lange Warteschlangen** geben.","ar":"يُرجى الانتباه: في أوقات الذروة قد تكون هناك **طوابير طويلة** عند موقف سيارات الأجرة في المطار."}},{"icon":"car","title":{"en":"Private transfer","it":"Transfer privato","fr":"Transfert privé","es":"Traslado privado","de":"Privater Transfer","ar":"نقل خاص"},"text":{"en":"For a simple, comfortable and stress-free journey, choose our **exclusive transfer service** directly from Ciampino. The price depends on the day, time and number of passengers.","it":"Per un viaggio semplice, comodo e senza stress, scegliete il nostro **servizio esclusivo di transfer** direttamente da Ciampino. Il prezzo dipende dal giorno, dall’orario e dal numero di passeggeri.","fr":"Pour un trajet simple, confortable et sans stress, choisissez notre **service de transfert exclusif** directement depuis Ciampino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Ciampino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Ciampino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Ciampino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Ciampino"}]}]},{"type":"heading","text":{"en":"From the tram 2 terminus (Mancini) on foot","it":"Dal capolinea del tram 2 (Mancini) a piedi","fr":"Du terminus du tram 2 (Mancini) à pied","es":"Desde la terminal del tranvía 2 (Mancini) a pie","de":"Von der Endhaltestelle der Tram 2 (Mancini) zu Fuß","ar":"من محطة الترام 2 الأخيرة (مانشيني) سيراً"}},{"type":"steps","items":[{"en":"From **Piazza Mancini** walk along **Viale Pinturicchio** to **Piazzale Cardinal Consalvi**.","it":"Da **Piazza Mancini** percorrete **Viale Pinturicchio** fino a **Piazzale Cardinal Consalvi**.","fr":"De la **Piazza Mancini**, suivez le **Viale Pinturicchio** jusqu’au **Piazzale Cardinal Consalvi**.","es":"Desde **Piazza Mancini** recorra **Viale Pinturicchio** hasta **Piazzale Cardinal Consalvi**.","de":"Gehen Sie von der **Piazza Mancini** den **Viale Pinturicchio** entlang bis zum **Piazzale Cardinal Consalvi**.","ar":"من **ساحة مانشيني** سيروا على **Viale Pinturicchio** حتى **Piazzale Cardinal Consalvi**."},{"en":"Cross the Tiber on the ancient pedestrian **Ponte Milvio** and arrive in **Piazzale di Ponte Milvio**.","it":"Attraversate il Tevere sull’antico **Ponte Milvio** pedonale e arrivate in **Piazzale di Ponte Milvio**.","fr":"Traversez le Tibre par l’antique **Ponte Milvio** piéton et arrivez sur le **Piazzale di Ponte Milvio**.","es":"Cruce el Tíber por el antiguo **Ponte Milvio** peatonal y llegue a **Piazzale di Ponte Milvio**.","de":"Überqueren Sie den Tiber auf der antiken Fußgängerbrücke **Ponte Milvio** bis zum **Piazzale di Ponte Milvio**.","ar":"اعبروا نهر التيبر على جسر **بونتي ميلفيو** الأثري المخصص للمشاة حتى **Piazzale di Ponte Milvio**."},{"en":"Take **Via degli Orti della Farnesina**, then **Via della Farnesina**, and turn left into **Via Alberico Albricci**: number **12**. Your apartment: **raised ground floor, door on the RIGHT**.","it":"Prendete **Via degli Orti della Farnesina**, poi **Via della Farnesina**, e girate a sinistra in **Via Alberico Albricci**: civico **12**. Il vostro appartamento: **piano rialzato, porta a DESTRA**.","fr":"Prenez la **Via degli Orti della Farnesina**, puis la **Via della Farnesina**, et tournez à gauche dans la **Via Alberico Albricci** : numéro **12**. Votre appartement : **rez-de-chaussée surélevé, porte de DROITE**.","es":"Tome **Via degli Orti della Farnesina**, luego **Via della Farnesina**, y gire a la izquierda por **Via Alberico Albricci**: número **12**. Su apartamento: **planta baja elevada, puerta de la DERECHA**.","de":"Nehmen Sie die **Via degli Orti della Farnesina**, dann die **Via della Farnesina**, und biegen Sie links in die **Via Alberico Albricci** ab: Nummer **12**. Ihre Wohnung: **Hochparterre, Tür RECHTS**.","ar":"اسلكوا **Via degli Orti della Farnesina** ثم **Via della Farnesina**، وانعطفوا يساراً إلى **Via Alberico Albricci**: الرقم **12**. شقتكم: **الطابق الأرضي المرتفع، الباب على اليمين**."}]}]},{"id":"wifi","icon":"wifi","title":{"en":"Wi-Fi","it":"Wi-Fi","fr":"Wi-Fi","es":"Wi-Fi","de":"WLAN","ar":"الواي فاي"},"blocks":[{"type":"wifi","qr":"<svg width=\"31mm\" height=\"31mm\" version=\"1.1\" viewBox=\"0 0 31 31\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M1,1H2V2H1zM2,1H3V2H2zM3,1H4V2H3zM4,1H5V2H4zM5,1H6V2H5zM6,1H7V2H6zM7,1H8V2H7zM9,1H10V2H9zM10,1H11V2H10zM14,1H15V2H14zM16,1H17V2H16zM19,1H20V2H19zM20,1H21V2H20zM23,1H24V2H23zM24,1H25V2H24zM25,1H26V2H25zM26,1H27V2H26zM27,1H28V2H27zM28,1H29V2H28zM29,1H30V2H29zM1,2H2V3H1zM7,2H8V3H7zM11,2H12V3H11zM14,2H15V3H14zM18,2H19V3H18zM19,2H20V3H19zM20,2H21V3H20zM23,2H24V3H23zM29,2H30V3H29zM1,3H2V4H1zM3,3H4V4H3zM4,3H5V4H4zM5,3H6V4H5zM7,3H8V4H7zM10,3H11V4H10zM11,3H12V4H11zM12,3H13V4H12zM17,3H18V4H17zM18,3H19V4H18zM20,3H21V4H20zM23,3H24V4H23zM25,3H26V4H25zM26,3H27V4H26zM27,3H28V4H27zM29,3H30V4H29zM1,4H2V5H1zM3,4H4V5H3zM4,4H5V5H4zM5,4H6V5H5zM7,4H8V5H7zM9,4H10V5H9zM10,4H11V5H10zM13,4H14V5H13zM15,4H16V5H15zM16,4H17V5H16zM21,4H22V5H21zM23,4H24V5H23zM25,4H26V5H25zM26,4H27V5H26zM27,4H28V5H27zM29,4H30V5H29zM1,5H2V6H1zM3,5H4V6H3zM4,5H5V6H4zM5,5H6V6H5zM7,5H8V6H7zM9,5H10V6H9zM11,5H12V6H11zM12,5H13V6H12zM13,5H14V6H13zM15,5H16V6H15zM16,5H17V6H16zM21,5H22V6H21zM23,5H24V6H23zM25,5H26V6H25zM26,5H27V6H26zM27,5H28V6H27zM29,5H30V6H29zM1,6H2V7H1zM7,6H8V7H7zM9,6H10V7H9zM10,6H11V7H10zM11,6H12V7H11zM15,6H16V7H15zM17,6H18V7H17zM18,6H19V7H18zM19,6H20V7H19zM20,6H21V7H20zM23,6H24V7H23zM29,6H30V7H29zM1,7H2V8H1zM2,7H3V8H2zM3,7H4V8H3zM4,7H5V8H4zM5,7H6V8H5zM6,7H7V8H6zM7,7H8V8H7zM9,7H10V8H9zM11,7H12V8H11zM13,7H14V8H13zM15,7H16V8H15zM17,7H18V8H17zM19,7H20V8H19zM21,7H22V8H21zM23,7H24V8H23zM24,7H25V8H24zM25,7H26V8H25zM26,7H27V8H26zM27,7H28V8H27zM28,7H29V8 ormas de la casa**.","de":"Die Wohnung liegt in einem **historischen Wohnhaus** (Palazzo d’epoca), in dem **Familien wohnen**. Danke, dass Sie die **Hausregeln** einhalten.","ar":"تقع الشقة في **مبنى سكني تاريخي** (palazzo d’epoca) **تسكنه عائلات**. نشكركم على احترام **قواعد المنزل**."}},{"type":"rules","items":[{"icon":"column","text":{"en":"This is a **historic residential building**: keep **quiet** in the **common areas**, out of respect for the residents.","it":"È un **palazzo d’epoca residenziale**: mantenete il **silenzio** negli **spazi comuni**, per rispetto dei residenti.","fr":"C’est un **immeuble résidentiel historique** : restez **silencieux** dans les **parties communes**, par respect pour les résidents.","es":"Es un **edificio residencial histórico**: guarde **silencio** en las **zonas comunes**, por respeto a los vecinos.","de":"Dies ist ein **historisches Wohnhaus**: Bitte seien Sie in den **Gemeinschaftsbereichen** **leise** – aus Rücksicht auf die Bewohner.","ar":"هذا **مبنى سكني تاريخي**: التزموا **الهدوء** في **الأماكن المشتركة** احتراماً للسكان."}},{"icon":"nosmoke","text":{"en":"Please **do not smoke** inside the house.","it":"Vi preghiamo di **non fumare** all’interno della casa.","fr":"Merci de **ne pas fumer** à l’intérieur du logement.","es":"Le rogamos que **no fume** dentro de la vivienda.","de":"Bitte **rauchen Sie nicht** in der Wohnung.","ar":"يُرجى **عدم التدخين** داخل المنزل."}},{"icon":"sparkles","text":{"en":"Take care of the house, **keep the common areas clean** and leave things tidy after you use them.","it":"Abbiate cura della casa, **mantenete puliti gli spazi comuni** e lasciate tutto in ordine dopo l’uso.","fr":"Prenez soin du logement, **gardez les parties communes propres** et laissez tout en ordre après utilisation.","es":"Cuide la vivienda, **mantenga limpias las zonas comunes** y deje todo ordenado después de usarlo.","de":"Gehen Sie sorgsam mit der Wohnung um, halten Sie die **Gemeinschaftsbereiche sauber** und hinterlassen Sie alles ordentlich.","ar":"اعتنوا بالمنزل، و**حافظوا على نظافة الأماكن المشتركة**، واتركوا الأشياء مرتبة بعد استخدامها."}},{"icon":"mute","text":{"en":"Respect the peace and privacy of other occupants by **minimizing noise**.","it":"Rispettate la tranquillità e la privacy degli altri residenti **limitando i rumori**.","fr":"Respectez la tranquillité et l’intimité des autres occupants **en limitant le bruit**.","es":"Respete la tranquilidad y la privacidad de los demás ocupantes **reduciendo el ruido**.","de":"Respektieren Sie die Ruhe und Privatsphäre der anderen Bewohner, indem Sie **Lärm vermeiden**.","ar":"احترموا هدوء وخصوصية السكان الآخرين **بالتقليل من الضوضاء**."}},{"icon":"users","text":{"en":"Avoid inviting additional people **without prior authorization**.","it":"Evitate di invitare altre persone **senza previa autorizzazione**.","fr":"Évitez d’inviter d’autres personnes **sans autorisation préalable**.","es":"Evite invitar a otras personas **sin autorización previa**.","de":"Laden Sie keine weiteren Personen **ohne vorherige Genehmigung** ein.","ar":"تجنّبوا دعوة أشخاص إضافيين **دون إذن مسبق**."}},{"icon":"zap","text":{"en":"Follow **safety instructions** and avoid using dangerous or unauthorised electrical equipment.","it":"Seguite le **istruzioni di sicurezza** ed evitate di usare apparecchi elettrici pericolosi o non autorizzati.","fr":"Suivez les **consignes de sécurité** et évitez d’utiliser des appareils électriques dangereux ou non autorisés.","es":"Siga las **instrucciones de seguridad** y evite utilizar aparatos eléctricos peligrosos o no autorizados.","de":"Befolgen Sie die **Sicherheitshinweise** und verwenden Sie keine gefährlichen oder nicht zugelassenen Elektrogeräte.","ar":"اتبعوا **تعليمات السلامة** وتجنّبوا استخدام الأجهزة الكهربائية الخطرة أو غير المصرّح بها."}},{"icon":"alert","text":{"en":"Please report any problems or damage that occur during your stay **as soon as possible**.","it":"Segnalateci **il prima possibile** eventuali problemi o danni che si verifichino durante il soggiorno.","fr":"Signalez-nous **au plus vite** tout problème ou dommage survenu pendant votre séjour.","es":"Comuníquenos **lo antes posible** cualquier problema o daño que se produzca durante su estancia.","de":"Bitte melden Sie uns Probleme oder Schäden während Ihres Aufenthalts **so schnell wie möglich**.","ar":"يُرجى إبلاغنا **في أقرب وقت ممكن** بأي مشكلة أو ضرر يحدث خلال إقامتكم."}}]},{"type":"closing","text":{"en":"Thank you","it":"Grazie","fr":"Merci","es":"Gracias","de":"Danke","ar":"شكراً لكم"}}]},{"id":"transport","icon":"metro","title":{"en":"Transport","it":"Trasporti","fr":"Transports","es":"Transporte","de":"Verkehrsmittel","ar":"المواصلات"},"blocks":[{"type":"list","items":[{"icon":"train","title":{"en":"Tram 2 and metro line A","it":"Tram 2 e metro linea A","fr":"Tram 2 et métro ligne A","es":"Tranvía 2 y metro línea A","de":"Tram 2 und Metro Linie A","ar":"الترام 2 وخط المترو A"},"text":{"en":"Tram **2** from **Mancini** (about **22 minutes** on foot, over Ponte Milvio) to **Flaminio – Piazza del Popolo** in about **10 minutes**, then **metro line A**.","it":"Tram **2** da **Mancini** (circa **22 minuti** a piedi, passando per Ponte Milvio) fino a **Flaminio – Piazza del Popolo** in circa **10 minuti**, poi **metro linea A**.","fr":"Tram **2** depuis **Mancini** (environ **22 minutes** à pied, par le Ponte Milvio) jusqu’à **Flaminio – Piazza del Popolo** en **10 minutes** environ, puis **métro ligne A**.","es":"Tranvía **2** desde **Mancini** (unos **22 minutos** a pie, por el Ponte Milvio) hasta **Flaminio – Piazza del Popolo** en unos **10 minutos**, luego **metro línea A**.","de":"Tram **2** ab **Mancini** (ca. **22 Minuten** zu Fuß über den Ponte Milvio) bis **Flaminio – Piazza del Popolo** in etwa **10 Minuten**, dann **Metro Linie A**.","ar":"الترام **2** من **مانشيني** (حوالي **22 دقيقة** سيراً عبر بونتي ميلفيو) إلى **فلامينيو – ساحة الشعب** في نحو **10 دقائق**، ثم **خط المترو A**."},"maps":" 15–20 minutos** en taxi","de":"Bahnhof Termini · ca. **40 Minuten** mit Tram **2** + Metro **A**, **15–20 Minuten** mit dem Taxi","ar":"محطة تيرميني · حوالي **40 دقيقة** بالمواصلات (الترام **2** + المترو **A**)، و**15–20 دقيقة** بالتاكسي"},"maps":"Roma Termini"},{"icon":"plane","title":{"en":"Fiumicino Airport","it":"Aeroporto di Fiumicino","fr":"Aéroport de Fiumicino","es":"Aeropuerto de Fiumicino","de":"Flughafen Fiumicino","ar":"مطار فيوميتشينو"},"text":{"en":"40 minutes by car","it":"40 minuti in auto","fr":"40 minutes en voiture","es":"40 minutos en coche","de":"40 Minuten mit dem Auto","ar":"40 دقيقة بالسيارة"},"maps":"Fiumicino Airport"},{"icon":"plane","title":{"en":"Ciampino Airport","it":"Aeroporto di Ciampino","fr":"Aéroport de Ciampino","es":"Aeropuerto de Ciampino","de":"Flughafen Ciampino","ar":"مطار تشامبينو"},"text":{"en":"50 minutes by car","it":"50 minuti in auto","fr":"50 minutes en voiture","es":"50 minutos en coche","de":"50 Minuten mit dem Auto","ar":"50 دقيقة بالسيارة"},"maps":"Ciampino Airport"}]}]},{"id":"amenities","icon":"sofa","title":{"en":"Amenities","it":"Dotazioni","fr":"Équipements","es":"Equipamiento","de":"Ausstattung","ar":"المرافق"},"blocks":[{"type":"amenities","items":[{"icon":"bed2","label":{"en":"Bedroom 1: 1 double bed","it":"Camera 1: 1 letto matrimoniale","fr":"Chambre 1 : 1 lit double","es":"Dormitorio 1: 1 cama doble","de":"Schlafzimmer 1: 1 Doppelbett","ar":"غرفة النوم 1: سرير مزدوج"}},{"icon":"bed2","label":{"en":"Bedroom 2: 1 double bed","it":"Camera 2: 1 letto matrimoniale","fr":"Chambre 2 : 1 lit double","es":"Dormitorio 2: 1 cama doble","de":"Schlafzimmer 2: 1 Doppelbett","ar":"غرفة النوم 2: سرير مزدوج"}},{"icon":"sofa","label":{"en":"Living room: sofa bed","it":"Soggiorno: divano letto","fr":"Séjour : canapé-lit","es":"Salón: sofá cama","de":"Wohnzimmer: Schlafsofa","ar":"غرفة المعيشة: أريكة سرير"}},{"icon":"users","label":{"en":"Up to 5 guests","it":"Fino a 5 ospiti","fr":"Jusqu’à 5 personnes","es":"Hasta 5 huéspedes","de":"Bis zu 5 Gäste","ar":"حتى 5 ضيوف"}},{"icon":"house","label":{"en":"2 bathrooms","it":"2 bagni","fr":"2 salles de bain","es":"2 baños","de":"2 Bäder","ar":"حمّامان"}},{"icon":"baby","label":{"en":"Travel cot","it":"Culla da viaggio","fr":"Lit parapluie","es":"Cuna de viaje","de":"Reisebett","ar":"سرير أطفال للسفر"}},{"icon":"wifi","label":{"en":"Fast Wi-Fi","it":"Wi-Fi veloce","fr":"Wi-Fi rapide","es":"Wi-Fi rápido","de":"Schnelles WLAN","ar":"واي فاي سريع"}},{"icon":"tv","label":{"en":"TV","it":"TV","fr":"TV","es":"TV","de":"TV","ar":"تلفزيون"}},{"icon":"snow","label":{"en":"Air conditioning","it":"Aria condizionata","fr":"Climatisation","es":"Aire acondicionado","de":"Klimaanlage","ar":"تكييف الهواء"}},{"icon":"sun","label":{"en":"Heating","it":"Riscaldamento","fr":"Chauffage","es":"Calefacción","de":"Heizung","ar":"تدفئة"}},{"icon":"washer","label":{"en":"Washing machine","it":"Lavatrice","fr":"Lave-linge","es":"Lavadora","de":"Waschmaschine","ar":"غسالة ملابس"}},{"icon":"hob","label":{"en":"Kitchen with induction hob, oven, microwave and dishwasher","it":"Cucina con piano a induzione, forno, microonde e lavastoviglie","fr":"Cuisine avec plaque à induction, four, micro-ondes et lave-vaisselle","es":"Cocina con placa de inducción, horno, microondas y lavavajillas","de":"Küche mit Induktionskochfeld, Backofen, Mikrowelle und Geschirrspüler","ar":"مطبخ مع موقد حثّي وفرن وميكروويف وغسالة صحون"}},{"icon":"fridge","label":{"en":"Fridge and freezer","it":"Frigorifero e congelatore","fr":"Réfrigérateur et congélateur","es":"Frigorífico y congelador","de":"Kühlschrank und Gefrierfach","ar":"ثلاجة ومجمّد"}},{"icon":"coffee","label":{"en":"Espresso machine","it":"Macchina per espresso","fr":"Machine à expresso","es":"Cafetera espresso","de":"Espressomaschine","ar":"آلة إسبريسو"}},{"icon":"table","label":{"en":"Dining table","it":"Tavolo da pranzo","fr":"Table à manger","es":"Mesa de comedor","de":"Esstisch","ar":"طاولة طعام"}},{"icon":"zap","label":{"en":"Hair dryer","it":"Asciugacapelli","fr":"Sèche-cheveux","es":"Secador de pelo","de":"Haartrockner","ar":"مجفف شعر"}}]}]},{"id":"activities","icon":"colosseum","title":{"en":"Activities","it":"Attività","fr":"Activités","es":"Actividades","de":"Aktivitäten","ar":"الأنشطة"},"blocks":[{"type":"heading","text":{"en":"Around Ponte Milvio","it":"Intorno a Ponte Milvio","fr":"Autour de Ponte Milvio","es":"Alrededor de Ponte Milvio","de":"Rund um Ponte Milvio","ar":"حول بونتي ميلفيو"}},{"type":"features","items":[{"icon":"arch","title":{"en":"Ponte Milvio and the Tiber","it":"Ponte Milvio e il Tevere","fr":"Le Ponte Milvio et le Tibre","es":"Ponte Milvio y el Tíber","de":"Ponte Milvio und der Tiber","ar":"جسر بونتي ميلفيو ونهر التيبر"},"text":{"en":"**13 minutes** on foot: one of Rome’s **oldest bridges** (2nd century BC), where Constantine won the battle of **312 AD**, today pedestrian. From here the **cycle and footpath along the Tiber** runs towards the centre – lovely at sunset. In the evening the square around it is the heart of the district’s **nightlife**.","it":"A **13 minuti** a piedi: uno dei **ponti più antichi** di Roma (II secolo a.C.), dove Costantino vinse la battaglia del **312 d.C.**, oggi pedonale. Da qui parte la **pista ciclopedonale lungo il Tevere** verso il centro, bellissima al tramonto. La sera la piazza intorno è il cuore della **movida** del quartiere.","fr":"À **13 minutes** à pied : l’un des **plus anciens ponts** de Rome (IIe siècle av. J.-C.), où Constantin remporta la bataille de **312**, aujourd’hui piéton. De là, la **piste cyclable et piétonne le long du Tibre** mène vers le centre – superbe au coucher du soleil. Le soir, la place est le cœur de la **vie nocturne** du quartier.","es":"A **13 minutos** a pie: uno de los **puentes más antiguos** de Roma (siglo II a. C.), donde Constantino ganó la batalla del **312 d. C.**, hoy peatonal. Desde aquí sale el **carril bici y peatonal junto al Tíber** hacia el centro, precioso al atardecer. Por la noche la plaza es el corazón de la **vida nocturna** del barrio.","de":"**13 Gehminuten**: eine der **ältesten Brücken** Roms (2. Jh. v. Chr.), an der Konstantin **312 n. Chr.** die Schlacht gewann, heute eine Fußgängerbrücke. Von hier führt der **Rad- und Fußweg am Tiber** Richtung Zentrum – herrlich bei Sonnenuntergang. Abends ist der Platz das Zentrum des **Nachtlebens** im Viertel.","ar":"على بُعد **13 دقيقة** سيراً: أحد **أقدم جسور** روما (القرن الثاني قبل الميلاد)، حيث انتصر قسطنطين في معركة عام **312م**، وهو اليوم مخصص للمشاة. ومن هنا يبدأ **مسار الدراجات والمشاة على ضفاف التيبر** نحو وسط المدينة، وهو رائع عند الغروب. وفي المساء تصبح الساحة المحيطة قلب **الحياة الليلية** في الحي."},"maps":"Ponte Milvio, Roma","photo":{"src":"rome/ponte-milvio","place":"Ponte Milvio","area":false,"credit":{"title":"Ponte Milvio Roma DSC00400.JPG","author":"Gianni o O","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","source":"https://commons.wikimedia.org/wiki/File:Ponte_Milvio_Roma_DSC00400.JPG"}}},{"icon":"ticket","title":{"en":"Foro Italico and Stadio Olimpico","it":"Foro Italico e Stadio Olimpico","fr":"Foro Italico et Stadio Olimpico","es":"Foro Italico y Estadio Olímpico","de":"Foro Italico und Olympiastadion","ar":"فورو إيتاليكو والملعب الأولمبي"},"text":{"en":"About **21 minutes** on foot: the 1930s sports complex with the **Stadio dei Marmi** and its 59 marble athletes, the **Stadio Olimpico** (**21 minutes**) where **AS Roma** and **Lazio** play, and the **Internazionali d’Italia** tennis tournament in May. On match days the area is very busy: plan ahead.","it":"Circa **21 minuti** a piedi: il complesso sportivo degli anni Trenta con lo **Stadio dei Marmi** e le sue 59 statue di atleti, lo **Stadio Olimpico** (**21 minuti**) dove giocano **Roma** e **Lazio**, e a maggio gli **Internazionali d’Italia** di tennis. Nei giorni di partita la zona è molto affollata: organizzatevi per tempo.","fr":"Environ **21 minutes** à pied : le complexe sportif des années 1930 avec le **Stadio dei Marmi** et ses 59 athlètes de marbre, le **Stadio Olimpico** (**21 minutes**) où jouent l’**AS Roma** et la **Lazio**, et en mai le tournoi de tennis des **Internazionali d’Italia**. Les jours de match, le quartier est très fréquenté : anticipez.","es":"Unos **21 minutos** a pie: el complejo deportivo de los años treinta con el **Stadio dei Marmi** y sus 59 atletas de mármol, el **Estadio Olímpico** (**21 minutos**) donde juegan la **Roma** y la **Lazio**, y en mayo el torneo de tenis **Internazionali d’Italia**. Los días de partido la zona está muy concurrida: planifique con tiempo.","de":"Etwa **21 Gehminuten**: die Sportanlage aus den 1930er-Jahren mit dem **Stadio dei Marmi** und seinen 59 Marmorathleten, das **Olympiastadion** (**21 Minuten**), in dem **AS Roma** und **Lazio** spielen, und im Mai das Tennisturnier **Internazionali d’Italia**. An Spieltagen ist viel los: Planen Sie Zeit ein.","ar":"حوالي **21 دقيقة** سيراً: المجمّع الرياضي من ثلاثينيات القرن الماضي مع **ملعب الرخام** وتماثيله الـ59 للرياضيين، و**الملعب الأولمبي** (**21 دقيقة**) حيث يلعب **روما** و**لاتسيو**، وفي مايو بطولة التنس **إنترناتسيونالي دي إيطاليا**. في أيام المباريات تكون المنطقة مزدحمة جداً: خططوا مسبقاً."},"maps":"Stadio dei Marmi, Foro Italico, Roma","photo":{"src":"rome/foro-italico","place":"Stadio dei Marmi","area":false,"credit":{"title":"Stadio dei Marmi e Palazzo della Farnesina (34393342414).jpg","author":"Simone Ramella from Roma, Italy","license":"CC BY 2.0","licenseUrl":"https://creativecommons.org/licenses/by/2.0","source":"https://commons.wikimedia.org/wiki/File:Stadio_dei_Marmi_e_Palazzo_della_Farnesina_(34393342414).jpg"}}},{"icon":"ticket","title":{"en":"MAXXI – contemporary art","it":"MAXXI – arte contemporanea","fr":"MAXXI – art contemporain","es":"MAXXI – arte contemporáneo","de":"MAXXI – zeitgenössische Kunst","ar":"متحف ماكسي – الفن المعاصر"},"text":{"en":"About **28 minutes** on foot across the river: the national museum of **21st-century art and architecture**, in **Zaha Hadid**’s spectacular building. Open **Tue–Sun 11:00–19:00** (ticket office until 18:00), **closed on Mondays**; tickets on **maxxi.art**.","it":"Circa **28 minuti** a piedi, oltre il fiume: il museo nazionale delle **arti del XXI secolo**, nello spettacolare edificio di **Zaha Hadid**. Aperto **mar–dom 11:00–19:00** (biglietteria fino alle 18:00), **chiuso il lunedì**; biglietti su **maxxi.art**.","fr":"Environ **28 minutes** à pied, de l’autre côté du fleuve : le musée national des **arts du XXIe siècle**, dans le spectaculaire bâtiment de **Zaha Hadid**. Ouvert **du mardi au dimanche, 11h00–19h00** (billetterie jusqu’à 18h00), **fermé le lundi** ; billets sur **maxxi.art**.","es":"Unos **28 minutos** a pie, al otro lado del río: el museo nacional de las **artes del siglo XXI**, en el espectacular edificio de **Zaha Hadid**. Abierto **mar–dom 11:00–19:00** (taquilla hasta las 18:00), **cerrado los lunes**; entradas en **maxxi.art**.","de":"Etwa **28 Gehminuten** jenseits des Flusses: das Nationalmuseum für **Kunst und Architektur des 21. Jahrhunderts** im spektakulären Bau von **Zaha Hadid**. Geöffnet **Di–So 11:00–19:00** (Kasse bis 18:00), **montags geschlossen**; Tickets auf **maxxi.art**.","ar":"حوالي **28 دقيقة** سيراً عبر النهر: المتحف الوطني **لفنون القرن الحادي والعشرين** في مبنى **زها حديد** المذهل. مفتوح **من الثلاثاء إلى الأحد 11:00–19:00** (شباك التذاكر حتى 18:00)، **مغلق يوم الإثنين**؛ التذاكر عبر **maxxi.art**."},"maps":"MAXXI, Via Guido Reni 4A, Roma","web":"www.maxxi.art"},{"icon":"music","title":{"en":"Auditorium Parco della Musica","it":"Auditorium Parco della Musica","fr":"Auditorium Parco della Musica","es":"Auditorium Parco della Musica","de":"Auditorium Parco della Musica","ar":"أوديتوريوم باركو ديلا موزيكا"},"text":{"en":"About **30 minutes** on foot: **Renzo Piano**’s three “beetle” concert halls, with classical music, jazz, pop concerts and festivals all year round. Check the programme on **auditorium.com**.","it":"Circa **30 minuti** a piedi: le tre sale “scarabeo” di **Renzo Piano**, con musica classica, jazz, concerti pop e festival tutto l’anno. Il programma è su **auditorium.com**.","fr":"Environ **30 minutes** à pied : les trois salles « scarabées » de **Renzo Piano**, avec musique classique, jazz, concerts pop et festivals toute l’année. Programme sur **auditorium.com**.","es":"Unos **30 minutos** a pie: las tres salas “escarabajo” de **Renzo Piano**, con música clásica, jazz, conciertos pop y festivales todo el año. Programa en **auditorium.com**.","de":"Etwa **30 Gehminuten**: die drei „Käfer“-Konzertsäle von **Renzo Piano** mit Klassik, Jazz, Popkonzerten und Festivals das ganze Jahr. Programm auf **auditorium.com**.","ar":"حوالي **30 دقيقة** سيراً: قاعات الحفلات الثلاث على شكل «خنافس» من تصميم **رينزو بيانو**، مع موسيقى كلاسيكية وجاز وحفلات بوب ومهرجانات طوال العام. البرنامج على **auditorium.com**."},"maps":"Auditorium Parco della Musica, Viale Pietro de Coubertin 30, Roma","web":"www.auditorium.com"},{"icon":"basket","title":{"en":"Ponte Milvio market","it":"Il mercato di Ponte Milvio","fr":"Le marché de Ponte Milvio","es":"El mercado de Ponte Milvio","de":"Der Markt von Ponte Milvio","ar":"سوق بونتي ميلفيو"},"text":{"en":"**15 minutes** on foot, in **Via Riano**: the covered neighbourhood market with fruit and vegetables, butchers, cheese and street food. **Mon–Sat 7:00–18:00**.","it":"A **15 minuti** a piedi, in **Via Riano**: il mercato coperto del quartiere, con frutta e verdura, macellerie, formaggi e street food. **Lun–sab 7:00–18:00**.","fr":"À **15 minutes** à pied, **Via Riano** : le marché couvert du quartier, avec fruits et légumes, boucheries, fromages et street food. **Lun–sam 7h00–18h00**.","es":"A **15 minutos** a pie, en **Via Riano**: el mercado cubierto del barrio, con fruta y verdura, carnicerías, quesos y comida callejera. **Lun–sáb 7:00–18:00**.","de":"**15 Gehminuten** entfernt in der **Via Riano**: die Markthalle des Viertels mit Obst und Gemüse, Metzgern, Käse und Streetfood. **Mo–Sa 7:00–18:00**.","ar":"على بُعد **15 دقيقة** سيراً في **Via Riano**: سوق الحي المغطّى بالفواكه والخضار والجزارين والأجبان وأطعمة الشارع. **الإثنين–السبت 7:00–18:00**."},"maps":"Mercato di Ponte Milvio, Via Riano 15, Roma"}]},{"type":"heading","text":{"en":"The great classics of the centre","it":"I grandi classici del centro","fr":"Les grands classiques du centre","es":"Los grandes clásicos del centro","de":"Die großen Klassiker im Zentrum","ar":"روائع وسط المدينة"}},{"type":"features","items":[{"icon":"column","title":{"en":"Piazza del Popolo and Piazza di Spagna","it":"Piazza del Popolo e Piazza di Spagna","fr":"Piazza del Popolo et Piazza di Spagna","es":"Piazza del Popolo y Piazza di Spagna","de":"Piazza del Popolo und Piazza di Spagna","ar":"ساحة الشعب وساحة إسبانيا"},"text":{"en":"Take **tram 2** from Mancini to **Flaminio** (about **10 minutes**): you get off at **Piazza del Popolo**, and the **Spanish Steps** are **10 minutes** further on foot along Via del Babuino.","it":"Prendete il **tram 2** da Mancini fino a **Flaminio** (circa **10 minuti**): scendete a **Piazza del Popolo**, e la **Scalinata di Trinità dei Monti** è a **10 minuti** a piedi lungo Via del Babuino.","fr":"Prenez le **tram 2** de Mancini jusqu’à **Flaminio** (environ **10 minutes**) : vous arrivez **Piazza del Popolo**, et l’**escalier de la Trinité-des-Monts** est à **10 minutes** à pied par la Via del Babuino.","es":"Tome el **tranvía 2** desde Mancini hasta **Flaminio** (unos **10 minutos**): llega a **Piazza del Popolo**, y la **escalinata de Trinità dei Monti** está a **10 minutos** a pie por Via del Babuino.","de":"Nehmen Sie die **Tram 2** von Mancini bis **Flaminio** (ca. **10 Minuten**): Sie kommen an der **Piazza del Popolo** an, die **Spanische Treppe** ist **10 Gehminuten** weiter über die Via del Babuino.","ar":"استقلّوا **الترام 2** من مانشيني حتى **فلامينيو** (حوالي **10 دقائق**): تنزلون في **ساحة الشعب**، و**درج ترينيتا دي مونتي** على بُعد **10 دقائق** سيراً عبر شارع بابوينو."},"maps":"Piazza del Popolo, Roma","photo":{"src":"img/piazza-di-spagna","own":true,"pos":"50% 0%"}},{"icon":"coin","title":{"en":"Trevi Fountain and the Pantheon","it":"Fontana di Trevi e Pantheon","fr":"Fontaine de Trevi et Panthéon","es":"Fontana de Trevi y Panteón","de":"Trevi-Brunnen und Pantheon","ar":"نافورة تريفي والبانثيون"},"text":{"en":"From **Piazza del Popolo** walk down **Via del Corso**: the **Trevi Fountain** (throw a coin to come back to Rome!) and the **Pantheon** are about **20 minutes** away. By taxi from home: about **20 minutes** (5.5 km).","it":"Da **Piazza del Popolo** scendete lungo **Via del Corso**: la **Fontana di Trevi** (lanciate una moneta per tornare a Roma!) e il **Pantheon** sono a circa **20 minuti**. In taxi da casa: circa **20 minuti** (5,5 km).","fr":"Depuis la **Piazza del Popolo**, descendez la **Via del Corso** : la **fontaine de Trevi** (lancez une pièce pour revenir à Rome !) et le **Panthéon** sont à environ **20 minutes**. En taxi depuis l’appartement : environ **20 minutes** (5,5 km).","es":"Desde **Piazza del Popolo** baje por **Via del Corso**: la **Fontana de Trevi** (¡lance una moneda para volver a Roma!) y el **Panteón** están a unos **20 minutos**. En taxi desde casa: unos **20 minutos** (5,5 km).","de":"Von der **Piazza del Popolo** die **Via del Corso** hinunter: **Trevi-Brunnen** (werfen Sie eine Münze, um wiederzukommen!) und **Pantheon** sind etwa **20 Minuten** entfernt. Mit dem Taxi ab der Wohnung: etwa **20 Minuten** (5,5 km).","ar":"من **ساحة الشعب** انزلوا عبر **شارع كورسو**: **نافورة تريفي** (ارموا قطعة نقدية لتعودوا إلى روما!) و**البانثيون** على بُعد حوالي **20 دقيقة**. بالتاكسي من المنزل: حوالي **20 دقيقة** (5.5 كم)."},"maps":"Fontana di Trevi, Roma","photo":{"src":"img/trevi-fountain","own":true,"pos":"50% 40%"}},{"icon":"dome","title":{"en":"St. Peter’s and the Vatican","it":"San Pietro e il Vaticano","fr":"Saint-Pierre et le Vatican","es":"San Pedro y el Vaticano","de":"Petersdom und Vatikan","ar":"القديس بطرس والفاتيكان"},"text":{"en":"Bus **32** from the **Ponte Milvio** stop (**9 minutes** on foot) goes straight to **Piazza Risorgimento**, a few minutes from **St. Peter’s Square** and the **Vatican Museums** (book ahead on **museivaticani.va**).","it":"Il bus **32** dalla fermata **Ponte Milvio** (a **9 minuti** a piedi) arriva direttamente a **Piazza Risorgimento**, a pochi minuti da **Piazza San Pietro** e dai **Musei Vaticani** (prenotate su **museivaticani.va**).","fr":"Le bus **32**, depuis l’arrêt **Ponte Milvio** (à **9 minutes** à pied), va directement à la **Piazza Risorgimento**, à quelques minutes de la **place Saint-Pierre** et des **musées du Vatican** (réservez sur **museivaticani.va**).","es":"El autobús **32**, desde la parada **Ponte Milvio** (a **9 minutos** a pie), llega directamente a **Piazza Risorgimento**, a pocos minutos de la **Plaza de San Pedro** y de los **Museos Vaticanos** (reserve en **museivaticani.va**).","de":"Der Bus **32** ab der Haltestelle **Ponte Milvio** (**9 Gehminuten**) fährt direkt zur **Piazza Risorgimento**, wenige Minuten vom **Petersplatz** und den **Vatikanischen Museen** (vorab buchen auf **museivaticani.va**).","ar":"الحافلة **32** من محطة **Ponte Milvio** (على بُعد **9 دقائق** سيراً) تصل مباشرة إلى **ساحة ريزورجيمنتو**، على بُعد دقائق من **ساحة القديس بطرس** و**متاحف الفاتيكان** (احجزوا عبر **museivaticani.va**)."},"maps":"Piazza San Pietro, Città del Vaticano","photo":{"src":"rome/st-peters-square","place":"Piazza San Pietro","area":false,"credit":{"title":"Piazza San Pietro Panorama from basilica.jpg","author":"Till Niermann","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","source":"https://commons.wikimedia.org/wiki/File:Piazza_San_Pietro_Panorama_from_basilica.jpg"}}}]},{"type":"heading","text":{"en":"Local activities","it":"Attività in zona","fr":"Activités locales","es":"Actividades locales","de":"Aktivitäten vor Ort","ar":"أنشطة محلية"}},{"type":"list","grid":true,"items":[{"icon":"bike","title":{"en":"Cycling","it":"In bicicletta","fr":"Vélo","es":"En bicicleta","de":"Radfahren","ar":"ركوب الدراجات"},"text":{"en":"Explore **Villa Borghese**, the Tiber, Trastevere, the Vatican and Monti.","it":"Esplorate **Villa Borghese**, il Tevere, Trastevere, il Vaticano e Monti.","fr":"Explorez la **Villa Borghèse**, le Tibre, le Trastevere, le Vatican et Monti.","es":"Explore **Villa Borghese**, el Tíber, Trastevere, el Vaticano y Monti.","de":"Erkunden Sie die **Villa Borghese**, den Tiber, Trastevere, den Vatikan und Monti.","ar":"استكشفوا **فيلا بورغيزي** ونهر التيبر وتراستيفيري والفاتيكان وحي مونتي."},"photo":{"src":"rome/villa-borghese","place":"Villa Borghese","area":false,"credit":{"title":"Piazza di Siena Villa Borghese Roma 2012.JPG","author":"Felix König","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","source":"https://commons.wikimedia.org/wiki/File:Piazza_di_Siena_Villa_Borghese_Roma_2012.JPG"}}},{"icon":"boat","title":{"en":"Boating","it":"In barca","fr":"Balade en barque","es":"En barca","de":"Bootfahren","ar":"نزهة بالقارب"},"text":{"en":"**Boat trip** on the lake at Villa Borghese.","it":"**Giro in barca** sul laghetto di Villa Borghese.","fr":"**Promenade en barque** sur le lac de la Villa Borghèse.","es":"**Paseo en barca** por el lago de Villa Borghese.","de":"**Bootsfahrt** auf dem See der Villa Borghese.","ar":"**جولة بالقارب** في بحيرة فيلا بورغيزي."},"maps":"Laghetto di Villa Borghese, Roma","photo":{"src":"img/villa-borghese-lake","own":true,"pos":"50% 30%"}},{"icon":"picnic","title":{"en":"Picnic","it":"Picnic","fr":"Pique-nique","es":"Pícnic","de":"Picknick","ar":"نزهة في الهواء الطلق"},"text":{"en":"Have lunch outdoors at **Villa Borghese** or on the **Gianicolo** Hill.","it":"Pranzate all’aperto a **Villa Borghese** o sul colle del **Gianicolo**.","fr":"Déjeunez en plein air à la **Villa Borghèse *partir plus tard**, contactez-nous : nous vérifierons la disponibilité et vous confirmerons selon notre planning. Vous pouvez également nous laisser vos bagages **jusqu’à 13h00**, à condition qu’ils soient bien fermés.","es":"Si desea **salir más tarde**, contáctenos y comprobaremos la disponibilidad y se la confirmaremos según nuestra programación. También puede dejarnos su equipaje **hasta las 13:00**, siempre que esté bien cerrado.","de":"Wenn Sie **später abreisen** möchten, kontaktieren Sie uns bitte – wir prüfen die Verfügbarkeit und bestätigen sie entsprechend unserem Zeitplan. Sie können Ihr Gepäck auch **bis 13:00 Uhr** bei uns lassen, sofern es gut verschlossen ist.","ar":"إذا رغبتم في **المغادرة في وقت لاحق**، يُرجى التواصل معنا وسنتحقق من التوفر ونؤكد لكم ذلك حسب جدولنا. يمكنكم أيضاً ترك أمتعتكم لدينا **حتى الساعة 13:00**، بشرط أن تكون مغلقة بإحكام."}},{"type":"checklist","title":{"en":"Before leaving – in this order","it":"Prima di partire – in quest’ordine","fr":"Avant de partir – dans cet ordre","es":"Antes de salir – en este orden","de":"Vor der Abreise – in dieser Reihenfolge","ar":"قبل المغادرة – بهذا الترتيب"},"items":[{"icon":"clock","title":{"en":"Leave by 10:00","it":"Uscite entro le 10:00","fr":"Départ avant 10h00","es":"Salida antes de las 10:00","de":"Abreise bis 10:00 Uhr","ar":"المغادرة قبل 10:00"},"text":{"en":"Check-out is by **10:00**. Make sure you **haven’t forgotten anything**.","it":"Il check-out è entro le **10:00**. Controllate di **non aver dimenticato nulla**.","fr":"Le départ se fait avant **10h00**. Vérifiez que vous **n’avez rien oublié**.","es":"El check-out es antes de las **10:00**. Compruebe que **no ha olvidado nada**.","de":"Check-out ist bis **10:00 Uhr**. Prüfen Sie, dass Sie **nichts vergessen** haben.","ar":"موعد المغادرة قبل **10:00**. تأكّدوا من أنكم **لم تنسوا شيئاً**."}},{"icon":"power","title":{"en":"Lights and devices off","it":"Luci e apparecchi spenti","fr":"Lumières et appareils éteints","es":"Luces y aparatos apagados","de":"Licht und Geräte aus","ar":"إطفاء الأضواء والأجهزة"},"text":{"en":"**Turn off** all lights and electrical devices.","it":"**Spegnete** tutte le luci e gli apparecchi elettrici.","fr":"**Éteignez** toutes les lumières et les appareils électriques.","es":"**Apague** todas las luces y los aparatos eléctricos.","de":"**Schalten Sie** alle Lichter und Elektrogeräte **aus**.","ar":"**أطفئوا** جميع الأضواء والأجهزة الكهربائية."}},{"icon":"house","title":{"en":"Windows closed","it":"Finestre chiuse","fr":"Fenêtres fermées","es":"Ventanas cerradas","de":"Fenster geschlossen","ar":"النوافذ مغلقة"},"text":{"en":"**Close all the windows.**","it":"**Chiudete tutte le finestre.**","fr":"**Fermez toutes les fenêtres.**","es":"**Cierre todas las ventanas.**","de":"**Schließen Sie alle Fenster.**","ar":"**أغلقوا جميع النوافذ.**"}},{"icon":"euro","title":{"en":"Tourist tax","it":"Tassa di soggiorno","fr":"Taxe de séjour","es":"Tasa turística","de":"Kurtaxe","ar":"ضريبة السياحة"},"text":{"en":"Leave it **in cash on the table** (€6 per person per night).","it":"Lasciatela **in contanti sul tavolo** (6 € a persona a notte).","fr":"Laissez-la **en espèces sur la table** (6 € par personne et par nuit).","es":"Déjela **en efectivo sobre la mesa** (6 € por persona y noche).","de":"Lassen Sie sie **in bar auf dem Tisch** (6 € pro Person und Nacht).","ar":"اتركوها **نقدًا على الطاولة** (6 يورو للشخص في الليلة)."}},{"icon":"door","title":{"en":"Close the door","it":"Chiudete la porta","fr":"Fermez la porte","es":"Cierre la puerta","de":"Tür schließen","ar":"أغلقوا الباب"},"text":{"en":"Go out and **close the apartment door**.","it":"Uscite e **chiudete la porta di casa**.","fr":"Sortez et **fermez la porte de l’appartement**.","es":"Salga y **cierre la puerta del apartamento**.","de":"Gehen Sie hinaus und **schließen Sie die Wohnungstür**.","ar":"اخرجوا و**أغلقوا باب الشقة**."}},{"icon":"key","title":{"en":"Keys in the lockbox","it":"Chiavi nella cassetta","fr":"Clés dans la boîte","es":"Llaves en la caja","de":"Schlüssel in den Safe","ar":"المفاتيح في الصندوق"},"text":{"en":"Put the keys back in the **lockbox on the door** and close it.","it":"Rimettete le chiavi nella **cassetta sulla porta** e chiudetela.","fr":"Remettez les clés dans la **boîte à clés sur la porte** et refermez-la.","es":"Vuelva a dejar las llaves en la **caja de la puerta** y ciérrela.","de":"Legen Sie die Schlüssel zurück in den **Schlüsselsafe an der Tür** und schließen Sie ihn.","ar":"أعيدوا المفاتيح إلى **الصندوق الموجود على الباب** وأغلقوه."}},{"icon":"rotate","title":{"en":"Scramble the code","it":"Mescolate il codice","fr":"Brouillez le code","es":"Mezcle el código","de":"Code verstellen","ar":"غيّروا أرقام الرمز"},"text":{"en":"**Scramble the code** on the lockbox, **otherwise it stays open**.","it":"**Mescolate le cifre** della cassetta, **altrimenti resta aperta**.","fr":"**Brouillez les chiffres** de la boîte, **sinon elle reste ouverte**.","es":"**Mezcle los dígitos** de la caja; **de lo contrario, se queda abierta**.","de":"**Verstellen Sie die Ziffern** am Safe, **sonst bleibt er offen**.","ar":"**غيّروا أرقام** الصندوق، **وإلا سيبقى مفتوحاً**."}}]},{"type":"notice","tone":"important","icon":"key","title":{"en":"Important","it":"Importante","fr":"Important","es":"Importante","de":"Wichtig","ar":"مهم"},"text":{"en":"After putting the keys in the lockbox, always **scramble the code**: otherwise the box **stays open**.","it":"Dopo aver messo le chiavi nella cassetta, **mescolate sempre il codice**: altrimenti la cassetta **resta aperta**.","fr":"Après avoir remis les clés dans la boîte, **brouillez toujours le code** : sinon la boîte **reste ouverte**.","es":"Después de dejar las llaves en la caja, **mezcle siempre el código**: de lo contrario, la caja **se queda abierta**.","de":"Nachdem Sie die Schlüssel in den Safe gelegt haben, **verstellen Sie immer den Code**: sonst **bleibt der Safe offen**.","ar":"بعد وضع المفاتيح في الصندوق، **غيّروا أرقام الرمز دائماً**: وإلا **سيبقى الصندوق مفتوحاً**."}},{"type":"closing","text":{"en":"Thank you!","it":"Grazie!","fr":"Merci !","es":"¡Gracias!","de":"Vielen Dank!","ar":"شكراً لكم!"}}]},{"id":"contact","icon":"phone","title":{"en":"Contact","it":"Contatti","fr":"Contact","es":"Contacto","de":"Kontakt","ar":"التواصل"},"blocks":[{"type":"host","text":{"en":"Dear travelers, I am here to assist you whenever you need. If you encounter any issues or have any questions, please do not hesitate to contact me **by phone or email**. I am **always available** to help make your stay as pleasant and stress-free as possible.","it":"Cari viaggiatori, sono qui per assistervi ogni volta che ne avrete bisogno. Se incontrate qualche problema o avete domande, non esitate a contattarmi **per telefono o via email**. Sono **sempre disponibile** per rendere il vostro soggiorno il più piacevole e sereno possibile.","fr":"Chers voyageurs, je suis là pour vous aider à tout moment. Si vous rencontrez un problème ou avez des questions, n’hésitez pas à me contacter **par téléphone ou par e-mail**. Je suis **toujours disponible** pour rendre votre séjour aussi agréable et serein que possible.","es":"Queridos viajeros, estoy aquí para ayudarles siempre que lo necesiten. Si tienen algún problema o alguna pregunta, no duden en contactarme **por teléfono o por correo electrónico**. **Siempre estoy disponible** para que su estancia sea lo más agradable y tranquila posible.","de":"Liebe Reisende, ich bin jederzeit für Sie da. Wenn Probleme auftreten oder Sie Fragen haben, zögern Sie nicht, mich **telefonisch oder per E-Mail** zu kontaktieren. Ich helfe Ihnen **immer gern**, Ihren Aufenthalt so angenehm und entspannt wie möglich zu gestalten.","ar":"أعزاءنا المسافرين، أنا هنا لمساعدتكم متى احتجتم إلى ذلك. إذا واجهتم أي مشكلة أو كان لديكم أي سؤال، فلا تترددوا في التواصل معي **عبر الهاتف أو البريد الإلكتروني**. أنا **متاح دائماً** لأجعل إقامتكم ممتعة ومريحة قدر الإمكان."}},{"type":"review","text":{"en":"We hop
