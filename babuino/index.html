ida","de":"Willkommen","ar":"مرحباً بكم"},"blocks":[{"type":"lead","text":{"en":"We are pleased to welcome you to our accommodation and we hope you will have an **unforgettable stay**.","it":"Siamo lieti di accogliervi nella nostra struttura e speriamo che il vostro soggiorno sia **indimenticabile**.","fr":"Nous sommes ravis de vous accueillir dans notre logement et espérons que votre séjour sera **inoubliable**.","es":"Nos complace darle la bienvenida a nuestro alojamiento y esperamos que disfrute de una **estancia inolvidable**.","de":"Wir freuen uns, Sie in unserer Unterkunft willkommen zu heißen, und wünschen Ihnen einen **unvergesslichen Aufenthalt**.","ar":"يسعدنا أن نرحب بكم في مسكننا، ونتمنى لكم **إقامة لا تُنسى**."}},{"type":"photo","src":"img/living-bedroom","alt":{"en":"The apartment","it":"L’appartamento","fr":"L’appartement","es":"El apartamento","de":"Die Wohnung","ar":"الشقة"}},{"type":"text","text":{"en":"We wish you an **excellent stay** in our beautiful city and hope to **see you again soon**!","it":"Vi auguriamo un **ottimo soggiorno** nella nostra splendida città e speriamo di **rivedervi presto**!","fr":"Nous vous souhaitons un **excellent séjour** dans notre belle ville et espérons **vous revoir très bientôt** !","es":"¡Le deseamos una **excelente estancia** en nuestra hermosa ciudad y esperamos **volver a verle pronto**!","de":"Wir wünschen Ihnen einen **wunderbaren Aufenthalt** in unserer schönen Stadt und hoffen, Sie **bald wiederzusehen**!","ar":"نتمنى لكم **إقامة ممتعة** في مدينتنا الجميلة، ونأمل أن **نراكم مجدداً قريباً**!"}},{"type":"signature","text":"Rome Dream Home"}]},{"id":"checkin","icon":"key","title":{"en":"Check-in","it":"Check-in","fr":"Arrivée","es":"Check-in","de":"Check-in","ar":"تسجيل الوصول"},"blocks":[{"type":"time","value":"15:00","label":{"en":"Self check-in","it":"Self check-in","fr":"Self check-in","es":"Self check-in","de":"Self-Check-in","ar":"تسجيل الوصول الذاتي"}},{"type":"text","text":{"en":"You can arrive **at any time**, even late at night: just **call us** when you are at the street door.","it":"Potete arrivare **a qualsiasi ora**, anche a tarda notte: basta **chiamarci** quando siete davanti al portone.","fr":"Vous pouvez arriver **à toute heure**, même tard le soir : il suffit de **nous appeler** une fois devant la porte de l’immeuble.","es":"Puede llegar **a cualquier hora**, incluso de madrugada: solo tiene que **llamarnos** cuando esté delante del portal.","de":"Sie können **jederzeit** anreisen, auch spät in der Nacht: **Rufen Sie uns einfach an**, wenn Sie vor der Haustür stehen.","ar":"يمكنكم الوصول **في أي وقت**، حتى في ساعة متأخرة من الليل: يكفي أن **تتصلوا بنا** عندما تكونون أمام باب المبنى."}},{"type":"text","text":{"en":"Please respect the check-in times. If you would like to arrive earlier, no problem at all: you can **drop off your luggage from 11:00** and take the keys, then **come back at 15:00** when the apartment will be ready.","it":"Vi preghiamo di rispettare gli orari di check-in. Se desiderate arrivare prima, nessun problema: potete **lasciare i bagagli a partire dalle 11:00** e ritirare le chiavi, per poi **tornare alle 15:00**, quando l’appartamento sarà pronto.","fr":"Merci de respecter les horaires d’arrivée. Si vous souhaitez arriver plus tôt, aucun problème : vous pouvez **déposer vos bagages à partir de 11h00** et récupérer les clés, puis **revenir à 15h00**, lorsque l’appartement sera prêt.","es":"Le rogamos que respete los horarios de check-in. Si desea llegar antes, no hay ningún problema: puede **dejar su equipaje a partir de las 11:00** y recoger las llaves, y luego **volver a las 15:00**, cuando el apartamento esté listo.","de":"Bitte halten Sie die Check-in-Zeiten ein. Wenn Sie früher ankommen möchten, ist das kein Problem: Sie können Ihr **Gepäck ab 11:00 Uhr abstellen** und die Schlüssel abholen und dann **um 15:00 Uhr zurückkommen**, wenn die Wohnung bereit ist.","ar":"يُرجى الالتزام بمواعيد تسجيل الوصول. إذا رغبتم في الوصول مبكراً فلا مشكلة إطلاقاً: يمكنكم **ترك أمتعتكم ابتداءً من الساعة 11:00** واستلام المفاتيح، ثم **العودة في الساعة 15:00** عندما تكون الشقة جاهزة."}},{"type":"heading","text":{"en":"House access","it":"Accesso alla casa","fr":"Accès au logement","es":"Acceso a la vivienda","de":"Zugang zur Wohnung","ar":"الدخول إلى المنزل"}},{"type":"photo","src":"img/entrance","alt":{"en":"Building entrance","it":"Ingresso del palazzo","fr":"Entrée de l’immeuble","es":"Entrada del edificio","de":"Hauseingang","ar":"مدخل المبنى"}},{"type":"steps","items":[{"en":"At **Via del Babuino 169**, **call us**: we open the **street door** remotely right away.","it":"Arrivati in **Via del Babuino 169**, **chiamateci**: vi apriamo subito il **portone** a distanza.","fr":"Arrivés au **Via del Babuino 169**, **appelez-nous** : nous ouvrons aussitôt la **porte de l’immeuble** à distance.","es":"Al llegar a **Via del Babuino 169**, **llámenos**: le abrimos enseguida el **portal** a distancia.","de":"In der **Via del Babuino 169** angekommen, **rufen Sie uns an**: Wir öffnen die **Haustür** sofort aus der Ferne.","ar":"عند وصولكم إلى **Via del Babuino 169**، **اتصلوا بنا**: سنفتح لكم **باب المبنى** عن بُعد فوراً."},{"en":"Take the elevator or the stairs to the **2nd floor** – two floors above street level, **elevator button 2**.","it":"Salite con l’ascensore o a piedi al **2° piano** – due piani sopra il livello della strada, **pulsante 2 dell’ascensore**.","fr":"Montez en ascenseur ou par l’escalier au **2e étage** – deux étages au-dessus de la rue, **bouton 2 de l’ascenseur**.","es":"Suba en ascensor o por la escalera a la **2ª planta** – dos pisos por encima de la calle, **botón 2 del ascensor**.","de":"Fahren Sie mit dem Aufzug oder gehen Sie zu Fuß in den **2. Stock** – zwei Etagen über Straßenniveau, **Aufzugsknopf 2**.","ar":"اصعدوا بالمصعد أو عبر الدرج إلى **الطابق الثاني** – طابقان فوق مستوى الشارع، **زر المصعد 2**."},{"en":"The apartment door is **immediately on your left**.","it":"La porta dell’appartamento è **subito sulla sinistra**.","fr":"La porte de l’appartement est **immédiatement sur votre gauche**.","es":"La puerta del apartamento está **justo a su izquierda**.","de":"Die Wohnungstür befindet sich **direkt links** von Ihnen.","ar":"باب الشقة **على يساركم مباشرةً**."},{"en":"The **lockbox is on the apartment door**: enter the code **9321**, open it and **take the keys**.","it":"La **cassetta è sulla porta di casa**: inserite il codice **9321**, apritela e **prendete le chiavi**.","fr":"La **boîte à clés est sur la porte de l’appartement** : saisissez le code **9321**, ouvrez-la et **prenez les clés**.","es":"La **caja de llaves está en la puerta del apartamento**: introduzca el código **9321**, ábrala y **coja las llaves**.","de":"Der **Schlüsselsafe hängt an der Wohnungstür**: Geben Sie den Code **9321** ein, öffnen Sie ihn und **nehmen Sie die Schlüssel**.","ar":"**صندوق المفاتيح موجود على باب الشقة**: أدخلوا الرمز **9321**، افتحوه و**خذوا المفاتيح**."},{"en":"Go inside and **close the door** behind you. **Welcome!**","it":"Entrate e **chiudete la porta** alle vostre spalle. **Benvenuti!**","fr":"Entrez et **refermez la porte** derrière vous. **Bienvenue !**","es":"Entre y **cierre la puerta** detrás de usted. **¡Bienvenidos!**","de":"Treten Sie ein und **schließen Sie die Tür** hinter sich. **Willkommen!**","ar":"ادخلوا و**أغلقوا الباب** خلفكم. **أهلاً وسهلاً!**"}]},{"type":"arrival"},{"type":"code","label":{"en":"Lockbox code · on the apartment door","it":"Codice cassetta · sulla porta di casa","fr":"Code de la boîte à clés · sur la porte","es":"Código de la caja · en la puerta","de":"Schlüsselsafe-Code · an der Wohnungstür","ar":"رمز صندوق المفاتيح · على باب الشقة"},"value":"9321","icon":"lock"},{"type":"notice","tone":"warning","icon":"elevator","title":{"en":"Elevator & lights","it":"Ascensore e luci","fr":"Ascenseur et lumières","es":"Ascensor y luces","de":"Aufzug & Licht","ar":"المصعد والإضاءة"},"text":{"en":"Old-style elevator with **two doors**: always close **BOTH doors** (outer and inner), otherwise the elevator **stops working for everyone**, including the elderly residents. The apartment’s lighting system is similar to that found in hotels, so every time you open the door, **the lights turn off automatically**. To turn them back on, **close the door and simply press the button**.","it":"Ascensore d’epoca con **due porte**: chiudete sempre **ENTRAMBE le porte** (esterna e interna), altrimenti l’ascensore **si blocca per tutti**, compresi i residenti anziani. L’impianto di illuminazione dell’appartamento è simile a quello degli hotel: ogni volta che aprite la porta, **le luci si spengono automaticamente**. Per riaccenderle, **chiudete la porta e premete semplicemente il pulsante**.","fr":"Ascenseur ancien à **deux portes** : refermez toujours **LES DEUX portes** (extérieure et intérieure), sinon l’ascenseur **ne fonctionne plus pour personne**, y compris pour les résidents âgés. Le système d’éclairage de l’appartement est semblable à celui des hôtels : chaque fois que vous ouvrez la porte, **les lumières s’éteignent automatiquement**. Pour les rallumer, **fermez la porte et appuyez simplement sur le bouton**.","es":"Ascensor antiguo con **dos puertas**: cierre siempre **AMBAS puertas** (exterior e interior); de lo contrario, el ascensor **deja de funcionar para todos**, incluidos los residentes mayores. El sistema de iluminación del apartamento es similar al de los hoteles: cada vez que abre la puerta, **las luces se apagan automáticamente**. Para volver a encenderlas, **cierre la puerta y simplemente pulse el botón**.","de":"Historischer Aufzug mit **zwei Türen**: Schließen Sie immer **BEIDE Türen** (außen und innen), sonst **funktioniert der Aufzug für niemanden mehr** – auch nicht für die älteren Bewohner. Das Lichtsystem der Wohnung ähnelt dem in Hotels: Jedes Mal, wenn Sie die Tür öffnen, **gehen die Lichter automatisch aus**. Um sie wieder einzuschalten, **schließen Sie die Tür und drücken Sie einfach den Schalter**.","ar":"مصعد قديم **ببابين**: أغلقوا دائماً **البابين كليهما** (الخارجي والداخلي)، وإلا **سيتوقف المصعد عن العمل للجميع**، بمن فيهم السكان المسنّون. نظام الإضاءة في الشقة مشابه لما هو موجود في الفنادق، لذا في كل مرة تفتحون فيها الباب **تنطفئ الأضواء تلقائياً**. لإعادة تشغيلها، **أغلقوا الباب واضغطوا على الزر** ببساطة."}},{"type":"tax","text":{"en":"Rome **tourist tax**: **€6 per person per night**. Please leave it **in cash** on the table before you leave.","it":"**Tassa di soggiorno** di Roma: **6 € a persona a notte**. Lasciatela **in contanti** sul tavolo prima di partire.","fr":"**Taxe de séjour** de Rome : **6 € par personne et par nuit**. Merci de la laisser **en espèces** sur la table avant votre départ.","es":"**Tasa turística** de Roma: **6 € por persona y noche**. Déjela **en efectivo** sobre la mesa antes de marcharse.","de":"Römische **Kurtaxe**: **6 € pro Person und Nacht**. Bitte lassen Sie sie vor der Abreise **in bar** auf dem Tisch.","ar":"**ضريبة السياحة** في روما: **6 يورو للشخص في الليلة**. يُرجى تركها **نقدًا** على الطاولة قبل المغادرة."}},{"type":"problems","items":[{"icon":"door","q":{"en":"The street door doesn’t open?","it":"Il portone non si apre?","fr":"La porte de l’immeuble ne s’ouvre pas ?","es":"¿El portal no se abre?","de":"Die Haustür geht nicht auf?","ar":"باب المبنى لا يُفتح؟"},"a":{"en":"**Call us** again: we open it **remotely**.","it":"**Richiamateci**: lo apriamo **a distanza**.","fr":"**Rappelez-nous** : nous l’ouvrons **à distance**.","es":"**Vuelva a llamarnos**: lo abrimos **a distancia**.","de":"**Rufen Sie uns erneut an**: Wir öffnen sie **aus der Ferne**.","ar":"**اتصلوا بنا مجدداً**: سنفتحه **عن بُعد**."}},{"icon":"lock","q":{"en":"The lockbox won’t open?","it":"La cassetta non si apre?","fr":"La boîte à clés ne s’ouvre pas ?","es":"¿La caja de llaves no se abre?","de":"Der Schlüsselsafe geht nicht auf?","ar":"صندوق المفاتيح لا يُفتح؟"},"a":{"en":"Check that **each digit** is set to **9321**, then try again. Still closed? **Call us**.","it":"Controllate che **ogni cifra** sia su **9321** e riprovate. Ancora chiusa? **Chiamateci**.","fr":"Vérifiez que **chaque chiffre** est bien sur **9321**, puis réessayez. Toujours fermée ? **Appelez-nous**.","es":"Compruebe que **cada dígito** esté en **9321** e inténtelo de nuevo. ¿Sigue cerrada? **Llámenos**.","de":"Prüfen Sie, ob **jede Ziffer** auf **9321** steht, und versuchen Sie es erneut. Immer noch zu? **Rufen Sie uns an**.","ar":"تأكّدوا من أن **كل رقم** مضبوط على **9321** ثم حاولوا مجدداً. ما زال مغلقاً؟ **اتصلوا بنا**."}},{"icon":"clock","q":{"en":"Arriving late?","it":"Arrivate tardi?","fr":"Vous arrivez tard ?","es":"¿Llega tarde?","de":"Späte Ankunft?","ar":"ستصلون متأخرين؟"},"a":{"en":"**No time limit**: just **call us** at the door.","it":"**Nessun limite di orario**: basta **chiamarci** davanti al portone.","fr":"**Aucune limite d’horaire** : il suffit de **nous appeler** devant la porte.","es":"**Sin límite de horario**: solo tiene que **llamarnos** desde el portal.","de":"**Keine Zeitbegrenzung**: **Rufen Sie uns** einfach an der Tür **an**.","ar":"**لا يوجد حدّ زمني**: يكفي أن **تتصلوا بنا** عند الباب."}},{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]},{"type":"closing","text":{"en":"Thank you very much for your **understanding and cooperation**.","it":"Grazie mille per la vostra **comprensione e collaborazione**.","fr":"Merci beaucoup pour votre **compréhension et votre coopération**.","es":"Muchas gracias por su **comprensión y colaboración**.","de":"Vielen Dank für Ihr **Verständnis und Ihre Mitarbeit**.","ar":"شكراً جزيلاً **لتفهمكم وتعاونكم**."}}]},{"id":"location","icon":"pin","title":{"en":"Location","it":"Posizione","fr":"Accès","es":"Ubicación","de":"Anreise","ar":"الموقع"},"blocks":[{"type":"address"},{"type":"heading","text":{"en":"How to arrive?","it":"Come arrivare?","fr":"Comment arriver ?","es":"¿Cómo llegar?","de":"Wie komme ich hin?","ar":"كيف تصلون إلينا؟"}},{"type":"tabs","label":{"en":"Arrive from","it":"Arrivo da","fr":"Arriver depuis","es":"Llegar desde","de":"Anreise von","ar":"الوصول من"},"tabs":[{"label":{"en":"Fiumicino Airport","it":"Aeroporto di Fiumicino","fr":"Aéroport de Fiumicino","es":"Aeropuerto de Fiumicino","de":"Flughafen Fiumicino","ar":"مطار فيوميتشينو"},"origin":"Fiumicino Airport (FCO), Rome","routes":[{"icon":"train","title":{"en":"Train (Leonardo Express)","it":"Treno (Leonardo Express)","fr":"Train (Leonardo Express)","es":"Tren (Leonardo Express)","de":"Zug (Leonardo Express)","ar":"القطار (ليوناردو إكسبريس)"},"text":{"en":"Take the **Leonardo Express** from Fiumicino Airport to Roma Termini Station (direct trip, **about 32 minutes**). Then take **metro line A** towards Battistini and get off at Flaminio. Walk about 5 minutes to Via del Babuino.","it":"Prendete il **Leonardo Express** dall’aeroporto di Fiumicino alla stazione Roma Termini (corsa diretta, **circa 32 minuti**). Poi prendete la **metro linea A** direzione Battistini e scendete a Flaminio. Proseguite a piedi per circa 5 minuti fino a Via del Babuino.","fr":"Prenez le **Leonardo Express** de l’aéroport de Fiumicino jusqu’à la gare Roma Termini (trajet direct, **environ 32 minutes**). Prenez ensuite la **ligne A du métro** direction Battistini et descendez à Flaminio. Marchez environ 5 minutes jusqu’à la Via del Babuino.","es":"Tome el **Leonardo Express** desde el aeropuerto de Fiumicino hasta la estación Roma Termini (trayecto directo, **unos 32 minutos**). Después tome la **línea A del metro** dirección Battistini y bájese en Flaminio. Camine unos 5 minutos hasta Via del Babuino.","de":"Nehmen Sie den **Leonardo Express** vom Flughafen Fiumicino zum Bahnhof Roma Termini (Direktfahrt, **ca. 32 Minuten**). Fahren Sie dann mit der **Metrolinie A** Richtung Battistini bis Flaminio. Von dort sind es etwa 5 Minuten zu Fuß bis zur Via del Babuino.","ar":"استقلوا قطار **ليوناردو إكسبريس** من مطار فيوميتشينو إلى محطة روما تيرميني (رحلة مباشرة، **حوالي 32 دقيقة**). ثم استقلوا **خط المترو A** باتجاه باتيستيني وانزلوا في محطة فلامينيو. سيروا حوالي 5 دقائق حتى فيا ديل بابوينو."},"price":{"en":"Total price: **around €15.50** (€14 for the train + €1.50 for the metro).","it":"Prezzo totale: **circa 15,50 €** (14 € il treno + 1,50 € la metro).","fr":"Prix total : **environ 15,50 €** (14 € pour le train + 1,50 € pour le métro).","es":"Precio total: **unos 15,50 €** (14 € el tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 15,50 €** (14 € für den Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 15.50 يورو** (14 يورو للقطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus to Roma Termini (approx. 50 minutes), then **metro line A** towards Battistini to **Flaminio**.","it":"Prendete un autobus **Terravision** fino a Roma Termini (circa 50 minuti), poi la **metro linea A** direzione Battistini fino a **Flaminio**.","fr":"Prenez un bus **Terravision** jusqu’à Roma Termini (environ 50 minutes), puis la **ligne A du métro** direction Battistini jusqu’à **Flaminio**.","es":"Tome un autobús **Terravision** hasta Roma Termini (aprox. 50 minutos) y después la **línea A del metro** dirección Battistini hasta **Flaminio**.","de":"Nehmen Sie einen **Terravision**-Bus nach Roma Termini (ca. 50 Minuten) und dann die **Metrolinie A** Richtung Battistini bis **Flaminio**.","ar":"استقلوا حافلة **تيرافيجن** إلى روما تيرميني (حوالي 50 دقيقة)، ثم **خط المترو A** باتجاه باتيستيني حتى محطة **فلامينيو**."},"price":{"en":"Total price: **from about €5.50** (Terravision bus from €4 + €1.50 metro).","it":"Prezzo totale: **da circa 5,50 €** (bus Terravision da 4 € + 1,50 € metro).","fr":"Prix total : **à partir d’environ 5,50 €** (bus Terravision dès 4 € + 1,50 € le métro).","es":"Precio total: **desde unos 5,50 €** (autobús Terravision desde 4 € + 1,50 € el metro).","de":"Gesamtpreis: **ab ca. 5,50 €** (Terravision-Bus ab 4 € + 1,50 € Metro).","ar":"السعر الإجمالي: **ابتداءً من حوالي 5.50 يورو** (حافلة تيرافيجن ابتداءً من 4 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis charge a **fixed fare of €55** from Fiumicino to the city centre (inside the Aurelian Walls), luggage included.","it":"I taxi ufficiali bianchi applicano una **tariffa fissa di 55 €** da Fiumicino al centro città (entro le Mura Aureliane), bagagli inclusi.","fr":"Les taxis officiels blancs appliquent un **tarif fixe de 55 €** de Fiumicino au centre-ville (à l’intérieur du mur d’Aurélien), bagages compris.","es":"Los taxis oficiales blancos aplican una **tarifa fija de 55 €** desde Fiumicino hasta el centro de la ciudad (dentro de las Murallas Aurelianas), equipaje incluido.","de":"Offizielle weiße Taxis berechnen von Fiumicino ins Stadtzentrum (innerhalb der Aurelianischen Mauer) einen **Festpreis von 55 €**, Gepäck inklusive.","ar":"تتقاضى سيارات الأجرة الرسمية البيضاء **تعرفة ثابتة قدرها 55 يورو** من فيوميتشينو إلى وسط المدينة (داخل الأسوار الأوريليانية)، شاملة الأمتعة."},"warn":{"en":"Please note: during busy periods, there may be **long lines** at the airport taxi station.","it":"Attenzione: nei periodi di maggiore affluenza potrebbero esserci **lunghe code** alla stazione dei taxi dell’aeroporto.","fr":"Attention : en période d’affluence, il peut y avoir de **longues files d’attente** à la station de taxis de l’aéroport.","es":"Atención: en periodos de mucha afluencia puede haber **largas colas** en la parada de taxis del aeropuerto.","de":"Bitte beachten: Zu Stoßzeiten kann es am Taxistand des Flughafens **lange Warteschlangen** geben.","ar":"يُرجى الانتباه: خلال فترات الازدحام قد تكون هناك **طوابير طويلة** عند موقف سيارات الأجرة في المطار."}},{"icon":"car","title":{"en":"Private transfer","it":"Transfer privato","fr":"Transfert privé","es":"Traslado privado","de":"Privater Transfer","ar":"نقل خاص"},"text":{"en":"For a simple, comfortable and stress-free journey, choose our **exclusive transfer service** directly from Fiumicino. The price depends on the day, time and number of passengers.","it":"Per un viaggio semplice, comodo e senza stress, scegliete il nostro **servizio esclusivo di transfer** direttamente da Fiumicino. Il prezzo dipende dal giorno, dall’orario e dal numero di passeggeri.","fr":"Pour un trajet simple, confortable et sans stress, choisissez notre **service de transfert exclusif** directement depuis Fiumicino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Fiumicino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Fiumicino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Fiumicino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Fiumicino"}]},{"label":{"en":"Ciampino Airport","it":"Aeroporto di Ciampino","fr":"Aéroport de Ciampino","es":"Aeropuerto de Ciampino","de":"Flughafen Ciampino","ar":"مطار تشامبينو"},"origin":"Ciampino Airport (CIA), Rome","routes":[{"icon":"train","title":{"en":"Train + Metro","it":"Treno + Metro","fr":"Train + Métro","es":"Tren + Metro","de":"Zug + Metro","ar":"قطار + مترو"},"text":{"en":"Take the **Ciampino Airlink** shuttle bus to Ciampino station (about 10 minutes). Then take a **regional train** to Roma Termini (about 15 minutes). From Termini, take **metro line A** towards Battistini and get off at Flaminio.","it":"Prendete la navetta **Ciampino Airlink** fino alla stazione di Ciampino (circa 10 minuti). Poi un **treno regionale** fino a Roma Termini (circa 15 minuti). Da Termini, prendete la **metro linea A** direzione Battistini e scendete a Flaminio.","fr":"Prenez la navette **Ciampino Airlink** jusqu’à la gare de Ciampino (environ 10 minutes). Prenez ensuite un **train régional** jusqu’à Roma Termini (environ 15 minutes). À Termini, prenez la **ligne A du métro** direction Battistini et descendez à Flaminio.","es":"Tome el autobús lanzadera **Ciampino Airlink** hasta la estación de Ciampino (unos 10 minutos). Después tome un **tren regional** hasta Roma Termini (unos 15 minutos). Desde Termini, tome la **línea A del metro** dirección Battistini y bájese en Flaminio.","de":"Nehmen Sie den Shuttlebus **Ciampino Airlink** zum Bahnhof Ciampino (ca. 10 Minuten). Fahren Sie dann mit einem **Regionalzug** nach Roma Termini (ca. 15 Minuten). Ab Termini nehmen Sie die **Metrolinie A** Richtung Battistini bis Flaminio.","ar":"استقلوا حافلة **Ciampino Airlink** المكوكية إلى محطة تشامبينو (حوالي 10 دقائق). ثم استقلوا **قطاراً إقليمياً** إلى روما تيرميني (حوالي 15 دقيقة). ومن تيرميني، استقلوا **خط المترو A** باتجاه باتيستيني وانزلوا في محطة فلامينيو."},"price":{"en":"Total price: **about €4.20** (€2.70 for the ‘Ciampino Airlink’ bus + train + €1.50 for the metro).","it":"Prezzo totale: **circa 4,20 €** (2,70 € per bus ‘Ciampino Airlink’ + treno + 1,50 € per la metro).","fr":"Prix total : **environ 4,20 €** (2,70 € pour le bus « Ciampino Airlink » + train + 1,50 € pour le métro).","es":"Precio total: **unos 4,20 €** (2,70 € el autobús ‘Ciampino Airlink’ + tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 4,20 €** (2,70 € für Bus „Ciampino Airlink“ + Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 4.20 يورو** (2.70 يورو لحافلة «Ciampino Airlink» + القطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus directly to Roma Termini (approx. 40–50 minutes). Then take **metro line A** towards Battistini to **Flaminio**.","it":"Prendete un autobus **Terravision** diretto a Roma Termini (circa 40–50 minuti). Poi la **metro linea A** direzione Battistini fino a **Flaminio**.","fr":"Prenez un bus **Terravision** direct jusqu’à Roma Termini (environ 40 à 50 minutes). Prenez ensuite la **ligne A du métro** direction Battistini jusqu’à **Flaminio**.","es":"Tome un autobús **Terravision** directo a Roma Termini (aprox. 40–50 minutos). Después tome la **línea A del metro** dirección Battistini hasta **Flaminio**.","de":"Nehmen Sie einen **Terravision**-Bus direkt nach Roma Termini (ca. 40–50 Minuten). Fahren Sie dann mit der **Metrolinie A** Richtung Battistini bis **Flaminio**.","ar":"استقلوا حافلة **تيرافيجن** مباشرةً إلى روما تيرميني (حوالي 40–50 دقيقة). ثم **خط المترو A** باتجاه باتيستيني حتى محطة **فلامينيو**."},"price":{"en":"Total price: **about €8** (Terravision bus from €6.50 + €1.50 metro).","it":"Prezzo totale: **circa 8 €** (bus Terravision da 6,50 € + 1,50 € metro).","fr":"Prix total : **environ 8 €** (bus Terravision dès 6,50 € + 1,50 € le métro).","es":"Precio total: **unos 8 €** (autobús Terravision desde 6,50 € + 1,50 € el metro).","de":"Gesamtpreis: **ca. 8 €** (Terravision-Bus ab 6,50 € + 1,50 € Metro).","ar":"السعر الإجمالي: **حوالي 8 يورو** (حافلة تيرافيجن ابتداءً من 6.50 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis from Ciampino charge a **fixed fare of €40** to the centre of Rome (inside the Aurelian Walls), luggage included.","i ","ar":"تأكّدوا من توصيل **جميع الكابلات** بجهاز الإنترنت بشكل صحيح."}},{"icon":"rotate","title":{"en":"Restart the box","it":"Riavviate il modem","fr":"Redémarrez la box","es":"Reinicie el router","de":"Router neu starten","ar":"أعيدوا تشغيل الجهاز"},"text":{"en":"**Switch off the box**, wait a few seconds, then **switch it back on**.","it":"**Spegnete il modem**, attendete qualche secondo, poi **riaccendetelo**.","fr":"**Éteignez la box**, attendez quelques secondes, puis **rallumez-la**.","es":"**Apague el router**, espere unos segundos y **vuelva a encenderlo**.","de":"**Schalten Sie den Router aus**, warten Sie einige Sekunden und schalten Sie ihn dann **wieder ein**.","ar":"**أطفئوا الجهاز**، وانتظروا بضع ثوانٍ، ثم **أعيدوا تشغيله**."}}]},{"type":"problems","items":[{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]}]},{"id":"rules","icon":"rules","title":{"en":"House rules","it":"Regole della casa","fr":"Règlement intérieur","es":"Normas de la casa","de":"Hausregeln","ar":"قواعد المنزل"},"blocks":[{"type":"lead","text":{"en":"The apartment is in a **historic residential building** (palazzo d’epoca) where **families live**. Thank you for respecting the **house rules**.","it":"L’appartamento si trova in un **palazzo d’epoca residenziale**, dove **vivono famiglie**. Grazie per il rispetto delle **regole della casa**.","fr":"L’appartement se trouve dans un **immeuble résidentiel historique** (palazzo d’epoca) où **vivent des familles**. Merci de respecter le **règlement intérieur**.","es":"El apartamento está en un **edificio residencial histórico** (palazzo d’epoca) donde **viven familias**. Gracias por respetar las **normas de la casa**.","de":"Die Wohnung liegt in einem **historischen Wohnhaus** (Palazzo d’epoca), in dem **Familien wohnen**. Danke, dass Sie die **Hausregeln** einhalten.","ar":"تقع الشقة في **مبنى سكني تاريخي** (palazzo d’epoca) **تسكنه عائلات**. نشكركم على احترام **قواعد المنزل**."}},{"type":"rules","items":[{"icon":"column","text":{"en":"This is a **historic residential building**: keep **quiet** on the stairs and in the **common areas**, out of respect for the residents.","it":"È un **palazzo d’epoca residenziale**: mantenete il **silenzio** sulle scale e negli **spazi comuni**, per rispetto dei residenti.","fr":"C’est un **immeuble résidentiel historique** : restez **silencieux** dans l’escalier et les **parties communes**, par respect pour les résidents.","es":"Es un **edificio residencial histórico**: guarde **silencio** en la escalera y en las **zonas comunes**, por respeto a los vecinos.","de":"Dies ist ein **historisches Wohnhaus**: Bitte seien Sie im Treppenhaus und in den **Gemeinschaftsbereichen** **leise** – aus Rücksicht auf die Bewohner.","ar":"هذا **مبنى سكني تاريخي**: التزموا **الهدوء** على الدرج وفي **الأماكن المشتركة** احتراماً للسكان."}},{"icon":"nosmoke","text":{"en":"Please **do not smoke** inside the house.","it":"Vi preghiamo di **non fumare** all’interno della casa.","fr":"Merci de **ne pas fumer** à l’intérieur du logement.","es":"Le rogamos que **no fume** dentro de la vivienda.","de":"Bitte **rauchen Sie nicht** in der Wohnung.","ar":"يُرجى **عدم التدخين** داخل المنزل."}},{"icon":"sparkles","text":{"en":"Take care of the house, **keep the common areas clean** and leave things tidy after you use them.","it":"Abbiate cura della casa, **mantenete puliti gli spazi comuni** e lasciate tutto in ordine dopo l’uso.","fr":"Prenez soin du logement, **gardez les parties communes propres** et laissez tout en ordre après utilisation.","es":"Cuide la vivienda, **mantenga limpias las zonas comunes** y deje todo ordenado después de usarlo.","de":"Gehen Sie sorgsam mit der Wohnung um, halten Sie die **Gemeinschaftsbereiche sauber** und hinterlassen Sie alles ordentlich.","ar":"اعتنوا بالمنزل، و**حافظوا على نظافة الأماكن المشتركة**، واتركوا الأشياء مرتبة بعد استخدامها."}},{"icon":"mute","text":{"en":"Respect the peace and privacy of other occupants by **minimizing noise**.","it":"Rispettate la tranquillità e la privacy degli altri residenti **limitando i rumori**.","fr":"Respectez la tranquillité et l’intimité des autres occupants **en limitant le bruit**.","es":"Respete la tranquilidad y la privacidad de los demás ocupantes **reduciendo el ruido**.","de":"Respektieren Sie die Ruhe und Privatsphäre der anderen Bewohner, indem Sie **Lärm vermeiden**.","ar":"احترموا هدوء وخصوصية السكان الآخرين **بالتقليل من الضوضاء**."}},{"icon":"users","text":{"en":"Avoid inviting additional people **without prior authorization**.","it":"Evitate di invitare altre persone **senza previa autorizzazione**.","fr":"Évitez d’inviter d’autres personnes **sans autorisation préalable**.","es":"Evite invitar a otras personas **sin autorización previa**.","de":"Laden Sie keine weiteren Personen **ohne vorherige Genehmigung** ein.","ar":"تجنّبوا دعوة أشخاص إضافيين **دون إذن مسبق**."}},{"icon":"zap","text":{"en":"Follow **safety instructions** and avoid using dangerous or unauthorised electrical equipment.","it":"Seguite le **istruzioni di sicurezza** ed evitate di usare apparecchi elettrici pericolosi o non autorizzati.","fr":"Suivez les **consignes de sécurité** et évitez d’utiliser des appareils électriques dangereux ou non autorisés.","es":"Siga las **instrucciones de seguridad** y evite utilizar aparatos eléctricos peligrosos o no autorizados.","de":"Befolgen Sie die **Sicherheitshinweise** und verwenden Sie keine gefährlichen oder nicht zugelassenen Elektrogeräte.","ar":"اتبعوا **تعليمات السلامة** وتجنّبوا استخدام الأجهزة الكهربائية الخطرة أو غير المصرّح بها."}},{"icon":"alert" ini · **10 Minuten** mit der U-Bahn (**Linie A**, Flaminio → Termini)","ar":"محطة تيرميني · **10 دقائق** بالمترو (**الخط A**، فلامينيو ← تيرميني)"},"maps":"Roma Termini"},{"icon":"plane","title":{"en":"Fiumicino Airport","it":"Aeroporto di Fiumicino","fr":"Aéroport de Fiumicino","es":"Aeropuerto de Fiumicino","de":"Flughafen Fiumicino","ar":"مطار فيوميتشينو"},"text":{"en":"50 minutes by car","it":"50 minuti in auto","fr":"50 minutes en voiture","es":"50 minutos en coche","de":"50 Minuten mit dem Auto","ar":"50 دقيقة بالسيارة"},"maps":"Fiumicino Airport"},{"icon":"plane","title":{"en":"Ciampino Airport","it":"Aeroporto di Ciampino","fr":"Aéroport de Ciampino","es":"Aeropuerto de Ciampino","de":"Flughafen Ciampino","ar":"مطار تشامبينو"},"text":{"en":"45 minutes by car","it":"45 minuti in auto","fr":"45 minutes en voiture","es":"45 minutos en coche","de":"45 Minuten mit dem Auto","ar":"45 دقيقة بالسيارة"},"maps":"Ciampino Airport"}]}]},{"id":"amenities","icon":"sofa","title":{"en":"Amenities","it":"Dotazioni","fr":"Équipements","es":"Equipamiento","de":"Ausstattung","ar":"المرافق"},"blocks":[{"type":"amenities","items":[{"icon":"bed1","label":{"en":"Single bed","it":"Letto singolo","fr":"Lit simple","es":"Cama individual","de":"Einzelbett","ar":"سرير فردي"}},{"icon":"bed2","label":{"en":"Double bed","it":"Letto matrimoniale","fr":"Lit double","es":"Cama doble","de":"Doppelbett","ar":"سرير مزدوج"}},{"icon":"sofa","label":{"en":"Sofa","it":"Divano","fr":"Canapé","es":"Sofá","de":"Sofa","ar":"أريكة"}},{"icon":"baby","label":{"en":"Baby bed","it":"Lettino","fr":"Lit bébé","es":"Cuna","de":"Babybett","ar":"سرير أطفال"}},{"icon":"tv","label":{"en":"Television","it":"Televisione","fr":"Télévision","es":"Televisión","de":"Fernseher","ar":"تلفاز"}},{"icon":"wifi","label":{"en":"Wi-Fi","it":"Wi-Fi","fr":"Wi-Fi","es":"Wi-Fi","de":"WLAN","ar":"واي فاي"}},{"icon":"hood","label":{"en":"Cooker hood","it":"Cappa aspirante","fr":"Hotte","es":"Campana extractora","de":"Dunstabzugshaube"  il soggiorno, Rome Dream Home è **sempre a vostra disposizione**.","fr":"Pour tout besoin ou toute question pendant votre séjour, Rome Dream Home reste **toujours à votre disposition**.","es":"Para cualquier necesidad o pregunta durante su estancia, Rome Dream Home está **siempre a su disposición**.","de":"Bei allen Anliegen oder Fragen während Ihres Aufenthalts ist Rome Dream Home **jederzeit für Sie da**.","ar":"لأي حاجة أو سؤال خلال إقامتكم، فريق Rome Dream Home **في خدمتكم دائماً**."}},{"type":"hostActions"}]},{"id":"checkout","icon":"door","title":{"en":"Check-out","it":"Check-out","fr":"Départ","es":"Check-out","de":"Check-out","ar":"تسجيل المغادرة"},"blocks":[{"type":"time","value":"10:00","label":{"en":"Check-out","it":"Check-out","fr":"Départ","es":"Check-out","de":"Check-out","ar":"تسجيل المغادرة"}},{"type":"text","text":{"en":"If you wish to **depart later**, please contact us and we will check availability and confirm according to our schedule. You may also leave your luggage with us **until 1:00 PM**, provided it is properly closed.","it":"Se desiderate **partire più tardi**, contattateci: verificheremo la disponibilità e ve la confermeremo in base alla nostra programmazione. Potete anche lasciare i bagagli da noi **fino alle 13:00**, purché ben chiusi.","fr":"Si vous souhaitez **partir plus tard**, contactez-nous : nous vérifierons la disponibilité et vous confirmerons selon notre planning. Vous pouvez également nous laisser vos bagages **jusqu’à 13h00**, à condition qu’ils soient bien fermés.","es":"Si desea **salir más tarde**, contáctenos y comprobaremos la disponibilidad y se la confirmaremos según nuestra programación. También puede dejarnos su equipaje **hasta las 13:00**, siempre que esté bien cerrado.","de":"Wenn Sie **später abreisen** möchten, kontaktieren Sie uns bitte – wir prüfen die Verfügbarkeit und bestätigen sie entsprechend unserem Zeitplan. Sie können Ihr Gepäck auch **bis 13:00 Uhr** bei uns lassen, sofern es gut verschlossen ist.","ar":"إذا رغبتم في **المغادرة في وقت لاحق**، يُرجى التواصل معنا وسنتحقق من التوفر ونؤكد لكم ذلك حسب جدولنا. يمكنكم أيضاً ترك أمتعتكم لدينا **حتى الساعة 13:00**، بشرط أن تكون مغلقة بإحكام."}},{"type":"checklist","title":{"en":"Before leaving – in this order","it":"Prima di partire – in quest’ordine","fr":"Avant de partir – dans cet ordre","es":"Antes de salir – en este orden","de":"Vor der Abreise – in dieser Reihenfolge","ar":"قبل المغادرة – بهذا الترتيب"},"items":[{"icon":"clock","title":{"en":"Leave by 10:00","it":"Uscite entro le 10:00","fr":"Départ avant 10h00","es":"Salida antes de las 10:00","de":"Abreise bis 10:00 Uhr","ar":"المغادرة قبل 10:00"},"text":{"en":"Check-out is by **10:00**. Make sure you **haven’t forgotten anything**.","it":"Il check-out è entro le **10:00**. Controllate di **non aver dimenticato nulla**.","fr":"Le départ se fait avant **10h00**. Vérifiez que vous **n’avez rien oublié**.","es":"El check-out es antes de las **10:00**. Compruebe que **no ha olvidado nada**.","de":"Check-out ist bis **10:00 Uhr**. Prüfen Sie, dass Sie **nichts vergessen** haben.","ar":"موعد المغادرة قبل **10:00**. تأكّدوا من أنكم **لم تنسوا شيئاً**."}},{"icon":"power","title":{"en":"Lights and devices off","it":"Luci e apparecchi spenti","fr":"Lumières et appareils éteints","es":"Luces y aparatos apagados","de":"Licht und Geräte aus","ar":"إطفاء الأضواء والأجهزة"},"text":{"en":"**Turn off** all lights and electrical devices.","it":"**Spegnete** tutte le luci e gli apparecchi elettrici.","fr":"**Éteignez** toutes les lumières et les appareils électriques.","es":"**Apague** todas las luces y los aparatos eléctricos.","de":"**Schalten Sie** alle Lichter und Elektrogeräte **aus**.","ar":"**أطفئوا** جميع الأضواء والأجهزة الكهربائية."}},{"icon":"house","title":{"en":"Windows closed","it":"Finestre chiuse","fr":"Fenêtres fermées","es":"Ventanas cerradas","de":"Fenster geschlossen","ar":"النوافذ مغلقة"},"text":{"en":"**Close all the windows.**","it":"**Chiudete tutte le finestre.**","fr":"**Fermez toutes les fenêtres.**","es":"**Cierre todas las ventanas.**","de":"**Schließen Sie alle Fenster.**","ar":"**أغلقوا جميع النوافذ.**"}},{"icon":"euro","title":{"en":"Tourist tax","it":"Tassa di soggiorno","fr":"Taxe de séjour","es":"Tasa turística","de":"Kurtaxe","ar":"ضريبة السياحة"},"text":{"en":"Leave it **in cash on the table** (€6 per person per night).","it":"Lasciatela **in contanti sul tavolo** (6 € a persona a notte).","fr":"Laissez-la **en espèces sur la table** (6 € par personne et par nuit).","es":"Déjela **en efectivo sobre la mesa** (6 € por persona y noche).","de":"Lassen Sie sie **in bar auf dem Tisch** (6 € pro Person und Nacht).","ar":"اتركوها **نقدًا على الطاولة** (6 يورو للشخص في الليلة)."}},{"icon":"door","title":{"en":"Close the door","it":"Chiudete la porta","fr":"Fermez la porte","es":"Cierre la puerta","de":"Tür schließen","ar":"أغلقوا الباب"},"text":{"en":"Go out and **close the apartment door**.","it":"Uscite e **chiudete la porta di casa**.","fr":"Sortez et **fermez la porte de l’appartement**.","es":"Salga y **cierre la puerta del apartamento**.","de":"Gehen Sie hinaus und **schließen Sie die Wohnungstür**.","ar":"اخرجوا و**أغلقوا باب الشقة**."}},{"icon":"key","title":{"en":"Keys in the lockbox","it":"Chiavi nella cassetta","fr":"Clés dans la boîte","es":"Llaves en la caja","de":"Schlüssel in den Safe","ar":"المفاتيح في الصندوق"},"text":{"en":"Put the keys back in the **lockbox on the door** and close it.","it":"Rimettete le chiavi nella **cassetta sulla porta** e chiudetela.","fr":"Remettez les clés dans la **boîte à clés sur la porte** et refermez-la.","es":"Vuelva a dejar las llaves en la **caja de la puerta** y ciérrela.","de":"Legen Sie die Schlüssel zurück in den **Schlüsselsafe an der Tür** und schließen Sie ihn.","ar":"أعيدوا المفاتيح إلى **الصندوق الموجود على الباب** وأغلقوه."}},{"icon":"rotate","title":{"en":"Scramble the code","it":"Mescolate il codice","fr":"Brouillez le code","es":"Mezcle el código","de":"Code verstellen","ar":"غيّروا أرقام الرمز"},"text":{"en":"**Scramble the code** on the lockbox, **otherwise it stays open**.","it":"**Mescolate le cifre** della cassetta, **altrimenti resta aperta**.","fr":"**Brouillez les chiffres** de la boîte, **sinon elle reste ouverte**.","es":"**Mezcle los dígitos** de la caja; **de lo contrario, se queda abierta**.","de":"**Verstellen Sie die Ziffern** am Safe, **sonst bleibt er offen**.","ar":"**غيّروا أرقام** الصندوق، **وإلا سيبقى مفتوحاً**."}}]},{"type":"notice","tone":"important","icon":"key","title":{"en":"Important","it":"Importante","fr":"Important","es":"Importante","de":"Wichtig","ar":"مهم"},"text":{"en":"After putting the keys in the lockbox, always **scramble the code**: otherwise the box **stays open**.","it":"Dopo aver messo le chiavi nella cassetta, **mescolate sempre il codice**: altrimenti la cassetta **resta aperta**.","fr":"Après avoir remis les clés dans la boîte, **brouillez toujours le code** : sinon la boîte **reste ouverte**.","es":"Después de dejar las llaves en la caja, **mezcle siempre el código**: de lo contrario, la caja **se queda abierta**.","de":"Nachdem Sie die Schlüssel in den Safe gelegt haben, **verstellen Sie immer den Code**: sonst **bleibt der Safe offen**.","ar":"بعد وضع المفاتيح في الصندوق، **غيّروا أرقام الرمز دائماً**: وإلا **سيبقى الصندوق مفتوحاً**."}},{"type":"closing","text":{"en":"Thank you!","it":"Grazie!","fr":"Merci !","es":"¡Gracias!","de":"Vielen Dank!","ar":"شكراً لكم!"}}]},{"id":"contact","icon":"phone","title":{"en":"Contact","it":"Contatti","fr":"Contact","es":"Contacto","de":"Kontakt","ar":"التواصل"},"blocks":[{"type":"host","text":{"en":"Dear travelers, I am here to assist you whenever you need. If you encounter any issues or have any questions, please do not hesitate to contact me **by phone or email**. I am **always available** to help make your stay as pleasant and stress-free as possible.","it":"Cari viaggiatori, sono qui per assistervi ogni volta che ne avrete bisogno. Se incontrate qualche problema o avete domande, non esitate a contattarmi **per telefono o via email**. Sono **sempre disponibile** per rendere il vostro soggiorno il più piacevole e sereno possibile.","fr":"Chers voyageurs, je suis là pour vous aider à tout moment. Si vous rencontrez un problème ou avez des questions, n’hésitez pas à me contacter **par téléphone ou par e-mail**. Je suis **toujours disponible** pour rendre votre séjour aussi agréable et serein que possible.","es":"Queridos viajeros, estoy aquí para ayudarles siempre que lo necesiten. Si tienen algún problema o alguna pregunta, no duden en contactarme **por teléfono o por correo electrónico**. **Siempre estoy disponible** para que su estancia sea lo más agradable y tranquila posible.","de":"Liebe Reisende, ich bin jederzeit für Sie da. Wenn Probleme auftreten oder Sie Fragen haben, zögern Sie nicht, mich **telefonisch oder per E-Mail** zu kontaktieren. Ich helfe Ihnen **immer gern**, Ihren Aufenthalt so angenehm und entspannt wie möglich zu gestalten.","ar":"أعزاءنا المسافرين، أنا هنا لمساعدتكم متى احتجتم إلى ذلك. إذا واجهتم أي مشكلة أو كان لديكم أي سؤال، فلا تترددوا في التواصل معي **عبر الهاتف أو البريد الإلكتروني**. أنا **متاح دائماً** لأجعل إقامتكم ممتعة ومريحة قدر الإمكان."}},{"type":"review","text":{"en":"We hope you had a pleasant stay in our home. If you could take a moment to share your feedback and leave us a **5-star review**, it would be greatly appreciated.","it":"Speriamo che abbiate trascorso un piacevole soggiorno nella nostra casa. Se poteste dedicarci un momento per condividere la vostra opinione e lasciarci una **recensione a 5 stelle**, ve ne saremmo davvero grati.","fr":"Nous espérons que vous avez passé un agréable séjour chez nous. Si vous pouviez prendre un instant pour partager votre avis et nous laisser un **commentaire 5 étoiles**, nous vous en serions très reconnaissants.","es":"Esperamos que haya disfrutado de una agradable estancia en nuestra casa. Si pudiera dedicar un momento a compartir su opinión y dejarnos una **reseña de 5 estrellas**, se lo agradeceríamos muchísimo.","de":"Wir hoffen, Sie hatten einen angenehmen Aufenthalt bei uns. Wenn Sie sich einen Moment Zeit nehmen könnten, um Ihre Eindrücke zu teilen und uns eine **5-Sterne-Bewertung** zu hinterlassen, würden wir uns sehr freuen.","ar":"نأمل أن تكونوا قد استمتعتم بإقامة طيبة في منزلنا. إذا تمكنتم من تخصيص لحظة لمشاركة رأيكم وترك **تقييم من 5 نجوم** لنا، فسنكون ممتنين جداً."}}]}],"arrival":{"steps":[{"en":"At **Via del Babuino 169**, **call us**: we open the **street door** remotely right away.","it":"Arrivati in **Via del Babuino 169**, **chiamateci**: vi apriamo subito il **portone** a distanza.","fr":"Arrivés au **Via del Babuino 169**, **appelez-nous** : nous ouvrons aussitôt la **porte de l’immeuble** à distance.","es":"Al llegar a **Via del Babuino 169**, **llámenos**: le abrimos enseguida el **portal** a distancia.","de":"In der **Via del Babuino 169** angekommen, **rufen Sie uns an**: Wir öffnen die **Haustür** sofort aus der Ferne.","ar":"عند وصولكم إلى **Via del Babuino 169**، **اتصلوا بنا**: سنفتح لكم **باب المبنى** عن بُعد فوراً."},{"en":"Take the elevator or the stairs to the **2nd floor** – two floors above street level, **elevator button 2**.","it":"Salite con l’ascensore o a piedi al **2° piano** – due piani sopra il livello della strada, **pulsante 2 dell’ascensore**.","fr":"Montez en ascenseur ou par l’escalier au **2e étage** – deux étages au-dessus de la rue, **bouton 2 de l’ascenseur**.","es":"Suba en ascensor o por la escalera a la **2ª planta** – dos pisos por encima de la calle, **botón 2 del ascensor**.","de":"Fahren Sie mit dem Aufzug oder gehen Sie zu Fuß in den **2. Stock** – zwei Etagen über Straßenniveau, **Aufzugsknopf 2**.","ar":"اصعدوا بالمصعد أو عبر الدرج إلى **الطابق الثاني** – طابقان فوق مستوى الشارع، **زر المصعد 2**."},{"en":"The apartment door is **immediately on your left**.","it":"La porta dell’appartamento è **subito sulla sinistra**.","fr":"La porte de l’appartement est **immédiatement sur votre gauche**.","es":"La puerta del apartamento está **justo a su izquierda**.","de":"Die Wohnungstür befindet sich **direkt links** von Ihnen.","ar":"باب الشقة **على يساركم مباشرةً**."},{"en":"The **lockbox is on the apartment door**: enter the code **9321**, open it and **take the keys**.","it":"La **cassetta è sulla porta di casa**: inserite il codice **9321**, apritela e **prendete le chiavi**.","fr":"La **boîte à clés est sur la porte de l’appartement** : saisissez le code **9321**, ouvrez-la et **prenez les clés**.","es":"La **caja de llaves está en la puerta del apartamento**: introduzca el código **9321**, ábrala y **coja las llaves**.","de":"Der **Schlüsselsafe hängt an der Wohnungstür**: Geben Sie den Code **9321** ein, öffnen Sie ihn und **nehmen Sie die Schlüssel**.","ar":"**صندوق المفاتيح موجود على باب الشقة**: أدخلوا الرمز **9321**، افتحوه و**خذوا المفاتيح**."},{"en":"Go inside and **close the door** behind you. **Welcome!**","it":"Entrate e **chiudete la porta** alle vostre spalle. **Benvenuti!**","fr":"Entrez et **refermez la porte** derrière vous. **Bienvenue !**","es":"Entre y **cierre la puerta** detrás de usted. **¡Bienvenidos!**","de":"Treten Sie ein und **schließen Sie die Tür** hinter sich. **Willkommen!**","ar":"ادخلوا و**أغلقوا الباب** خلفكم. **أهلاً وسهلاً!**"}]}};</script>
