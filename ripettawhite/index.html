**4 minutes** de la **Piazza del Popolo** : sa **porte est celle de GAUCHE** dans la cour intérieure. Il dispose d’un **salon** lumineux, d’un **coin repas** et d’une **cuisine**, d’**1 chambre** avec un **mur ancien en briques** apparent, de **2 lits** et d’**1 salle de bain**.","es":"**Ripetta White** es un apartamento para un máximo de **4 huéspedes** en la **planta baja** de **Via di Ripetta 35**, a solo **4 minutos** de la **Piazza del Popolo**: su **puerta es la de la IZQUIERDA** en el patio interior. Tiene un luminoso **salón**, un **comedor** y una **cocina**, **1 dormitorio** con un **antiguo muro de ladrillo** a la vista, **2 camas** y **1 baño**.","de":"**Ripetta White** ist eine Wohnung für bis zu **4 Gäste** im **Erdgeschoss** der **Via di Ripetta 35**, nur **4 Minuten** von der **Piazza del Popolo**: Ihre **Tür ist die LINKE** im Innenhof. Sie hat ein helles **Wohnzimmer**, einen **Essbereich** und eine **Küche**, **1 Schlafzimmer** mit einer sichtbaren **antiken Ziegelmauer**, **2 Betten** und **1 Bad**.","ar":"**Ripetta White** شقة تتسع لما يصل إلى **4 ضيوف** في **الطابق الأرضي** من **Via di Ripetta 35**، على بُعد **4 دقائق** فقط من **ساحة الشعب**: **بابها هو الباب على اليسار** في الفناء الداخلي. تضم **غرفة معيشة** مشرقة و**منطقة طعام** و**مطبخاً**، و**غرفة نوم واحدة** بـ**جدار قديم من الطوب** ظاهر، و**سريرين** و**حماماً واحداً**."}},{"type":"photo","src":"img/living-1","alt":{"en":"Living room","it":"Soggiorno","fr":"Salon","es":"Salón","de":"Wohnzimmer","ar":"غرفة المعيشة"}},{"type":"text","text":{"en":"We wish you an **excellent stay** in our beautiful city and hope to **see you again soon**!","it":"Vi auguriamo un **ottimo soggiorno** nella nostra splendida città e speriamo di **rivedervi presto**!","fr":"Nous vous souhaitons un **excellent séjour** dans notre belle ville et espérons **vous revoir très bientôt** !","es":"¡Le deseamos una **excelente estancia** en nuestra hermosa ciudad y esperamos **volver a verle pronto**!","de":"Wir wünschen Ihnen einen **wunderbaren Aufenthalt** in unserer schönen Stadt und hoffen, Sie **bald wiederzusehen**!","ar":"نتمنى لكم **إقامة ممتعة** في مدينتنا الجميلة، ونأمل أن **نراكم مجدداً قريباً**!"}},{"type":"signature","text":"Rome Dream Home"}]},{"id":"checkin","icon":"key","title":{"en":"Check-in","it":"Check-in","fr":"Arrivée","es":"Check-in","de":"Check-in","ar":"تسجيل الوصول"},"blocks":[{"type":"time","value":"15:00","label":{"en":"Self check-in","it":"Self check-in","fr":"Self check-in","es":"Self check-in","de":"Self-Check-in","ar":"تسجيل الوصول الذاتي"}},{"type":"text","text":{"en":"**Self check-in**: when you reach the building, **message us** or **ring “De Lieto”** – we open the main door **remotely**.","it":"**Self check-in**: quando arrivate al palazzo, **scriveteci** o **suonate a “De Lieto”** – vi apriamo il portone **a distanza**.","fr":"**Self check-in** : en arrivant à l’immeuble, **écrivez-nous** ou **sonnez à « De Lieto »** – nous ouvrons la porte **à distance**.","es":"**Self check-in**: al llegar al edificio, **escríbanos** o **llame a “De Lieto”** – le abrimos el portal **a distancia**.","de":"**Self-Check-in**: Wenn Sie am Haus ankommen, **schreiben Sie uns** oder **klingeln Sie bei „De Lieto“** – wir öffnen das Haustor **aus der Ferne**.","ar":"**تسجيل دخول ذاتي**: عند وصولكم إلى المبنى **راسلونا** أو **اضغطوا جرس «De Lieto»** – سنفتح لكم باب المبنى **عن بُعد**."}},{"type":"text","text":{"en":"Please respect the check-in times. If you would like to arrive earlier, no problem at all: you can **drop off your luggage from 11:00** and take the keys, then **come back at 15:00** when the apartment will be ready.","it":"Vi preghiamo di rispettare gli orari di check-in. Se desiderate arrivare prima, nessun problema: potete **lasciare i bagagli a partire dalle 11:00** e ritirare le chiavi, per poi **tornare alle 15:00**, quando l’appartamento sarà pronto.","fr":"Merci de respecter les horaires d’arrivée. Si vous souhaitez arriver plus tôt, aucun problème : vous pouvez **déposer vos bagages à partir de 11h00** et récupérer les clés, puis **revenir à 15h00**, lorsque l’appartement sera prêt.","es":"Le rogamos que respete los horarios de check-in. Si desea llegar antes, no hay ningún problema: puede **dejar su equipaje a partir de las 11:00** y recoger las llaves, y luego **volver a las 15:00**, cuando el apartamento esté listo.","de":"Bitte halten Sie die Check-in-Zeiten ein. Wenn Sie früher ankommen möchten, ist das kein Problem: Sie können Ihr **Gepäck ab 11:00 Uhr abstellen** und die Schlüssel abholen und dann **um 15:00 Uhr zurückkommen**, wenn die Wohnung bereit ist.","ar":"يُرجى الالتزام بمواعيد تسجيل الوصول. إذا رغبتم في الوصول مبكراً فلا مشكلة إطلاقاً: يمكنكم **ترك أمتعتكم ابتداءً من الساعة 11:00** واستلام المفاتيح، ثم **العودة في الساعة 15:00** عندما تكون الشقة جاهزة."}},{"type":"heading","text":{"en":"House access","it":"Accesso alla casa","fr":"Accès au logement","es":"Acceso a la vivienda","de":"Zugang zur Wohnung","ar":"الدخول إلى المنزل"}},{"type":"steps","items":[{"text":{"en":"Arrive at **Via di Ripetta 35**: the **green main door** next to the trattoria **La Buca di Ripetta**. **Message us** or **ring “De Lieto”** on the intercom: we **open the main door remotely**.","it":"Arrivate in **Via di Ripetta 35**: il **portone verde** accanto alla trattoria **La Buca di Ripetta**. **Scriveteci** o **suonate a “De Lieto”** sul citofono: vi **apriamo il portone a distanza**.","fr":"Arrivez au **Via di Ripetta 35** : la **porte verte** à côté de la trattoria **La Buca di Ripetta**. **Écrivez-nous** ou **sonnez à « De Lieto »** à l’interphone : nous **ouvrons la porte à distance**.","es":"Llegue a **Via di Ripetta 35**: el **portal verde** junto a la trattoria **La Buca di Ripetta**. **Escríbanos** o **llame a “De Lieto”** en el portero automático: le **abrimos el portal a distancia**.","de":"Kommen Sie in die **Via di Ripetta 35**: das **grüne Haustor** neben der Trattoria **La Buca di Ripetta**. **Schreiben Sie uns** oder **klingeln Sie bei „De Lieto“**: Wir **öffnen das Haustor aus der Ferne**.","ar":"عند وصولكم إلى **Via di Ripetta 35**: **الباب الأخضر** بجانب مطعم **La Buca di Ripetta**. **راسلونا** أو **اضغطوا جرس «De Lieto»** في جهاز الاتصال الداخلي: **سنفتح لكم باب المبنى عن بُعد**."},"photos":[{"src":"img/step-entrance","alt":{"en":"The green main door at Via di Ripetta 35, next to the trattoria","it":"Il portone verde di Via di Ripetta 35, accanto alla trattoria","fr":"La porte verte du Via di Ripetta 35, à côté de la trattoria","es":"El portal verde de Via di Ripetta 35, junto a la trattoria","de":"Das grüne Haustor, Via di Ripetta 35, neben der Trattoria","ar":"الباب الأخضر في Via di Ripetta 35 بجانب المطعم"}}]},{"text":{"en":"Go into the **lobby** and walk down the **hallway**: at the **end**, turn **left**.","it":"Entrate nell’**androne** e percorrete il **corridoio**: in **fondo** girate a **sinistra**.","fr":"Entrez dans le **hall** et suivez le **couloir** : au **fond**, tournez à **gauche**.","es":"Entre en el **vestíbulo** y recorra el **pasillo**: al **fondo**, gire a la **izquierda**.","de":"Gehen Sie in die **Eingangshalle** und den **Flur** entlang: am **Ende** biegen Sie **links** ab.","ar":"ادخلوا إلى **البهو** وسيروا في **الممر**: وفي **نهايته** انعطفوا **يساراً**."},"photos":[{"src":"img/step-hallway","alt":{"en":"The entrance hallway: at the end, turn left","it":"Il corridoio d’ingresso: in fondo girate a sinistra","fr":"Le couloir d’entrée : au fond, tournez à gauche","es":"El pasillo de entrada: al fondo, gire a la izquierda","de":"Der Eingangsflur: am Ende links abbiegen","ar":"ممر المدخل: انعطفوا يساراً في نهايته"}}]},{"text":{"en":"Turn **left** into the **courtyard**: your apartment is on the **ground floor** – the **door on the LEFT** – the narrow wooden door marked by the arrow in the photo. The **key box is on the door**: enter the code **9321** and take the **keys**.","it":"Girate a **sinistra** ed entrate nel **cortile**: il vostro appartamento è al **piano terra** – la **porta a SINISTRA** – quella stretta in legno indicata dalla freccia nella foto. La **cassetta delle chiavi è sulla porta**: inserite il codice **9321** e prendete le **chiavi**.","fr":"Tournez à **gauche** et entrez dans la **cour** : votre appartement est au **rez-de-chaussée** – la **porte de GAUCHE** – la porte étroite en bois indiquée par la flèche sur la photo. La **boîte à clés est sur la porte** : saisissez le code **9321** et prenez les **clés**.","es":"Gire a la **izquierda** y entre en el **patio**: su apartamento está en la **planta baja** – la **puerta de la IZQUIERDA** – la puerta estrecha de madera señalada por la flecha en la foto. La **caja de llaves está en la puerta**: introduzca el código **9321** y coja las **llaves**.","de":"Biegen Sie **links** in den **Innenhof** ab: Ihre Wohnung liegt im **Erdgeschoss** – die **Tür LINKS** – die schmale Holztür, auf die der Pfeil im Foto zeigt. Der **Schlüsselsafe ist an der Tür**: Geben Sie den Code **9321** ein und nehmen Sie die **Schlüssel**.","ar":"انعطفوا **يساراً** وادخلوا إلى **الفناء**: شقتكم في **الطابق الأرضي** – **الباب على اليسار** – الباب الخشبي الضيق الذي يشير إليه السهم في الصورة. **صندوق المفاتيح على الباب**: أدخلوا الرمز **9321** وخذوا **المفاتيح**."},"photos":[{"src":"img/step-courtyard","alt":{"en":"Your door: the one on the LEFT in the courtyard, ground floor","it":"La vostra porta: quella a sinistra nel cortile, piano terra","fr":"Votre porte : celle de gauche dans la cour, rez-de-chaussée","es":"Su puerta: la de la izquierda en el patio, planta baja","de":"Ihre Tür: die linke im Innenhof, Erdgeschoss","ar":"بابكم: الباب على اليسار في الفناء، الطابق الأرضي"}}]},{"en":"Go inside and **close the door** behind you. **Welcome!**","it":"Entrate e **chiudete la porta** alle vostre spalle. **Benvenuti!**","fr":"Entrez et **refermez la porte** derrière vous. **Bienvenue !**","es":"Entre y **cierre la puerta** detrás de usted. **¡Bienvenidos!**","de":"Treten Sie ein und **schließen Sie die Tür** hinter sich. **Willkommen!**","ar":"ادخلوا و**أغلقوا الباب** خلفكم. **أهلاً وسهلاً!**"}]},{"type":"arrival"},{"type":"code","label":{"en":"Key box code · door on the LEFT in the courtyard, ground floor","it":"Codice cassetta · porta a SINISTRA nel cortile, piano terra","fr":"Code de la boîte à clés · porte de GAUCHE dans la cour, rez-de-chaussée","es":"Código de la caja · puerta de la IZQUIERDA en el patio, planta baja","de":"Schlüsselsafe-Code · Tür LINKS im Innenhof, Erdgeschoss","ar":"رمز صندوق المفاتيح · الباب على اليسار في الفناء، الطابق الأرضي"},"value":"9321","icon":"lock"},{"type":"tax","text":{"en":"Rome **tourist tax**: **€6 per person per night**. Leave it **in cash on the table** before you leave. Please make sure you have already sent us a **photo of your passport** for the registration of your stay.","it":"**Tassa di soggiorno** di Roma: **6 € a persona a notte**. Lasciatela **in contanti sul tavolo** prima di partire. Assicuratevi di averci già inviato la **foto del passaporto** per la registrazione del soggiorno.","fr":"**Taxe de séjour** de Rome : **6 € par personne et par nuit**. Laissez-la **en espèces sur la table** avant de partir. Assurez-vous de nous avoir déjà envoyé la **photo de votre passeport** pour l’enregistrement de votre séjour.","es":"**Tasa turística** de Roma: **6 € por persona y noche**. Déjela **en efectivo sobre la mesa** antes de irse. Asegúrese de habernos enviado ya la **foto de su pasaporte** para el registro de su estancia.","de":"Römische **Kurtaxe**: **6 € pro Person und Nacht**. Lassen Sie sie vor der Abreise **in bar auf dem Tisch**. Bitte stellen Sie sicher, dass Sie uns bereits ein **Foto Ihres Reisepasses** für die Anmeldung Ihres Aufenthalts geschickt haben.","ar":"**ضريبة السياحة** في روما: **6 يورو للشخص في الليلة**. اتركوها **نقداً على الطاولة** قبل المغادرة. يُرجى التأكد من أنكم أرسلتم إلينا **صورة جواز السفر** لتسجيل إقامتكم."}},{"type":"problems","items":[{"icon":"door","q":{"en":"The street door doesn’t open?","it":"Il portone non si apre?","fr":"La porte de l’immeuble ne s’ouvre pas ?","es":"¿El portal no se abre?","de":"Die Haustür geht nicht auf?","ar":"باب المبنى لا يُفتح؟"},"a":{"en":"**Ring “De Lieto”** again and **message or call us**: we open it **remotely**.","it":"**Suonate di nuovo a “De Lieto”** e **scriveteci o chiamateci**: lo apriamo **a distanza**.","fr":"**Sonnez à nouveau à « De Lieto »** et **écrivez-nous ou appelez-nous** : nous l’ouvrons **à distance**.","es":"**Llame de nuevo a “De Lieto”** y **escríbanos o llámenos**: lo abrimos **a distancia**.","de":"**Klingeln Sie erneut bei „De Lieto“** und **schreiben oder rufen Sie uns an**: Wir öffnen **aus der Ferne**.","ar":"**اضغطوا جرس «De Lieto» مجدداً** و**راسلونا أو اتصلوا بنا**: سنفتحه **عن بُعد**."}},{"icon":"lock","q":{"en":"The lockbox won’t open?","it":"La cassetta non si apre?","fr":"La boîte à clés ne s’ouvre pas ?","es":"¿La caja de llaves no se abre?","de":"Der Schlüsselsafe geht nicht auf?","ar":"صندوق المفاتيح لا يُفتح؟"},"a":{"en":"The box is **on your door**: the **LEFT-hand door** in the courtyard (**ground floor**, left at the end of the hallway). Check that **every digit** is on **9321** and try again. Still closed? **Call us**.","it":"La cassetta è **sulla vostra porta**: quella a **SINISTRA** nel cortile (**piano terra**, a sinistra in fondo al corridoio). Controllate che **ogni cifra** sia su **9321** e riprovate. Ancora chiusa? **Chiamateci**.","fr":"La boîte est **sur votre porte** : celle de **GAUCHE** dans la cour (**rez-de-chaussée**, à gauche au fond du couloir). Vérifiez que **chaque chiffre** est sur **9321** et réessayez. Toujours fermée ? **Appelez-nous**.","es":"La caja está **en su puerta**: la de la **IZQUIERDA** en el patio (**planta baja**, a la izquierda al fondo del pasillo). Compruebe que **cada cifra** esté en **9321** y vuelva a intentarlo. ¿Sigue cerrada? **Llámenos**.","de":"Der Safe ist **an Ihrer Tür**: der Tür **LINKS** im Innenhof (**Erdgeschoss**, links am Ende des Flurs). Prüfen Sie, ob **jede Ziffer** auf **9321** steht, und versuchen Sie es erneut. Immer noch zu? **Rufen Sie uns an**.","ar":"الصندوق **على بابكم**: الباب على **اليسار** في الفناء (**الطابق الأرضي**، يساراً في نهاية الممر). تأكدوا من أن **كل رقم** على **9321** وأعيدوا المحاولة. ما زال مغلقاً؟ **اتصلوا بنا**."}},{"icon":"clock","q":{"en":"Arriving late?","it":"Arrivate tardi?","fr":"Vous arrivez tard ?","es":"¿Llega tarde?","de":"Späte Ankunft?","ar":"ستصلون متأخرين؟"},"a":{"en":"**Message us** when you are on your way and again at the door: we open it **remotely**.","it":"**Scriveteci** quando siete in arrivo e di nuovo davanti al portone: lo apriamo **a distanza**.","fr":"**Écrivez-nous** quand vous êtes en route, puis devant la porte : nous l’ouvrons **à distance**.","es":"**Escríbanos** cuando esté de camino y de nuevo en el portal: lo abrimos **a distancia**.","de":"**Schreiben Sie uns**, wenn Sie unterwegs sind, und erneut an der Tür: Wir öffnen **aus der Ferne**.","ar":"**راسلونا** عندما تكونون في الطريق ومرة أخرى عند الباب: سنفتحه **عن بُعد**."}},{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]},{"type":"closing","text":{"en":"Thank you very much for your **understanding and cooperation**.","it":"Grazie mille per la vostra **comprensione e collaborazione**.","fr":"Merci beaucoup pour votre **compréhension et votre coopération**.","es":"Muchas gracias por su **comprensión y colaboración**.","de":"Vielen Dank für Ihr **Verständnis und Ihre Mitarbeit**.","ar":"شكراً جزيلاً **لتفهمكم وتعاونكم**."}}]},{"id":"location","icon":"pin","title":{"en":"Location","it":"Posizione","fr":"Accès","es":"Ubicación","de":"Anreise","ar":"الموقع"},"blocks":[{"type":"address"},{"type":"heading","text":{"en":"How to arrive?","it":"Come arrivare?","fr":"Comment arriver ?","es":"¿Cómo llegar?","de":"Wie komme ich hin?","ar":"كيف تصلون إلينا؟"}},{"type":"tabs","label":{"en":"Arrive from","it":"Arrivo da","fr":"Arriver depuis","es":"Llegar desde","de":"Anreise von","ar":"الوصول من"},"tabs":[{"label":{"en":"Fiumicino Airport","it":"Aeroporto di Fiumicino","fr":"Aéroport de Fiumicino","es":"Aeropuerto de Fiumicino","de":"Flughafen Fiumicino","ar":"مطار فيوميتشينو"},"origin":"Fiumicino Airport (FCO), Rome","routes":[{"icon":"train","title":{"en":"Train (Leonardo Express)","it":"Treno (Leonardo Express)","fr":"Train (Leonardo Express)","es":"Tren (Leonardo Express)","de":"Zug (Leonardo Express)","ar":"القطار (ليوناردو إكسبريس)"},"text":{"en":"Take the **Leonardo Express** from Fiumicino Airport to Roma Termini Station (direct trip, **about 32 minutes**). Then take **metro line A** towards Battistini and get off at Flaminio. Walk about 7 minutes to Via di Ripetta.","it":"Prendete il **Leonardo Express** dall’aeroporto di Fiumicino alla stazione Roma Termini (corsa diretta, **circa 32 minuti**). Poi prendete la **metro linea A** direzione Battistini e scendete a Flaminio. Proseguite a piedi per circa 7 minuti fino a Via di Ripetta.","fr":"Prenez le **Leonardo Express** de l’aéroport de Fiumicino jusqu’à la gare Roma Termini (trajet direct, **environ 32 minutes**). Prenez ensuite la **ligne A du métro** direction Battistini et descendez à Flaminio. Marchez environ 7 minutes jusqu’à la Via di Ripetta.","es":"Tome el **Leonardo Express** desde el aeropuerto de Fiumicino hasta la estación Roma Termini (trayecto directo, **unos 32 minutos**). Después tome la **línea A del metro** dirección Battistini y bájese en Flaminio. Camine unos 7 minutos hasta Via di Ripetta.","de":"Nehmen Sie den **Leonardo Express** vom Flughafen Fiumicino zum Bahnhof Roma Termini (Direktfahrt, **ca. 32 Minuten**). Fahren Sie dann mit der **Metrolinie A** Richtung Battistini bis Flaminio. Von dort sind es etwa 7 Minuten zu Fuß bis zur Via di Ripetta.","ar":"استقلوا قطار **ليوناردو إكسبريس** من مطار فيوميتشينو إلى محطة روما تيرميني (رحلة مباشرة، **حوالي 32 دقيقة**). ثم استقلوا **خط المترو A** باتجاه باتيستيني وانزلوا في محطة فلامينيو. سيروا حوالي 7 دقائق حتى Via di Ripetta."},"price":{"en":"Total price: **around €15.50** (€14 for the train + €1.50 for the metro).","it":"Prezzo totale: **circa 15,50 €** (14 € il treno + 1,50 € la metro).","fr":"Prix total : **environ 15,50 €** (14 € pour le train + 1,50 € pour le métro).","es":"Precio total: **unos 15,50 €** (14 € el tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 15,50 €** (14 € für den Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 15.50 يورو** (14 يورو للقطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus to Roma Termini (approx. 50 minutes), then **metro line A** towards Battistini to **Flaminio**.","it":"Prendete un autobus **Terravision** fino a Roma Termini (circa 50 minuti), poi la **metro linea A** direzione Battistini fino a **Flaminio**.","fr":"Prenez un bus **Terravision** jusqu’à Roma Termini (environ 50 minutes), puis la **ligne A du métro** direction Battistini jusqu’à **Flaminio**.","es":"Tome un autobús **Terravision** hasta Roma Termini (aprox. 50 minutos) y después la **línea A del metro** dirección Battistini hasta **Flaminio**.","de":"Nehmen Sie einen **Terravision**-Bus nach Roma Termini (ca. 50 Minuten) und dann die **Metrolinie A** Richtung Battistini bis **Flaminio**.","ar":"استقلوا حافلة **تيرافيجن** إلى روما تيرميني (حوالي 50 دقيقة)، ثم **خط المترو A** باتجاه باتيستيني حتى محطة **فلامينيو**."},"price":{"en":"Total price: **from about €5.50** (Terravision bus from €4 + €1.50 metro).","it":"Prezzo totale: **da circa 5,50 €** (bus Terravision da 4 € + 1,50 € metro).","fr":"Prix total : **à partir d’environ 5,50 €** (bus Terravision dès 4 € + 1,50 € le métro).","es":"Precio total: **desde unos 5,50 €** (autobús Terravision desde 4 € + 1,50 € el metro).","de":"Gesamtpreis: **ab ca. 5,50 €** (Terravision-Bus ab 4 € + 1,50 € Metro).","ar":"السعر الإجمالي: **ابتداءً من حوالي 5.50 يورو** (حافلة تيرافيجن ابتداءً من 4 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis charge a **fixed fare of €55** from Fiumicino to the city centre (inside the Aurelian Walls), luggage included.","it":"I taxi ufficiali bianchi applicano una **tariffa fissa di 55 €** da Fiumicino al centro città (entro le Mura Aureliane), bagagli inclusi.","fr":"Les taxis officiels blancs appliquent un **tarif fixe de 55 €** de Fiumicino au centre-ville (à l’intérieur du mur d’Aurélien), bagages compris.","es":"Los taxis oficiales blancos aplican una **tarifa fija de 55 €** desde Fiumicino hasta el centro de la ciudad (dentro de las Murallas Aurelianas), equipaje incluido.","de":"Offizielle weiße Taxis berechnen von Fiumicino ins Stadtzentrum (innerhalb der Aurelianischen Mauer) einen **Festpreis von 55 €**, Gepäck inklusive.","ar":"تتقاضى سيارات الأجرة الرسمية البيضاء **تعرفة ثابتة قدرها 55 يورو** من فيوميتشينو إلى وسط المدينة (داخل الأسوار الأوريليانية)، شاملة الأمتعة."},"warn":{"en":"Please note: during busy periods, there may be **long lines** at the airport taxi station.","it":"Attenzione: nei periodi di maggiore affluenza potrebbero esserci **lunghe code** alla stazione dei taxi dell’aeroporto.","fr":"Attention : en période d’affluence, il peut y avoir de **longues files d’attente** à la station de taxis de l’aéroport.","es":"Atención: en periodos de mucha afluencia puede haber **largas colas** en la parada de taxis del aeropuerto.","de":"Bitte beachten: Zu Stoßzeiten kann es am Taxistand des Flughafens **lange Warteschlangen** geben.","ar":"يُرجى الانتباه: خلال فترات الازدحام قد تكون هناك **طوابير طويلة** عند موقف سيارات الأجرة في المطار."}},{"icon":"car","title":{"en":"Private transfer","it":"Transfer privato","fr":"Transfert privé","es":"Traslado privado","de":"Privater Transfer","ar":"نقل خاص"},"text":{"en":"For a simple, comfortable and stress-free journey, choose our **exclusive transfer service** directly from Fiumicino. The price depends on the day, time and number of passengers.","it":"Per un viaggio semplice, comodo e senza stress, scegliete il nostro **servizio esclusivo di transfer** direttamente da Fiumicino. Il prezzo dipende dal giorno, dall’orario e dal numero di passeggeri.","fr":"Pour un trajet simple, confortable et sans stress, choisissez notre **service de transfert exclusif** directement depuis Fiumicino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Fiumicino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Fiumicino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Fiumicino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Fiumicino"}]},{"label":{"en":"Ciampino Airport","it":"Aeroporto di Ciampino","fr":"Aéroport de Ciampino","es":"Aeropuerto de Ciampino","de":"Flughafen Ciampino","ar":"مطار تشامبينو"},"origin":"Ciampino Airport (CIA), Rome","routes":[{"icon":"train","title":{"en":"Train + Metro","it":"Treno + Metro","fr":"Train + Métro","es":"Tren + Metro","de":"Zug + Metro","ar":"قطار + مترو"},"text":{"en":"Take the **Ciampino Airlink** shuttle bus to Ciampino station (about 10 minutes). Then take a **regional train** to Roma Termini (about 15 minutes). From Termini, take **metro line A** towards Battistini and get off at Flaminio.","it":"Prendete la navetta **Ciampino Airlink** fino alla stazione di Ciampino (circa 10 minuti). Poi un **treno regionale** fino a Roma Termini (circa 15 minuti). Da Termini, prendete la **metro linea A** direzione Battistini e scendete a Flaminio.","fr":"Prenez la navette **Ciampino Airlink** jusqu’à la gare de Ciampino (environ 10 minutes). Prenez ensuite un **train régional** jusqu’à Roma Termini (environ 15 minutes). À Termini, prenez la **ligne A du métro** direction Battistini et descendez à Flaminio.","es":"Tome el autobús lanzadera **Ciampino Airlink** hasta la estación de Ciampino (unos 10 minutos). Después tome un **tren regional** hasta Roma Termini (unos 15 minutos). Desde Termini, tome la **línea A del metro** dirección Battistini y bájese en Flaminio.","de":"Nehmen Sie den Shuttlebus **Ciampino Airlink** zum Bahnhof Ciampino (ca. 10 Minuten). Fahren Sie dann mit einem **Regionalzug** nach Roma Termini (ca. 15 Minuten). Ab Termini nehmen Sie die **Metrolinie A** Richtung Battistini bis Flaminio.","ar":"استقلوا حافلة **Ciampino Airlink** المكوكية إلى محطة تشامبينو (حوالي 10 دقائق). ثم استقلوا **قطاراً إقليمياً** إلى روما تيرميني (حوالي 15 دقيقة). ومن تيرميني، استقلوا **خط المترو A** باتجاه باتيستيني وانزلوا في محطة فلامينيو."},"price":{"en":"Total price: **about €4.20** (€2.70 for the ‘Ciampino Airlink’ bus + train + €1.50 for the metro).","it":"Prezzo totale: **circa 4,20 €** (2,70 € per bus ‘Ciampino Airlink’ + treno + 1,50 € per la metro).","fr":"Prix total : **environ 4,20 €** (2,70 € pour le bus « Ciampino Airlink » + train + 1,50 € pour le métro).","es":"Precio total: **unos 4,20 €** (2,70 € el autobús ‘Ciampino Airlink’ + tren + 1,50 € el metro).","de":"Gesamtpreis: **ca. 4,20 €** (2,70 € für Bus „Ciampino Airlink“ + Zug + 1,50 € für die Metro).","ar":"السعر الإجمالي: **حوالي 4.20 يورو** (2.70 يورو لحافلة «Ciampino Airlink» + القطار + 1.50 يورو للمترو)."}},{"icon":"bus","title":{"en":"Bus + Metro","it":"Bus + Metro","fr":"Bus + Métro","es":"Autobús + Metro","de":"Bus + Metro","ar":"حافلة + مترو"},"text":{"en":"Take a **Terravision** bus directly to Roma Termini (approx. 40–50 minutes). Then take **metro line A** towards Battistini to **Flaminio**.","it":"Prendete un autobus **Terravision** diretto a Roma Termini (circa 40–50 minuti). Poi la **metro linea A** direzione Battistini fino a **Flaminio**.","fr":"Prenez un bus **Terravision** direct jusqu’à Roma Termini (environ 40 à 50 minutes). Prenez ensuite la **ligne A du métro** direction Battistini jusqu’à **Flaminio**.","es":"Tome un autobús **Terravision** directo a Roma Termini (aprox. 40–50 minutos). Después tome la **línea A del metro** dirección Battistini hasta **Flaminio**.","de":"Nehmen Sie einen **Terravision**-Bus direkt nach Roma Termini (ca. 40–50 Minuten). Fahren Sie dann mit der **Metrolinie A** Richtung Battistini bis **Flaminio**.","ar":"استقلوا حافلة **تيرافيجن** مباشرةً إلى روما تيرميني (حوالي 40–50 دقيقة). ثم **خط المترو A** باتجاه باتيستيني حتى محطة **فلامينيو**."},"price":{"en":"Total price: **about €8** (Terravision bus from €6.50 + €1.50 metro).","it":"Prezzo totale: **circa 8 €** (bus Terravision da 6,50 € + 1,50 € metro).","fr":"Prix total : **environ 8 €** (bus Terravision dès 6,50 € + 1,50 € le métro).","es":"Precio total: **unos 8 €** (autobús Terravision desde 6,50 € + 1,50 € el metro).","de":"Gesamtpreis: **ca. 8 €** (Terravision-Bus ab 6,50 € + 1,50 € Metro).","ar":"السعر الإجمالي: **حوالي 8 يورو** (حافلة تيرافيجن ابتداءً من 6.50 يورو + 1.50 يورو للمترو)."}},{"icon":"taxi","title":{"en":"Taxi","it":"Taxi","fr":"Taxi","es":"Taxi","de":"Taxi","ar":"سيارة أجرة"},"text":{"en":"Official white taxis from Ciampino charge a **fixed fare of €40** to the centre of Rome (inside the Aurelian Walls), luggage included.","it":"I taxi ufficiali bianchi da Ciampino applicano una **tariffa fissa di 40 €** per il centro di Roma (entro le Mura Aureliane), bagagli inclusi.","fr":"Les taxis officiels blancs au départ de Ciampino appliquent un **tarif fixe de 40 €** jusqu’au centre de Rome (à l’intérieur du mur d’Aurélien), bagages compris.","es":"Los taxis oficiales blancos desde Ciampino aplican una **tarifa fija de 40 €** hasta el centro de Roma (dentro de las Murallas Aurelianas), equipaje incluido.","de":"Offizielle weiße Taxis ab Ciampino berechnen ins Zentrum von Rom (innerhalb der Aurelianischen Mauer) einen **Festpreis von 40 €**, Gepäck inklusive.","ar":"تتقاضى سيارات الأجرة الرسمية البيضاء من تشامبينو **تعرفة ثابتة قدرها 40 يورو** إلى وسط روما (داخل الأسوار الأوريليانية)، شاملة الأمتعة."},"warn":{"en":"Please note: during busy times, there may be **long queues** at the airport taxi rank.","it":"Attenzione: negli orari di punta potrebbero esserci **lunghe code** alla fermata dei taxi dell’aeroporto.","fr":"Attention : aux heures d’affluence, il peut y avoir de **longues files d’attente** à la station de taxis de l’aéroport.","es":"Atención: en las horas de mayor afluencia puede haber **largas colas** en la parada de taxis del aeropuerto.","de":"Bitte beachten: Zu Stoßzeiten kann es am Taxistand des Flughafens **lange Warteschlangen** geben.","ar":"يُرجى الانتباه: في أوقات الذروة قد تكون هناك **طوابير طويلة** عند موقف سيارات الأجرة في المطار."}},{"icon":"car","title":{"en":"Private transfer","it":"Transfer privato","fr":"Transfert privé","es":"Traslado privado","de":"Privater Transfer","ar":"نقل خاص"},"text":{"en":"For a simple, comfortable and stress-free journey, choose our **exclusive transfer service** directly from Ciampino. The price depends on the day, time and number of passengers.","it":"Per un viaggio semplice, comodo e senza stress, scegliete il nostro **servizio esclusivo di transfer** direttamente da Ciampino. Il prezzo dipende dal giorno, dall’orario e dal numero di passeggeri.","fr":"Pour un trajet simple, confortable et sans stress, choisissez notre **service de transfert exclusif** directement depuis Ciampino. Le prix dépend du jour, de l’heure et du nombre de passagers.","es":"Para un viaje sencillo, cómodo y sin estrés, elija nuestro **servicio exclusivo de traslado** directamente desde Ciampino. El precio depende del día, la hora y el número de pasajeros.","de":"Für eine einfache, bequeme und stressfreie Anreise wählen Sie unseren **exklusiven Transferservice** direkt ab Ciampino. Der Preis hängt von Tag, Uhrzeit und Anzahl der Fahrgäste ab.","ar":"لرحلة سهلة ومريحة وخالية من التوتر، اختاروا **خدمة النقل الحصرية** لدينا مباشرةً من Ciampino. يعتمد السعر على اليوم والوقت وعدد الركاب."},"transfer":"Ciampino"}]}]},{"type":"heading","text":{"en":"From Flaminio metro on foot","it":"Dalla metro Flaminio a piedi","fr":"Du métro Flaminio à pied","es":"Desde el metro Flaminio a pie","de":"Von der Metro Flaminio zu Fuß","ar":"من مترو فلامينيو سيراً على الأقدام"}},{"type":"steps","items":[{"en":"Exit **Flaminio** station and walk through the **Porta del Popolo** arch.","it":"Uscite dalla stazione **Flaminio** e passate sotto l’arco di **Porta del Popolo**.","fr":"Sortez de la station **Flaminio** et passez sous l’arche de la **Porta del Popolo**.","es":"Salga de la estación **Flaminio** y pase bajo el arco de la **Porta del Popolo**.","de":"Verlassen Sie die Station **Flaminio** und gehen Sie durch den Bogen der **Porta del Popolo**.","ar":"اخرجوا من محطة **فلامينيو** ومرّوا تحت قوس **بورتا ديل بوبولو**."},{"en":"Cross **Piazza del Popolo** towards the **twin churches**.","it":"Attraversate **Piazza del Popolo** verso le **chiese gemelle**.","fr":"Traversez la **Piazza del Popolo** vers les **églises jumelles**.","es":"Cruce la **Piazza del Popolo** hacia las **iglesias gemelas**.","de":"Überqueren Sie die **Piazza del Popolo** in Richtung der **Zwillingskirchen**.","ar":"اعبروا **ساحة ديل بوبولو** باتجاه **الكنيستين التوأمين**."},{"en":"Take **Via di Ripetta**, the street on the **right of the twin churches**, and look for number **35**, the **green door** next to the trattoria: the apartment is on the **ground floor**, the **door on the LEFT in the courtyard**.","it":"Prendete **Via di Ripetta**, la strada a **destra delle chiese gemelle**, e cercate il numero **35**, il **portone verde** accanto alla trattoria: l’appartamento è al **piano terra**, la **porta a SINISTRA nel cortile**.","fr":"Prenez la **Via di Ripetta**, la rue **à droite des églises jumelles**, et cherchez le numéro **35**, la **porte verte** à côté de la trattoria : l’appartement est au **rez-de-chaussée**, la **porte de GAUCHE dans la cour**.","es":"Tome **Via di Ripetta**, la calle a la **derecha de las iglesias gemelas**, y busque el número **35**, el **portal verde** junto a la trattoria: el apartamento está en la **planta baja**, la **puerta de la IZQUIERDA en el patio**.","de":"Nehmen Sie die **Via di Ripetta**, die Straße **rechts der Zwillingskirchen**, und suchen Sie die Nummer **35**, das **grüne Tor** neben der Trattoria: Die Wohnung liegt im **Erdgeschoss**, **Tür LINKS im Innenhof**.","ar":"ادخلوا **Via di Ripetta**، الشارع الواقع **على يمين الكنيستين التوأمين**، وابحثوا عن الرقم **35**، **الباب الأخضر** بجانب المطعم: الشقة في **الطابق الأرضي**، **الباب على اليسار في الفناء**."}]}]},{"id":"wifi","icon":"wifi","title":{"en":"Wi-Fi","it":"Wi-Fi","fr":"Wi-Fi","es":"Wi-Fi","de":"WLAN","ar":"الواي فاي"},"blocks":[{"type":"wifi","qr":"<svg width=\"31mm\" height=\"31mm\" version=\"1.1\" viewBox=\"0 0 31 31\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M1,1H2V2H1zM2,1H3V2H2zM3,1H4V2H3zM4,1H5V2H4zM5,1H6V2H5zM6,1H7V2H6zM7,1H8V2H7zM12,1H13V2H12zM13,1H14V2H13zM15,1H16V2H15zM16,1H17V2H16zM17,1H18V2H17zM19,1H20V2H19zM21,1H22V2H21zM23,1H24V2H23zM24,1H25V2H24zM25,1H26V2H25zM26,1H27V2H26zM27,1H28V2H27zM28,1H29V2H28zM29,1H30V2H29zM1,2H2V3H1zM7,2H8V3H7zM12,2H13V3H12zM13,2H14V3H13zM14,2H15V3H14zM16,2H17V3H16zM21,2H22V3H21zM23,2H24V3H23zM29,2H30V3H29zM1,3H2V4H1zM3,3H4V4H3zM4,3H5V4H4zM5,3H6V4H5zM7,3H8V4H7zM  للإنترنت"}},{"type":"list","items":[{"icon":"cable","title":{"en":"Check the connection","it":"Controllate la connessione","fr":"Vérifiez la connexion","es":"Compruebe la conexión","de":"Verbindung prüfen","ar":"تحقّقوا من الاتصال"},"text":{"en":"Ensure that **all cables** are properly connected to the internet box.","it":"Assicuratevi che **tutti i cavi** siano collegati correttamente al modem.","fr":"Assurez-vous que **tous les câbles** sont bien branchés sur la box internet.","es":"Asegúrese de que **todos los cables** estén bien conectados al router.","de":"Stellen Sie sicher, dass **alle Kabel** richtig mit dem Router verbunden sind.","ar":"تأكّدوا من توصيل **جميع الكابلات** بجهاز الإنترنت بشكل صحيح."}},{"icon":"rotate","title":{"en":"Restart the box","it":"Riavviate il modem","fr":"Redémarrez la box","es":"Reinicie el router","de":"Router neu starten","ar":"أعيدوا تشغيل الجهاز"},"text":{"en":"**Switch off the box**, wait a few seconds, then **switch it back on**.","it":"**Spegnete il modem**, attendete qualche secondo, poi **riaccendetelo**.","fr":"**Éteignez la box**, attendez quelques secondes, puis **rallumez-la**.","es":"**Apague el router**, espere unos segundos y **vuelva a encenderlo**.","de":"**Schalten Sie den Router aus**, warten Sie einige Sekunden und schalten Sie ihn dann **wieder ein**.","ar":"**أطفئوا الجهاز**، وانتظروا بضع ثوانٍ، ثم **أعيدوا تشغيله**."}}]},{"type":"problems","items":[{"icon":"wifi","q":{"en":"No Wi-Fi?","it":"Il Wi-Fi non funziona?","fr":"Pas de Wi-Fi ?","es":"¿No hay Wi-Fi?","de":"Kein WLAN?","ar":"لا يوجد واي فاي؟"},"a":{"en":"**Message us** and we will help you right away.","it":"**Scriveteci** e vi aiutiamo subito.","fr":"**Écrivez-nous** et nous vous aiderons tout de suite.","es":"**Escríbanos** y le ayudaremos enseguida.","de":"**Schreiben Sie uns**, wir helfen Ihnen sofort.","ar":"**راسلونا** وسنساعدكم فوراً."}}]}]},{"id":"rules","icon":"rules","title":{"en":"House rules","it":"Regole della casa","fr":"Règlement intérieur","es":"Normas de la casa","de":"Hausregeln","ar":"قواعد المنزل"},"blocks":[{"type":"lead","text":{"en":"The apartment is in a **historic residential building** (palazzo d’epoca) where **families live**. Thank you for respecting the **house rules**.","it":"L’appartamento si trova in un **palazzo d’epoca residenziale**, dove **vivono famiglie**. Grazie per il rispetto delle **regole della casa**.","fr":"L’appartement se trouve dans un **immeuble résidentiel historique** (palazzo d’epoca) où **vivent des familles**. Merci de respecter le **règlement intérieur**.","es":"El apartamento está en un **edificio residencial histórico** (palazzo d’epoca) donde **viven familias**. Gracias por respetar las **normas de la casa**.","de":"Die Wohnung liegt in einem **historischen Wohnhaus** (Palazzo d’epoca), in dem **Familien wohnen**. Danke, dass Sie die **Hausregeln** einhalten.","ar":"تقع الشقة في **مبنى سكني تاريخي** (palazzo d’epoca) **تسكنه عائلات**. نشكركم على احترام **قواعد المنزل**."}},{"type":"rules","items":[{"icon":"column","text":{"en":"This is a **historic residential building**: keep **quiet** on the stairs and in the **common areas**, out of respect for the residents.","it":"È un **palazzo d’epoca residenziale**: mantenete il **silenzio** sulle scale e negli **spazi comuni**, per rispetto dei residenti.","fr":"C’est un **immeuble résidentiel historique** : restez **silencieux** dans l’escalier et les **parties communes**, par respect pour les résidents.","es":"Es un **edificio residencial histórico**: guarde **silencio** en la escalera y en las **zonas comunes**, por respeto a los vecinos.","de":"Dies ist ein **historisches Wohnhaus**: Bitte seien Sie im Treppenhaus und in den **Gemeinschaftsbereichen** **leise** – aus Rücksicht auf die Bewohner.","ar":"هذا **مبنى سكني تاريخي**: التزموا **الهدوء** على الدرج وفي **الأماكن المشتركة** احتراماً للسكان."}},{"icon":"nosmoke","text":{"en":"Please **do not smoke** inside the house.","it":"Vi preghiamo di **non fumare** all’interno della casa.","fr":"Merci de **ne pas fumer** à l’intérieur du logement.","es":"Le rogamos que **no fume** dentro de la vivienda.","de":"Bitte **rauchen Sie nicht** in der Wohnung.","ar":"يُرجى **عدم التدخين** داخل المنزل."}},{"icon":"alert","text":{"en":"**Parking** in the **inner courtyard** is **not allowed** (condominium rules).","it":"È **vietato parcheggiare** nel **cortile interno** (regolamento condominiale).","fr":"Il est **interdit de se garer** dans la **cour intérieure** (règlement de copropriété).","es":"Está **prohibido aparcar** en el **patio interior** (normas de la comunidad).","de":"**Parken** im **Innenhof** ist **nicht erlaubt** (Hausordnung).","ar":"**يُمنع ركن السيارات** في **الفناء الداخلي** (نظام المبنى)."}},{"icon":"mute","rid":"courtyard","text":{"en":"It is **forbidden to linger in the courtyard**: please walk through it **quietly**, **without talking or making noise**, out of respect for the residents.","it":"È **vietato sostare nel cortile**: attraversatelo in **silenzio**, **senza parlare né fare rumore**, per rispetto dei residenti.","fr":"Il est **interdit de s’attarder dans la cour** : traversez-la en **silence**, **sans parler ni faire de bruit**, par respect pour les résidents.","es":"Está **prohibido detenerse en el patio**: atraviéselo en **silencio**, **sin hablar ni hacer ruido**, por respeto a los vecinos.","de":"Es ist **verboten, sich im Innenhof aufzuhalten**: Gehen Sie **leise** hindurch, **ohne zu reden oder Lärm zu machen**, aus Rücksicht auf die Bewohner.","ar":"**يُمنع التوقف في الفناء**: اعبروه **بهدوء** و**دون كلام أو ضجيج**، احتراماً للسكان."}},{"icon":"toilet","rid":"toilet","text":{"en":"Flush **only toilet paper**: do **not** throw **wipes, sanitary products, cotton buds, paper towels, nappies** or **any other items** down the toilet.","it":"Gettate nel WC **solo carta igienica**: **non** gettate **salviette, assorbenti, cotton fioc, carta, pannolini** o **altri oggetti**.","fr":"Ne jetez dans les toilettes **que du papier toilette** : **pas** de **lingettes, protections hygiéniques, cotons-tiges, essuie-tout, couches** ni **aucun autre objet**.","es":"Tire al inodoro **solo papel higiénico**: **no** tire **toallitas, compresas, bastoncillos, papel de cocina, pañales** ni **ningún otro objeto**.","de":"Werfen Sie **nur Toilettenpapier** in die Toilette: **keine Feuchttücher, Hygieneartikel, Wattestäbchen, Papiertücher, Windeln** oder **andere Gegenstände**.","ar":"ارموا في المرحاض **ورق التواليت فقط**: **لا** ترموا **المناديل المبللة أو الفوط الصحية أو أعواد القطن أو المناشف الورقية أو الحفاضات** أو **أي أشياء أخرى**."}},{"icon":"sparkles","text":{"en":"Take care of the house, **keep the common areas clean** and leave things tidy after you use them.","it":"Abbiate cura della casa, **mantenete puliti gli spazi comuni** e lasciate tutto in ordine dopo l’uso.","fr":"Prenez soin du logement, **gardez les parties communes propres** et laissez tout en ordre après utilisation.","es":"Cuide la vivienda, **mantenga limpias las zonas comunes** y deje todo ordenado después de usarlo.","de":"Gehen Sie sorgsam mit der Wohnung um, halten Sie die **Gemeinschaftsbereiche sauber** und hinterlassen Sie alles ordentlich.","ar":"اعتنوا بالمنزل، و**حافظوا على نظافة الأماكن المشتركة**، واتركوا الأشياء مرتبة بعد استخدامها."}},{"icon":"mute","text":{"en":"Respect the peace and privacy of other occupants by **minimizing noise**.","it":"Rispettate la tranquillità e la privacy degli altri residenti **limitando i rumori**.","fr":"Respectez la tranquillité et l’intimité des autres occupants **en limitant le bruit**.","es":"Respete la tranquilidad y la privacidad de los demás ocupantes **reduciendo el ruido**.","de":"Respektieren Sie die Ruhe und Privatsphäre der anderen Bewohner, indem Sie **Lärm vermeiden**.","ar":"احترموا هدوء وخصوصية السكان الآخرين **بالتقليل من الضوضاء**."}},{"icon":"users","text":{"en":"Avoid inviting additional people **without prior authorization**.","it":"Evitate di n fermés.","es":"Si desea **salir más tarde**, contáctenos y comprobaremos la disponibilidad y se la confirmaremos según nuestra programación. También puede dejarnos su equipaje **hasta las 13:00**, siempre que esté bien cerrado.","de":"Wenn Sie **später abreisen** möchten, kontaktieren Sie uns bitte – wir prüfen die Verfügbarkeit und bestätigen sie entsprechend unserem Zeitplan. Sie können Ihr Gepäck auch **bis 13:00 Uhr** bei uns lassen, sofern es gut verschlossen ist.","ar":"إذا رغبتم في **المغادرة في وقت لاحق**، يُرجى التواصل معنا وسنتحقق من التوفر ونؤكد لكم ذلك حسب جدولنا. يمكنكم أيضاً ترك أمتعتكم لدينا **حتى الساعة 13:00**، بشرط أن تكون مغلقة بإحكام."}},{"type":"checklist","title":{"en":"Before leaving – in this order","it":"Prima di partire – in quest’ordine","fr":"Avant de partir – dans cet ordre","es":"Antes de salir – en este orden","de":"Vor der Abreise – in dieser Reihenfolge","ar":"قبل المغادرة – بهذا الترتيب"},"items":[{"icon":"clock","title":{"en":"Leave by 10:00","it":"Uscite entro le 10:00","fr":"Départ avant 10h00","es":"Salida antes de las 10:00","de":"Abreise bis 10:00 Uhr","ar":"المغادرة قبل 10:00"},"text":{"en":"Check-out is by **10:00**. Make sure you **haven’t forgotten anything**.","it":"Il check-out è entro le **10:00**. Controllate di **non aver dimenticato nulla**.","fr":"Le départ se fait avant **10h00**. Vérifiez que vous **n’avez rien oublié**.","es":"El check-out es antes de las **10:00**. Compruebe que **no ha olvidado nada**.","de":"Check-out ist bis **10:00 Uhr**. Prüfen Sie, dass Sie **nichts vergessen** haben.","ar":"موعد المغادرة قبل **10:00**. تأكّدوا من أنكم **لم تنسوا شيئاً**."}},{"icon":"power","title":{"en":"Lights and devices off","it":"Luci e apparecchi spenti","fr":"Lumières et appareils éteints","es":"Luces y aparatos apagados","de":"Licht und Geräte aus","ar":"إطفاء الأضواء والأجهزة"},"text":{"en":"**Turn off** all lights and electrical devices.","it":"**Spegnete** tutte le luci e gli apparecchi elettrici.","fr":"**Éteignez** toutes les lumières et les appareils électriques.","es":"**Apague** todas las luces y los aparatos eléctricos.","de":"**Schalten Sie** alle Lichter und Elektrogeräte **aus**.","ar":"**أطفئوا** جميع الأضواء والأجهزة الكهربائية."}},{"icon":"house","title":{"en":"Windows closed","it":"Finestre chiuse","fr":"Fenêtres fermées","es":"Ventanas cerradas","de":"Fenster geschlossen","ar":"النوافذ مغلقة"},"text":{"en":"**Close all the windows.**","it":"**Chiudete tutte le finestre.**","fr":"**Fermez toutes les fenêtres.**","es":"**Cierre todas las ventanas.**","de":"**Schließen Sie alle Fenster.**","ar":"**أغلقوا جميع النوافذ.**"}},{"icon":"euro","title":{"en":"Tourist tax","it":"Tassa di soggiorno","fr":"Taxe de séjour","es":"Tasa turística","de":"Kurtaxe","ar":"ضريبة السياحة"},"text":{"en":"Leave it **in cash on the table** (€6 per person per night).","it":"Lasciatela **in contanti sul tavolo** (6 € a persona a notte).","fr":"Laissez-la **en espèces sur la table** (6 € par personne et par nuit).","es":"Déjela **en efectivo sobre la mesa** (6 € por persona y noche).","de":"Lassen Sie sie **in bar auf dem Tisch** (6 € pro Person und Nacht).","ar":"اتركوها **نقدًا على الطاولة** (6 يورو للشخص في الليلة)."}},{"icon":"door","title":{"en":"Close the door","it":"Chiudete la porta","fr":"Fermez la porte","es":"Cierre la puerta","de":"Tür schließen","ar":"أغلقوا الباب"},"text":{"en":"Go out and **close the apartment door**.","it":"Uscite e **chiudete la porta di casa**.","fr":"Sortez et **fermez la porte de l’appartement**.","es":"Salga y **cierre la puerta del apartamento**.","de":"Gehen Sie hinaus und **schließen Sie die Wohnungstür**.","ar":"اخرجوا و**أغلقوا باب الشقة**."}},{"icon":"key","title":{"en":"Keys in the lockbox","it":"Chiavi nella cassetta","fr":"Clés dans la boîte","es":"Llaves en la caja","de":"Schlüssel in den Safe","ar":"المفاتيح في الصندوق"},"text":{"en":"Put the keys back in the **lockbox on the door** and close it.","it":"Rimettete le chiavi nella **cassetta sulla porta** e chiudetela.","fr":"Remettez les clés dans la **boîte à clés sur la porte** et refermez-la.","es":"Vuelva a dejar las llaves en la **caja de la puerta** y ciérrela.","de":"Legen Sie die Schlüssel zurück in den **Schlüsselsafe an der Tür** und schließen Sie ihn.","ar":"أعيدوا المفاتيح إلى **الصندوق الموجود على الباب** وأغلقوه."}},{"icon":"rotate","title":{"en":"Scramble the code","it":"Mescolate il codice","fr":"Brouillez le code","es":"Mezcle el código","de":"Code verstellen","ar":"غيّروا أرقام الرمز"},"text":{"en":"**Scramble the code** on the lockbox, **otherwise it stays open**.","it":"**Mescolate le cifre** della cassetta, **altrimenti resta aperta**.","fr":"**Brouillez les chiffres** de la boîte, **sinon elle reste ouverte**.","es":"**Mezcle los dígitos** de la caja; **de lo contrario, se queda abierta**.","de":"**Verstellen Sie die Ziffern** am Safe, **sonst bleibt er offen**.","ar":"**غيّروا أرقام** الصندوق، **وإلا سيبقى مفتوحاً**."}}]},{"type":"notice","tone":"important","icon":"key","title":{"en":"Important","it":"Importante","fr":"Important","es":"Importante","de":"Wichtig","ar":"مهم"},"text":{"en":"After putting the keys in the lockbox, always **scramble the code**: otherwise the box **stays open**.","it":"Dopo aver messo le chiavi nella cassetta, **mescolate sempre il codice**: altrimenti la cassetta **resta aperta**.","fr":"Après avoir remis les clés dans la boîte, **brouillez toujours le code** : sinon la boîte **reste ouverte**.","es":"Después de dejar las llaves en la caja, **mezcle siempre el código**: de lo contrario, la caja **se queda abierta**.","de":"Nachdem Sie die Schlüssel in den Safe gelegt haben, **verstellen Sie immer den Code**: sonst **bleibt der Safe offen**.","ar":"بعد وضع المفاتيح في الصندوق، **غيّروا أرقام الرمز دائماً**: وإلا **سيبقى الصندوق مفتوحاً**."}},{"type":"closing","text":{"en":"Thank you!","it":"Grazie!","fr":"Merci !","es":"¡Gracias!","de":"Vielen Dank!","ar":"شكراً لكم!"}}]},{"id":"contact","icon":"phone","title":{"en":"Contact","it":"Contatti","fr":"Contact","es":"Contacto","de":"Kontakt","ar":"التواصل"},"blocks":[{"type":"host","text":{"en":"Dear travelers, I am here to assist you whenever you need. If you encounter any issues or have any questions, please do not hesitate to contact me **by phone or email**. I am **always available** to help make your stay as pleasant and stress-free as possible.","it":"Cari viaggiatori, sono qui per assistervi ogni volta che ne avrete bisogno. Se incontrate qualche problema o avete domande, non esitate a contattarmi **per telefono o via email**. Sono **sempre disponibile** per rendere il vostro soggiorno il più piacevole e sereno possibile.","fr":"Chers voyageurs, je suis là pour vous aider à tout moment. Si vous rencontrez un problème ou avez des questions, n’hésitez pas à me contacter **par téléphone ou par e-mail**. Je suis **toujours disponible** pour rendre votre séjour aussi agréable et serein que possible.","es":"Queridos viajeros, estoy aquí para ayudarles siempre que lo necesiten. Si tienen algún problema o alguna pregunta, no duden en contactarme **por teléfono o por correo electrónico**. **Siempre estoy disponible** para que su estancia sea lo más agradable y tranquila posible.","de":"Liebe Reisende, ich bin jederzeit für Sie da. Wenn Probleme auftreten oder Sie Fragen haben, zögern Sie nicht, mich **telefonisch oder per E-Mail** zu kontaktieren. Ich helfe Ihnen **immer gern**, Ihren Aufenthalt so angenehm und entspannt wie möglich zu gestalten.","ar":"أعزاءنا المسافرين، أنا هنا لمساعدتكم متى احتجتم إلى ذلك. إذا واجهتم أي مشكلة أو كان لديكم أي سؤال، فلا تترددوا في التواصل معي **عبر الهاتف أو البريد الإلكتروني**. أنا **متاح دائماً** لأجعل إقامتكم ممتعة ومريحة قدر الإمكان."}},{"type":"review","text":{"en":"We hope you had a pleasant stay in our home. If you could take a moment to share your feedback and leave us a **5-star review**, it would be greatly appreciated.","it":"Speriamo che abbiate trascorso un piacevole soggiorno nella nostra casa. Se poteste dedicarci un momento per condividere la vostra opinione e lasciarci una **recensione a 5 stelle**, ve ne saremmo davvero grati.","fr":"Nous espérons que vous avez passé un agréable séjour chez nous. Si vous pouviez prendre un instant pour partager votre avis et nous laisser un **commentaire 5 étoiles**, nous vous en serions très reconnaissants.","es":"Esperamos que haya disfrutado de una agradable estancia en nuestra casa. Si pudiera dedicar un momento a compartir su opinión y dejarnos una **reseña de 5 estrellas**, se lo agradeceríamos muchísimo.","de":"Wir hoffen, Sie hatten einen angenehmen Aufenthalt bei uns. Wenn Sie sich einen Moment Zeit nehmen könnten, um Ihre Eindrücke zu teilen und uns eine **5-Sterne-Bewertung** zu hinterlassen, würden wir uns sehr freuen.","ar":"نأمل أن تكونوا قد استمتعتم بإقامة طيبة في منزلنا. إذا تمكنتم من تخصيص لحظة لمشاركة رأيكم وترك **تقييم من 5 نجوم** لنا، فسنكون ممتنين جداً."}}]}],"arrival":{"steps":[{"en":"Arrive at **Via di Ripetta 35**: the **green main door** next to the trattoria **La Buca di Ripetta**. **Message us** or **ring “De Lieto”** on the intercom: we **open the main door remotely**.","it":"Arrivate in **Via di Ripetta 35**: il **portone verde** accanto alla trattoria **La Buca di Ripetta**. **Scriveteci** o **suonate a “De Lieto”** sul citofono: vi **apriamo il portone a distanza**.","fr":"Arrivez au **Via di Ripetta 35** : la **porte verte** à côté de la trattoria **La Buca di Ripetta**. **Écrivez-nous** ou **sonnez à « De Lieto »** à l’interphone : nous **ouvrons la porte à distance**.","es":"Llegue a **Via di Ripetta 35**: el **portal verde** junto a la trattoria **La Buca di Ripetta**. **Escríbanos** o **llame a “De Lieto”** en el portero automático: le **abrimos el portal a distancia**.","de":"Kommen Sie in die **Via di Ripetta 35**: das **grüne Haustor** neben der Trattoria **La Buca di Ripetta**. **Schreiben Sie uns** oder **klingeln Sie bei „De Lieto“**: Wir **öffnen das Haustor aus der Ferne**.","ar":"عند وصولكم إلى **Via di Ripetta 35**: **الباب الأخضر** بجانب مطعم **La Buca di Ripetta**. **راسلونا** أو **اضغطوا جرس «De Lieto»** في جهاز الاتصال الداخلي: **سنفتح لكم باب المبنى عن بُعد**."},{"en":"Go into the **lobby** and walk down the **hallway**: at the **end**, turn **left**.","it":"Entrate nell’**androne** e percorrete il **corridoio**: in **fondo** girate a **sinistra**.","fr":"Entrez dans le **hall** et suivez le **couloir** : au **fond**, tournez à **gauche**.","es":"Entre en el **vestíbulo** y recorra el **pasillo**: al **fondo**, gire a la **izquierda**.","de":"Gehen Sie in die **Eingangshalle** und den **Flur** entlang: am **Ende** biegen Sie **links** ab.","ar":"ادخلوا إلى **البهو** وسيروا في **الممر**: وفي **نهايته** انعطفوا **يساراً**."},{"en":"Turn **left** into the **courtyard**: your apartment is on the **ground floor** – the **door on the LEFT** – the narrow wooden door marked by the arrow in the photo. The **key box is on the door**: enter the code **9321** and take the **keys**.","it":"Girate a **sinistra** ed entrate nel **cortile**: il vostro appartamento è al **piano terra** – la **porta a SINISTRA** – quella stretta in legno indicata dalla freccia nella foto. La **cassetta delle chiavi è sulla porta**: inserite il codice **9321** e prendete le **chiavi**.","fr":"Tournez à **gauche** et entrez dans la **cour** : votre appartement est au **rez-de-chaussée** – la **porte de GAUCHE** – la porte étroite en bois indiquée par la flèche sur la photo. La **boîte à clés est sur la porte** : saisissez le code **9321** et prenez les **clés**.","es":"Gire a la **izquierda** y entre en el **patio**: su apartamento está en la **planta baja** – la **puerta de la IZQUIERDA** – la puerta estrecha de madera señalada por la flecha en la foto. La **caja de llaves está en la puerta**: introduzca el código **9321** y coja las **llaves**.","de":"Biegen Sie **links** in den **Innenhof** ab: Ihre Wohnung liegt im **Erdgeschoss** – die
