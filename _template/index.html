<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{NAME}} · Welcome Book · Rome Dream Home</title>
  <meta name="description" content="Digital welcome book for guests of {{NAME}}, {{ADDRESS}} — Rome Dream Home." />
  <meta name="theme-color" content="#4C0303" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="rdh-assets" content="../assets/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{NAME}} · Rome Dream Home" />
  <meta property="og:description" content="Welcome Book · {{ADDRESS}}" />
  <meta property="og:image" content="../assets/img/og-image.jpg" />
  <link rel="icon" href="../assets/img/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="preload" as="image" href="../assets/img/logo-white.webp" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css?v={{VERSION}}" />
  <script>
    (function () {
      var codes = { it: 1, en: 1, fr: 1, es: 1, de: 1, ar: 1 }, lang = "en", r = document.documentElement;
      try {
        var s = localStorage.getItem("rdh-lang");
        if (codes[s]) lang = s; else {
          var l = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
          for (var i = 0; i < l.length; i++) { var b = String(l[i]).toLowerCase().split("-")[0]; if (codes[b]) { lang = b; break; } }
        }
      } catch (e) {}
      r.lang = lang; r.dir = lang === "ar" ? "rtl" : "ltr"; r.dataset.lang = lang;
      try { if (sessionStorage.getItem("rdh-intro") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches) r.classList.add("intro-seen"); } catch (e) {}
      r.classList.add("js");
    })();
  </script>
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-inner">
      <img id="intro-logo" class="intro-logo" src="../assets/img/logo-white.webp" alt="" width="915" height="608" />
      <p id="intro-title" class="intro-title"></p>
      <p id="intro-name" class="intro-name"></p>
    </div>
  </div>

  <a class="skip" id="skip" href="#sections">Skip to the guide</a>

  <header class="hero">
    <div class="hero-bar">
      <div id="lang-home" class="lang"></div>
      <button type="button" id="music" class="music" aria-pressed="false" hidden>
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <svg class="note" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
    </div>
    <div class="hero-main">
      <h1 class="hero-logo-wrap">
        <img class="hero-logo" src="../assets/img/logo-white.webp" alt="Rome Dream Home" width="915" height="608" />
      </h1>
      <p class="hero-eyebrow" id="hero-eyebrow">Welcome Book</p>
      <p class="hero-name" id="hero-name">{{NAME}}</p>
      <a class="hero-address" id="hero-address" href="#">{{ADDRESS}}</a>
      <div class="hero-times" id="hero-times"></div>
    </div>
    <div class="arcade" aria-hidden="true"></div>
  </header>

  <main class="main">
    <section id="quick" class="quick" aria-label="Essentials"></section>
    <section id="gallery" class="gallery" aria-label="Photos"></section>
    <section id="sections" class="guide" tabindex="-1"></section>
  </main>

  <footer class="footer">
    <img class="f-sky" src="../assets/img/skyline-white.webp" alt="" width="915" height="238" loading="lazy" />
    <div id="footer-body" class="f-body"></div>
  </footer>

  <button type="button" id="to-top" class="to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
  </button>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-bar">
        <button type="button" class="back" id="sheet-back">
          <svg class="flip" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
          <span id="sheet-back-label">Back</span>
        </button>
        <p id="sheet-title" class="sheet-title"></p>
        <div id="lang-sheet" class="lang lang-compact"></div>
      </div>
      <div class="sheet-scroll"><div id="sheet-body" class="sheet-body"></div></div>
    </div>
  </dialog>

  <dialog id="lightbox" class="lightbox" aria-label="Photo">
    <div class="lb-stage">
      <img id="lb-img" alt="" />
      <button type="button" id="lb-close" class="lb-btn lb-close"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <button type="button" id="lb-prev" class="lb-btn lb-prev"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <button type="button" id="lb-next" class="lb-btn lb-next"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
      <p id="lb-cap" class="lb-cap"></p>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <p id="live" class="sr" aria-live="polite"></p>
  <audio id="audio" preload="none"></audio>

  <noscript><p class="noscript">Please enable JavaScript to use this guide. · Attivate JavaScript per usare la guida.</p></noscript>

  <script src="../assets/js/icons.js?v={{VERSION}}"></script>
  <script src="../assets/js/i18n.js?v={{VERSION}}"></script>
  <script>window.RDH_DATA = {{DATA}};</script>
  <script src="../assets/js/app.js?v={{VERSION}}"></script>
</body>
</html>
